ient 调 Server，Server 再办理业务。授权、对象权限、幂等和审计仍需设计。采用它的理由应是多应用复用、生态接入与维护收益，而不是“接上就自动成为万能 Agent”。\n**企业工具中心。** 将工单查询、文档读取等能力包装成受控服务，多种 AI 客户端按协议使用。目录记录提供者、权限、Schema、版本和可用状态；撤销连接后新调用不能继续使用旧授权。\n\n**开发工作台接入。** AI 应用通过受支持的 MCP 服务读取项目文档与错误追踪信息，按任务选工具。Server 返回的数据仍是外部内容，不能借描述文字升级成 Host 的系统指令。\n- **两边都支持 MCP，却连接不上。** 分别核对协议版本、传输方式、认证和能力支持；不要把连接失败统一当成模型问题。\n- **工具列表能看到，调用却失败。** 发现能力不等于拥有业务权限，检查凭据范围、对象权限、参数与后端业务状态。\n- **接入越多，模型越容易选错。** 按任务加载相关工具，规范命名与描述，记录版本变更；协议标准化没有消除上下文拥挤和选择歧义。\nMCP、API 和 Function Calling 怎么配合？ “API 是业务服务提供能力的接口；Function Calling 是模型生成工具调用意图和参数的方式；MCP 统一 AI 应用与外部工具、资源交互的协议。它们可以在一次任务里连续出现。\n例如模型选择查询工单，Host 校验后通过 MCP Client 调 Server，Server 再调用工单 API，结果逐层返回。MCP 可以减少各客户端单独适配的成本，但不会替代工单系统的权限与业务校验。\n因此我会先看是否有跨应用复用需求和成熟服务，再决定是否采用。单一应用接一个稳定接口，直接集成也可能更简单，不能把协议当业务能力本身。”\n设计 MCP 工具中心，需要管理哪些内容？ “我会同时管理接入兼容性和业务可用性。接入侧记录协议版本、传输、能力声明与认证方式；工具侧记录用途、参数、权限、提供者、版本、调用表现和失败类型。\n发布工具前要验证描述与实际行为一致，工具变更会影响哪些 Agent，旧调用能否继续使用。运行时由 Host 和后端执行权限边界，不能让 Server 的描述自己获得更高信任。\n对用户则说明连接后能读什么、做什么以及如何撤销。评价中心不只看工具数量，还看接入耗时、正确调用率和维护成本。目录丰富但模型选不对，仍然不能算平台能力成熟。”\n接入 MCP 服务后，最容易忽略什么？ “容易把协议连通误认为业务已经可信。工具发现成功，不代表当前账号有权限；参数符合 Schema，不代表订单状态允许操作；服务端返回文字，也不能作为新的系统指令。\n我会分别检查版本与传输兼容、凭据隔离、对象权限、结果语义和工具变更。协议版本还会演进，客户端应固定受支持组合，不能直接照旧教程拼接新规范。\n出现问题时沿 Host、Client、Server 和业务 API 分层定位；涉及写操作仍保留确认与幂等。MCP 帮我们统一接入方式，可靠执行还取决于完整业务契约。”"}, {"id": "k18", "number": "18", "title": "任务状态与短期记忆：怎样知道现在该按哪个条件继续？", "short": "任务状态与短期记忆", "priority": "P0", "group": 2, "intro": "\u003cp>聊天记录保存“说过什么”，任务状态保存“现在什么有效、已经做了什么”。这两者不能直接互换。用户先说周三出发，后来改成周四，历史里两个日期都存在，但当前任务必须有唯一明确的生效条件。\u003c/p>\n\u003cp>短期记忆是当前会话或任务需要的工作信息，可以包含近期消息、摘要、已选方案与工具结果。结构化状态则把关键事实明确存成字段，例如任务 ID、日期、对象清单、确认状态、已执行操作与产物位置。每次调用模型时，只取其中必要部分进入上下文。\u003c/p>\n\u003cp>\u003cstrong>状态更新会影响依赖它的结果。\u003c/strong> 出发日期变化后，机票、酒店、天气与旧确认可能失效；不是只把界面上的日期改掉。系统需要记录哪些查询和动作依赖哪个条件，判断应重新计算、重新确认，还是进入已发生业务的变更流程。\u003c/p>\n\u003cp>并发让问题更复杂。用户改完日期，旧查询结果才返回，如果直接写入当前状态，就会覆盖新条件。常见做法是给任务条件加版本，结果携带请求对应的版本；不匹配的结果不能直接覆盖当前值。数据库层还可以使用版本校验等并发控制，避免两次更新互相丢失。\u003c/p>\n\u003cp>检查点保存一个可恢复的执行状态，但任务继续前还要重新验证外部事实。价格、库存、登录状态和权限不是一旦记录就永久有效。短期记忆帮助连续工作，业务状态才决定动作是否合法、是否已经完成。\u003c/p>", "decision": "\u003cp>把用户确认、模型推断、工具事实分开记录来源。待确认的猜测不能自动变成有效输入。恢复体验要说明使用哪些条件、哪些结果过期；测试要包含并发消息、迟到返回、重复提交与任务中断，而不仅是正常连续对话。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>数据分析会话。\u003c/strong> 用户把“上月支付额”改成“本季度净销售额”，更新指标、时间和退款口径，旧图表标为过期，重新查询；不能只重写图表标题。\u003c/p>\n\u003cp>\u003cstrong>多步内容生产。\u003c/strong> 保存已确认受众、渠道、篇幅与稿件版本。用户修改受众后，依赖旧受众的文案需要重审，但已经上传的素材不必无条件重做。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>用户已纠正，模型又用旧条件。\u003c/strong> 检查有效状态是否更新，以及摘要、缓存和工具参数是否还携带旧值；不要只追加一句“以最新为准”。\u003c/li>\n\u003cli>\u003cstrong>恢复后不知道已经做过什么。\u003c/strong> 区分聊天摘要与执行记录，补齐步骤状态、回执和产物标识，避免让模型从文字推测业务结果。\u003c/li>\n\u003cli>\u003cstrong>两个任务串了上下文。\u003c/strong> 检查会话与任务 ID 的范围、并发存储键及共享对象；同一个用户也可能同时处理互不相关的任务。\u003c/li>\n\u003c/ul>", "questions": [{"id": "18.1", "title": "为什么不能只把完整对话发给模型，让它自己管理状态？", "answer": "\u003cp>“完整对话里有旧条件、猜测、撤回和失败动作，模型每次重新解释容易不一致，也增加上下文成本。当前状态需要明确哪个值有效、来自谁、是否确认，哪些动作真的执行过。\u003c/p>\n\u003cp>例如时间改了两次，我会把生效时间作为结构化字段保存，让模型读取当前值；历史保留用于追溯。业务回执单独记录，不能因为聊天里出现‘已提交’就当提交成功。\u003c/p>\n\u003cp>这并不是不要对话，而是分工：对话解释来龙去脉，状态支持执行。验证会看条件变更和中断恢复后，动作是否仍用对输入，而不只看模型能否复述历史。”\u003c/p>"}, {"id": "18.2", "title": "用户改条件时，旧工具结果刚好返回，怎么处理？", "answer": "\u003cp>“我会给条件和查询绑定版本。比如版本一查询周三航班，用户改成周四后进入版本二；版本一的返回可以留作历史，但不能直接写成当前候选，更不能用于下单。\u003c/p>\n\u003cp>然后识别哪些步骤依赖日期，重新查询相关结果并使旧确认失效。已经产生订单的情况，要进入真实改签或取消流程，不能简单改状态字段。\u003c/p>\n\u003cp>测试时主动制造旧请求慢返回和连续修改，核对当前 UI、模型上下文与工具入参是否一致。核心是防止过期结果覆盖新状态，而不是让模型凭时间顺序自己猜。”\u003c/p>"}, {"id": "18.3", "title": "短期记忆、任务状态和检查点有什么区别？", "answer": "\u003cp>“短期记忆是当前工作需要的上下文集合；任务状态是其中明确可执行的事实和进度；检查点是为了暂停恢复而保存的状态快照或执行记录。实现上可以关联，但目的不同。\u003c/p>\n\u003cp>比如研究任务的近期讨论是短期上下文，研究范围与已读文件是状态，暂停时保存到哪一步及产物位置是检查点。恢复不意味着所有外部事实仍有效，权限和变化快的数据要重查。\u003c/p>\n\u003cp>我会优先结构化保存决定执行的字段，摘要只承载辅助背景。这样上下文可以压缩，任务也不必从头开始，更不会因为模型忘记一句话就重复操作。”\u003c/p>"}], "search": "任务状态与短期记忆：怎样知道现在该按哪个条件继续？\n聊天记录保存“说过什么”，任务状态保存“现在什么有效、已经做了什么”。这两者不能直接互换。用户先说周三出发，后来改成周四，历史里两个日期都存在，但当前任务必须有唯一明确的生效条件。\n\n短期记忆是当前会话或任务需要的工作信息，可以包含近期消息、摘要、已选方案与工具结果。结构化状态则把关键事实明确存成字段，例如任务 ID、日期、对象清单、确认状态、已执行操作与产物位置。每次调用模型时，只取其中必要部分进入上下文。\n\n**状态更新会影响依赖它的结果。** 出发日期变化后，机票、酒店、天气与旧确认可能失效；不是只把界面上的日期改掉。系统需要记录哪些查询和动作依赖哪个条件，判断应重新计算、重新确认，还是进入已发生业务的变更流程。\n\n并发让问题更复杂。用户改完日期，旧查询结果才返回，如果直接写入当前状态，就会覆盖新条件。常见做法是给任务条件加版本，结果携带请求对应的版本；不匹配的结果不能直接覆盖当前值。数据库层还可以使用版本校验等并发控制，避免两次更新互相丢失。\n\n检查点保存一个可恢复的执行状态，但任务继续前还要重新验证外部事实。价格、库存、登录状态和权限不是一旦记录就永久有效。短期记忆帮助连续工作，业务状态才决定动作是否合法、是否已经完成。\n把用户确认、模型推断、工具事实分开记录来源。待确认的猜测不能自动变成有效输入。恢复体验要说明使用哪些条件、哪些结果过期；测试要包含并发消息、迟到返回、重复提交与任务中断，而不仅是正常连续对话。\n**数据分析会话。** 用户把“上月支付额”改成“本季度净销售额”，更新指标、时间和退款口径，旧图表标为过期，重新查询；不能只重写图表标题。\n\n**多步内容生产。** 保存已确认受众、渠道、篇幅与稿件版本。用户修改受众后，依赖旧受众的文案需要重审，但已经上传的素材不必无条件重做。\n- **用户已纠正，模型又用旧条件。** 检查有效状态是否更新，以及摘要、缓存和工具参数是否还携带旧值；不要只追加一句“以最新为准”。\n- **恢复后不知道已经做过什么。** 区分聊天摘要与执行记录，补齐步骤状态、回执和产物标识，避免让模型从文字推测业务结果。\n- **两个任务串了上下文。** 检查会话与任务 ID 的范围、并发存储键及共享对象；同一个用户也可能同时处理互不相关的任务。\n为什么不能只把完整对话发给模型，让它自己管理状态？ “完整对话里有旧条件、猜测、撤回和失败动作，模型每次重新解释容易不一致，也增加上下文成本。当前状态需要明确哪个值有效、来自谁、是否确认，哪些动作真的执行过。\n例如时间改了两次，我会把生效时间作为结构化字段保存，让模型读取当前值；历史保留用于追溯。业务回执单独记录，不能因为聊天里出现‘已提交’就当提交成功。\n这并不是不要对话，而是分工：对话解释来龙去脉，状态支持执行。验证会看条件变更和中断恢复后，动作是否仍用对输入，而不只看模型能否复述历史。”\n用户改条件时，旧工具结果刚好返回，怎么处理？ “我会给条件和查询绑定版本。比如版本一查询周三航班，用户改成周四后进入版本二；版本一的返回可以留作历史，但不能直接写成当前候选，更不能用于下单。\n然后识别哪些步骤依赖日期，重新查询相关结果并使旧确认失效。已经产生订单的情况，要进入真实改签或取消流程，不能简单改状态字段。\n测试时主动制造旧请求慢返回和连续修改，核对当前 UI、模型上下文与工具入参是否一致。核心是防止过期结果覆盖新状态，而不是让模型凭时间顺序自己猜。”\n短期记忆、任务状态和检查点有什么区别？ “短期记忆是当前工作需要的上下文集合；任务状态是其中明确可执行的事实和进度；检查点是为了暂停恢复而保存的状态快照或执行记录。实现上可以关联，但目的不同。\n比如研究任务的近期讨论是短期上下文，研究范围与已读文件是状态，暂停时保存到哪一步及产物位置是检查点。恢复不意味着所有外部事实仍有效，权限和变化快的数据要重查。\n我会优先结构化保存决定执行的字段，摘要只承载辅助背景。这样上下文可以压缩，任务也不必从头开始，更不会因为模型忘记一句话就重复操作。”"}, {"id": "k19", "number": "19", "title": "长期记忆：记什么、什么时候用、什么时候该忘？", "short": "长期记忆", "priority": "P2", "group": 2, "intro": "\u003cp>长期记忆是应用跨会话保存并取用的信息，不等于模型参数记住了用户。它可以存数据库字段、文档、历史摘要或向量索引中；关键不在存储品牌，而在写入、读取、更新和删除规则。\u003c/p>\n\u003cp>比如“用户偏好简短回答”可以成为可查看、可修改的长期记忆；“本次出差改到周五”则先作为当前任务的有效条件。\u003c/p>\n\u003cp>可以把内容分成几类：相对稳定的事实与偏好，例如常用语言；历史事件，例如某次项目决策及来源；经过验证的工作方式，例如团队固定报告格式。它们有效期不同，不能把一次任务要求变成永久规则，也不能把模型推断当成用户亲口确认。\u003c/p>\n\u003cp>\u003cstrong>先决定是否值得写入，再谈怎么搜出来。\u003c/strong> 写入要判断用途、稳定性、来源和允许保存的范围；读取要结合当前任务与权限，只取相关记忆。命中一条语义相似的旧记录，不代表它仍然有效。当前明确要求通常优先于旧偏好，但仍受更高层业务规则约束。\u003c/p>\n\u003cp>一条记忆应能关联主体、范围、来源时间、生效状态和修订关系。用户纠正后，旧值不应继续参与当前决策；摘要与向量副本也要同步失效。能实时查询的库存、余额或权限，不适合被当成长期事实缓存到个性化记忆里。\u003c/p>\n\u003cp>\u003cstrong>记得越多，未必越好。\u003c/strong> 无关记忆会污染上下文，过度推断让用户产生被误解感，旧偏好还可能阻碍新任务。先证明它减少了重复沟通、提升了任务结果，再扩大范围。\u003c/p>", "decision": "\u003cp>单独评估写入正确性、读取相关性和使用收益。记忆检索很准，但写入时就把临时预算记错，仍然会持续出错。提供查看、纠正和删除入口；明确组织共享知识与个人记忆的边界。记忆删除需要覆盖再次取用路径，而不是只从设置页隐藏。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>个人工作助手。\u003c/strong> 记住经确认的输出语言与周报结构，用户每周少重复说明；本次报告要求更详细时，以当前要求为准，不强行套用旧的简洁偏好。\u003c/p>\n\u003cp>\u003cstrong>客户跟进助手。\u003c/strong> 保留已确认的沟通要点与来源，后续会议前提取相关事项；客户预算和联系人角色发生变化时记录新版本。CRM 的最新业务状态优先查询，不从旧摘要直接推断。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>用户说‘这次’，系统却一直照做。\u003c/strong> 写入分类没有区分任务条件与长期偏好；修写入规则，并清理已产生的错误记忆。\u003c/li>\n\u003cli>\u003cstrong>修改记忆后仍用旧信息。\u003c/strong> 检查摘要、缓存、向量索引和会话上下文的旧副本，更新状态并在下一轮组装时排除。\u003c/li>\n\u003cli>\u003cstrong>跨项目串用经验。\u003c/strong> 给记忆增加项目与主体范围，读取时先限制范围，再做相关性检索，不能只凭语义相似就共享。\u003c/li>\n\u003c/ul>", "questions": [{"id": "19.1", "title": "长期记忆与 RAG 知识库有什么区别？", "answer": "\u003cp>“二者都可能通过检索把外部信息带进上下文，但管理对象和生命周期不同。知识库主要管理可引用资料，长期记忆更多管理用户偏好、历史决策与跨任务信息；不能只看是否用了向量库来区分。\u003c/p>\n\u003cp>企业制度由正式来源更新，个人偏好可能在交互中改变。记忆需要判断什么时候写入、什么范围有效、用户如何纠正；知识库更强调文档版本、完整性与来源。\u003c/p>\n\u003cp>实际可以组合使用，但要明确优先关系。当前业务状态查权威系统，当前明确要求优先于旧个人偏好。把所有对话自动向量化保存，并不等于设计好了长期记忆。”\u003c/p>"}, {"id": "19.2", "title": "你会怎样判断一条信息应该进入长期记忆？", "answer": "\u003cp>“我会问它是否稳定、是否有明确用途、来源是否可靠，以及是否允许保存。‘以后周报用这个模板’比‘这次预算三千’更像长期要求，后者通常只属于当前任务。\u003c/p>\n\u003cp>写入时记录范围与来源，区分用户明确表达和系统推断。敏感或高影响信息要更谨慎；实时价格和权限不作为长期静态事实。读取时还要检查是否过期、是否被新信息替代。\u003c/p>\n\u003cp>验证不能只看保存了多少条，要检查错误写入率、无关记忆干扰，以及是否减少重复沟通。如果记忆经常让用户纠正，说明个性化反而增加了负担。”\u003c/p>"}, {"id": "19.3", "title": "怎样评估记忆功能是否真的有价值？", "answer": "\u003cp>“我会用跨会话任务对照，有记忆与没有记忆时，用户需要补充多少重复信息、结果是否更符合要求，以及有没有引入旧条件错误。写入、取回和使用三个环节分别诊断。\u003c/p>\n\u003cp>测试要覆盖偏好变更、临时要求、记忆删除和跨项目隔离。比如用户撤销简洁偏好后，再次生成报告不应继续强制缩短；只测第一次记住姓名是不够的。\u003c/p>\n\u003cp>长期观察纠正次数和任务采纳，但不把用户少打字自动当成功，可能是系统代用户做了错误假设。记忆的价值应是可控地减少沟通，而不是尽可能多地储存个人信息。”\u003c/p>"}], "search": "长期记忆：记什么、什么时候用、什么时候该忘？\n长期记忆是应用跨会话保存并取用的信息，不等于模型参数记住了用户。它可以存数据库字段、文档、历史摘要或向量索引中；关键不在存储品牌，而在写入、读取、更新和删除规则。\n\n比如“用户偏好简短回答”可以成为可查看、可修改的长期记忆；“本次出差改到周五”则先作为当前任务的有效条件。\n\n可以把内容分成几类：相对稳定的事实与偏好，例如常用语言；历史事件，例如某次项目决策及来源；经过验证的工作方式，例如团队固定报告格式。它们有效期不同，不能把一次任务要求变成永久规则，也不能把模型推断当成用户亲口确认。\n\n**先决定是否值得写入，再谈怎么搜出来。** 写入要判断用途、稳定性、来源和允许保存的范围；读取要结合当前任务与权限，只取相关记忆。命中一条语义相似的旧记录，不代表它仍然有效。当前明确要求通常优先于旧偏好，但仍受更高层业务规则约束。\n\n一条记忆应能关联主体、范围、来源时间、生效状态和修订关系。用户纠正后，旧值不应继续参与当前决策；摘要与向量副本也要同步失效。能实时查询的库存、余额或权限，不适合被当成长期事实缓存到个性化记忆里。\n\n**记得越多，未必越好。** 无关记忆会污染上下文，过度推断让用户产生被误解感，旧偏好还可能阻碍新任务。先证明它减少了重复沟通、提升了任务结果，再扩大范围。\n单独评估写入正确性、读取相关性和使用收益。记忆检索很准，但写入时就把临时预算记错，仍然会持续出错。提供查看、纠正和删除入口；明确组织共享知识与个人记忆的边界。记忆删除需要覆盖再次取用路径，而不是只从设置页隐藏。\n**个人工作助手。** 记住经确认的输出语言与周报结构，用户每周少重复说明；本次报告要求更详细时，以当前要求为准，不强行套用旧的简洁偏好。\n\n**客户跟进助手。** 保留已确认的沟通要点与来源，后续会议前提取相关事项；客户预算和联系人角色发生变化时记录新版本。CRM 的最新业务状态优先查询，不从旧摘要直接推断。\n- **用户说‘这次’，系统却一直照做。** 写入分类没有区分任务条件与长期偏好；修写入规则，并清理已产生的错误记忆。\n- **修改记忆后仍用旧信息。** 检查摘要、缓存、向量索引和会话上下文的旧副本，更新状态并在下一轮组装时排除。\n- **跨项目串用经验。** 给记忆增加项目与主体范围，读取时先限制范围，再做相关性检索，不能只凭语义相似就共享。\n长期记忆与 RAG 知识库有什么区别？ “二者都可能通过检索把外部信息带进上下文，但管理对象和生命周期不同。知识库主要管理可引用资料，长期记忆更多管理用户偏好、历史决策与跨任务信息；不能只看是否用了向量库来区分。\n企业制度由正式来源更新，个人偏好可能在交互中改变。记忆需要判断什么时候写入、什么范围有效、用户如何纠正；知识库更强调文档版本、完整性与来源。\n实际可以组合使用，但要明确优先关系。当前业务状态查权威系统，当前明确要求优先于旧个人偏好。把所有对话自动向量化保存，并不等于设计好了长期记忆。”\n你会怎样判断一条信息应该进入长期记忆？ “我会问它是否稳定、是否有明确用途、来源是否可靠，以及是否允许保存。‘以后周报用这个模板’比‘这次预算三千’更像长期要求，后者通常只属于当前任务。\n写入时记录范围与来源，区分用户明确表达和系统推断。敏感或高影响信息要更谨慎；实时价格和权限不作为长期静态事实。读取时还要检查是否过期、是否被新信息替代。\n验证不能只看保存了多少条，要检查错误写入率、无关记忆干扰，以及是否减少重复沟通。如果记忆经常让用户纠正，说明个性化反而增加了负担。”\n怎样评估记忆功能是否真的有价值？ “我会用跨会话任务对照，有记忆与没有记忆时，用户需要补充多少重复信息、结果是否更符合要求，以及有没有引入旧条件错误。写入、取回和使用三个环节分别诊断。\n测试要覆盖偏好变更、临时要求、记忆删除和跨项目隔离。比如用户撤销简洁偏好后，再次生成报告不应继续强制缩短；只测第一次记住姓名是不够的。\n长期观察纠正次数和任务采纳，但不把用户少打字自动当成功，可能是系统代用户做了错误假设。记忆的价值应是可控地减少沟通，而不是尽可能多地储存个人信息。”"}, {"id": "k20", "number": "20", "title": "多智能体：怎样分工才值得增加协调成本？", "short": "多智能体", "priority": "P2", "group": 2, "intro": "\u003cp>多智能体把任务交给多个具有不同上下文、工具或职责的 Agent，再协调结果。多个角色可以使用同一基础模型；反过来，一个 Agent 调用多个模型，也不一定构成多智能体。更重要的是谁负责决策、信息怎么传、结果怎样合并。\u003c/p>\n\u003cp>常见方式有顺序交接、并行分工和协调者分派。顺序交接适合阶段依赖；并行适合互不依赖的资料域；协调者根据任务动态拆解，适合事前不能完全确定工作量的情况。拆成多个名字但仍互相重复分析，通常只会增加调用。\u003c/p>\n\u003cp>\u003cstrong>分工的收益来自隔离和并行。\u003c/strong> 每个角色只读必要上下文，可以减少干扰；独立工具权限也更清楚。并行的总时长近似受最慢分支加协调与合并耗时影响，不是把所有分支时间相加；总费用却仍需累加全部分支消耗。顺序依赖很多时，开更多角色未必更快。\u003c/p>\n\u003cp>子任务需要清楚输入、产物格式、来源、截止时间、预算和失败状态。共享状态由协调机制管理，避免多个角色同时覆盖同一字段。合并时要处理重复、口径不一致和证据冲突，不能让“汇总角色”凭更自信的措辞决定事实。\u003c/p>\n\u003cp>独立核验角色只有接触到原证据或真实执行结果，才可能提供不同检查。多个相似模型看同一错误摘要并投票，错误往往相关，不是天然的可靠多数。\u003c/p>", "decision": "\u003cp>先建立单 Agent 或固定工作流基线，再看分工是否解决了上下文容量、专业工具或并行等待的明确瓶颈。用消融实验检查去掉一个角色会损失什么。比较完整任务质量、总 Token、关键路径耗时与人工合并量，避免只展示更复杂的流程图。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>竞品研究。\u003c/strong> 不同任务分别查价格、用户流程和技术约束，按统一证据格式返回，再汇总比较。未找到的资料标缺失，不能让汇总者把空白补成确定结论。\u003c/p>\n\u003cp>\u003cstrong>跨模块代码维护。\u003c/strong> 相互独立的组件可以分工分析，统一接口与集成检查；多个角色修改同一文件时需要明确所有权或串行合并，不能只相信最后一次写入。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>角色很多，结果更啰嗦却没提升。\u003c/strong> 检查每个角色是否提供独立信息或验证能力，合并重复职责，先比较单体基线。\u003c/li>\n\u003cli>\u003cstrong>并行仍然很慢。\u003c/strong> 看最慢分支、协调等待与汇总输入量；减少无效研究范围，设超时与部分结果策略。\u003c/li>\n\u003cli>\u003cstrong>多个结论相互矛盾。\u003c/strong> 核对时间、指标定义和原始来源；事实争议回证据，方案争议回目标约束，不做无依据多数投票。\u003c/li>\n\u003c/ul>", "questions": [{"id": "20.1", "title": "什么任务真正适合多智能体？", "answer": "\u003cp>“我会看任务能否拆成相对独立的子问题，以及分工能否带来上下文隔离、权限隔离或并行收益。比如竞品价格、流程和技术约束分别研究，再统一汇总，比几个角色轮流改同一段摘要更有明确价值。\u003c/p>\n\u003cp>但拆开后需要信息交换和结果合并，所以先有单 Agent 或工作流基线。用同一批任务比较质量、总成本和关键路径时间，确认收益来自分工，而不是单纯多用了计算。\u003c/p>\n\u003cp>如果任务很短、共享上下文很多、每一步又强依赖前一步，多智能体可能增加沟通损耗。我不会以角色数量作为先进程度。”\u003c/p>"}, {"id": "20.2", "title": "多智能体结果冲突，协调者应该怎么处理？", "answer": "\u003cp>“先要求各方提交结论、原始来源、时间与口径，判断冲突是不是来自不同定义。比如一个报告按支付额、另一个按净收入，先统一指标，不能简单挑一个结论。\u003c/p>\n\u003cp>事实冲突回到原始证据或权威系统核验；缺资料就补查或明确保留分歧。方案取舍则根据共同目标、成本和约束做选择，需要业务判断时交给负责人。\u003c/p>\n\u003cp>协调者的职责是组织比较和补证，不是天然更正确。评测要专门包含冲突案例，检查最终是否暴露不确定性，而不是把矛盾悄悄合成一句听起来顺畅的话。”\u003c/p>"}, {"id": "20.3", "title": "怎样证明多智能体没有过度设计？", "answer": "\u003cp>“我会做对照和消融。先比较单体、固定分工和动态分工在同一批任务上的表现，再逐个去掉角色，看质量、时延或权限隔离是否真的受损。\u003c/p>\n\u003cp>成本计算累加所有分支、重复研究和汇总消耗，时延则看真实关键路径。并行可能减少等待，却增加总费用；汇总阶段也可能因为上下文膨胀成为新瓶颈。\u003c/p>\n\u003cp>如果某个角色只是在重复同样分析，删掉它效果不变，就应该简化。只有在可复现的任务收益足以抵消协调和维护成本时，我才会保留多智能体方案。”\u003c/p>"}], "search": "多智能体：怎样分工才值得增加协调成本？\n多智能体把任务交给多个具有不同上下文、工具或职责的 Agent，再协调结果。多个角色可以使用同一基础模型；反过来，一个 Agent 调用多个模型，也不一定构成多智能体。更重要的是谁负责决策、信息怎么传、结果怎样合并。\n\n常见方式有顺序交接、并行分工和协调者分派。顺序交接适合阶段依赖；并行适合互不依赖的资料域；协调者根据任务动态拆解，适合事前不能完全确定工作量的情况。拆成多个名字但仍互相重复分析，通常只会增加调用。\n\n**分工的收益来自隔离和并行。** 每个角色只读必要上下文，可以减少干扰；独立工具权限也更清楚。并行的总时长近似受最慢分支加协调与合并耗时影响，不是把所有分支时间相加；总费用却仍需累加全部分支消耗。顺序依赖很多时，开更多角色未必更快。\n\n子任务需要清楚输入、产物格式、来源、截止时间、预算和失败状态。共享状态由协调机制管理，避免多个角色同时覆盖同一字段。合并时要处理重复、口径不一致和证据冲突，不能让“汇总角色”凭更自信的措辞决定事实。\n\n独立核验角色只有接触到原证据或真实执行结果，才可能提供不同检查。多个相似模型看同一错误摘要并投票，错误往往相关，不是天然的可靠多数。\n先建立单 Agent 或固定工作流基线，再看分工是否解决了上下文容量、专业工具或并行等待的明确瓶颈。用消融实验检查去掉一个角色会损失什么。比较完整任务质量、总 Token、关键路径耗时与人工合并量，避免只展示更复杂的流程图。\n**竞品研究。** 不同任务分别查价格、用户流程和技术约束，按统一证据格式返回，再汇总比较。未找到的资料标缺失，不能让汇总者把空白补成确定结论。\n\n**跨模块代码维护。** 相互独立的组件可以分工分析，统一接口与集成检查；多个角色修改同一文件时需要明确所有权或串行合并，不能只相信最后一次写入。\n- **角色很多，结果更啰嗦却没提升。** 检查每个角色是否提供独立信息或验证能力，合并重复职责，先比较单体基线。\n- **并行仍然很慢。** 看最慢分支、协调等待与汇总输入量；减少无效研究范围，设超时与部分结果策略。\n- **多个结论相互矛盾。** 核对时间、指标定义和原始来源；事实争议回证据，方案争议回目标约束，不做无依据多数投票。\n什么任务真正适合多智能体？ “我会看任务能否拆成相对独立的子问题，以及分工能否带来上下文隔离、权限隔离或并行收益。比如竞品价格、流程和技术约束分别研究，再统一汇总，比几个角色轮流改同一段摘要更有明确价值。\n但拆开后需要信息交换和结果合并，所以先有单 Agent 或工作流基线。用同一批任务比较质量、总成本和关键路径时间，确认收益来自分工，而不是单纯多用了计算。\n如果任务很短、共享上下文很多、每一步又强依赖前一步，多智能体可能增加沟通损耗。我不会以角色数量作为先进程度。”\n多智能体结果冲突，协调者应该怎么处理？ “先要求各方提交结论、原始来源、时间与口径，判断冲突是不是来自不同定义。比如一个报告按支付额、另一个按净收入，先统一指标，不能简单挑一个结论。\n事实冲突回到原始证据或权威系统核验；缺资料就补查或明确保留分歧。方案取舍则根据共同目标、成本和约束做选择，需要业务判断时交给负责人。\n协调者的职责是组织比较和补证，不是天然更正确。评测要专门包含冲突案例，检查最终是否暴露不确定性，而不是把矛盾悄悄合成一句听起来顺畅的话。”\n怎样证明多智能体没有过度设计？ “我会做对照和消融。先比较单体、固定分工和动态分工在同一批任务上的表现，再逐个去掉角色，看质量、时延或权限隔离是否真的受损。\n成本计算累加所有分支、重复研究和汇总消耗，时延则看真实关键路径。并行可能减少等待，却增加总费用；汇总阶段也可能因为上下文膨胀成为新瓶颈。\n如果某个角色只是在重复同样分析，删掉它效果不变，就应该简化。只有在可复现的任务收益足以抵消协调和维护成本时，我才会保留多智能体方案。”"}, {"id": "k21", "number": "21", "title": "ASR 与会议处理：听清楚、分清人、提对待办是三件事", "short": "ASR 与会议处理", "priority": "P1", "group": 3, "intro": "\u003cp>ASR 把语音转成文字，但会议产品的交付不是“出现文字”就结束了。典型链路还包括音频接入、语音区间检测、说话人分离、时间对齐、纪要整理与待办提取。现在也有直接处理音频的多模态模型，具体技术组合可以变化，业务上仍要区分这些任务，才能定位错误。\u003c/p>\n\u003cp>比如会议录音先转成可处理的文本，再提取结论和待办；转写正确不代表负责人和截止时间一定提取正确。\u003c/p>\n\u003cp>VAD 判断哪里有语音，帮助切分片段和处理静音；说话人分离判断不同片段是否来自同一位说话者，不自动知道真实姓名。把“说话人 2”对应为项目负责人，需要参会信息、声纹方案或用户确认，不能凭发言内容猜身份。\u003c/p>\n\u003cp>\u003cstrong>实时结果常常会修订。\u003c/strong> 语音模型听到后半句后，可能纠正前面的同音字或断句。因此界面应区分临时字幕与稳定文稿，不能每次字幕变化就同步创建业务待办。分段过短会丢语义，过长会增加等待，断句与实时性需要平衡。\u003c/p>\n\u003cp>从转写到待办，还要处理承诺关系。“我们可以考虑下周上线”“下周先不要上线”“王明负责确认能否上线”，分别是建议、否定和确认任务，不能都提取成王明下周上线。负责人、期限与状态要有原话依据，并保留音频时间戳。\u003c/p>\n\u003cp>WER 按词计算替换、删除、插入的错误，CER 按字符计算，中文场景经常关注 CER，但两者都受分词和规范化规则影响。整体转写错误率低，也可能刚好把关键金额或否定词听错。纪要准确和待办准确需要独立评估。\u003c/p>", "decision": "\u003cp>把音频到字幕延迟、最终文稿就绪时间和纪要生成时间分开测。待办既看提取准确率，也看应提取事项的召回；只提一条最简单的任务可能很准，却漏了关键责任。建立噪声、多人交叠、术语、中英混说和纠正发言的样本，验收要能回听原句。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>项目会议助手。\u003c/strong> 实时显示字幕，会议结束后生成结论、分歧、待办与未确认项，参会人核对后再同步任务系统。后续发言推翻前文时，要更新结论而不是把两版都当成决定。\u003c/p>\n\u003cp>\u003cstrong>语音客服质检。\u003c/strong> 转写带时间与说话人角色，检查是否准确解释政策、是否有未解决诉求。业务员与客户说同一句话，含义可能不同；评价依赖角色与上下文，不能只搜索关键词。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>纪要像真的，负责人却总错。\u003c/strong> 先查说话人映射，再查待办抽取；“我去问张三”不等于张三已承诺执行。\u003c/li>\n\u003cli>\u003cstrong>实时字幕很快，但频繁来回改。\u003c/strong> 检查片段提交策略和稳定结果标识，区分预览与最终确认，避免界面闪动和下游重复处理。\u003c/li>\n\u003cli>\u003cstrong>专业词误识别影响结论。\u003c/strong> 结合目标服务支持的词表、上下文或后处理，并保留原始转写。修正要有依据，不能把不确定音频强行替换成业务上看似合理的词。\u003c/li>\n\u003c/ul>", "questions": [{"id": "21.1", "title": "会议待办不准确，你会怎样拆解问题？", "answer": "\u003cp>“我会拿一条错误待办回听原音频，先判断听错、认错人，还是理解错了发言意图。三个环节修法不一样，不能都通过改总结提示词处理。\u003c/p>\n\u003cp>比如原话是‘王明确认能否上线’，转写正确但变成‘王明负责上线’，属于任务语义错误；说话人对应错了，则要修角色映射。提取字段要区分任务、负责人、期限、是否已确认，并附时间戳。\u003c/p>\n\u003cp>评估同时看错误待办和遗漏待办，以及人工修订时间。系统可以把不确定项留给确认，不应该为了列表完整补出不存在的责任和日期。”\u003c/p>"}, {"id": "21.2", "title": "转写准确率很高，为什么用户还是不满意？", "answer": "\u003cp>“因为整体转写指标与业务结果不是一回事。大部分闲聊识别正确，少数金额、否定词和责任人识别错，就可能让纪要不可用。文字正确以后，还可能在结论归纳和任务提取上出错。\u003c/p>\n\u003cp>我会按关键字段、说话人、结论和待办分层抽查，而不是只看一个平均错误率。实时体验还涉及字幕稳定性、断流、时间定位和修改成本。\u003c/p>\n\u003cp>因此验收既包括 CER 或 WER 这类转写指标，也包括关键事实、任务准确性和用户核对时间。需要先把计量规则说清楚，再比较不同方案，不能把某家服务公布的分数直接当产品效果。”\u003c/p>"}, {"id": "21.3", "title": "实时会议助手如何兼顾低延迟和可靠性？", "answer": "\u003cp>“我会分开临时展示和正式产物。临时字幕可以尽早显示并允许修订，稳定转写再参与最终纪要和待办处理；涉及创建任务的动作在用户确认或规定的可靠条件满足后执行。\u003c/p>\n\u003cp>技术上观察分段、语音结束判断、网络和模型耗时，产品上标识断流与覆盖缺口，支持会后补处理。过短分段可能失去上下文，过长又拖慢体验，要用真实会议样本取舍。\u003c/p>\n\u003cp>指标分别记录首段字幕、稳定文稿和纪要就绪延迟，同时检查关键事实。流式体验不能靠把未经稳定确认的内容直接当最终结论来换速度。”\u003c/p>"}], "search": "ASR 与会议处理：听清楚、分清人、提对待办是三件事\nASR 把语音转成文字，但会议产品的交付不是“出现文字”就结束了。典型链路还包括音频接入、语音区间检测、说话人分离、时间对齐、纪要整理与待办提取。现在也有直接处理音频的多模态模型，具体技术组合可以变化，业务上仍要区分这些任务，才能定位错误。\n\n比如会议录音先转成可处理的文本，再提取结论和待办；转写正确不代表负责人和截止时间一定提取正确。\n\nVAD 判断哪里有语音，帮助切分片段和处理静音；说话人分离判断不同片段是否来自同一位说话者，不自动知道真实姓名。把“说话人 2”对应为项目负责人，需要参会信息、声纹方案或用户确认，不能凭发言内容猜身份。\n\n**实时结果常常会修订。** 语音模型听到后半句后，可能纠正前面的同音字或断句。因此界面应区分临时字幕与稳定文稿，不能每次字幕变化就同步创建业务待办。分段过短会丢语义，过长会增加等待，断句与实时性需要平衡。\n\n从转写到待办，还要处理承诺关系。“我们可以考虑下周上线”“下周先不要上线”“王明负责确认能否上线”，分别是建议、否定和确认任务，不能都提取成王明下周上线。负责人、期限与状态要有原话依据，并保留音频时间戳。\n\nWER 按词计算替换、删除、插入的错误，CER 按字符计算，中文场景经常关注 CER，但两者都受分词和规范化规则影响。整体转写错误率低，也可能刚好把关键金额或否定词听错。纪要准确和待办准确需要独立评估。\n把音频到字幕延迟、最终文稿就绪时间和纪要生成时间分开测。待办既看提取准确率，也看应提取事项的召回；只提一条最简单的任务可能很准，却漏了关键责任。建立噪声、多人交叠、术语、中英混说和纠正发言的样本，验收要能回听原句。\n**项目会议助手。** 实时显示字幕，会议结束后生成结论、分歧、待办与未确认项，参会人核对后再同步任务系统。后续发言推翻前文时，要更新结论而不是把两版都当成决定。\n\n**语音客服质检。** 转写带时间与说话人角色，检查是否准确解释政策、是否有未解决诉求。业务员与客户说同一句话，含义可能不同；评价依赖角色与上下文，不能只搜索关键词。\n- **纪要像真的，负责人却总错。** 先查说话人映射，再查待办抽取；“我去问张三”不等于张三已承诺执行。\n- **实时字幕很快，但频繁来回改。** 检查片段提交策略和稳定结果标识，区分预览与最终确认，避免界面闪动和下游重复处理。\n- **专业词误识别影响结论。** 结合目标服务支持的词表、上下文或后处理，并保留原始转写。修正要有依据，不能把不确定音频强行替换成业务上看似合理的词。\n会议待办不准确，你会怎样拆解问题？ “我会拿一条错误待办回听原音频，先判断听错、认错人，还是理解错了发言意图。三个环节修法不一样，不能都通过改总结提示词处理。\n比如原话是‘王明确认能否上线’，转写正确但变成‘王明负责上线’，属于任务语义错误；说话人对应错了，则要修角色映射。提取字段要区分任务、负责人、期限、是否已确认，并附时间戳。\n评估同时看错误待办和遗漏待办，以及人工修订时间。系统可以把不确定项留给确认，不应该为了列表完整补出不存在的责任和日期。”\n转写准确率很高，为什么用户还是不满意？ “因为整体转写指标与业务结果不是一回事。大部分闲聊识别正确，少数金额、否定词和责任人识别错，就可能让纪要不可用。文字正确以后，还可能在结论归纳和任务提取上出错。\n我会按关键字段、说话人、结论和待办分层抽查，而不是只看一个平均错误率。实时体验还涉及字幕稳定性、断流、时间定位和修改成本。\n因此验收既包括 CER 或 WER 这类转写指标，也包括关键事实、任务准确性和用户核对时间。需要先把计量规则说清楚，再比较不同方案，不能把某家服务公布的分数直接当产品效果。”\n实时会议助手如何兼顾低延迟和可靠性？ “我会分开临时展示和正式产物。临时字幕可以尽早显示并允许修订，稳定转写再参与最终纪要和待办处理；涉及创建任务的动作在用户确认或规定的可靠条件满足后执行。\n技术上观察分段、语音结束判断、网络和模型耗时，产品上标识断流与覆盖缺口，支持会后补处理。过短分段可能失去上下文，过长又拖慢体验，要用真实会议样本取舍。\n指标分别记录首段字幕、稳定文稿和纪要就绪延迟，同时检查关键事实。流式体验不能靠把未经稳定确认的内容直接当最终结论来换速度。”"}, {"id": "k22", "number": "22", "title": "图像理解与生成：看得懂、搜得到、画得好是不同能力", "short": "图像理解与生成", "priority": "P1", "group": 3, "intro": "\u003cp>多模态模型能处理文字以外的信息，但不同任务的目标并不相同。OCR 读图中文字，视觉语言模型理解图文关系，多模态检索寻找相关素材，图像生成或编辑产出新图。它们可以组合，也可能由一个服务提供，但验收不能合成一句“支持图片”。\u003c/p>\n\u003cp>视觉模型通常把图片转换成可供模型处理的表示，再与文本指令结合。分辨率、裁剪、图片数量和服务的图像处理方式，会影响细节和成本。缩得太小可能看不清图表坐标；上传大图也不保证模型精确数出所有物体，具体能力要测。\u003c/p>\n\u003cp>\u003cstrong>理解图片时，区分观察与推断。\u003c/strong> 能看到“穿红衣服的人站在门口”，不等于知道对方身份、拍摄地点或事件原因。图表识别出上升趋势，也不代表读对了单位、基线和数值。涉及精确数据时，可以结合 OCR、区域裁剪和确定性计算。\u003c/p>\n\u003cp>生成图片则需要定义主题、构图、风格、尺寸、文字与编辑范围。局部编辑要尽量保持其他区域，人物或商品一致性还需要参考图、约束与检查。许多生图系统会逐步生成或去噪，也有其他生成架构；产品决策主要看可控性和交付质量，不必假设所有模型内部机制相同。\u003c/p>", "decision": "\u003cp>图像理解看事实忠实、细节覆盖和任务正确；检索看目标素材能否找到；生成看约束遵循、可编辑性与人工返工。用户要一张活动图时，品牌文字写错比风格不够惊艳更影响交付。真实图片、生成内容和经过编辑的内容要有清楚使用边界。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>截图问题诊断。\u003c/strong> 用户发来报错截图，系统识别提示、当前页面和相关控件，再结合产品版本查询解决办法；缺上下文时补问。截图上没有的账号状态，应通过授权接口核验。\u003c/p>\n\u003cp>\u003cstrong>电商素材制作。\u003c/strong> 用商品参考图生成多种场景，保留商品关键外观与文案约束，再检查 Logo、文字、尺寸和细节一致性。候选图可快速扩展创意，正式发布仍需按商品真实属性核对。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>图表趋势说对，数字说错。\u003c/strong> 核对坐标、单位和裁剪后的文字可读性；必要时先抽取数据，再让模型解释。\u003c/li>\n\u003cli>\u003cstrong>改一个区域，其他区域也变了。\u003c/strong> 检查编辑方式、遮罩或参考条件，逐项比对必须保持的元素，不只凭整体相似度验收。\u003c/li>\n\u003cli>\u003cstrong>一张图演示很好，批量失败。\u003c/strong> 按清晰度、遮挡、长宽比和内容类型分组测试，明确支持范围，而不是把单图成功泛化成通用视觉能力。\u003c/li>\n\u003c/ul>", "questions": [{"id": "22.1", "title": "你会怎样拆解一个多模态需求？", "answer": "\u003cp>“我先问用户到底要从已有内容提取事实、查找素材，还是创造新内容。截图诊断、按图搜商品和生成广告图虽然都涉及图片，但数据、流程和评测标准完全不同。\u003c/p>\n\u003cp>如果要读精确文字和数字，重点检查 OCR 与位置关系；如果要理解场景，评估视觉模型；如果要找已有素材，建立检索；生成则定义构图、品牌和编辑约束。能力可以组合，不要求一个模型包办。\u003c/p>\n\u003cp>然后用目标用户真实类型的图片测试，明确失败边界与纠正入口。‘接入多模态’不是可验收需求，用户最终拿到什么才是。”\u003c/p>"}, {"id": "22.2", "title": "视觉模型回答截图问题时，怎样避免把猜测当事实？", "answer": "\u003cp>“我会让它区分可见信息与推断。截图上的报错文字、页面元素可以直接核对；账号是否被封、后台订单是否失败，通常不能仅凭截图确定，需要业务查询或补充信息。\u003c/p>\n\u003cp>对小字和图表，先检查分辨率、裁剪和 OCR 结果；关键结论对应到图中区域或可查资料。模型没看清时应该明确缺口，不用一个很流畅的解释掩盖不确定。\u003c/p>\n\u003cp>评估加入模糊、遮挡、相似界面和版本变化样本，分别看读取错误与推理错误。这样才能知道应改善输入处理，还是改知识接入和判断逻辑。”\u003c/p>"}, {"id": "22.3", "title": "如何评价一套文生图或图像编辑能力？", "answer": "\u003cp>“我会先把交付约束拆开：主题构图、尺寸、品牌元素、文字正确、商品或人物一致，以及指定区域修改后其他内容是否保持。好看是一项，符合使用要求是另一项。\u003c/p>\n\u003cp>用同一组真实任务生成多个候选，观察首次可用率、达到可发布标准的迭代次数与总成本。局部编辑还要与原图逐项对照，不能只看修改区域变好了。\u003c/p>\n\u003cp>不同用途权重不同，电商商品细节和营销海报文字都是关键。最终评价围绕人工返工和实际交付，不会用一张漂亮示例代表整个产品能力。”\u003c/p>"}], "search": "图像理解与生成：看得懂、搜得到、画得好是不同能力\n多模态模型能处理文字以外的信息，但不同任务的目标并不相同。OCR 读图中文字，视觉语言模型理解图文关系，多模态检索寻找相关素材，图像生成或编辑产出新图。它们可以组合，也可能由一个服务提供，但验收不能合成一句“支持图片”。\n\n视觉模型通常把图片转换成可供模型处理的表示，再与文本指令结合。分辨率、裁剪、图片数量和服务的图像处理方式，会影响细节和成本。缩得太小可能看不清图表坐标；上传大图也不保证模型精确数出所有物体，具体能力要测。\n\n**理解图片时，区分观察与推断。** 能看到“穿红衣服的人站在门口”，不等于知道对方身份、拍摄地点或事件原因。图表识别出上升趋势，也不代表读对了单位、基线和数值。涉及精确数据时，可以结合 OCR、区域裁剪和确定性计算。\n\n生成图片则需要定义主题、构图、风格、尺寸、文字与编辑范围。局部编辑要尽量保持其他区域，人物或商品一致性还需要参考图、约束与检查。许多生图系统会逐步生成或去噪，也有其他生成架构；产品决策主要看可控性和交付质量，不必假设所有模型内部机制相同。\n图像理解看事实忠实、细节覆盖和任务正确；检索看目标素材能否找到；生成看约束遵循、可编辑性与人工返工。用户要一张活动图时，品牌文字写错比风格不够惊艳更影响交付。真实图片、生成内容和经过编辑的内容要有清楚使用边界。\n**截图问题诊断。** 用户发来报错截图，系统识别提示、当前页面和相关控件，再结合产品版本查询解决办法；缺上下文时补问。截图上没有的账号状态，应通过授权接口核验。\n\n**电商素材制作。** 用商品参考图生成多种场景，保留商品关键外观与文案约束，再检查 Logo、文字、尺寸和细节一致性。候选图可快速扩展创意，正式发布仍需按商品真实属性核对。\n- **图表趋势说对，数字说错。** 核对坐标、单位和裁剪后的文字可读性；必要时先抽取数据，再让模型解释。\n- **改一个区域，其他区域也变了。** 检查编辑方式、遮罩或参考条件，逐项比对必须保持的元素，不只凭整体相似度验收。\n- **一张图演示很好，批量失败。** 按清晰度、遮挡、长宽比和内容类型分组测试，明确支持范围，而不是把单图成功泛化成通用视觉能力。\n你会怎样拆解一个多模态需求？ “我先问用户到底要从已有内容提取事实、查找素材，还是创造新内容。截图诊断、按图搜商品和生成广告图虽然都涉及图片，但数据、流程和评测标准完全不同。\n如果要读精确文字和数字，重点检查 OCR 与位置关系；如果要理解场景，评估视觉模型；如果要找已有素材，建立检索；生成则定义构图、品牌和编辑约束。能力可以组合，不要求一个模型包办。\n然后用目标用户真实类型的图片测试，明确失败边界与纠正入口。‘接入多模态’不是可验收需求，用户最终拿到什么才是。”\n视觉模型回答截图问题时，怎样避免把猜测当事实？ “我会让它区分可见信息与推断。截图上的报错文字、页面元素可以直接核对；账号是否被封、后台订单是否失败，通常不能仅凭截图确定，需要业务查询或补充信息。\n对小字和图表，先检查分辨率、裁剪和 OCR 结果；关键结论对应到图中区域或可查资料。模型没看清时应该明确缺口，不用一个很流畅的解释掩盖不确定。\n评估加入模糊、遮挡、相似界面和版本变化样本，分别看读取错误与推理错误。这样才能知道应改善输入处理，还是改知识接入和判断逻辑。”\n如何评价一套文生图或图像编辑能力？ “我会先把交付约束拆开：主题构图、尺寸、品牌元素、文字正确、商品或人物一致，以及指定区域修改后其他内容是否保持。好看是一项，符合使用要求是另一项。\n用同一组真实任务生成多个候选，观察首次可用率、达到可发布标准的迭代次数与总成本。局部编辑还要与原图逐项对照，不能只看修改区域变好了。\n不同用途权重不同，电商商品细节和营销海报文字都是关键。最终评价围绕人工返工和实际交付，不会用一张漂亮示例代表整个产品能力。”"}, {"id": "k23", "number": "23", "title": "第三方 API 与账号授权：代表用户办事，需要哪些前提？", "short": "第三方 API 与账号授权", "priority": "P1", "group": 3, "intro": "\u003cp>API 把业务能力变成可调用接口。接入时不只看请求字段，还要看身份、授权范围、业务前置条件、返回状态、限流和错误语义。智能体可以组织调用，却不能替业务系统决定真实库存、余额或订单结果。\u003c/p>\n\u003cp>认证确认调用者身份，授权确认允许做什么。OAuth 常用于委托授权：用户在服务方允许的流程中授予应用访问范围，应用获得访问令牌；身份登录通常还需要 OIDC 等相应机制。不能看到 OAuth 就把它简单等同于“知道用户是谁”。\u003c/p>\n\u003cp>比如用户授权读取日历，不代表也授权删除日程；每项操作都要落到允许的能力范围。\u003c/p>\n\u003cp>\u003cstrong>令牌的范围与生命周期要管理。\u003c/strong> Access Token 用于访问资源，Refresh Token 在服务支持时用于换取新的访问令牌，两者的用途和保护要求不同。授权可能到期、被撤销，账号也可能绑定错误。服务端应安全保存凭据，模型只接触完成任务必需的业务数据。\u003c/p>\n\u003cp>读取、创建、修改和删除往往对应不同权限。用户授权应用读日历，不表示可以删除日程；授权应用具备发布能力，也不等于每次草稿都可以未经任务授权直接发布。账号授权和当前动作授权需要衔接。\u003c/p>\n\u003cp>异步 API 可能只返回受理状态，实际结果通过查询或回调获取。回调也可能重复、迟到或乱序，需要校验来源、去重并结合状态处理。HTTP 200 不是完整业务成功的同义词。\u003c/p>", "decision": "\u003cp>从任务所需的最小能力申请权限，说明连接了哪个账号、可做哪些事，以及如何撤销。按认证失败、权限不足、限流、业务拒绝和暂时故障分类处理。接口能力不满足承诺时，应调整产品流程，不能让模型通过反复重试假装集成完整。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>日程助手。\u003c/strong> 读取空闲时间与参与者时区，展示拟创建的日程，按授权写入并返回事件 ID。时间改变后重新检查冲突；用户撤权后停止后续访问。\u003c/p>\n\u003cp>\u003cstrong>售后协同。\u003c/strong> 查询订单和退款申请，提交符合规则的动作，通过回调与主动查询确认状态。用户看到的是“申请已受理”或“退款已完成”等真实阶段，不是一律成功。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>昨天能用，今天全部失败。\u003c/strong> 检查令牌到期、撤销、Scope 与账号关联，避免把授权问题当临时网络异常无限重试。\u003c/li>\n\u003cli>\u003cstrong>接口返回 200，业务没变化。\u003c/strong> 检查业务码、异步任务 ID 和最终状态；UI 不能只依据传输成功更新为完成。\u003c/li>\n\u003cli>\u003cstrong>同一回调更新了两次。\u003c/strong> 验证事件标识与状态版本，去重处理；乱序通知不能把完成态退回较早状态，状态变化需遵循业务规则。\u003c/li>\n\u003c/ul>", "questions": [{"id": "23.1", "title": "OAuth 授权和用户确认操作是什么关系？", "answer": "\u003cp>“OAuth 解决应用被授予哪些资源访问能力，当前任务确认解决这次具体要做什么。用户授权日历写权限，只说明应用具备写的能力，不代表可以任意创建或删除所有日程。\u003c/p>\n\u003cp>我会在连接账号时展示范围与撤销入口，执行任务时核对当前意图、对象和必要确认。凭据由受控服务管理，不把 Token 放进模型上下文。\u003c/p>\n\u003cp>验收既测授权拒绝、过期和撤销，也测有读权限却尝试写操作、账号绑定错误等情况。权限能力与任务意图都满足，才进入实际执行。”\u003c/p>"}, {"id": "23.2", "title": "第三方 API 接入评审，你重点检查什么？", "answer": "\u003cp>“先看接口是否真正覆盖用户任务，再看权限、状态和失败处理。字段能不能传只是基础，还要知道成功是受理还是完成，是否支持查询、回调、幂等和批量部分失败。\u003c/p>\n\u003cp>例如退款接口，除了提交金额，还需要知道可退余额、订单范围、最终到账状态和超时后如何核验。授权方式、限流、服务可用性与版本兼容也会影响产品承诺。\u003c/p>\n\u003cp>我会用正常、拒绝、超时、重复和撤权场景做联调，形成可恢复流程。没有最终状态查询能力，就不能在界面上承诺实时确认成功。”\u003c/p>"}, {"id": "23.3", "title": "接口失败时，什么时候重试，什么时候转交用户？", "answer": "\u003cp>“先按原因区分。授权过期需要刷新或重新授权，权限不足和业务拒绝通常不是重试能解决；临时网络异常或可恢复服务错误可以有限重试，限流要遵守等待提示。\u003c/p>\n\u003cp>写操作超时尤其要先核对是否已经生效，并结合下游幂等能力决定重试。同一动作的状态仍未知时，明确提示待确认，不能直接告诉用户失败后再发一次。\u003c/p>\n\u003cp>如果需要补充身份、选择替代方案或承担业务决策，就让用户介入，同时保留输入和进度。合理兜底是给出有依据的下一步，而不是把所有错误都变成‘请稍后再试’。”\u003c/p>"}], "search": "第三方 API 与账号授权：代表用户办事，需要哪些前提？\nAPI 把业务能力变成可调用接口。接入时不只看请求字段，还要看身份、授权范围、业务前置条件、返回状态、限流和错误语义。智能体可以组织调用，却不能替业务系统决定真实库存、余额或订单结果。\n\n认证确认调用者身份，授权确认允许做什么。OAuth 常用于委托授权：用户在服务方允许的流程中授予应用访问范围，应用获得访问令牌；身份登录通常还需要 OIDC 等相应机制。不能看到 OAuth 就把它简单等同于“知道用户是谁”。\n\n比如用户授权读取日历，不代表也授权删除日程；每项操作都要落到允许的能力范围。\n\n**令牌的范围与生命周期要管理。** Access Token 用于访问资源，Refresh Token 在服务支持时用于换取新的访问令牌，两者的用途和保护要求不同。授权可能到期、被撤销，账号也可能绑定错误。服务端应安全保存凭据，模型只接触完成任务必需的业务数据。\n\n读取、创建、修改和删除往往对应不同权限。用户授权应用读日历，不表示可以删除日程；授权应用具备发布能力，也不等于每次草稿都可以未经任务授权直接发布。账号授权和当前动作授权需要衔接。\n\n异步 API 可能只返回受理状态，实际结果通过查询或回调获取。回调也可能重复、迟到或乱序，需要校验来源、去重并结合状态处理。HTTP 200 不是完整业务成功的同义词。\n从任务所需的最小能力申请权限，说明连接了哪个账号、可做哪些事，以及如何撤销。按认证失败、权限不足、限流、业务拒绝和暂时故障分类处理。接口能力不满足承诺时，应调整产品流程，不能让模型通过反复重试假装集成完整。\n**日程助手。** 读取空闲时间与参与者时区，展示拟创建的日程，按授权写入并返回事件 ID。时间改变后重新检查冲突；用户撤权后停止后续访问。\n\n**售后协同。** 查询订单和退款申请，提交符合规则的动作，通过回调与主动查询确认状态。用户看到的是“申请已受理”或“退款已完成”等真实阶段，不是一律成功。\n- **昨天能用，今天全部失败。** 检查令牌到期、撤销、Scope 与账号关联，避免把授权问题当临时网络异常无限重试。\n- **接口返回 200，业务没变化。** 检查业务码、异步任务 ID 和最终状态；UI 不能只依据传输成功更新为完成。\n- **同一回调更新了两次。** 验证事件标识与状态版本，去重处理；乱序通知不能把完成态退回较早状态，状态变化需遵循业务规则。\nOAuth 授权和用户确认操作是什么关系？ “OAuth 解决应用被授予哪些资源访问能力，当前任务确认解决这次具体要做什么。用户授权日历写权限，只说明应用具备写的能力，不代表可以任意创建或删除所有日程。\n我会在连接账号时展示范围与撤销入口，执行任务时核对当前意图、对象和必要确认。凭据由受控服务管理，不把 Token 放进模型上下文。\n验收既测授权拒绝、过期和撤销，也测有读权限却尝试写操作、账号绑定错误等情况。权限能力与任务意图都满足，才进入实际执行。”\n第三方 API 接入评审，你重点检查什么？ “先看接口是否真正覆盖用户任务，再看权限、状态和失败处理。字段能不能传只是基础，还要知道成功是受理还是完成，是否支持查询、回调、幂等和批量部分失败。\n例如退款接口，除了提交金额，还需要知道可退余额、订单范围、最终到账状态和超时后如何核验。授权方式、限流、服务可用性与版本兼容也会影响产品承诺。\n我会用正常、拒绝、超时、重复和撤权场景做联调，形成可恢复流程。没有最终状态查询能力，就不能在界面上承诺实时确认成功。”\n接口失败时，什么时候重试，什么时候转交用户？ “先按原因区分。授权过期需要刷新或重新授权，权限不足和业务拒绝通常不是重试能解决；临时网络异常或可恢复服务错误可以有限重试，限流要遵守等待提示。\n写操作超时尤其要先核对是否已经生效，并结合下游幂等能力决定重试。同一动作的状态仍未知时，明确提示待确认，不能直接告诉用户失败后再发一次。\n如果需要补充身份、选择替代方案或承担业务决策，就让用户介入，同时保留输入和进度。合理兜底是给出有依据的下一步，而不是把所有错误都变成‘请稍后再试’。”"}, {"id": "k24", "number": "24", "title": "云手机与界面自动化：点击成功，为什么不等于任务成功？", "short": "云手机与界面自动化", "priority": "P2", "group": 3, "intro": "\u003cp>云手机是在远端运行并可操作的移动环境；界面自动化是观察界面、定位元素、执行输入和点击。两者可以结合，也可以分别存在。现在一些 Computer Use 或 GUI Agent 能根据截图选择动作，但其可靠性仍要落在具体应用与任务上验证。\u003c/p>\n\u003cp>定位常见两条路径：使用控件树、可访问性信息或稳定属性；使用截图识别位置与语义。前者通常更容易获取明确控件信息，但不一定覆盖所有页面；后者覆盖面灵活，却受布局、分辨率、遮挡和状态影响。实际可以组合，不能假设一种方式永远最好。\u003c/p>\n\u003cp>\u003cstrong>可靠自动化是观察—行动—再核验。\u003c/strong> 点击前检查当前页面和目标，动作后等待可验证状态变化，例如订单号出现、列表新增记录。等待固定两秒不一定可靠，应该优先等业务或界面条件；没有变化时区分加载慢、点错位置与操作被拒绝。\u003c/p>\n\u003cp>长流程要管理登录会话、设备状态、应用版本和任务检查点。并行操作同一账号或设备可能互相干扰。遇到验证码、额外授权或平台风控，转交用户或服务方允许的正式流程；这类步骤不能靠无条件重放实现稳定自动化。\u003c/p>\n\u003cp>相比正式 API，界面路径往往更依赖可见反馈，幂等和真实状态查询也可能较弱。因此适合先从任务边界小、可核验、出错可恢复的场景验证，按页面版本持续回归。\u003c/p>", "decision": "\u003cp>先评估正式接口、允许的接入方式和维护成本，再选择界面自动化。统计完整任务成功率、人工接管率和每次应用更新后的修复量，不能只看单次点击准确率。操作记录应支持定位失败，但账号与屏幕中的敏感信息需要受控保留。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>既有后台录入。\u003c/strong> 对缺少合适接口的内部系统，把已校验字段填入表单，提交前预览，提交后核验记录 ID。先支持少量固定表单和明确版本，避免第一版承诺处理所有页面。\u003c/p>\n\u003cp>\u003cstrong>移动端回归辅助。\u003c/strong> 在受控测试账号与设备上执行登录后浏览、搜索与表单流程，记录失败页面。GUI Agent 可以辅助探索，但最终断言要与预期功能对应，不能只凭模型说“看起来正常”。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>昨天成功，今天点错按钮。\u003c/strong> 检查应用版本、弹窗、键盘遮挡和定位依据；重新观察当前页面，不直接复用旧坐标。\u003c/li>\n\u003cli>\u003cstrong>弱网下重复提交。\u003c/strong> 点击后状态未确认，不应再次点击；先查询或查看提交记录，不能把没跳页当成未执行。\u003c/li>\n\u003cli>\u003cstrong>流程恢复后账号或页面不对。\u003c/strong> 重新校验账号、页面与任务对象，不能仅依保存的步骤序号继续。\u003c/li>\n\u003c/ul>", "questions": [{"id": "24.1", "title": "API 和 GUI 自动化应该如何选择？", "answer": "\u003cp>“先看正式接口是否覆盖任务、授权是否合法完整、能否返回明确业务状态。如果条件满足，API 通常更便于参数校验、幂等和监控。缺接口或覆盖不足时，再评估允许的界面自动化。\u003c/p>\n\u003cp>GUI 路线可以接近人工操作，但页面版本、弹窗和网络都可能影响稳定性，因此要缩小支持范围、逐步核验并提供接管。选型不能只比较开发第一版的速度，还要算持续维护和失败恢复成本。\u003c/p>\n\u003cp>我会用同一类任务比较端到端成功率和人工量。能点屏幕不等于更适合所有任务，接口存在也不代表它满足所需权限和状态能力。”\u003c/p>"}, {"id": "24.2", "title": "如何把演示型 GUI Agent 做成可用功能？", "answer": "\u003cp>“我会先固定支持的应用、账号类型和任务范围，定义每一步前置页面与完成条件。定位优先使用可靠结构信息，必要时结合视觉；每次动作后重新观察结果，而不是一串坐标连续点击。\u003c/p>\n\u003cp>加入超时、异常弹窗、弱网、登录失效和人工接管，保存可核验的进度。写操作还要区分未执行与结果未知，避免重复提交。应用版本变化后跑相关回归。\u003c/p>\n\u003cp>验收看完整任务成功率和接管成本，而不是一段顺利录屏。只在失败模式和恢复路径可接受时扩大范围，才能把探索能力变成稳定交付。”\u003c/p>"}, {"id": "24.3", "title": "发布按钮点完卡住了，应该怎么处理？", "answer": "\u003cp>“先把状态标为结果待确认，不立即重复点击。检查发布列表、回执或可查询的业务记录，用目标账号、内容标识和时间核对是否已成功。确认成功就补状态，确认未发生且允许重试才继续。\u003c/p>\n\u003cp>如果无法可靠核验，就暂停并交给用户，保留当前页面和必要记录。界面自动化常缺少正式幂等接口，重复点击可能造成真实重复发布。\u003c/p>\n\u003cp>后续改进要补提交后的状态判定和恢复入口，而不是只把等待时间调长。用户需要知道是否发生了外部动作，不是一句模糊的‘操作失败’。”\u003c/p>"}], "search": "云手机与界面自动化：点击成功，为什么不等于任务成功？\n云手机是在远端运行并可操作的移动环境；界面自动化是观察界面、定位元素、执行输入和点击。两者可以结合，也可以分别存在。现在一些 Computer Use 或 GUI Agent 能根据截图选择动作，但其可靠性仍要落在具体应用与任务上验证。\n\n定位常见两条路径：使用控件树、可访问性信息或稳定属性；使用截图识别位置与语义。前者通常更容易获取明确控件信息，但不一定覆盖所有页面；后者覆盖面灵活，却受布局、分辨率、遮挡和状态影响。实际可以组合，不能假设一种方式永远最好。\n\n**可靠自动化是观察—行动—再核验。** 点击前检查当前页面和目标，动作后等待可验证状态变化，例如订单号出现、列表新增记录。等待固定两秒不一定可靠，应该优先等业务或界面条件；没有变化时区分加载慢、点错位置与操作被拒绝。\n\n长流程要管理登录会话、设备状态、应用版本和任务检查点。并行操作同一账号或设备可能互相干扰。遇到验证码、额外授权或平台风控，转交用户或服务方允许的正式流程；这类步骤不能靠无条件重放实现稳定自动化。\n\n相比正式 API，界面路径往往更依赖可见反馈，幂等和真实状态查询也可能较弱。因此适合先从任务边界小、可核验、出错可恢复的场景验证，按页面版本持续回归。\n先评估正式接口、允许的接入方式和维护成本，再选择界面自动化。统计完整任务成功率、人工接管率和每次应用更新后的修复量，不能只看单次点击准确率。操作记录应支持定位失败，但账号与屏幕中的敏感信息需要受控保留。\n**既有后台录入。** 对缺少合适接口的内部系统，把已校验字段填入表单，提交前预览，提交后核验记录 ID。先支持少量固定表单和明确版本，避免第一版承诺处理所有页面。\n\n**移动端回归辅助。** 在受控测试账号与设备上执行登录后浏览、搜索与表单流程，记录失败页面。GUI Agent 可以辅助探索，但最终断言要与预期功能对应，不能只凭模型说“看起来正常”。\n- **昨天成功，今天点错按钮。** 检查应用版本、弹窗、键盘遮挡和定位依据；重新观察当前页面，不直接复用旧坐标。\n- **弱网下重复提交。** 点击后状态未确认，不应再次点击；先查询或查看提交记录，不能把没跳页当成未执行。\n- **流程恢复后账号或页面不对。** 重新校验账号、页面与任务对象，不能仅依保存的步骤序号继续。\nAPI 和 GUI 自动化应该如何选择？ “先看正式接口是否覆盖任务、授权是否合法完整、能否返回明确业务状态。如果条件满足，API 通常更便于参数校验、幂等和监控。缺接口或覆盖不足时，再评估允许的界面自动化。\nGUI 路线可以接近人工操作，但页面版本、弹窗和网络都可能影响稳定性，因此要缩小支持范围、逐步核验并提供接管。选型不能只比较开发第一版的速度，还要算持续维护和失败恢复成本。\n我会用同一类任务比较端到端成功率和人工量。能点屏幕不等于更适合所有任务，接口存在也不代表它满足所需权限和状态能力。”\n如何把演示型 GUI Agent 做成可用功能？ “我会先固定支持的应用、账号类型和任务范围，定义每一步前置页面与完成条件。定位优先使用可靠结构信息，必要时结合视觉；每次动作后重新观察结果，而不是一串坐标连续点击。\n加入超时、异常弹窗、弱网、登录失效和人工接管，保存可核验的进度。写操作还要区分未执行与结果未知，避免重复提交。应用版本变化后跑相关回归。\n验收看完整任务成功率和接管成本，而不是一段顺利录屏。只在失败模式和恢复路径可接受时扩大范围，才能把探索能力变成稳定交付。”\n发布按钮点完卡住了，应该怎么处理？ “先把状态标为结果待确认，不立即重复点击。检查发布列表、回执或可查询的业务记录，用目标账号、内容标识和时间核对是否已成功。确认成功就补状态，确认未发生且允许重试才继续。\n如果无法可靠核验，就暂停并交给用户，保留当前页面和必要记录。界面自动化常缺少正式幂等接口，重复点击可能造成真实重复发布。\n后续改进要补提交后的状态判定和恢复入口，而不是只把等待时间调长。用户需要知道是否发生了外部动作，不是一句模糊的‘操作失败’。”"}, {"id": "k25", "number": "25", "title": "多模型路由：怎样选模型，才能同时满足质量与成本？", "short": "多模型路由", "priority": "P1", "group": 4, "intro": "\u003cp>接入多个模型只是有多个可选服务，路由才是决定这次请求用哪一个。选择可以依据任务类型、输入模态、上下文长度、结构化输出与工具能力、数据边界、时延和成本。先满足硬约束，再比较质量与费用；不能为了便宜把不允许外发的资料发给另一家服务。\u003c/p>\n\u003cp>常见路线有三种。静态规则按任务直接分配，简单可解释；分类路由先判断任务复杂度或所需能力，再选模型，但分类本身也会出错；级联路线先尝试较低成本方案，依据可验证结果决定是否升级。不是只有动态模型分类器才算路由。\u003c/p>\n\u003cp>\u003cstrong>级联是否便宜，要算完整路径。\u003c/strong> 教学例子：第一层每次成本 0.1 元，三成任务需要再花 1 元升级，则平均调用成本为 0.1＋0.3×1＝0.4 元，尚未包括检索、重试和人工。升级率很高、失败损失很大时，直接用强模型可能更合适。\u003c/p>\n\u003cp>升级条件要可靠。格式校验失败、工具参数无效、证据不足是可以观察的信号；模型自报“没把握”需要验证，不能直接当校准概率。强模型也不一定能解决缺资料和接口权限问题，路由不能代替问题诊断。\u003c/p>\n\u003cp>故障切换与质量升级也不同。主服务不可用时的备用模型，需要在目标任务上验证能力兼容；API 字段相似，不代表工具调用、拒答和输出结构一致。进行中的多步任务切换模型，还要保持状态和工具契约。\u003c/p>", "decision": "\u003cp>按任务分组建立质量门槛，再在合格方案中比较成本和时延，形成可解释的选择边界。记录每个请求为何路由、是否升级和最终结果；评测路由整体表现，不能只看单个模型能力。路由失败导致的返工也应计入成本。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>客服平台。\u003c/strong> 稳定分类用经过验证的低成本模型，复杂政策比较或多轮工具决策用更强方案；实时订单状态依然查询系统。高风险处理不是仅靠选择更贵模型放行。\u003c/p>\n\u003cp>\u003cstrong>文档处理。\u003c/strong> 文本提取、复杂图文分析和长材料综合使用各自合适能力；普通文本不必走视觉路径，复杂页面也不能强行塞给只支持文本的模型。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>单价降低，总账上涨。\u003c/strong> 统计升级、重复检索、长输出与人工校对，按成功任务看总成本，而不是只比较单次 Token 报价。\u003c/li>\n\u003cli>\u003cstrong>备用模型能聊天，却不能完成流程。\u003c/strong> 检查 Schema、工具、模态和上下文兼容，回归真实工作流而非只测一问一答。\u003c/li>\n\u003cli>\u003cstrong>路由无法解释，问题难复现。\u003c/strong> 记录路由策略、模型配置、版本和触发信号；动态规则也要可追踪与回退。\u003c/li>\n\u003c/ul>", "questions": [{"id": "25.1", "title": "怎样设计一个实际可用的多模型路由？", "answer": "\u003cp>“我会先按任务定义硬条件和质量底线，再选满足要求的模型。数据区域、模态、上下文和工具能力先过滤，之后比较真实任务表现、时延与成本。\u003c/p>\n\u003cp>第一版优先使用可解释规则，比如分类任务走模型 A，复杂分析走模型 B。只有任务分布足够复杂、静态规则明显有损失时，才评估动态分类或级联。每次路由记录原因和最终结果。\u003c/p>\n\u003cp>评测不仅测模型，还测路由选错会带来什么损失。路由的价值是用合适资源完成任务，不是把所有请求都交给另一个模型判断该用谁。”\u003c/p>"}, {"id": "25.2", "title": "先用小模型，不行再升级，一定更省吗？", "answer": "\u003cp>“不一定，要看升级比例、第一轮消耗和漏升级损失。小模型每次都先花钱，升级后可能还要重新提供上下文和重做部分工具调用；若大多数任务最终都升级，成本和时延可能更高。\u003c/p>\n\u003cp>我会先定义可验证的升级信号，避免模型答错却自信地通过。用同一批任务比较直接强模型与级联，统计总调用、最终正确率、人工量和时延分布。\u003c/p>\n\u003cp>简单稳定任务适合较轻方案，复杂任务如果一开始就能识别，直接路由可能更好。关键是单位成功任务成本，不是第一跳模型有多便宜。”\u003c/p>"}, {"id": "25.3", "title": "主模型故障时，怎样降级才可控？", "answer": "\u003cp>“提前验证备用模型能承担哪些任务，并检查工具、结构化输出、模态和数据边界兼容。故障发生时只对满足条件的任务切换，其他任务保留状态、排队或提示能力暂不可用。\u003c/p>\n\u003cp>进行中的任务要带上可信状态，不能把原模型的半成品盲目当作新模型的正确依据。已有副作用不重复执行，关键结果重新核验。可能影响交付质量或范围时让用户知道变化。\u003c/p>\n\u003cp>我会做故障演练，观察切换后的完整任务成功率与恢复时间。降级是有边界地维持服务，不是只要另一个接口能返回文字就算成功。”\u003c/p>"}], "search": "多模型路由：怎样选模型，才能同时满足质量与成本？\n接入多个模型只是有多个可选服务，路由才是决定这次请求用哪一个。选择可以依据任务类型、输入模态、上下文长度、结构化输出与工具能力、数据边界、时延和成本。先满足硬约束，再比较质量与费用；不能为了便宜把不允许外发的资料发给另一家服务。\n\n常见路线有三种。静态规则按任务直接分配，简单可解释；分类路由先判断任务复杂度或所需能力，再选模型，但分类本身也会出错；级联路线先尝试较低成本方案，依据可验证结果决定是否升级。不是只有动态模型分类器才算路由。\n\n**级联是否便宜，要算完整路径。** 教学例子：第一层每次成本 0.1 元，三成任务需要再花 1 元升级，则平均调用成本为 0.1＋0.3×1＝0.4 元，尚未包括检索、重试和人工。升级率很高、失败损失很大时，直接用强模型可能更合适。\n\n升级条件要可靠。格式校验失败、工具参数无效、证据不足是可以观察的信号；模型自报“没把握”需要验证，不能直接当校准概率。强模型也不一定能解决缺资料和接口权限问题，路由不能代替问题诊断。\n\n故障切换与质量升级也不同。主服务不可用时的备用模型，需要在目标任务上验证能力兼容；API 字段相似，不代表工具调用、拒答和输出结构一致。进行中的多步任务切换模型，还要保持状态和工具契约。\n按任务分组建立质量门槛，再在合格方案中比较成本和时延，形成可解释的选择边界。记录每个请求为何路由、是否升级和最终结果；评测路由整体表现，不能只看单个模型能力。路由失败导致的返工也应计入成本。\n**客服平台。** 稳定分类用经过验证的低成本模型，复杂政策比较或多轮工具决策用更强方案；实时订单状态依然查询系统。高风险处理不是仅靠选择更贵模型放行。\n\n**文档处理。** 文本提取、复杂图文分析和长材料综合使用各自合适能力；普通文本不必走视觉路径，复杂页面也不能强行塞给只支持文本的模型。\n- **单价降低，总账上涨。** 统计升级、重复检索、长输出与人工校对，按成功任务看总成本，而不是只比较单次 Token 报价。\n- **备用模型能聊天，却不能完成流程。** 检查 Schema、工具、模态和上下文兼容，回归真实工作流而非只测一问一答。\n- **路由无法解释，问题难复现。** 记录路由策略、模型配置、版本和触发信号；动态规则也要可追踪与回退。\n怎样设计一个实际可用的多模型路由？ “我会先按任务定义硬条件和质量底线，再选满足要求的模型。数据区域、模态、上下文和工具能力先过滤，之后比较真实任务表现、时延与成本。\n第一版优先使用可解释规则，比如分类任务走模型 A，复杂分析走模型 B。只有任务分布足够复杂、静态规则明显有损失时，才评估动态分类或级联。每次路由记录原因和最终结果。\n评测不仅测模型，还测路由选错会带来什么损失。路由的价值是用合适资源完成任务，不是把所有请求都交给另一个模型判断该用谁。”\n先用小模型，不行再升级，一定更省吗？ “不一定，要看升级比例、第一轮消耗和漏升级损失。小模型每次都先花钱，升级后可能还要重新提供上下文和重做部分工具调用；若大多数任务最终都升级，成本和时延可能更高。\n我会先定义可验证的升级信号，避免模型答错却自信地通过。用同一批任务比较直接强模型与级联，统计总调用、最终正确率、人工量和时延分布。\n简单稳定任务适合较轻方案，复杂任务如果一开始就能识别，直接路由可能更好。关键是单位成功任务成本，不是第一跳模型有多便宜。”\n主模型故障时，怎样降级才可控？ “提前验证备用模型能承担哪些任务，并检查工具、结构化输出、模态和数据边界兼容。故障发生时只对满足条件的任务切换，其他任务保留状态、排队或提示能力暂不可用。\n进行中的任务要带上可信状态，不能把原模型的半成品盲目当作新模型的正确依据。已有副作用不重复执行，关键结果重新核验。可能影响交付质量或范围时让用户知道变化。\n我会做故障演练，观察切换后的完整任务成功率与恢复时间。降级是有边界地维持服务，不是只要另一个接口能返回文字就算成功。”"}, {"id": "k26", "number": "26", "title": "统一网关与限流：并发、RPM、TPM 与配额各管什么？", "short": "统一网关与限流", "priority": "P1", "group": 4, "intro": "\u003cp>网关是统一接入与治理的入口，可以承担凭据管理、模型路由、用量统计、限流和部分通用策略。模型网关、工具网关、业务 API 网关的职责可能不同；它们不必合成一个组件，也不能替代每个业务服务的对象权限检查。\u003c/p>\n\u003cp>\u003cstrong>先把四种限制分清。\u003c/strong> RPM 是每分钟请求数，TPM 是每分钟 Token 用量，具体输入输出计量按服务规则；并发限制同时有多少请求或任务在处理；配额通常限制更长周期的总预算或资源量。一个请求很长，可能 RPM 不高却触及 TPM；一批慢请求也可能很快占满并发。\u003c/p>\n\u003cp>一个用户任务又可能触发多轮模型与工具调用。教学例子：一分钟进入 100 个任务，每个平均调用模型 6 次，模型侧就可能需要处理约 600 次请求，还没算重试。容量规划不能把“用户提交数”直接当下游调用数。\u003c/p>\n\u003cp>令牌桶是常见限流机制：以一定速率补充可用额度，桶有上限，因此允许有限突发；这里的令牌是算法额度，不一定等于大模型 Token。队列可以吸收短暂峰值，但长期到达量超过处理量，排队会一直增长，必须限制队列长度、等待期限或做准入控制。\u003c/p>\n\u003cp>重试要区分错误，遵守 Retry-After 等提示，在有上限的退避中加入抖动，把集中重试分散开。熔断是在依赖持续失败时暂时停止或减少调用，再试探恢复；隔离不同租户或任务资源则减少某一类故障拖垮其他任务。\u003c/p>", "decision": "\u003cp>区分短交互与长批处理，为任务预估资源，设置可解释的队列与取消机制。用量预估可先占预算、完成后按实际结算，具体策略要符合服务计量规则。监控等待时间、拒绝率、队列积压和成功率，并检查大租户是否挤占小租户，而不是只看平均接口响应。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>多租户智能体平台。\u003c/strong> 每个组织有预算与速率边界，模型服务还有全局限制。对话请求与批量文档任务分开控制；额度没用完但并发已满时，UI 明确显示排队原因。\u003c/p>\n\u003cp>\u003cstrong>批量知识入库。\u003c/strong> OCR、Embedding 和索引各有处理能力，逐层控制吞吐；某个环节慢时暂停或缓冲上游，不能让无限任务堆进内存。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>请求数不多，却频繁 429。\u003c/strong> 检查 TPM、并发、共享组织额度和短窗口突发，而不只看 RPM；按服务错误详情确认原因。\u003c/li>\n\u003cli>\u003cstrong>重试后故障更严重。\u003c/strong> 查多个层级是否都在重试，导致乘法放大；统一预算并分散重试，持续失败时熔断。\u003c/li>\n\u003cli>\u003cstrong>排队看似保护系统，用户一直等。\u003c/strong> 检查长期供需、队列上限和超时，必要时拒绝新任务或调整容量，不能用无期限等待掩盖过载。\u003c/li>\n\u003c/ul>", "questions": [{"id": "26.1", "title": "RPM、TPM、并发和配额怎么影响产品设计？", "answer": "\u003cp>“RPM 控制请求频度，TPM 控制模型用量速率，并发控制同时处理数，配额控制周期总量。它们可能同时存在，不能只用用户提交次数判断是否超限。\u003c/p>\n\u003cp>比如一个长报告请求 Token 很多，即使一分钟只发几次，也可能触及 TPM；多个慢任务则占满并发。Agent 一次任务还有多轮调用，会放大下游负载。\u003c/p>\n\u003cp>产品要区分排队、瞬时限流和预算耗尽，提供对应等待或调整方式。容量评估按任务类别计算调用量、输入输出和耗时，再做压力测试，而不是给所有用户统一一个请求数就结束。”\u003c/p>"}, {"id": "26.2", "title": "流量突然翻倍，如何保护核心体验？", "answer": "\u003cp>“先保护下游和正在执行的任务，对新任务做准入与并发控制，把短交互和长批处理隔离，按租户公平分配。可以用有界队列吸收短峰值，但必须有等待期限和取消机制。\u003c/p>\n\u003cp>同时看瓶颈是模型 TPM、解析算力还是工具服务，针对性扩容、降级或延后低优先级批任务。不能只提高入口并发把下游进一步压垮。\u003c/p>\n\u003cp>我会观察队列等待、拒绝率、成功率与恢复耗时，检查流量恢复后积压能否清空。对用户明确任务已受理还是尚未接收，减少重复提交造成二次放大。”\u003c/p>"}, {"id": "26.3", "title": "指数退避为什么还需要抖动和重试上限？", "answer": "\u003cp>“如果所有客户端同一时间失败，再按相同间隔重试，它们仍会同时冲向服务。抖动把重试时间分散，退避给服务恢复空间；上限则防止一个任务无限占资源。\u003c/p>\n\u003cp>还要区分可重试错误，权限不足或明确业务拒绝通常不应重试。多个调用层都重试，会把一次失败放大成大量请求，所以要统一总次数与总时间预算。写操作先核验幂等和真实状态。\u003c/p>\n\u003cp>我会用过载和依赖故障测试检查恢复曲线，而不是只验证单次请求最终成功。重试的目标是提高可靠性，不能反过来成为故障放大器。”\u003c/p>"}], "search": "统一网关与限流：并发、RPM、TPM 与配额各管什么？\n网关是统一接入与治理的入口，可以承担凭据管理、模型路由、用量统计、限流和部分通用策略。模型网关、工具网关、业务 API 网关的职责可能不同；它们不必合成一个组件，也不能替代每个业务服务的对象权限检查。\n\n**先把四种限制分清。** RPM 是每分钟请求数，TPM 是每分钟 Token 用量，具体输入输出计量按服务规则；并发限制同时有多少请求或任务在处理；配额通常限制更长周期的总预算或资源量。一个请求很长，可能 RPM 不高却触及 TPM；一批慢请求也可能很快占满并发。\n\n一个用户任务又可能触发多轮模型与工具调用。教学例子：一分钟进入 100 个任务，每个平均调用模型 6 次，模型侧就可能需要处理约 600 次请求，还没算重试。容量规划不能把“用户提交数”直接当下游调用数。\n\n令牌桶是常见限流机制：以一定速率补充可用额度，桶有上限，因此允许有限突发；这里的令牌是算法额度，不一定等于大模型 Token。队列可以吸收短暂峰值，但长期到达量超过处理量，排队会一直增长，必须限制队列长度、等待期限或做准入控制。\n\n重试要区分错误，遵守 Retry-After 等提示，在有上限的退避中加入抖动，把集中重试分散开。熔断是在依赖持续失败时暂时停止或减少调用，再试探恢复；隔离不同租户或任务资源则减少某一类故障拖垮其他任务。\n区分短交互与长批处理，为任务预估资源，设置可解释的队列与取消机制。用量预估可先占预算、完成后按实际结算，具体策略要符合服务计量规则。监控等待时间、拒绝率、队列积压和成功率，并检查大租户是否挤占小租户，而不是只看平均接口响应。\n**多租户智能体平台。** 每个组织有预算与速率边界，模型服务还有全局限制。对话请求与批量文档任务分开控制；额度没用完但并发已满时，UI 明确显示排队原因。\n\n**批量知识入库。** OCR、Embedding 和索引各有处理能力，逐层控制吞吐；某个环节慢时暂停或缓冲上游，不能让无限任务堆进内存。\n- **请求数不多，却频繁 429。** 检查 TPM、并发、共享组织额度和短窗口突发，而不只看 RPM；按服务错误详情确认原因。\n- **重试后故障更严重。** 查多个层级是否都在重试，导致乘法放大；统一预算并分散重试，持续失败时熔断。\n- **排队看似保护系统，用户一直等。** 检查长期供需、队列上限和超时，必要时拒绝新任务或调整容量，不能用无期限等待掩盖过载。\nRPM、TPM、并发和配额怎么影响产品设计？ “RPM 控制请求频度，TPM 控制模型用量速率，并发控制同时处理数，配额控制周期总量。它们可能同时存在，不能只用用户提交次数判断是否超限。\n比如一个长报告请求 Token 很多，即使一分钟只发几次，也可能触及 TPM；多个慢任务则占满并发。Agent 一次任务还有多轮调用，会放大下游负载。\n产品要区分排队、瞬时限流和预算耗尽，提供对应等待或调整方式。容量评估按任务类别计算调用量、输入输出和耗时，再做压力测试，而不是给所有用户统一一个请求数就结束。”\n流量突然翻倍，如何保护核心体验？ “先保护下游和正在执行的任务，对新任务做准入与并发控制，把短交互和长批处理隔离，按租户公平分配。可以用有界队列吸收短峰值，但必须有等待期限和取消机制。\n同时看瓶颈是模型 TPM、解析算力还是工具服务，针对性扩容、降级或延后低优先级批任务。不能只提高入口并发把下游进一步压垮。\n我会观察队列等待、拒绝率、成功率与恢复耗时，检查流量恢复后积压能否清空。对用户明确任务已受理还是尚未接收，减少重复提交造成二次放大。”\n指数退避为什么还需要抖动和重试上限？ “如果所有客户端同一时间失败，再按相同间隔重试，它们仍会同时冲向服务。抖动把重试时间分散，退避给服务恢复空间；上限则防止一个任务无限占资源。\n还要区分可重试错误，权限不足或明确业务拒绝通常不应重试。多个调用层都重试，会把一次失败放大成大量请求，所以要统一总次数与总时间预算。写操作先核验幂等和真实状态。\n我会用过载和依赖故障测试检查恢复曲线，而不是只验证单次请求最终成功。重试的目标是提高可靠性，不能反过来成为故障放大器。”"}, {"id": "k27", "number": "27", "title": "租户与权限隔离：谁能看什么，必须在哪些位置生效？", "short": "租户与权限隔离", "priority": "P0", "group": 4, "intro": "\u003cp>租户通常对应一个客户组织，多租户系统要隔离数据、配置、凭据与资源。一个组织内部还可能按部门、项目和文件共享关系控制访问。租户隔离与对象权限是两层问题，不能只有 tenant_id 就认为全部完成。\u003c/p>\n\u003cp>RBAC 按角色授予能力，例如管理员、编辑者、只读成员；ABAC 根据用户、对象与环境属性判断，例如部门和数据等级；ReBAC 根据关系判断，例如项目成员、文档共享对象。实际系统可以组合，产品需要把“谁、对哪个对象、能做什么、在什么条件下”说清楚。\u003c/p>\n\u003cp>\u003cstrong>身份必须来自可信认证链路。\u003c/strong> 客户端参数或模型生成的用户 ID 不能直接成为执行身份。服务端将当前身份与租户绑定，再做对象级授权。拥有平台登录权限，不代表能读取任意文件；能读文件也不等于能修改或分享。\u003c/p>\n\u003cp>RAG 的权限边界应覆盖候选范围、正文取回、模型上下文和引用预览。无权正文不能先交给模型再要求它保密。若底层检索不能直接精确过滤，就要在可信层过滤候选并校验后再取回；注意过滤后候选不足可能降低可回答率，需要另外优化召回。\u003c/p>\n\u003cp>缓存、记忆、日志和第三方连接器同样可能形成旁路。缓存键只按问题文本，会让相同问题复用别人的答案；需要纳入有效数据范围或权限版本等设计。物理分库能加强某些隔离，但不自动修复应用层错误，逻辑隔离也必须有系统性验证。\u003c/p>", "decision": "\u003cp>使用权限矩阵表达角色、对象和动作，覆盖继承、共享、撤销、成员离职及任务中途变化。测试既有跨租户，也有同租户跨部门，重点观察内容是否进入上下文与工具，不只检查 UI 是否隐藏入口。高影响动作执行前核验当前权限与对象版本。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>企业知识助手。\u003c/strong> 人事和研发提同样的问题，只能使用各自允许的资料；分享链接预览仍校验访问，不能因为引用来自 AI 就放开。\u003c/p>\n\u003cp>\u003cstrong>客户组织工作台。\u003c/strong> 不同企业连接各自 CRM 与文档系统，凭据按组织和授权主体隔离，任务日志与用量也归属对应组织。切换组织后旧上下文不继续混用。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>数据库隔离了，答案却串租户。\u003c/strong> 检查答案缓存、向量命名空间、日志回放、会话与连接器凭据等旁路。\u003c/li>\n\u003cli>\u003cstrong>撤权后旧对话仍能继续使用文件。\u003c/strong> 检查历史片段重新组装与引用预览，处理权限变化后的状态和衍生内容，而不只删除搜索结果。\u003c/li>\n\u003cli>\u003cstrong>权限过滤后回答变差。\u003c/strong> 测试授权范围内必要证据是否仍能召回，调整合法候选获取方式，不能通过放宽权限换质量。\u003c/li>\n\u003c/ul>", "questions": [{"id": "27.1", "title": "如何设计企业 RAG 的权限控制？", "answer": "\u003cp>“我会把可信用户身份和租户范围贯穿到检索、原文读取和引用访问。无权内容在进入模型之前就要被排除，不能依靠提示词让模型不说出来。\u003c/p>\n\u003cp>索引需要携带足够授权信息或关联可信权限服务，读取时处理动态撤权。缓存和历史追问也要纳入，避免同一句问题命中其他用户的答案。引用链接再次打开仍做校验。\u003c/p>\n\u003cp>验证用多账号、跨部门、跨租户与撤权场景，看实际上下文和输出，而不只看前端列表。权限过滤后还要单独评估召回质量，但优化不能突破访问范围。”\u003c/p>"}, {"id": "27.2", "title": "逻辑隔离与物理隔离如何选择？", "answer": "\u003cp>“我会看客户的数据边界、运维要求、规模和成本。逻辑隔离通过租户范围与授权规则共享基础设施，资源利用更灵活，但要求所有访问路径正确执行；物理隔离使用独立库或环境，边界更明确，却增加部署与维护成本。\u003c/p>\n\u003cp>两者都不能免除应用层权限和凭据管理。独立数据库也可能因缓存串用或连接器选错而泄露，同租户内部还有对象权限。\u003c/p>\n\u003cp>因此我会按实际隔离要求选方案，并对存储、缓存、日志、模型请求和外部连接做完整验证。不是简单用‘独立部署更安全’代替具体设计，也不只靠一个 tenant_id 字段证明隔离。”\u003c/p>"}, {"id": "27.3", "title": "AI 工具的执行身份应该怎样确定？", "answer": "\u003cp>“执行身份应由认证后的应用上下文和授权关系决定，不能让模型填一个用户 ID 就切换身份。模型提供业务参数，服务端绑定调用主体，再检查这个主体对具体对象能做什么。\u003c/p>\n\u003cp>如果使用服务账号，还要明确它代表谁、能访问哪些范围，防止拥有更大权限的服务账号替普通用户越权。当前用户有读权限，也不自动拥有修改或分享权限。\u003c/p>\n\u003cp>我会测试伪造租户参数、跨对象调用、撤权和账号切换，核对审计记录里的实际主体。模型建议是否合理与系统是否有权执行，是必须分别成立的条件。”\u003c/p>"}], "search": "租户与权限隔离：谁能看什么，必须在哪些位置生效？\n租户通常对应一个客户组织，多租户系统要隔离数据、配置、凭据与资源。一个组织内部还可能按部门、项目和文件共享关系控制访问。租户隔离与对象权限是两层问题，不能只有 tenant_id 就认为全部完成。\n\nRBAC 按角色授予能力，例如管理员、编辑者、只读成员；ABAC 根据用户、对象与环境属性判断，例如部门和数据等级；ReBAC 根据关系判断，例如项目成员、文档共享对象。实际系统可以组合，产品需要把“谁、对哪个对象、能做什么、在什么条件下”说清楚。\n\n**身份必须来自可信认证链路。** 客户端参数或模型生成的用户 ID 不能直接成为执行身份。服务端将当前身份与租户绑定，再做对象级授权。拥有平台登录权限，不代表能读取任意文件；能读文件也不等于能修改或分享。\n\nRAG 的权限边界应覆盖候选范围、正文取回、模型上下文和引用预览。无权正文不能先交给模型再要求它保密。若底层检索不能直接精确过滤，就要在可信层过滤候选并校验后再取回；注意过滤后候选不足可能降低可回答率，需要另外优化召回。\n\n缓存、记忆、日志和第三方连接器同样可能形成旁路。缓存键只按问题文本，会让相同问题复用别人的答案；需要纳入有效数据范围或权限版本等设计。物理分库能加强某些隔离，但不自动修复应用层错误，逻辑隔离也必须有系统性验证。\n使用权限矩阵表达角色、对象和动作，覆盖继承、共享、撤销、成员离职及任务中途变化。测试既有跨租户，也有同租户跨部门，重点观察内容是否进入上下文与工具，不只检查 UI 是否隐藏入口。高影响动作执行前核验当前权限与对象版本。\n**企业知识助手。** 人事和研发提同样的问题，只能使用各自允许的资料；分享链接预览仍校验访问，不能因为引用来自 AI 就放开。\n\n**客户组织工作台。** 不同企业连接各自 CRM 与文档系统，凭据按组织和授权主体隔离，任务日志与用量也归属对应组织。切换组织后旧上下文不继续混用。\n- **数据库隔离了，答案却串租户。** 检查答案缓存、向量命名空间、日志回放、会话与连接器凭据等旁路。\n- **撤权后旧对话仍能继续使用文件。** 检查历史片段重新组装与引用预览，处理权限变化后的状态和衍生内容，而不只删除搜索结果。\n- **权限过滤后回答变差。** 测试授权范围内必要证据是否仍能召回，调整合法候选获取方式，不能通过放宽权限换质量。\n如何设计企业 RAG 的权限控制？ “我会把可信用户身份和租户范围贯穿到检索、原文读取和引用访问。无权内容在进入模型之前就要被排除，不能依靠提示词让模型不说出来。\n索引需要携带足够授权信息或关联可信权限服务，读取时处理动态撤权。缓存和历史追问也要纳入，避免同一句问题命中其他用户的答案。引用链接再次打开仍做校验。\n验证用多账号、跨部门、跨租户与撤权场景，看实际上下文和输出，而不只看前端列表。权限过滤后还要单独评估召回质量，但优化不能突破访问范围。”\n逻辑隔离与物理隔离如何选择？ “我会看客户的数据边界、运维要求、规模和成本。逻辑隔离通过租户范围与授权规则共享基础设施，资源利用更灵活，但要求所有访问路径正确执行；物理隔离使用独立库或环境，边界更明确，却增加部署与维护成本。\n两者都不能免除应用层权限和凭据管理。独立数据库也可能因缓存串用或连接器选错而泄露，同租户内部还有对象权限。\n因此我会按实际隔离要求选方案，并对存储、缓存、日志、模型请求和外部连接做完整验证。不是简单用‘独立部署更安全’代替具体设计，也不只靠一个 tenant_id 字段证明隔离。”\nAI 工具的执行身份应该怎样确定？ “执行身份应由认证后的应用上下文和授权关系决定，不能让模型填一个用户 ID 就切换身份。模型提供业务参数，服务端绑定调用主体，再检查这个主体对具体对象能做什么。\n如果使用服务账号，还要明确它代表谁、能访问哪些范围，防止拥有更大权限的服务账号替普通用户越权。当前用户有读权限，也不自动拥有修改或分享权限。\n我会测试伪造租户参数、跨对象调用、撤权和账号切换，核对审计记录里的实际主体。模型建议是否合理与系统是否有权执行，是必须分别成立的条件。”"}, {"id": "k28", "number": "28", "title": "提示词注入防护：为什么资料里的话不能变成系统命令？", "short": "提示词注入防护", "priority": "P1", "group": 4, "intro": "\u003cp>提示词注入是输入内容试图改变模型原本应该遵守的任务或规则。直接注入来自用户输入，间接注入可能藏在网页、文档、邮件、图片文字或工具返回中。外部内容本应是任务材料，却试图把自己变成更高优先级的指令。\u003c/p>\n\u003cp>这种问题难在模型用自然语言同时处理规则与资料，边界不像传统程序变量那样天然隔开。标签、分隔符和明确指令有帮助，但不能保证模型永远不混淆。工具描述与检索资料也不能因为来自已连接服务，就自动获得系统级信任。\u003c/p>\n\u003cp>\u003cstrong>防护重点是限制错误产生真实影响的路径。\u003c/strong> 让当前任务只获得必要工具和数据，由服务端控制权限与参数，限制外发目的地和写入范围，对重要动作执行独立策略。只读摘要任务不应顺带拥有删除、转账或任意外发能力。\u003c/p>\n\u003cp>模型判断、内容过滤与外部约束可以多层配合，但过滤可疑词不够。正常安全文档也会讨论“忽略指令”等文字，简单关键词拦截会误伤；攻击也可能绕开这些词。验证要观察最终工具行为和数据流，不只看模型是否口头拒绝。\u003c/p>\n\u003cp>模型输出进入网页或数据库时还需要常规安全处理，例如 HTML 清理、参数化查询和权限校验。提示词注入与传统注入不是同一个问题，但可能通过系统集成扩大影响，不能因为内容由 AI 生成就跳过已有工程保护。\u003c/p>", "decision": "\u003cp>把用户授权、应用规则和外部数据分开标明来源。建立受控攻击样本与正常业务样本，同时看未经授权行为发生率和合法任务被误拦的比例。单次测试没有成功攻击不代表不存在风险；随工具、模型、资料渠道变化做针对性回归。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>网页研究助手。\u003c/strong> 读取网页做比较时，网页只能提供被分析内容，不能改变文件访问权限或触发额外外发。输出引用真实来源，工具范围与研究目标一致。\u003c/p>\n\u003cp>\u003cstrong>企业邮件助手。\u003c/strong> 邮件附件中的操作建议属于待分析数据；是否创建任务、回复或共享文件，仍依据用户请求与系统授权。外部发件人的文字不能代替收件人的确认。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>模型答复守规矩，背后却调用了错误工具。\u003c/strong> 检查实际调用参数和外发记录，评测不能只观察最终文本。\u003c/li>\n\u003cli>\u003cstrong>防护越加越严，正常资料读不了了。\u003c/strong> 用合法引用命令、安全培训等样本测误拦，优化来源与行为约束，不仅加禁词。\u003c/li>\n\u003cli>\u003cstrong>新工具接入后风险突然增大。\u003c/strong> 新能力扩展了可执行范围，重新评估信任边界、描述变更和权限，不把旧测试通过视为永久有效。\u003c/li>\n\u003c/ul>", "questions": [{"id": "28.1", "title": "提示词注入为什么在 Agent 中更值得关注？", "answer": "\u003cp>“因为 Agent 把语言判断接到了真实工具。普通回答被诱导可能只是内容偏离；如果系统把外部文档里的命令当成授权，就可能读取、修改或发送不该处理的数据。\u003c/p>\n\u003cp>我会区分任务指令与资料来源，并把权限、可用工具和参数范围交给系统强制执行。比如只做网页总结，就没有必要提供文件删除工具。\u003c/p>\n\u003cp>防护不是要求模型更听话就结束，关键是即使模型误读了资料，错误能否被限制在可控范围。验收要看实际工具和数据流，而不是只看回答有没有说‘我不会执行’。”\u003c/p>"}, {"id": "28.2", "title": "为什么不能只靠一个安全 Prompt 或检测模型？", "answer": "\u003cp>“因为它们仍然依赖模型判断，存在漏判和误判，且外部内容形式很多。检测模型可以作为一层，但不能成为唯一的权限门槛。\u003c/p>\n\u003cp>我会组合来源标记、最小工具范围、服务端授权、参数与外发约束，以及必要的人审。对生成的代码、HTML 或查询，也继续使用原本的执行隔离和输入输出校验。\u003c/p>\n\u003cp>这样不同层解决不同问题：模型帮助识别语义，系统约束限制实际能力。即使检测漏掉某条指令，也不应因此获得新的数据访问或写操作权限。”\u003c/p>"}, {"id": "28.3", "title": "怎样验证防护有效，又没有过度影响可用性？", "answer": "\u003cp>“我会准备受控的直接和间接注入样本，覆盖网页、文档和工具返回，同时加入正常讨论指令、安全案例和引用文本的业务资料。\u003c/p>\n\u003cp>评价两面：是否发生未经授权的访问或动作，以及正常任务是否被误拦或无法完成。记录具体来源、模型决策与工具执行，区分检测成功和系统约束成功，而不是合成一个模糊通过率。\u003c/p>\n\u003cp>工具或模型版本变化后跑相关回归，线上抽查也遵循数据权限。测试结果只能说明覆盖范围内的表现，不能据此承诺所有注入都被彻底解决。”\u003c/p>"}], "search": "提示词注入防护：为什么资料里的话不能变成系统命令？\n提示词注入是输入内容试图改变模型原本应该遵守的任务或规则。直接注入来自用户输入，间接注入可能藏在网页、文档、邮件、图片文字或工具返回中。外部内容本应是任务材料，却试图把自己变成更高优先级的指令。\n\n这种问题难在模型用自然语言同时处理规则与资料，边界不像传统程序变量那样天然隔开。标签、分隔符和明确指令有帮助，但不能保证模型永远不混淆。工具描述与检索资料也不能因为来自已连接服务，就自动获得系统级信任。\n\n**防护重点是限制错误产生真实影响的路径。** 让当前任务只获得必要工具和数据，由服务端控制权限与参数，限制外发目的地和写入范围，对重要动作执行独立策略。只读摘要任务不应顺带拥有删除、转账或任意外发能力。\n\n模型判断、内容过滤与外部约束可以多层配合，但过滤可疑词不够。正常安全文档也会讨论“忽略指令”等文字，简单关键词拦截会误伤；攻击也可能绕开这些词。验证要观察最终工具行为和数据流，不只看模型是否口头拒绝。\n\n模型输出进入网页或数据库时还需要常规安全处理，例如 HTML 清理、参数化查询和权限校验。提示词注入与传统注入不是同一个问题，但可能通过系统集成扩大影响，不能因为内容由 AI 生成就跳过已有工程保护。\n把用户授权、应用规则和外部数据分开标明来源。建立受控攻击样本与正常业务样本，同时看未经授权行为发生率和合法任务被误拦的比例。单次测试没有成功攻击不代表不存在风险；随工具、模型、资料渠道变化做针对性回归。\n**网页研究助手。** 读取网页做比较时，网页只能提供被分析内容，不能改变文件访问权限或触发额外外发。输出引用真实来源，工具范围与研究目标一致。\n\n**企业邮件助手。** 邮件附件中的操作建议属于待分析数据；是否创建任务、回复或共享文件，仍依据用户请求与系统授权。外部发件人的文字不能代替收件人的确认。\n- **模型答复守规矩，背后却调用了错误工具。** 检查实际调用参数和外发记录，评测不能只观察最终文本。\n- **防护越加越严，正常资料读不了了。** 用合法引用命令、安全培训等样本测误拦，优化来源与行为约束，不仅加禁词。\n- **新工具接入后风险突然增大。** 新能力扩展了可执行范围，重新评估信任边界、描述变更和权限，不把旧测试通过视为永久有效。\n提示词注入为什么在 Agent 中更值得关注？ “因为 Agent 把语言判断接到了真实工具。普通回答被诱导可能只是内容偏离；如果系统把外部文档里的命令当成授权，就可能读取、修改或发送不该处理的数据。\n我会区分任务指令与资料来源，并把权限、可用工具和参数范围交给系统强制执行。比如只做网页总结，就没有必要提供文件删除工具。\n防护不是要求模型更听话就结束，关键是即使模型误读了资料，错误能否被限制在可控范围。验收要看实际工具和数据流，而不是只看回答有没有说‘我不会执行’。”\n为什么不能只靠一个安全 Prompt 或检测模型？ “因为它们仍然依赖模型判断，存在漏判和误判，且外部内容形式很多。检测模型可以作为一层，但不能成为唯一的权限门槛。\n我会组合来源标记、最小工具范围、服务端授权、参数与外发约束，以及必要的人审。对生成的代码、HTML 或查询，也继续使用原本的执行隔离和输入输出校验。\n这样不同层解决不同问题：模型帮助识别语义，系统约束限制实际能力。即使检测漏掉某条指令，也不应因此获得新的数据访问或写操作权限。”\n怎样验证防护有效，又没有过度影响可用性？ “我会准备受控的直接和间接注入样本，覆盖网页、文档和工具返回，同时加入正常讨论指令、安全案例和引用文本的业务资料。\n评价两面：是否发生未经授权的访问或动作，以及正常任务是否被误拦或无法完成。记录具体来源、模型决策与工具执行，区分检测成功和系统约束成功，而不是合成一个模糊通过率。\n工具或模型版本变化后跑相关回归，线上抽查也遵循数据权限。测试结果只能说明覆盖范围内的表现，不能据此承诺所有注入都被彻底解决。”"}, {"id": "k29", "number": "29", "title": "异步、幂等与恢复：超时之后，怎样确认到底做没做？", "short": "异步、幂等与恢复", "priority": "P0", "group": 4, "intro": "\u003cp>异步任务把“接收请求”和“完成工作”拆开：先返回任务 ID，再后台执行，通过查询、事件或通知反馈结果。长文档处理、批量索引与跨系统任务都适合这样设计。状态应区分排队、运行、等待用户、部分完成、成功、失败、取消与结果待确认，按业务选择，不必把所有状态塞进每个任务。\u003c/p>\n\u003cp>消息队列或客户端重试可能让同一请求被投递多次。至少一次投递侧重避免丢任务，不保证只处理一次。幂等要在业务层控制：重复请求同一操作，不产生额外重复效果。它不等于“不允许重试”，恰恰是为了让某些重试可控。\u003c/p>\n\u003cp>比如创建订单请求超时后，应先查询结果；需要重试且下游支持幂等时，沿用同一业务幂等标识，避免多创建一张订单。\u003c/p>\n\u003cp>\u003cstrong>幂等键要绑定一笔具体业务操作。\u003c/strong> 服务端记录键、调用主体、请求内容摘要与执行状态；同键同请求可返回原结果，同键不同内容应拒绝或按明确规则处理。键的作用范围、有效期、并发竞争与存储一致性都要设计。简单“先查有没有，再插入”若没有原子约束，并发请求仍可能一起执行。\u003c/p>\n\u003cp>超时意味着没有按时拿到结果，不等于动作没发生。下游支持幂等和状态查询时，用同一标识查证或重试；如果外部操作已成功、但本地尚未记录就断线，本地去重表也可能不知道结果。跨系统不能仅靠本地状态就承诺严格一次执行。\u003c/p>\n\u003cp>恢复依赖检查点、真实业务回执与补偿。Saga 类思路把长事务拆成步骤，失败时执行对应补偿，例如取消预订；补偿是新的业务动作，可能有费用、限制，也可能失败。回滚一行数据库不会自动撤回已经发出的消息。\u003c/p>", "decision": "\u003cp>明确取消的含义：停止未来步骤、请求中断当前处理，还是补偿已发生动作。取消请求与任务完成可能竞争，界面以最终确认状态为准。针对同请求并发、回执丢失、消息重复、补偿失败做故障测试，核对外部系统中的最终对象数和状态。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>批量创建待办。\u003c/strong> 每个待办有稳定操作标识，逐项保存成功 ID；重试只补失败或已核实未执行的项。任务整体允许部分完成，不把全部失败掩盖已创建记录。\u003c/p>\n\u003cp>\u003cstrong>跨系统申请。\u003c/strong> 先占资源、再发起审批、最后确认使用；审批失败时释放占用。每步状态可查询，补偿失败进入待处理队列，避免资源长期锁住。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>按钮禁用了，还是创建两条。\u003c/strong> 重复可能来自网络、队列或 Agent 多轮调用；检查服务端与下游幂等，前端防抖不是最终保证。\u003c/li>\n\u003cli>\u003cstrong>用了幂等键仍重复。\u003c/strong> 检查每次重试是否生成新键、有效期是否过短、并发约束是否原子，以及下游副作用是否被覆盖。\u003c/li>\n\u003cli>\u003cstrong>用户取消后，外部动作仍已完成。\u003c/strong> 检查取消到达时机与服务支持的中断能力，准确呈现已发生部分，按业务规则决定是否补偿。\u003c/li>\n\u003c/ul>", "questions": [{"id": "29.1", "title": "幂等应该怎样设计，为什么只加一个 requestId 不够？", "answer": "\u003cp>“requestId 只是标识，是否幂等取决于它如何绑定业务动作以及服务端如何处理重复。我要明确键的主体范围、请求内容、生命周期和状态存储，同一动作重试沿用同一键，不同内容不能误复用。\u003c/p>\n\u003cp>并发时需要原子去重或唯一约束，不能两个请求都查到不存在就一起执行。若还有下游写操作，要利用下游幂等或状态查询，处理下游成功但本地记录前断线的情况。\u003c/p>\n\u003cp>验收会并发重复提交、丢失回执并再次调用，核对最终只有预期业务效果。前端防抖和模型记忆只能减少重复意图，不能替代这些保证。”\u003c/p>"}, {"id": "29.2", "title": "接口超时，怎样判断是否可以自动重试？", "answer": "\u003cp>“先分读写和下游能力。只读查询通常更容易重试，但也要控制负载；写操作则可能已经完成，只是回执没回来，所以先根据业务标识查状态。\u003c/p>\n\u003cp>确认成功就补齐本地记录；确认未执行且条件仍满足，可以在预算内重试；状态未知时结合幂等支持决定，不能换个新标识再次执行。下游既没有查询也没有可靠幂等时，要保守处理或人工核对。\u003c/p>\n\u003cp>界面明确显示待确认，而不是把超时直接说成失败。这样才能避免用户又点一次、Agent 又重试一次，最终产生多笔真实操作。”\u003c/p>"}, {"id": "29.3", "title": "跨系统任务失败后，回滚和补偿有什么区别？", "answer": "\u003cp>“数据库事务回滚可以撤销事务内未提交的变化，但跨系统已经发生的动作往往只能通过新动作补偿。比如已订酒店后会议取消，要调用取消预订，可能受退改规则约束，不是把本地状态改回去就完成了。\u003c/p>\n\u003cp>我会记录每一步的状态与回执，定义可重试、可补偿和不可逆环节。补偿本身也要幂等、可观察，失败后有继续处理的路径。恢复时优先复用有效产物，不无条件从头再跑。\u003c/p>\n\u003cp>用户应该看到部分完成及后续选择。产品不能承诺一次取消能撤销所有已发生动作，必须把真实业务能力和成本讲清楚。”\u003c/p>"}], "search": "异步、幂等与恢复：超时之后，怎样确认到底做没做？\n异步任务把“接收请求”和“完成工作”拆开：先返回任务 ID，再后台执行，通过查询、事件或通知反馈结果。长文档处理、批量索引与跨系统任务都适合这样设计。状态应区分排队、运行、等待用户、部分完成、成功、失败、取消与结果待确认，按业务选择，不必把所有状态塞进每个任务。\n\n消息队列或客户端重试可能让同一请求被投递多次。至少一次投递侧重避免丢任务，不保证只处理一次。幂等要在业务层控制：重复请求同一操作，不产生额外重复效果。它不等于“不允许重试”，恰恰是为了让某些重试可控。\n\n比如创建订单请求超时后，应先查询结果；需要重试且下游支持幂等时，沿用同一业务幂等标识，避免多创建一张订单。\n\n**幂等键要绑定一笔具体业务操作。** 服务端记录键、调用主体、请求内容摘要与执行状态；同键同请求可返回原结果，同键不同内容应拒绝或按明确规则处理。键的作用范围、有效期、并发竞争与存储一致性都要设计。简单“先查有没有，再插入”若没有原子约束，并发请求仍可能一起执行。\n\n超时意味着没有按时拿到结果，不等于动作没发生。下游支持幂等和状态查询时，用同一标识查证或重试；如果外部操作已成功、但本地尚未记录就断线，本地去重表也可能不知道结果。跨系统不能仅靠本地状态就承诺严格一次执行。\n\n恢复依赖检查点、真实业务回执与补偿。Saga 类思路把长事务拆成步骤，失败时执行对应补偿，例如取消预订；补偿是新的业务动作，可能有费用、限制，也可能失败。回滚一行数据库不会自动撤回已经发出的消息。\n明确取消的含义：停止未来步骤、请求中断当前处理，还是补偿已发生动作。取消请求与任务完成可能竞争，界面以最终确认状态为准。针对同请求并发、回执丢失、消息重复、补偿失败做故障测试，核对外部系统中的最终对象数和状态。\n**批量创建待办。** 每个待办有稳定操作标识，逐项保存成功 ID；重试只补失败或已核实未执行的项。任务整体允许部分完成，不把全部失败掩盖已创建记录。\n\n**跨系统申请。** 先占资源、再发起审批、最后确认使用；审批失败时释放占用。每步状态可查询，补偿失败进入待处理队列，避免资源长期锁住。\n- **按钮禁用了，还是创建两条。** 重复可能来自网络、队列或 Agent 多轮调用；检查服务端与下游幂等，前端防抖不是最终保证。\n- **用了幂等键仍重复。** 检查每次重试是否生成新键、有效期是否过短、并发约束是否原子，以及下游副作用是否被覆盖。\n- **用户取消后，外部动作仍已完成。** 检查取消到达时机与服务支持的中断能力，准确呈现已发生部分，按业务规则决定是否补偿。\n幂等应该怎样设计，为什么只加一个 requestId 不够？ “requestId 只是标识，是否幂等取决于它如何绑定业务动作以及服务端如何处理重复。我要明确键的主体范围、请求内容、生命周期和状态存储，同一动作重试沿用同一键，不同内容不能误复用。\n并发时需要原子去重或唯一约束，不能两个请求都查到不存在就一起执行。若还有下游写操作，要利用下游幂等或状态查询，处理下游成功但本地记录前断线的情况。\n验收会并发重复提交、丢失回执并再次调用，核对最终只有预期业务效果。前端防抖和模型记忆只能减少重复意图，不能替代这些保证。”\n接口超时，怎样判断是否可以自动重试？ “先分读写和下游能力。只读查询通常更容易重试，但也要控制负载；写操作则可能已经完成，只是回执没回来，所以先根据业务标识查状态。\n确认成功就补齐本地记录；确认未执行且条件仍满足，可以在预算内重试；状态未知时结合幂等支持决定，不能换个新标识再次执行。下游既没有查询也没有可靠幂等时，要保守处理或人工核对。\n界面明确显示待确认，而不是把超时直接说成失败。这样才能避免用户又点一次、Agent 又重试一次，最终产生多笔真实操作。”\n跨系统任务失败后，回滚和补偿有什么区别？ “数据库事务回滚可以撤销事务内未提交的变化，但跨系统已经发生的动作往往只能通过新动作补偿。比如已订酒店后会议取消，要调用取消预订，可能受退改规则约束，不是把本地状态改回去就完成了。\n我会记录每一步的状态与回执，定义可重试、可补偿和不可逆环节。补偿本身也要幂等、可观察，失败后有继续处理的路径。恢复时优先复用有效产物，不无条件从头再跑。\n用户应该看到部分完成及后续选择。产品不能承诺一次取消能撤销所有已发生动作，必须把真实业务能力和成本讲清楚。”"}, {"id": "k30", "number": "30", "title": "日志与链路追踪：怎样把‘慢’和‘答错’定位到具体一步？", "short": "日志与链路追踪", "priority": "P1", "group": 4, "intro": "\u003cp>Logs 是事件记录，Metrics 是聚合指标，Traces 把一次请求或任务经过的步骤关联起来。三者分别帮助知道发生了什么、影响范围多大、具体卡在哪里。只有总耗时曲线，没有执行链路，通常很难解释某个用户为什么失败。\u003c/p>\n\u003cp>Trace 是一条执行链，Span 是其中一个操作片段，例如检索、重排、模型调用或保存。Span 带开始结束时间、状态与必要属性，并按父子关系连接。异步任务还要把任务 ID 与 Trace 关联，跨队列后不能丢失关联，否则前台请求结束后后台错误就无从追踪。\u003c/p>\n\u003cp>\u003cstrong>模型体验要拆时间。\u003c/strong> TTFT 是从明确起点到第一个输出 Token 的耗时，需说明是否包含排队和网络；后续生成速度描述输出阶段；端到端时延还包括检索、工具、人工等待等。用户说“慢”，可能是迟迟没有首字，也可能是工具来回调用，解决办法不同。\u003c/p>\n\u003cp>P95 表示观测值中约 95% 不超过这个值，不是平均数。端到端 P95 应从端到端样本计算，不能简单把各节点 P95 相加：最慢样本不一定是同一请求，并行步骤也不是串行累加。\u003c/p>\n\u003cp>诊断质量需要记录模型与提示词版本、资料引用、候选到最终上下文的选择、工具参数和真实状态，但不等于存下所有原文。凭据不进日志，敏感字段按必要性处理，访问与保留期限受控。隐藏思维不是排错必需品，可核对的输入、动作与结果更重要。\u003c/p>", "decision": "\u003cp>给用户看真实进度与可行动信息，给运维看成功率、成本和依赖健康，给研发看授权范围内的节点细节。记录采样策略，重要失败尽量保留足够诊断证据。按任务类型和输入规模分组，避免小请求平均值掩盖长任务体验。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>知识问答排错。\u003c/strong> 用户反馈某条款错误，按任务找到解析版本、召回候选、最终证据与回答，定位是漏证据、选错版本还是生成误读。\u003c/p>\n\u003cp>\u003cstrong>Agent 成本诊断。\u003c/strong> 将每轮模型、工具和重试费用关联同一任务，发现反复搜索或失败升级造成的额外消耗，而不是只看到一张模型总账。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>平均延迟下降，投诉增加。\u003c/strong> 检查高分位与重要任务分组，是否少数长任务等待更久；同时核对首字与最终完成时间。\u003c/li>\n\u003cli>\u003cstrong>后台失败，前台链路显示成功。\u003c/strong> 检查异步任务关联和受理／完成语义，HTTP 请求结束不能当后台任务结束。\u003c/li>\n\u003cli>\u003cstrong>日志很多，仍无法复现。\u003c/strong> 缺少版本、资料引用或状态关联时，增加文本量帮助有限；先补关键标识与结构化事件。\u003c/li>\n\u003c/ul>", "questions": [{"id": "30.1", "title": "智能体平台的 Trace 应该记录哪些关键内容？", "answer": "\u003cp>“以用户任务为主线，关联模型调用、检索、工具与状态变化。至少记录任务和操作标识、配置版本、耗时、错误类型、用量、必要来源及业务回执，能够从反馈追到具体步骤。\u003c/p>\n\u003cp>检索问题需要看到候选与最终上下文的差别，工具问题需要看到参数和真实业务状态。异步任务跨队列后也要保持关联，不能只记录入口接口。\u003c/p>\n\u003cp>但我不会把所有资料和凭据默认写进日志。按排错需要保留最小信息，对敏感内容设置权限和期限。可观测性的目标是解释问题与验证修复，而不是无限收集数据。”\u003c/p>"}, {"id": "30.2", "title": "用户说 AI 很慢，你会怎样分析？", "answer": "\u003cp>“先定义慢在哪：任务排队、首字出现、输出生成还是后续工具执行。用 Trace 拆开各段耗时，再按任务类型、输入长度、模型和高峰时段分组。\u003c/p>\n\u003cp>长输入可能拖慢首字，长输出延长生成，多轮工具可能把总时间拉长；还有服务端排队和网络因素。P95 等分位数能观察尾部体验，但要用正确的端到端样本计算，不能把节点 P95 相加。\u003c/p>\n\u003cp>定位后再选压缩上下文、缓存、并发优化、模型路由或减少无效轮次。流式显示可以改善等待感，是否真正变快仍要看测量，并确保没有牺牲任务质量。”\u003c/p>"}, {"id": "30.3", "title": "怎样设计可观测性，才能支持内容质量优化？", "answer": "\u003cp>“我会让用户反馈关联任务与版本，再保留足够的证据路径。比如 RAG 答错，必须能对照原始资料、召回结果、最终上下文和输出；只有一条‘模型调用成功’日志，解释不了质量问题。\u003c/p>\n\u003cp>随后把失败归类成解析、检索、选证、生成或执行问题，统计频率与影响。典型样本经过授权和脱敏进入回归集，修复后用同类问题验证。\u003c/p>\n\u003cp>这些信息要与性能和费用关联，才能判断某次质量提升付出了什么代价。日志本身不是质量指标，但它让我们知道应该改哪一层、改完有没有真的解决。”\u003c/p>"}], "search": "日志与链路追踪：怎样把‘慢’和‘答错’定位到具体一步？\nLogs 是事件记录，Metrics 是聚合指标，Traces 把一次请求或任务经过的步骤关联起来。三者分别帮助知道发生了什么、影响范围多大、具体卡在哪里。只有总耗时曲线，没有执行链路，通常很难解释某个用户为什么失败。\n\nTrace 是一条执行链，Span 是其中一个操作片段，例如检索、重排、模型调用或保存。Span 带开始结束时间、状态与必要属性，并按父子关系连接。异步任务还要把任务 ID 与 Trace 关联，跨队列后不能丢失关联，否则前台请求结束后后台错误就无从追踪。\n\n**模型体验要拆时间。** TTFT 是从明确起点到第一个输出 Token 的耗时，需说明是否包含排队和网络；后续生成速度描述输出阶段；端到端时延还包括检索、工具、人工等待等。用户说“慢”，可能是迟迟没有首字，也可能是工具来回调用，解决办法不同。\n\nP95 表示观测值中约 95% 不超过这个值，不是平均数。端到端 P95 应从端到端样本计算，不能简单把各节点 P95 相加：最慢样本不一定是同一请求，并行步骤也不是串行累加。\n\n诊断质量需要记录模型与提示词版本、资料引用、候选到最终上下文的选择、工具参数和真实状态，但不等于存下所有原文。凭据不进日志，敏感字段按必要性处理，访问与保留期限受控。隐藏思维不是排错必需品，可核对的输入、动作与结果更重要。\n给用户看真实进度与可行动信息，给运维看成功率、成本和依赖健康，给研发看授权范围内的节点细节。记录采样策略，重要失败尽量保留足够诊断证据。按任务类型和输入规模分组，避免小请求平均值掩盖长任务体验。\n**知识问答排错。** 用户反馈某条款错误，按任务找到解析版本、召回候选、最终证据与回答，定位是漏证据、选错版本还是生成误读。\n\n**Agent 成本诊断。** 将每轮模型、工具和重试费用关联同一任务，发现反复搜索或失败升级造成的额外消耗，而不是只看到一张模型总账。\n- **平均延迟下降，投诉增加。** 检查高分位与重要任务分组，是否少数长任务等待更久；同时核对首字与最终完成时间。\n- **后台失败，前台链路显示成功。** 检查异步任务关联和受理／完成语义，HTTP 请求结束不能当后台任务结束。\n- **日志很多，仍无法复现。** 缺少版本、资料引用或状态关联时，增加文本量帮助有限；先补关键标识与结构化事件。\n智能体平台的 Trace 应该记录哪些关键内容？ “以用户任务为主线，关联模型调用、检索、工具与状态变化。至少记录任务和操作标识、配置版本、耗时、错误类型、用量、必要来源及业务回执，能够从反馈追到具体步骤。\n检索问题需要看到候选与最终上下文的差别，工具问题需要看到参数和真实业务状态。异步任务跨队列后也要保持关联，不能只记录入口接口。\n但我不会把所有资料和凭据默认写进日志。按排错需要保留最小信息，对敏感内容设置权限和期限。可观测性的目标是解释问题与验证修复，而不是无限收集数据。”\n用户说 AI 很慢，你会怎样分析？ “先定义慢在哪：任务排队、首字出现、输出生成还是后续工具执行。用 Trace 拆开各段耗时，再按任务类型、输入长度、模型和高峰时段分组。\n长输入可能拖慢首字，长输出延长生成，多轮工具可能把总时间拉长；还有服务端排队和网络因素。P95 等分位数能观察尾部体验，但要用正确的端到端样本计算，不能把节点 P95 相加。\n定位后再选压缩上下文、缓存、并发优化、模型路由或减少无效轮次。流式显示可以改善等待感，是否真正变快仍要看测量，并确保没有牺牲任务质量。”\n怎样设计可观测性，才能支持内容质量优化？ “我会让用户反馈关联任务与版本，再保留足够的证据路径。比如 RAG 答错，必须能对照原始资料、召回结果、最终上下文和输出；只有一条‘模型调用成功’日志，解释不了质量问题。\n随后把失败归类成解析、检索、选证、生成或执行问题，统计频率与影响。典型样本经过授权和脱敏进入回归集，修复后用同类问题验证。\n这些信息要与性能和费用关联，才能判断某次质量提升付出了什么代价。日志本身不是质量指标，但它让我们知道应该改哪一层、改完有没有真的解决。”"}, {"id": "k31", "number": "31", "title": "评测体系：怎么证明系统更好，而不是刚好答对了几题？", "short": "评测体系", "priority": "P0", "group": 4, "intro": "\u003cp>评测先回答两个问题：系统应该完成什么，怎样判定完成。模型有输出、格式合法和任务成功是不同层次。写报告要检查事实与材料覆盖，客服处理要核对订单状态，代码修改要验证目标行为与相关回归，不能共用一个“回答质量 8 分”解决所有验收。\u003c/p>\n\u003cp>\u003cstrong>测试集要代表真实任务，也要暴露关键失败。\u003c/strong> 从目标用户任务中抽样，按类型、复杂度、输入长度和风险分层，再补充低频高影响的边界。代表性样本用于估计常态表现，专项压力与攻击样本用于验证边界；可以分别报告，不能随意混成一个总体成功率。\u003c/p>\n\u003cp>开发集帮助发现问题和调参，保留集用于较独立地判断效果。反复看着同一套保留题修改，事实上也会把它变成开发集，需要补充新样本。资料、评分规则和版本变化都应记录，避免把测试条件改变误认为模型进步。\u003c/p>\n\u003cp>比如用同一批任务比较新旧提示词的正确率、成本和失败情况，再决定是否上线；旧方案的表现就是比较基线。\u003c/p>\n\u003cp>评分分工也重要：JSON 结构、计算结果、工具状态可用程序核验；复杂事实和表达需要人工规则；模型评委可以扩展评审规模，但要与人工标注对齐，检查位置、篇幅、自偏好和注入等偏差。给评委足够证据，不让它只凭流畅程度打分。\u003c/p>\n\u003cp>\u003cstrong>模型输出有波动，数据也有抽样误差。\u003c/strong> 同一任务可能要重复运行，尤其关注一次成功和稳定成功的差别。比较新旧版本尽量用相同输入，观察成对变化与不同任务分组；少量样本上的小提升需要不确定性分析，不能轻易宣称显著。\u003c/p>", "decision": "\u003cp>定义组件、任务、业务三层指标。组件帮助定位，任务看最终结果与约束，业务看人工修改、采纳与价值。自动完成与人工辅助完成分开统计，失败任务的消耗仍计入成本。发布门槛提前约定，重要约束单独设置，不用其他普通题加分抵消越权或重复交易。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>模型或提示词升级。\u003c/strong> 在固定数据与工具环境上比较旧新版本，观察事实、工具选择、结构、时延与费用，再灰度验证真实流量。对会产生副作用的任务使用测试环境或只读回放。\u003c/p>\n\u003cp>\u003cstrong>企业知识问答验收。\u003c/strong> 标注必要证据、适用条件和不可回答原因，分别测召回、答案与引用。用例不只是一句标准答案，还包括为什么这个答案成立。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>离线高分，上线不好用。\u003c/strong> 检查任务分布、资料质量和用户交互差异，是否遗漏真实等待、补问和执行步骤。\u003c/li>\n\u003cli>\u003cstrong>改一版涨分，再测又掉。\u003c/strong> 检查样本规模、输出波动与评分稳定性；固定条件并重复关键任务，不根据一次运行下结论。\u003c/li>\n\u003cli>\u003cstrong>评委喜欢长答案，实际用户嫌啰嗦。\u003c/strong> 评分规则明确任务完成与简洁要求，随机交换候选顺序，并与人工判断对齐。\u003c/li>\n\u003c/ul>", "questions": [{"id": "31.1", "title": "从零搭建 Agent 评测体系，你先做什么？", "answer": "\u003cp>“先选核心任务并定义可核验的成功条件，明确允许的动作和失败边界。然后从真实类型的任务抽样分层，补上缺信息、工具失败、权限变化和中断恢复等关键用例。\u003c/p>\n\u003cp>组件层看检索和工具参数，任务层核对最终业务状态与约束，业务层看人工修改和成本。能用程序判断的直接核验，复杂内容用明确规则人工标注，再引入经过校准的模型评委。\u003c/p>\n\u003cp>开发集与保留集分开，记录数据与配置版本。升级时做离线对照，再小范围验证真实任务，不把某个模型榜单或几条演示结果直接当产品验收。”\u003c/p>"}, {"id": "31.2", "title": "两个版本成功率差两个百分点，能说明新版更好吗？", "answer": "\u003cp>“还不能，先看样本量、任务分布和波动。少量任务里多成功一两条就可能产生这个差距；如果新旧测试输入不一致，比较也不公平。\u003c/p>\n\u003cp>我会尽量用相同任务成对比较，检查哪些题变好、哪些退化，并按关键场景分组。对随机性明显的任务重复运行，结合置信区间或合适的统计分析判断不确定性。关键失败不能被总体平均掩盖。\u003c/p>\n\u003cp>即使质量提升可信，还要看成本、时延和上线约束。结论应说明收益范围和证据强度，不能只因为数字大一点就全量切换。”\u003c/p>"}, {"id": "31.3", "title": "模型当评委怎么用才可靠？", "answer": "\u003cp>“先把评分维度和证据给清楚，避免让评委凭整体印象打分。比如回答事实是否被资料支持，要提供原始证据与判定规则；计算和工具状态则直接用程序校验。\u003c/p>\n\u003cp>我会抽样与人工标注对齐，检查它是否偏好长答案、候选位置或某类表达，必要时交换顺序、拆维度评分。被评内容也可能带有干扰指令，需要作为数据处理。\u003c/p>\n\u003cp>模型评委适合帮助扩展覆盖和发现问题，但不是唯一真相。对高影响错误保留更强核验，并持续检查新任务分布下是否仍与业务判断一致。”\u003c/p>"}], "search": "评测体系：怎么证明系统更好，而不是刚好答对了几题？\n评测先回答两个问题：系统应该完成什么，怎样判定完成。模型有输出、格式合法和任务成功是不同层次。写报告要检查事实与材料覆盖，客服处理要核对订单状态，代码修改要验证目标行为与相关回归，不能共用一个“回答质量 8 分”解决所有验收。\n\n**测试集要代表真实任务，也要暴露关键失败。** 从目标用户任务中抽样，按类型、复杂度、输入长度和风险分层，再补充低频高影响的边界。代表性样本用于估计常态表现，专项压力与攻击样本用于验证边界；可以分别报告，不能随意混成一个总体成功率。\n\n开发集帮助发现问题和调参，保留集用于较独立地判断效果。反复看着同一套保留题修改，事实上也会把它变成开发集，需要补充新样本。资料、评分规则和版本变化都应记录，避免把测试条件改变误认为模型进步。\n\n比如用同一批任务比较新旧提示词的正确率、成本和失败情况，再决定是否上线；旧方案的表现就是比较基线。\n\n评分分工也重要：JSON 结构、计算结果、工具状态可用程序核验；复杂事实和表达需要人工规则；模型评委可以扩展评审规模，但要与人工标注对齐，检查位置、篇幅、自偏好和注入等偏差。给评委足够证据，不让它只凭流畅程度打分。\n\n**模型输出有波动，数据也有抽样误差。** 同一任务可能要重复运行，尤其关注一次成功和稳定成功的差别。比较新旧版本尽量用相同输入，观察成对变化与不同任务分组；少量样本上的小提升需要不确定性分析，不能轻易宣称显著。\n定义组件、任务、业务三层指标。组件帮助定位，任务看最终结果与约束，业务看人工修改、采纳与价值。自动完成与人工辅助完成分开统计，失败任务的消耗仍计入成本。发布门槛提前约定，重要约束单独设置，不用其他普通题加分抵消越权或重复交易。\n**模型或提示词升级。** 在固定数据与工具环境上比较旧新版本，观察事实、工具选择、结构、时延与费用，再灰度验证真实流量。对会产生副作用的任务使用测试环境或只读回放。\n\n**企业知识问答验收。** 标注必要证据、适用条件和不可回答原因，分别测召回、答案与引用。用例不只是一句标准答案，还包括为什么这个答案成立。\n- **离线高分，上线不好用。** 检查任务分布、资料质量和用户交互差异，是否遗漏真实等待、补问和执行步骤。\n- **改一版涨分，再测又掉。** 检查样本规模、输出波动与评分稳定性；固定条件并重复关键任务，不根据一次运行下结论。\n- **评委喜欢长答案，实际用户嫌啰嗦。** 评分规则明确任务完成与简洁要求，随机交换候选顺序，并与人工判断对齐。\n从零搭建 Agent 评测体系，你先做什么？ “先选核心任务并定义可核验的成功条件，明确允许的动作和失败边界。然后从真实类型的任务抽样分层，补上缺信息、工具失败、权限变化和中断恢复等关键用例。\n组件层看检索和工具参数，任务层核对最终业务状态与约束，业务层看人工修改和成本。能用程序判断的直接核验，复杂内容用明确规则人工标注，再引入经过校准的模型评委。\n开发集与保留集分开，记录数据与配置版本。升级时做离线对照，再小范围验证真实任务，不把某个模型榜单或几条演示结果直接当产品验收。”\n两个版本成功率差两个百分点，能说明新版更好吗？ “还不能，先看样本量、任务分布和波动。少量任务里多成功一两条就可能产生这个差距；如果新旧测试输入不一致，比较也不公平。\n我会尽量用相同任务成对比较，检查哪些题变好、哪些退化，并按关键场景分组。对随机性明显的任务重复运行，结合置信区间或合适的统计分析判断不确定性。关键失败不能被总体平均掩盖。\n即使质量提升可信，还要看成本、时延和上线约束。结论应说明收益范围和证据强度，不能只因为数字大一点就全量切换。”\n模型当评委怎么用才可靠？ “先把评分维度和证据给清楚，避免让评委凭整体印象打分。比如回答事实是否被资料支持，要提供原始证据与判定规则；计算和工具状态则直接用程序校验。\n我会抽样与人工标注对齐，检查它是否偏好长答案、候选位置或某类表达，必要时交换顺序、拆维度评分。被评内容也可能带有干扰指令，需要作为数据处理。\n模型评委适合帮助扩展覆盖和发现问题，但不是唯一真相。对高影响错误保留更强核验，并持续检查新任务分布下是否仍与业务判断一致。”"}, {"id": "k32", "number": "32", "title": "版本发布与资产管理：怎样更新能力，又能解释和恢复变化？", "short": "版本发布与资产管理", "priority": "P1", "group": 4, "intro": "\u003cp>一个 Agent 的行为由多项资产共同决定：模型及参数、提示词、工具 Schema、工作流、检索策略、知识版本和运行配置。仅记录“Prompt v3”，常常无法重现某次回答，因为模型或工具可能已经变了。\u003c/p>\n\u003cp>资产管理要保存所有者、用途、接口、依赖、版本与质量记录。别人复用一个工作流模板时，需要知道适用场景、需要哪些凭据与资料、用什么测试过，不能只复制一张画布。版本组合可以形成一次发布的清单，明确哪些变化一起上线。\u003c/p>\n\u003cp>\u003cstrong>发布要区分验证方式。\u003c/strong> 离线回放使用固定样本比较；影子流量让新版本观察真实请求但不影响用户结果；灰度让一部分真实任务使用新版；对照实验按合适单位分配版本来评估效果。影子执行涉及写操作时必须禁用副作用或使用隔离环境，不能同时创建两笔真实订单。\u003c/p>\n\u003cp>进行中的长任务通常需要明确版本策略，避免前半段用旧 Schema、后半段读到新字段。兼容变更可以平滑升级，不兼容变更需要迁移或保留旧接口。权限撤销与安全策略则不能因为任务固定旧版本就被忽略。\u003c/p>\n\u003cp>回退只能恢复配置或代码到旧组合，不自动撤销已经发出的内容或创建的订单。知识版本回退也不能重新开放已删除或撤权的数据。业务补偿、数据修复与版本回滚要分别处理。\u003c/p>", "decision": "\u003cp>发布前明确受影响任务、回归范围、观察指标和停止条件，确保旧方案仍可用或有替代路径。资产数量不是效果，复用成功率、首次交付时间、维护负担与实际使用才说明价值。长期无人维护或依赖失效的模板应下架或标记，避免污染能力目录。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>工具接口升级。\u003c/strong> 退款工具增加分项金额字段，检查引用它的 Agent 和流程，验证旧调用是否仍有明确语义；不能让默认值悄悄变成整单退款。\u003c/p>\n\u003cp>\u003cstrong>知识检索策略发布。\u003c/strong> 新索引与 Embedding 成套验证，切换查询版本并持续同步更新，保留可回退路径；监控不同资料类型的收益，避免整体提升掩盖某一类退化。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>回滚提示词，效果却没回来。\u003c/strong> 检查模型、工具与知识索引是否同时变化，回退完整兼容组合，而不是单个文件。\u003c/li>\n\u003cli>\u003cstrong>灰度结果混在一起看不出差异。\u003c/strong> 记录版本分组与任务流量，检查用户或会话是否跨版本污染，并按同类任务比较。\u003c/li>\n\u003cli>\u003cstrong>模板很多，实际没人敢用。\u003c/strong> 补用途、示例、依赖、维护人和测试结果，减少重复与失效资产，衡量成功复用而非收藏数。\u003c/li>\n\u003c/ul>", "questions": [{"id": "32.1", "title": "智能体发布时应该固定哪些版本信息？", "answer": "\u003cp>“固定会影响行为的主要组合：模型和参数、提示词、工具接口、流程、检索策略以及使用的知识版本，并记录评测集和结果。这样用户反馈时能知道当时运行的到底是哪套系统。\u003c/p>\n\u003cp>长任务还要规定是否沿用启动时的兼容版本，避免中途字段含义变化。但动态权限和撤销仍按当前规则检查，不能为了复现恢复过期授权。\u003c/p>\n\u003cp>版本管理不只是存历史，还要描述依赖和兼容性。否则只回滚 Prompt，其他组件已经变了，可能既解释不了问题，也恢复不了旧表现。”\u003c/p>"}, {"id": "32.2", "title": "影子流量和灰度发布有什么区别？", "answer": "\u003cp>“影子流量通常让新版处理相同或复制的请求，但用户仍收到原版本结果，适合观察质量和性能；灰度则让一部分真实任务真正使用新版，会影响用户体验。两者的风险与判断目的不同。\u003c/p>\n\u003cp>Agent 可能调用写工具，所以影子验证不能无控制复制副作用。可以记录原工具结果供回放，或在隔离环境执行，明确这不等同于完整真实环境表现。\u003c/p>\n\u003cp>灰度前约定样本分配、监控和回退条件，比较同类任务，关注关键错误。不能只因为影子答案看起来不错，就忽略真实交互、权限与下游执行差异。”\u003c/p>"}, {"id": "32.3", "title": "AI 资产怎样沉淀才有复用价值？", "answer": "\u003cp>“我会把资产做成有边界的交付件，说明解决什么任务、输入输出是什么、依赖哪些模型工具与数据、用什么样本验证过、由谁维护。模板、工具和知识连接都需要这些信息。\u003c/p>\n\u003cp>上线前给出可运行示例，变更时追踪受影响应用，失效时及时归档。让使用者找到并成功用起来，比积累很多名字相似的模板更重要。\u003c/p>\n\u003cp>衡量复用价值看首次交付时间、复用后成功运行比例和维护成本。复制次数高但后续都要大幅改造，可能说明抽象边界不合适，而不是沉淀已经成功。”\u003c/p>"}], "search": "版本发布与资产管理：怎样更新能力，又能解释和恢复变化？\n一个 Agent 的行为由多项资产共同决定：模型及参数、提示词、工具 Schema、工作流、检索策略、知识版本和运行配置。仅记录“Prompt v3”，常常无法重现某次回答，因为模型或工具可能已经变了。\n\n资产管理要保存所有者、用途、接口、依赖、版本与质量记录。别人复用一个工作流模板时，需要知道适用场景、需要哪些凭据与资料、用什么测试过，不能只复制一张画布。版本组合可以形成一次发布的清单，明确哪些变化一起上线。\n\n**发布要区分验证方式。** 离线回放使用固定样本比较；影子流量让新版本观察真实请求但不影响用户结果；灰度让一部分真实任务使用新版；对照实验按合适单位分配版本来评估效果。影子执行涉及写操作时必须禁用副作用或使用隔离环境，不能同时创建两笔真实订单。\n\n进行中的长任务通常需要明确版本策略，避免前半段用旧 Schema、后半段读到新字段。兼容变更可以平滑升级，不兼容变更需要迁移或保留旧接口。权限撤销与安全策略则不能因为任务固定旧版本就被忽略。\n\n回退只能恢复配置或代码到旧组合，不自动撤销已经发出的内容或创建的订单。知识版本回退也不能重新开放已删除或撤权的数据。业务补偿、数据修复与版本回滚要分别处理。\n发布前明确受影响任务、回归范围、观察指标和停止条件，确保旧方案仍可用或有替代路径。资产数量不是效果，复用成功率、首次交付时间、维护负担与实际使用才说明价值。长期无人维护或依赖失效的模板应下架或标记，避免污染能力目录。\n**工具接口升级。** 退款工具增加分项金额字段，检查引用它的 Agent 和流程，验证旧调用是否仍有明确语义；不能让默认值悄悄变成整单退款。\n\n**知识检索策略发布。** 新索引与 Embedding 成套验证，切换查询版本并持续同步更新，保留可回退路径；监控不同资料类型的收益，避免整体提升掩盖某一类退化。\n- **回滚提示词，效果却没回来。** 检查模型、工具与知识索引是否同时变化，回退完整兼容组合，而不是单个文件。\n- **灰度结果混在一起看不出差异。** 记录版本分组与任务流量，检查用户或会话是否跨版本污染，并按同类任务比较。\n- **模板很多，实际没人敢用。** 补用途、示例、依赖、维护人和测试结果，减少重复与失效资产，衡量成功复用而非收藏数。\n智能体发布时应该固定哪些版本信息？ “固定会影响行为的主要组合：模型和参数、提示词、工具接口、流程、检索策略以及使用的知识版本，并记录评测集和结果。这样用户反馈时能知道当时运行的到底是哪套系统。\n长任务还要规定是否沿用启动时的兼容版本，避免中途字段含义变化。但动态权限和撤销仍按当前规则检查，不能为了复现恢复过期授权。\n版本管理不只是存历史，还要描述依赖和兼容性。否则只回滚 Prompt，其他组件已经变了，可能既解释不了问题，也恢复不了旧表现。”\n影子流量和灰度发布有什么区别？ “影子流量通常让新版处理相同或复制的请求，但用户仍收到原版本结果，适合观察质量和性能；灰度则让一部分真实任务真正使用新版，会影响用户体验。两者的风险与判断目的不同。\nAgent 可能调用写工具，所以影子验证不能无控制复制副作用。可以记录原工具结果供回放，或在隔离环境执行，明确这不等同于完整真实环境表现。\n灰度前约定样本分配、监控和回退条件，比较同类任务，关注关键错误。不能只因为影子答案看起来不错，就忽略真实交互、权限与下游执行差异。”\nAI 资产怎样沉淀才有复用价值？ “我会把资产做成有边界的交付件，说明解决什么任务、输入输出是什么、依赖哪些模型工具与数据、用什么样本验证过、由谁维护。模板、工具和知识连接都需要这些信息。\n上线前给出可运行示例，变更时追踪受影响应用，失效时及时归档。让使用者找到并成功用起来，比积累很多名字相似的模板更重要。\n衡量复用价值看首次交付时间、复用后成功运行比例和维护成本。复制次数高但后续都要大幅改造，可能说明抽象边界不合适，而不是沉淀已经成功。”"}, {"id": "k33", "number": "33", "title": "场景选择与优先级：第一版先证明哪件事值得做？", "short": "场景选择与优先级", "priority": "P0", "group": 5, "intro": "\u003cp>智能体平台可以展示模型、工具、知识库和画布，但用户购买的是工作结果。选场景先画出现有流程：谁在什么时刻做什么、用哪些资料和系统、哪里耗时或容易错、结果由谁验收。没有这一步，容易把“可以接 AI”误当成“值得做”。\u003c/p>\n\u003cp>价值侧看频率、耗时、错误损失与使用人群；可行性看数据、接口、权限和结果可验证性；经营侧看交付成本、实施复杂度与持续使用机会。评分可以帮助比较，但分数背后的证据与不确定性比精确小数更重要。访谈样本不足时，明确哪些仍是假设。\u003c/p>\n\u003cp>\u003cstrong>是否需要 Agent，要看变化发生在哪里。\u003c/strong> 固定字段与规则，用普通程序可能足够；非结构化理解，可以只加一个模型节点；需要根据工具反馈探索下一步，才考虑更多动态决策。自主程度应服务任务，不是第一版必须拉满的指标。\u003c/p>\n\u003cp>MVP 不是删到只剩聊天演示，而是缩小范围后仍能检验价值的完整闭环。比如只支持一个制度域的客服辅助答复，但必须包括资料适用、引用、修改和反馈；如果省掉结果核验，就无法知道它到底替用户省了什么工作。\u003c/p>\n\u003cp>比如先让一类资料完成“检索—生成—确认保存”的闭环，再考虑更多复杂任务。\u003c/p>\n\u003cp>验证要同时设继续与停止条件。用户采用、减少处理时间是正向信号；大量校对、权限长期拿不到、错误损失无法接受，则可能需要收窄、换场景或停止。不要把每次失败都解释为再加一点模型能力就能成功。\u003c/p>", "decision": "\u003cp>明确需求假设、基线流程、目标用户、成功指标、范围和前置依赖，再安排小样本验证。与同类任务比较包含核查返工的总时间，而不只比较生成速度。先用方案试验或受控试点降低不确定性，再承诺规模化交付。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>企业客服助手的第一版。\u003c/strong> 假设高频咨询集中在有稳定文档的产品规则，人工能核对答案，订单写操作暂不具备可靠接口：可以先做带引用的回复草稿，验证处理效率，再考虑订单操作。这是条件明确的选择，不是所有企业都应先做客服。\u003c/p>\n\u003cp>\u003cstrong>内部研究助手试点。\u003c/strong> 先支持指定来源、固定比较维度和证据表，暂不承诺自主全网调查与自动发布。验证研究人员是否更快获得可用资料，而不只看报告页数。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>用户觉得有趣，几天后不用。\u003c/strong> 回到真实工作时刻，检查结果是否能进入现有流程、有没有减少完整任务成本，而不是继续加聊天花样。\u003c/li>\n\u003cli>\u003cstrong>需求池里什么都高优先级。\u003c/strong> 要求给出频率、影响与依赖证据，区分价值假设和已知事实；没有接口的高价值任务也可能暂时不可交付。\u003c/li>\n\u003cli>\u003cstrong>试点成功，扩展后成本失控。\u003c/strong> 检查是否依赖少数专家手工清洗或逐次救场，把隐性人工与实施成本纳入规模化评估。\u003c/li>\n\u003c/ul>", "questions": [{"id": "33.1", "title": "如果让你负责一个企业 Agent 平台，第一版做什么？", "answer": "\u003cp>“我先给出条件再做选择。假设目标客户有高频产品咨询、资料维护较好、客服能核对答案，但交易写接口不成熟，我会先做带来源的客服回复草稿，暂不直接自动退款。因为资料入口和验收清楚，也能在较小范围测效率。\u003c/p>\n\u003cp>第一版选一个问题域，完成提问、检索、引用、编辑与反馈闭环。对照原流程测完整处理时间、关键事实错误和人工修改，确认是否真正有用。若主要困难其实在查询订单而非找政策，就应调整方向，补业务集成。\u003c/p>\n\u003cp>我不会脱离客户条件给所有平台同一答案。首选场景要能被验证，也要有明确的扩大或停止条件。”\u003c/p>"}, {"id": "33.2", "title": "什么需求值得做成 Agent，什么不值得？", "answer": "\u003cp>“我看任务是否需要在不确定环境下根据反馈选择行动。输入、规则和步骤固定，普通自动化通常更容易验证；只是需要理解文本，可以在工作流里加模型；需要跨资料和工具探索，才值得增加 Agent 决策。\u003c/p>\n\u003cp>比如固定格式报表按时发送，不必让模型重新规划；调查客户问题可能要根据日志和查询结果决定下一步，更适合限定范围的 Agent。还要看错误后果和最终结果能否核验。\u003c/p>\n\u003cp>我会用最简单可行方案做基线，比较增加自主决策后的成功率、时延和人工量。技术上做得到，不等于业务上值得承担更多不确定性。”\u003c/p>"}, {"id": "33.3", "title": "业务方要求第一版全覆盖，你怎么收敛并推进？", "answer": "\u003cp>“先把要验证的核心价值讲清楚，再按用户任务拆范围，不按技术功能随意裁剪。比如客服草稿先覆盖一个产品和高频问题域，仍保留引用、编辑和失败反馈；复杂交易处理放到具备接口与验证条件后。\u003c/p>\n\u003cp>我会列出数据、权限、接口和运营维护的依赖，设可验收里程碑：资料可用、核心任务达标、受控试点验证价值，再扩大。具体排期基于依赖确认，不凭一个聊天演示承诺全量上线。\u003c/p>\n\u003cp>如果反对收敛，就用实施成本、错误损失和证据缺口讨论取舍。目标是先交付一个值得扩展的闭环，而不是第一版列出最多功能。”\u003c/p>"}], "search": "场景选择与优先级：第一版先证明哪件事值得做？\n智能体平台可以展示模型、工具、知识库和画布，但用户购买的是工作结果。选场景先画出现有流程：谁在什么时刻做什么、用哪些资料和系统、哪里耗时或容易错、结果由谁验收。没有这一步，容易把“可以接 AI”误当成“值得做”。\n\n价值侧看频率、耗时、错误损失与使用人群；可行性看数据、接口、权限和结果可验证性；经营侧看交付成本、实施复杂度与持续使用机会。评分可以帮助比较，但分数背后的证据与不确定性比精确小数更重要。访谈样本不足时，明确哪些仍是假设。\n\n**是否需要 Agent，要看变化发生在哪里。** 固定字段与规则，用普通程序可能足够；非结构化理解，可以只加一个模型节点；需要根据工具反馈探索下一步，才考虑更多动态决策。自主程度应服务任务，不是第一版必须拉满的指标。\n\nMVP 不是删到只剩聊天演示，而是缩小范围后仍能检验价值的完整闭环。比如只支持一个制度域的客服辅助答复，但必须包括资料适用、引用、修改和反馈；如果省掉结果核验，就无法知道它到底替用户省了什么工作。\n\n比如先让一类资料完成“检索—生成—确认保存”的闭环，再考虑更多复杂任务。\n\n验证要同时设继续与停止条件。用户采用、减少处理时间是正向信号；大量校对、权限长期拿不到、错误损失无法接受，则可能需要收窄、换场景或停止。不要把每次失败都解释为再加一点模型能力就能成功。\n明确需求假设、基线流程、目标用户、成功指标、范围和前置依赖，再安排小样本验证。与同类任务比较包含核查返工的总时间，而不只比较生成速度。先用方案试验或受控试点降低不确定性，再承诺规模化交付。\n**企业客服助手的第一版。** 假设高频咨询集中在有稳定文档的产品规则，人工能核对答案，订单写操作暂不具备可靠接口：可以先做带引用的回复草稿，验证处理效率，再考虑订单操作。这是条件明确的选择，不是所有企业都应先做客服。\n\n**内部研究助手试点。** 先支持指定来源、固定比较维度和证据表，暂不承诺自主全网调查与自动发布。验证研究人员是否更快获得可用资料，而不只看报告页数。\n- **用户觉得有趣，几天后不用。** 回到真实工作时刻，检查结果是否能进入现有流程、有没有减少完整任务成本，而不是继续加聊天花样。\n- **需求池里什么都高优先级。** 要求给出频率、影响与依赖证据，区分价值假设和已知事实；没有接口的高价值任务也可能暂时不可交付。\n- **试点成功，扩展后成本失控。** 检查是否依赖少数专家手工清洗或逐次救场，把隐性人工与实施成本纳入规模化评估。\n如果让你负责一个企业 Agent 平台，第一版做什么？ “我先给出条件再做选择。假设目标客户有高频产品咨询、资料维护较好、客服能核对答案，但交易写接口不成熟，我会先做带来源的客服回复草稿，暂不直接自动退款。因为资料入口和验收清楚，也能在较小范围测效率。\n第一版选一个问题域，完成提问、检索、引用、编辑与反馈闭环。对照原流程测完整处理时间、关键事实错误和人工修改，确认是否真正有用。若主要困难其实在查询订单而非找政策，就应调整方向，补业务集成。\n我不会脱离客户条件给所有平台同一答案。首选场景要能被验证，也要有明确的扩大或停止条件。”\n什么需求值得做成 Agent，什么不值得？ “我看任务是否需要在不确定环境下根据反馈选择行动。输入、规则和步骤固定，普通自动化通常更容易验证；只是需要理解文本，可以在工作流里加模型；需要跨资料和工具探索，才值得增加 Agent 决策。\n比如固定格式报表按时发送，不必让模型重新规划；调查客户问题可能要根据日志和查询结果决定下一步，更适合限定范围的 Agent。还要看错误后果和最终结果能否核验。\n我会用最简单可行方案做基线，比较增加自主决策后的成功率、时延和人工量。技术上做得到，不等于业务上值得承担更多不确定性。”\n业务方要求第一版全覆盖，你怎么收敛并推进？ “先把要验证的核心价值讲清楚，再按用户任务拆范围，不按技术功能随意裁剪。比如客服草稿先覆盖一个产品和高频问题域，仍保留引用、编辑和失败反馈；复杂交易处理放到具备接口与验证条件后。\n我会列出数据、权限、接口和运营维护的依赖，设可验收里程碑：资料可用、核心任务达标、受控试点验证价值，再扩大。具体排期基于依赖确认，不凭一个聊天演示承诺全量上线。\n如果反对收敛，就用实施成本、错误损失和证据缺口讨论取舍。目标是先交付一个值得扩展的闭环，而不是第一版列出最多功能。”"}, {"id": "k34", "number": "34", "title": "可视化编排与人工介入：让用户在真正需要判断的地方参与", "short": "可视化编排与人工介入", "priority": "P1", "group": 5, "intro": "\u003cp>可视化编排帮助用户表达流程，人工介入帮助系统在信息、判断或授权不足时继续。两者不是加一个画布和确认框那么简单：要让人知道当前输入、候选结果、动作影响，以及修改后系统从哪里接着做。\u003c/p>\n\u003cp>人参与至少有四种目的：补充缺失条件、修正模型产物、批准具体动作、异常时接管。对应的界面和状态不同。缺负责人就提供人员选择，批准发布就展示准确内容与账号；不能用同一个“是否继续”代替所有交互。\u003c/p>\n\u003cp>\u003cstrong>确认要绑定具体对象与版本。\u003c/strong> 用户批准某篇草稿后，如果内容被改、目标账号变或对象清单增加，就要判断原确认是否仍覆盖。审批结果需要写入任务状态，恢复时从正确节点继续，不能重新执行前面的写操作。\u003c/p>\n\u003cp>业务人员使用画布时，需要理解节点输入输出，而不是暴露所有工程参数。优先提供经过验证的模板、字段选择、发布前检查和真实数据预览，再逐层开放高级能力。调试、预览与正式运行要清楚区分，避免测试触发真实操作。\u003c/p>\n\u003cp>长任务体验依赖真实状态：已受理、等待资源、正在处理、需要补充、已完成部分。可以渐进交付，但要说明覆盖范围；没有可靠估计时不伪造百分比。取消与暂停应说明影响的步骤，不让用户误以为所有已发生动作都会撤销。\u003c/p>", "decision": "\u003cp>按错误影响、可逆性和授权充分程度安排人工环节。低风险草稿不必每一步确认，高影响或缺关键事实的动作需要更强控制。衡量独立完成率、处理耗时、有效纠正与误批准，不只看确认点击率；点击很快可能是用户已经机械略过。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>内容发布流程。\u003c/strong> 模型先生成草稿，人查看完整内容、素材与发布账号，批准后执行；任何影响授权范围的变更触发重新确认。结果显示真实发布状态和链接。\u003c/p>\n\u003cp>\u003cstrong>业务流程搭建。\u003c/strong> 运营从模板选择资料、提取规则与通知对象，试运行时查看节点真实输出，修正字段映射；正式发布前检查权限与异常出口，降低第一次运行失败成本。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>确认框很多，用户照样误操作。\u003c/strong> 检查信息是否具体、风险是否分级，移除低价值重复确认，把注意力留给真正重要的动作。\u003c/li>\n\u003cli>\u003cstrong>人改了内容，Agent 又覆盖回去。\u003c/strong> 将人工修订写成当前有效状态并记录来源，下游读取新版本，不从旧模型输出恢复。\u003c/li>\n\u003cli>\u003cstrong>等待审批期间条件变了。\u003c/strong> 恢复前检查对象、权限、金额等是否仍匹配，不能把旧审批无条件延用。\u003c/li>\n\u003c/ul>", "questions": [{"id": "34.1", "title": "什么时候需要人工介入，什么时候应该直接完成？", "answer": "\u003cp>“我会按信息是否充分、影响大小、可逆性和授权范围判断。常规只读查询与低风险草稿可以直接完成；关键条件缺失时补问，内容需要业务判断时编辑或审阅，重要写操作按规则审批。\u003c/p>\n\u003cp>不是所有 AI 动作都加确认，也不是模型自信就免确认。比如发布内容需要确认具体稿件与账号，普通摘要不需要让用户批准每次检索。\u003c/p>\n\u003cp>验收看人工介入是否有效降低关键错误，以及额外耗时和完成率。如果确认很多却没有实质纠正，说明交互可能只是形式，需要重新设计风险分层。”\u003c/p>"}, {"id": "34.2", "title": "人工确认后如何安全恢复任务？", "answer": "\u003cp>“先保存待确认对象、内容版本和当前步骤，人修改或批准后把结果写入任务状态。恢复时校验这个确认仍对应当前动作，权限、价格或目标范围变化要重新判断。\u003c/p>\n\u003cp>已经完成的步骤与副作用通过回执保留，不因恢复从头重做。比如草稿改完可以从发布前检查继续，先前上传成功的素材不必重复上传，已发布状态不应再次提交。\u003c/p>\n\u003cp>测试覆盖重复点击批准、审批过期、人工修改与接口迟到返回。人工介入应该成为可恢复流程的一部分，而不是在原来自动任务外随便加一个弹窗。”\u003c/p>"}, {"id": "34.3", "title": "如何让业务人员真正用得起低代码编排？", "answer": "\u003cp>“我会从高频任务模板和清楚的数据流开始。让用户选择字段来源、查看样例输出，提前提示缺参数、类型错误与无效路径；高级设置按需要展开。\u003c/p>\n\u003cp>调试时提供节点级输入输出和可解释错误，区分测试与正式运行；外部写操作使用草稿、模拟或受控数据，避免用户一调试就产生真实业务影响。失败时能从合适节点继续。\u003c/p>\n\u003cp>衡量首次成功运行时间、独立排错能力和维护成本。业务人员要的是稳定交付工作，画布越自由不一定越好，重要的是复杂度是否与他们的任务匹配。”\u003c/p>"}], "search": "可视化编排与人工介入：让用户在真正需要判断的地方参与\n可视化编排帮助用户表达流程，人工介入帮助系统在信息、判断或授权不足时继续。两者不是加一个画布和确认框那么简单：要让人知道当前输入、候选结果、动作影响，以及修改后系统从哪里接着做。\n\n人参与至少有四种目的：补充缺失条件、修正模型产物、批准具体动作、异常时接管。对应的界面和状态不同。缺负责人就提供人员选择，批准发布就展示准确内容与账号；不能用同一个“是否继续”代替所有交互。\n\n**确认要绑定具体对象与版本。** 用户批准某篇草稿后，如果内容被改、目标账号变或对象清单增加，就要判断原确认是否仍覆盖。审批结果需要写入任务状态，恢复时从正确节点继续，不能重新执行前面的写操作。\n\n业务人员使用画布时，需要理解节点输入输出，而不是暴露所有工程参数。优先提供经过验证的模板、字段选择、发布前检查和真实数据预览，再逐层开放高级能力。调试、预览与正式运行要清楚区分，避免测试触发真实操作。\n\n长任务体验依赖真实状态：已受理、等待资源、正在处理、需要补充、已完成部分。可以渐进交付，但要说明覆盖范围；没有可靠估计时不伪造百分比。取消与暂停应说明影响的步骤，不让用户误以为所有已发生动作都会撤销。\n按错误影响、可逆性和授权充分程度安排人工环节。低风险草稿不必每一步确认，高影响或缺关键事实的动作需要更强控制。衡量独立完成率、处理耗时、有效纠正与误批准，不只看确认点击率；点击很快可能是用户已经机械略过。\n**内容发布流程。** 模型先生成草稿，人查看完整内容、素材与发布账号，批准后执行；任何影响授权范围的变更触发重新确认。结果显示真实发布状态和链接。\n\n**业务流程搭建。** 运营从模板选择资料、提取规则与通知对象，试运行时查看节点真实输出，修正字段映射；正式发布前检查权限与异常出口，降低第一次运行失败成本。\n- **确认框很多，用户照样误操作。** 检查信息是否具体、风险是否分级，移除低价值重复确认，把注意力留给真正重要的动作。\n- **人改了内容，Agent 又覆盖回去。** 将人工修订写成当前有效状态并记录来源，下游读取新版本，不从旧模型输出恢复。\n- **等待审批期间条件变了。** 恢复前检查对象、权限、金额等是否仍匹配，不能把旧审批无条件延用。\n什么时候需要人工介入，什么时候应该直接完成？ “我会按信息是否充分、影响大小、可逆性和授权范围判断。常规只读查询与低风险草稿可以直接完成；关键条件缺失时补问，内容需要业务判断时编辑或审阅，重要写操作按规则审批。\n不是所有 AI 动作都加确认，也不是模型自信就免确认。比如发布内容需要确认具体稿件与账号，普通摘要不需要让用户批准每次检索。\n验收看人工介入是否有效降低关键错误，以及额外耗时和完成率。如果确认很多却没有实质纠正，说明交互可能只是形式，需要重新设计风险分层。”\n人工确认后如何安全恢复任务？ “先保存待确认对象、内容版本和当前步骤，人修改或批准后把结果写入任务状态。恢复时校验这个确认仍对应当前动作，权限、价格或目标范围变化要重新判断。\n已经完成的步骤与副作用通过回执保留，不因恢复从头重做。比如草稿改完可以从发布前检查继续，先前上传成功的素材不必重复上传，已发布状态不应再次提交。\n测试覆盖重复点击批准、审批过期、人工修改与接口迟到返回。人工介入应该成为可恢复流程的一部分，而不是在原来自动任务外随便加一个弹窗。”\n如何让业务人员真正用得起低代码编排？ “我会从高频任务模板和清楚的数据流开始。让用户选择字段来源、查看样例输出，提前提示缺参数、类型错误与无效路径；高级设置按需要展开。\n调试时提供节点级输入输出和可解释错误，区分测试与正式运行；外部写操作使用草稿、模拟或受控数据，避免用户一调试就产生真实业务影响。失败时能从合适节点继续。\n衡量首次成功运行时间、独立排错能力和维护成本。业务人员要的是稳定交付工作，画布越自由不一定越好，重要的是复杂度是否与他们的任务匹配。”"}, {"id": "k35", "number": "35", "title": "成本收益与计费：怎样算清一个可用结果到底值不值？", "short": "成本收益与计费", "priority": "P1", "group": 5, "intro": "\u003cp>模型单价是成本的一部分，完整任务还包括解析、检索、重排、工具、存储、重试与人工审核。建设和实施是投入，日常运行是持续成本；比较方案前先明确算的是直接技术成本、包含人工的运营成本，还是完整经营成本，不能用不同口径相互比较。\u003c/p>\n\u003cp>\u003cstrong>每个成功任务成本，能暴露失败消耗。\u003c/strong> 同一批任务的相关总成本除以达到验收标准的任务数，失败消耗留在分子里。教学例子：100 个任务共花 200 元，80 个合格，成功任务成本是 2.5 元；200÷100＝2 元是提交任务平均成本，回答的是另一个问题。\u003c/p>\n\u003cp>Token 成本还应区分输入、输出、缓存以及服务定义的推理用量，按实际计量计算。更便宜模型如果带来多轮修复，未必总成本更低。成本分布也可能长尾，一小部分复杂任务耗掉大部分预算，套餐设计要考虑这种差异。\u003c/p>\n\u003cp>收益侧先测完整工作时间，包括准备、等待、校对和返工。生成十秒不代表替用户省了原来的半小时，如果核查还要很久，收益有限。节省时间可以带来产能与服务水平，但不能直接把所有分钟按工资变成实际现金节约。\u003c/p>\n\u003cp>计费是商业规则，不等于内部成本公式。资源计费透明但用户难估算，按任务计费易理解但要定义复杂度和失败规则，套餐便于预算但需控制长尾消耗。按成功结果计费还必须约定成功标准、争议与重复请求，否则“成功”很容易变成各方理解不同的词。\u003c/p>", "decision": "\u003cp>先用同类任务做人工与 AI 辅助的对照，观察正确性、总耗时与真实采用，再核算投入和收益。经营上看收入减直接交付成本后的空间，另外考虑研发、实施和持续支持，不把单位毛利等同于公司净利润。所有教学数字与假设都应明确标记。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>客服草稿助手。\u003c/strong> 测人工独立处理与使用草稿后的完整处理时间，包含查证和改写；统计错误回复与返工。试点看有效处理能力，不能只看生成了多少条。\u003c/p>\n\u003cp>\u003cstrong>企业研究套餐。\u003c/strong> 按任务范围与资料量分档，给用户费用预估和上限；内部记录模型、工具与失败成本。长任务到预算边界先说明已完成部分与继续选择，不无限自动升级模型。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>Token 降了，毛利仍下降。\u003c/strong> 查重排、外部工具、人工支持与失败损耗，确认客户使用结构是否变复杂。\u003c/li>\n\u003cli>\u003cstrong>宣称节省很多时间，业务不认可。\u003c/strong> 原口径可能没计校对和等待，或节省时间无法转化产能；重新测完整流程和实际瓶颈。\u003c/li>\n\u003cli>\u003cstrong>按成功收费引发争议。\u003c/strong> 明确任务验收、部分完成、用户取消、重复结果和平台失败规则，保留可核验回执。\u003c/li>\n\u003c/ul>", "questions": [{"id": "35.1", "title": "你怎样计算 Agent 的真实单任务成本？", "answer": "\u003cp>“先明确成本边界，再把一个任务的模型、检索、解析、工具、存储和重试关联起来；如果比较工作效率，还要纳入必要人工校对。失败任务消耗也要计算。\u003c/p>\n\u003cp>我会同时看提交任务平均成本与成功任务成本。前者适合预算与流量估算，后者更能反映交付效率。不同任务分组统计，避免简单问答掩盖复杂长任务的长尾费用。\u003c/p>\n\u003cp>然后看哪些环节有优化空间，是输入重复、工具循环还是模型选择问题。不能只因为每百万 Token 价格降低，就认定产品整体更划算。”\u003c/p>"}, {"id": "35.2", "title": "怎样证明 AI 真正提升效率，而不是把工作转移给人工？", "answer": "\u003cp>“比较同类任务完整流程，包含准备资料、等待、核对、修改和异常处理，并同时控制交付质量。AI 生成快，如果让用户花更多时间查错，总体可能没有收益。\u003c/p>\n\u003cp>我会建立原流程基线，用受控试点或合理对照看总耗时、错误、返工和吞吐。节省的时间是否变成更多处理能力或更快服务，还要结合业务瓶颈验证，不能一律按工资折现金。\u003c/p>\n\u003cp>成本侧加入技术、维护和必要实施投入。最后说明哪些任务有效、哪些仍不划算，让扩展决策基于可验证的业务价值，而不是调用量或生成速度。”\u003c/p>"}, {"id": "35.3", "title": "资源计费、任务计费和套餐，你怎么选？", "answer": "\u003cp>“我会看用户理解什么价值单位，以及任务成本是否稳定。开发者可能接受资源用量，业务用户更容易理解报告或处理任务；预算固定的企业偏好套餐，但需要清楚额度和复杂任务规则。\u003c/p>\n\u003cp>按任务收费必须定义成功、部分完成、重试和取消；成本差异大时可以按范围或复杂度分档。套餐还要观察重度客户的长尾消耗，不能用平均成本盲目定价。\u003c/p>\n\u003cp>我会在试点里记录成本与使用分布，测试用户能否预估账单，并核算可持续利润空间。计费形式可以组合，但费用规则要能解释和核对。”\u003c/p>"}], "search": "成本收益与计费：怎样算清一个可用结果到底值不值？\n模型单价是成本的一部分，完整任务还包括解析、检索、重排、工具、存储、重试与人工审核。建设和实施是投入，日常运行是持续成本；比较方案前先明确算的是直接技术成本、包含人工的运营成本，还是完整经营成本，不能用不同口径相互比较。\n\n**每个成功任务成本，能暴露失败消耗。** 同一批任务的相关总成本除以达到验收标准的任务数，失败消耗留在分子里。教学例子：100 个任务共花 200 元，80 个合格，成功任务成本是 2.5 元；200÷100＝2 元是提交任务平均成本，回答的是另一个问题。\n\nToken 成本还应区分输入、输出、缓存以及服务定义的推理用量，按实际计量计算。更便宜模型如果带来多轮修复，未必总成本更低。成本分布也可能长尾，一小部分复杂任务耗掉大部分预算，套餐设计要考虑这种差异。\n\n收益侧先测完整工作时间，包括准备、等待、校对和返工。生成十秒不代表替用户省了原来的半小时，如果核查还要很久，收益有限。节省时间可以带来产能与服务水平，但不能直接把所有分钟按工资变成实际现金节约。\n\n计费是商业规则，不等于内部成本公式。资源计费透明但用户难估算，按任务计费易理解但要定义复杂度和失败规则，套餐便于预算但需控制长尾消耗。按成功结果计费还必须约定成功标准、争议与重复请求，否则“成功”很容易变成各方理解不同的词。\n先用同类任务做人工与 AI 辅助的对照，观察正确性、总耗时与真实采用，再核算投入和收益。经营上看收入减直接交付成本后的空间，另外考虑研发、实施和持续支持，不把单位毛利等同于公司净利润。所有教学数字与假设都应明确标记。\n**客服草稿助手。** 测人工独立处理与使用草稿后的完整处理时间，包含查证和改写；统计错误回复与返工。试点看有效处理能力，不能只看生成了多少条。\n\n**企业研究套餐。** 按任务范围与资料量分档，给用户费用预估和上限；内部记录模型、工具与失败成本。长任务到预算边界先说明已完成部分与继续选择，不无限自动升级模型。\n- **Token 降了，毛利仍下降。** 查重排、外部工具、人工支持与失败损耗，确认客户使用结构是否变复杂。\n- **宣称节省很多时间，业务不认可。** 原口径可能没计校对和等待，或节省时间无法转化产能；重新测完整流程和实际瓶颈。\n- **按成功收费引发争议。** 明确任务验收、部分完成、用户取消、重复结果和平台失败规则，保留可核验回执。\n你怎样计算 Agent 的真实单任务成本？ “先明确成本边界，再把一个任务的模型、检索、解析、工具、存储和重试关联起来；如果比较工作效率，还要纳入必要人工校对。失败任务消耗也要计算。\n我会同时看提交任务平均成本与成功任务成本。前者适合预算与流量估算，后者更能反映交付效率。不同任务分组统计，避免简单问答掩盖复杂长任务的长尾费用。\n然后看哪些环节有优化空间，是输入重复、工具循环还是模型选择问题。不能只因为每百万 Token 价格降低，就认定产品整体更划算。”\n怎样证明 AI 真正提升效率，而不是把工作转移给人工？ “比较同类任务完整流程，包含准备资料、等待、核对、修改和异常处理，并同时控制交付质量。AI 生成快，如果让用户花更多时间查错，总体可能没有收益。\n我会建立原流程基线，用受控试点或合理对照看总耗时、错误、返工和吞吐。节省的时间是否变成更多处理能力或更快服务，还要结合业务瓶颈验证，不能一律按工资折现金。\n成本侧加入技术、维护和必要实施投入。最后说明哪些任务有效、哪些仍不划算，让扩展决策基于可验证的业务价值，而不是调用量或生成速度。”\n资源计费、任务计费和套餐，你怎么选？ “我会看用户理解什么价值单位，以及任务成本是否稳定。开发者可能接受资源用量，业务用户更容易理解报告或处理任务；预算固定的企业偏好套餐，但需要清楚额度和复杂任务规则。\n按任务收费必须定义成功、部分完成、重试和取消；成本差异大时可以按范围或复杂度分档。套餐还要观察重度客户的长尾消耗，不能用平均成本盲目定价。\n我会在试点里记录成本与使用分布，测试用户能否预估账单，并核算可持续利润空间。计费形式可以组合，但费用规则要能解释和核对。”"}, {"id": "k36", "number": "36", "title": "用户反馈与持续优化：怎样把抱怨变成有证据的改进？", "short": "用户反馈与持续优化", "priority": "P1", "group": 5, "intro": "\u003cp>反馈是一条观察，不是现成的根因。“不好用”可能指答案错、缺依据、太慢、格式不合适、执行失败，也可能是用户根本不需要这项能力。先关联具体任务、版本与操作现场，才能找到问题发生在哪里。\u003c/p>\n\u003cp>点赞、复制、停留和重新生成都是信号，但解释不唯一。复制可能为了继续重写，重生成可能是找更合适措辞，沉默可能是放弃。主动反馈用户也不代表全部用户，需要结合任务结果、抽样核查、访谈与使用分布判断。\u003c/p>\n\u003cp>\u003cstrong>把反馈变成可复现问题。\u003c/strong> 保留必要输入、预期与实际差异，按资料、检索、模型、工具、交互和价值分类，再验证根因。典型失败经过权限与质量处理后进入回归样本；不能每条投诉直接加一句 Prompt，否则规则会互相冲突。\u003c/p>\n\u003cp>用户修订也不是天然正确标签。有人修改语气，有人补充系统原本没有的新事实，也有人改错。若用于训练或评测，要有明确的数据使用授权、标注规则和审查，避免把偏好与事实混为一谈。是否微调是后续方案选择，不是反馈闭环的默认终点。\u003c/p>\n\u003cp>上线后继续观察同类问题是否减少，并检查是否引入退化。资料更新、用户群变化或模型升级都可能造成漂移。指标下降要先定位变化来源，再决定改资料、流程、交互或模型，不能自动触发无限训练。\u003c/p>", "decision": "\u003cp>优先处理高影响问题，再看频率、影响核心任务程度、覆盖用户与修复成本。为每次改动定义目标失败类、验证样本和观察指标，保留回退条件。闭环完成应以问题改善且无不可接受退化为准，不以工单关闭数或新增规则数为准。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>知识助手的错误反馈。\u003c/strong> 用户标记引用不支持结论，系统关联当次证据与版本；确认是旧版资料还是生成误读，再分别处理。修复后回归相邻政策问题，避免只补一条特殊答案。\u003c/p>\n\u003cp>\u003cstrong>客服助手的采用分析。\u003c/strong> 观察草稿是否被大幅修改、修改哪些字段以及最终处理结果，结合抽样访谈识别真实负担。高复制率不能替代事实核验或业务效率评价。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>投诉都关了，用户仍不满意。\u003c/strong> 看是否修了表面措辞而没解决根因，或只处理活跃反馈者，遗漏沉默用户的失败。\u003c/li>\n\u003cli>\u003cstrong>每次修复都带来新问题。\u003c/strong> 缺相邻场景回归、版本记录或范围控制；先明确目标错误类再小步发布。\u003c/li>\n\u003cli>\u003cstrong>线上质量突然下降。\u003c/strong> 检查资料分布、用户任务、模型、工具与提示词最近变化，分组比较，避免把所有漂移都归结为模型变差。\u003c/li>\n\u003c/ul>", "questions": [{"id": "36.1", "title": "你会如何建立真正有效的反馈闭环？", "answer": "\u003cp>“先让反馈关联具体任务和版本，帮助用户选择错误类型并保留必要现场。然后用链路证据定位根因，区分资料、检索、生
