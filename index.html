个数：一个是**人工介入/用户放弃率**，一个是**用户反馈里的负面信号**。demo 里最容易被忽略的，就是用户其实没那么爱用它，只是被你演示的效果唬住了。\n\n**第四步，把'翻车'沉淀成迭代。** 每次出问题我都要求记录下来，反哺到评测集和提示词里，这样系统是越用越稳的。\n\n所以我的结论是：**预判翻车不是靠'想得更周全'，而是靠一套可量化的评测 + 明确的边界兜底 + 灰度闭环的机制。** 把机制搭起来，翻车就从'事故'变成'可预期的迭代输入'。\"\n\n### 原文补充：金句与案例\n\n### 🟡 金句（背这 3 句就够了）\n1. **\"demo 是挑好样本给你看，生产环境是全量真实用户、各种刁钻输入，翻车是必然的，关键是把翻车成本控制住。\"**\n2. **\"AI 产品最重要的设计，是它的'下坡路'——失败的时候怎么优雅地退，而不是永远不出错。\"**\n3. **\"预判翻车不是靠想得更周全，是靠一套可量化的评测 + 明确边界兜底 + 灰度闭环的机制。\"**\n\n### 🔵 案例（例子一句话记住）\n> 亲子产品做\"家长零散记录自动整理成周报\"，我把\"错别字多、语气碎、随手记\"的难样本放进评测集，上线前跑同一把尺子，效果可量化、不是靠感觉。\n\n## AI 技术栈 · 01\n\n讲讲 RAG（检索增强生成）的原理，以及它相比把资料直接塞进提示词有什么优势？什么场景下你会优先用 RAG？\n\n### 回答框架\n\n**原理三环节：**\n1. **索引** → 文档切块 → Embedding 转向量 → 存进向量库。\n2. **检索** → 用户问题转向量 → 算相似度 → 捞回最相关的几段。\n3. **生成** → 把捞回的内容 + 问题拼进提示词 → 模型基于资料回答。\n\n**相比直接塞提示词的三大优势：**\n1. **解决上下文窗口限制** —— 不用全塞，按需捞。\n2. **可控可更新** —— 文档变只更新向量库，不用重新训练。\n3. **降低幻觉** —— 基于检索事实作答，还能溯源。\n\n**优先用 RAG 的场景：**\n> 知识驱动型、依赖外部资料、资料频繁更新 → 企业知识库问答、客服机器人、合同审阅、政策问答。\n> 反例：靠模型推理就够的通用知识，不一定要 RAG。\n\n### 口述参考答案\n\n\"RAG，全称叫检索增强生成。核心思路很直白：**模型回答问题之前，先从一个知识库里把相关的资料'捞'出来，再带着这些资料去生成答案。** 它分成三个环节：**索引、检索、生成**。\n\n我先说索引。我们要先把企业自己的文档切块，切成一段一段的，然后用 Embedding 模型把每段转成向量，存进向量数据库里。这一步的目的是让文字变成模型能算距离的数字。\n\n然后是检索。用户问一个问题，我们也把它转成同样的向量，跟库里的向量算相似度，把最相关的那几段内容捞出来。这就是为什么它叫'检索增强'——你是在主动把和问题相关的上下文捞进来。\n\n最后是生成。把捞出来的这几段内容，连同用户的原始问题，一起拼进提示词里喂给大模型，让模型**基于这些资料**来回答。这样一来，答案就带着知识库里的真实信息，而不是模型自己瞎编。\n\n那它相比'把资料直接塞进提示词'有什么优势？我给你讲三个最关键的点。\n\n第一是**解决上下文窗口的物理限制**。模型的上下文窗口是有限的，现在主流可能到几十万 token，但企业文档是海量的，你不可能全塞进去，塞进去也贵。RAG 是**按需捞最相关的一小部分**，这样再大的知识库都能用。\n\n第二是**可控、可更新**。文档一变，我只要更新向量库就行，不需要重新训练模型。这一点对产品迭代特别重要，企业的知识是天天变的，RAG 让知识的增删改非常轻量。\n\n第三是**降低幻觉**。因为模型是基于检索来的事实去答的，不是纯靠它自己记住的东西，所以答案的准确度更高，而且我还能溯源——告诉用户'我这个答案来自哪份文档'，这在很多 To B 场景是硬要求。\n\n不过 RAG 也有它要处理的问题，比如切块切得好不好、检索准不准，直接影响答案质量，这就是为什么会有'高级 RAG'——在检索前做 query 改写、重排，这些细节。\n\n那我什么时候**优先用 RAG**？一句话概括：**当答案是'知识驱动型'、依赖特定外部资料、且资料会频繁更新的场景**。典型比如企业知识库问答、客服机器人、合同审阅、政策问答。反过来，如果答案是靠模型推理能力就能回答的通用知识，就不一定要 RAG。所以选型逻辑还是那句话——**跟着场景走，不是跟着技术热不热走**。\"\n\n### 原文补充：金句与案例\n\n### 🟡 金句（背这 3 句）\n1. **\"RAG 的核心是：回答之前先从一个知识库把相关资料'捞'出来，再带着资料去生成。\"**\n2. **\"它解决的是上下文窗口的物理限制——文档是海量的，RAG 按需捞最相关的，知识库再大都能用。\"**\n3. **\"选型逻辑是跟着场景走，不是跟着技术热不热走。\"**\n\n### 🔵 案例（例子一句话记住）\n> 企业知识库客服：文档天天更新，我只要刷新向量库，不用重新训模型，答案还能告诉用户\"来自哪份文档\"。\n\n## AI 产品经理 · 03\n\n很多 AI 功能是\"有 AI 没 AI 都行\"的伪需求。作为产品经理，你怎么判断一个 AI 功能到底是不是真需求、值不值得做？\n\n### 回答框架\n\n1. 判断标准：AI 是否真正创造了\"原来做不到 / 原来做不好\"的新价值\n2. 三个验证维度：用户愿不愿为此多付（意愿）、是否有真实高频场景（频次）、换人/换工具是否可行（替代性）\n3. 用 MVP + 数据小成本验证，而不是靠\"技术很酷\"拍板\n4. 反例自查：如果去掉 AI 用户体验没差别，就是伪需求\n\n### 口述参考答案\n\n\"我觉得这个问题，核心是逼着产品经理想清楚一件事：**AI 到底在这里创造了什么不可替代的价值。** 如果只是把原来一个普通流程换成'套了个 AI'，用户体验没实质变化，那它就是伪需求，不值得做。\n\n我一般用三个维度来验证。\n\n**第一个，看它是不是'原来做不到或做不好的事'。** 真需求通常是 AI 把一件用户本来很痛苦、但人力很难规模化的事情给解了。比如让普通人一句话生成一份专业合同——这个没有 AI 以前根本做不到，这就是真价值。反过来，如果只是把下拉菜单换成'输入一句话'，原来的方案已经很顺，那 AI 是锦上添花，不是雪中送炭。\n\n**第二个，看用户愿不愿意为它付出成本。** 这个成本可以是钱、是时间、是切换习惯。真需求通常意味着用户愿意改变自己的既有路径去用这个功能。如果用户只是在演示的时候'哇'一下，回到日常根本不会打开，那说明这个功能是 demo 需求，不是用户需求。\n\n**第三个，看它有没有真实的高频场景。** 我会去想清楚：这个能力在什么具体场景、多久被用一次、解决了用户哪个具体动作。场景越具体、越高频，越可能是真需求；只有抽象概念、说不清使用场景的，基本是伪需求。\n\n然后落到做法上，我不会靠'技术很酷'来拍板，而是**先做一个轻量 MVP 去小成本验证**，埋点看真实使用数据，再决定要不要加大投入。我特别看重一个反例自查：**如果把 AI 拿掉，用户的体验有没有本质变化？如果没有，那这个功能就该砍掉或者重新想。**\n\n所以我的结论是：判断 AI 功能值不值得做，不看技术含量，看它是不是真的把一件'原来做不到或做不好'的事，在真实高频场景里、让用户愿意付出成本去用。抓住这三点，伪需求就藏不住了。\"\n\n## AI 技术栈 · 02\n\n讲讲大模型的上下文窗口，以及什么是\"上下文工程\"？它为什么重要？\n\n### 回答框架\n\n1. 概念：上下文窗口 = 模型单次能\"看见/处理\"的 token 上限\n2. 上下文工程的含义：围绕有限的窗口做\"信息取舍与组织\"——放什么、放多少、怎么排\n3. 重要性：窗口有限 + 信息有优劣 → 直接决定回答质量和成本\n4. 常用手段：RAG 按需捞取、摘要压缩、截断策略、提示词结构优化\n\n### 口述参考答案\n\n\"我先解释上下文窗口。它是大模型一次能同时'看见'和处理的 token 上限——你可以理解成模型的'工作记忆容量'。你给它多少输入，它处理这些输入的能力是有上限的，这个上限就是上下文窗口，比如常见的几万甚至几十万 token。超出窗口的部分，模型是看不到的。\n\n那什么是上下文工程？既然窗口是有限的，你怎么在**有限的容量里放进对回答最有用的信息**、以及怎么把这些信息组织好，让模型发挥出最好效果——这一整套取舍和设计，就叫上下文工程。说白了就是**'在窗口内做信息管理'**：放什么、放多少、按什么顺序放。\n\n它为什么重要？我给你讲三个原因。\n\n**第一，窗口有限，但信息是海量的。** 企业的知识库、超长的文档，不可能全塞进去，你必须主动决定哪些信息值得占用宝贵的窗口空间。放错了、放少了，答案质量就会掉。\n\n**第二，信息在窗口里的位置和清晰度，直接影响模型表现。** 同一段资料，怎么组织、怎么强调、放在前面还是后面，效果差别很大。比如把核心指令放前面、把用户最相关的资料放中间，通常比一股脑堆在后面更好。所以上下文工程不是玄学，是实打实影响结果的工程。\n\n**第三，它直接和成本挂钩。** token 是计费的，塞得越多越贵、响应也越慢。好的上下文工程是用**最少的 token 拿到最好的效果**，这既是技术问题也是成本问题。\n\n那常用手段有哪些？我重点讲两个。一个是**RAG**——通过检索把最相关的资料按需捞进窗口，而不是把整个知识库都塞进来；另一个是**摘要与压缩**——对长文档先做提炼再进窗口；再配合**提示词的结构化设计**和合理的截断策略。\n\n所以我的理解是：上下文工程本质是**在'有限的窗口 + 有成本'这两个约束下，做信息的精确编排**。它决定了模型能不能在合适的位置看到合适的信息，从而决定回答质量，也决定了你花多少钱、多快出结果。对大模型产品来说，这是很核心的一个工程能力。\"\n\n## AI 产品经理 · 04\n\nAgent 类产品和传统功能型产品在体验设计上最大的不同是什么？你会怎么设计，让用户愿意信任并放手交给 Agent 去执行任务？\n\n### 回答框架\n\n1. 定位差异：从\"用户操作工具\"变为\"用户委托 Agent 执行\"——控制权转移\n2. 信任是核心：透明（能看到 Agent 在做什么、为什么这么做）+ 可控（随时可干预/可撤回）\n3. 失败/不确定时的设计：确认节点、兜底降级、失败成本前置\n4. 用进度可见 + 结果预期管理，逐步建立用户信任\n\n### 口述参考答案\n\n\"我觉得最大的不同，是**用户和产品的关系变了**。传统功能型产品是'用户操作工具'——每一步用户都自己动手、自己负责；而 Agent 产品是'用户委托一个智能体去做事'，控制权从我手里交出去了。这个转变带来一个核心问题：**用户凭什么信任你、愿意放手？** 所以我认为 Agent 体验设计的灵魂，不是功能有多强，而是**信任设计**。\n\n我围绕三个关键词来展开：**透明、可控、可预期**。\n\n**第一是透明。** 用户放手的前提，是他能看到 Agent 在做什么、为什么这么做。我会把 Agent 的执行过程做成'可见的进度'——比如它在读哪个资料、查了什么、下一步要做什么，像给用户开了一扇窗，让他觉得'我看得见它，不是黑箱'。全程黑盒的 Agent，用户是不敢用的。\n\n**第二是可控。** 信任不是一次建立的，而是靠'随时能收回控制权'建立的。我会设计清楚干预节点：用户随时可以暂停、改指令、撤回某一步；尤其在高影响动作（比如付款、发邮件、改配置）前面，一定放**确认节点**，让用户过一道手。这既降低风险，也让用户觉得'权力还在我手里'，他才会慢慢放手。\n\n**第三是可预期——做好失败兜底。** Agent 一定会出错，关键是把失败的成本前置。我会想清楚：它不确定时是继续硬做，还是停下来问用户；出错之后有没有降级方案，能不能回到上一个可控状态。我会宁可让它在没把握的时候'认怂'停下来，也不让它闷头把事情搞砸。\n\n最后落到做法上，我不会一上来就让 Agent 全权接管。通常先给用户**偏'半自动'的体验**——Agent 做一版、用户确认一版，用进度可见 + 结果预期管理，让用户在一次次'我放心、它没跑偏'里积累信任，再逐步放开权限。\n\n所以我的结论是：Agent 体验设计的本质是**把控制权的转移设计得足够安全、足够透明**。用户不是被功能说服，而是被'我看得见、我控得住、它兜得住'说服，才会真正愿意把事交给它。\"\n\n## AI 技术栈 · 03\n\n讲讲大模型的\"长期记忆 / 长记忆\"机制，它是怎么实现的？产品上一般怎么用？\n\n### 回答框架\n\n1. 概念区分：上下文/短期记忆（当前对话）vs 长期记忆（跨会话的持久信息）\n2. 实现原理：不靠模型参数，靠外部存储——把关键信息结构化存下来、会话时再召回注入\n3. 常见做法：向量库检索 + 关键信息抽取/画像存储 + 会话开始时注入\n4. 产品价值与权衡：个性化体验提升 vs 隐私/数据治理、存储与召回的准确性\n\n### 口述参考答案\n\n\"我先澄清一个概念，很多人容易混淆。**短期记忆**指的是模型当前这一次对话里能记住的内容，也就是它的上下文窗口；而**长期记忆**是跨会话的——用户这次来，模型还记得上次聊了什么、他的偏好、他的历史。这个能力模型参数里是没有的，因为大模型本身没有'天生的跨会话记忆'，所以长期记忆一定得靠**产品层面用外部存储来实现**。\n\n怎么实现的？我给你讲它的原理路径。\n\n**第一步是'提取'。** 在一次对话结束后，系统会主动从这段对话里抽出值得记住的信息——比如用户的身份、偏好、说过的重要事实。这一步通常结合规则和大模型抽取来做，抽完再整理成结构化的记忆条目。\n\n**第二步是'存储'。** 把这些记忆存起来。常见两种存法：一种是**结构化存储**，比如用一张用户画像表存'这个用户喜欢什么、忌讳什么'；另一种是**向量存储**，把记忆文本转成向量存进向量库，方便后面做相似度召回。\n\n**第三步是'召回注入'。** 用户下次来的时候，系统先检索出和他当前问题相关的记忆，把它拼进提示词里，让模型'带着记忆'来回答。这其实就是把长期记忆当成了一个'会随着对话增长的动态资料库'，和 RAG 的按需检索思路是相通的。\n\n那产品上怎么用、值在哪？它的价值很直观——**把冷冰冰的交互变成有连续性的体验**：AI 记得你上次聊到哪、记得你的偏好，用户会明显觉得'它懂我'，这对留存和个性化体验是实打实的提升。比如一个陪伴型或学习型产品，记住用户的进度和风格，体验会完全不同。\n\n但它也有必须权衡的地方，我重点提两个。一个是**准确性**——记忆提取错、或者召回了不相关的记忆，反而会误导模型，所以记忆的写入和召回都要有质量控制，甚至要给用户'查看和删除记忆'的入口。另一个是**隐私和数据治理**——长期记忆本质是存了用户的大量个人信息，这涉及到合规、存储安全、用户授权，产品上必须给用户可见的控制权。\n\n所以我的理解是：长期记忆是**把模型'记不住'这件事，用'外部存储 + 提取 + 召回注入'这套机制在产品层面补上**。它能让产品更有连续性，但前提是把准确性和隐私这两件事先管好，否则记忆越多，风险越大。\"\n\n## AI 产品经理 · 05\n\n你的 AI 功能上线了、用户反馈和效果都不错，但公司要求你把它做成能持续赚钱的业务。你会怎么设计它的商业化路径？\n\n### 回答框架\n\n1. 先想清楚价值锚点：AI 到底为用户省了什么 / 创造了什么，谁能为此付费\n2. 商业模式选择：订阅 / 按量计费 / 按结果付费 / 增值分层——依据使用特征与价值边界\n3. 成本结构是关键：token/算力成本与定价挂钩，避免\"卖得越多亏得越多\"\n4. 从付费意愿最高的场景切入，用 MVP 验证后分层扩展\n\n### 口述参考答案\n\n\"商业化这件事，我的第一步不是急着定价，而是先想清楚一个本质问题：**这个 AI 功能到底替用户省了什么、创造了什么，以及谁是那个最愿意为此付钱的人。** 商业化能不能成，九成取决于价值锚点找得准不准，而不是定价技巧。\n\n定了锚点之后，我再选商业模式。我一般会对着这个功能的使用特征去选，而不是拍脑袋：\n\n**第一类是订阅制。** 适合那种高频、持续被使用、用户离不了的功能——按月度或年度收费，逻辑像'它是我日常工具的一部分'。\n\n**第二类是按量/按 token 计费。** 适合使用量差异很大的场景，比如用户偶尔才用一次、但每次消耗资源明显不同。按量收费的好处是**成本和收入同频**，用户用多少付多少，公司不会因为有人大量滥用而亏。\n\n**第三类是按结果付费。** 当 AI 帮用户完成的是有明确价值结果的事（比如自动生成了能用的物料、完成了分析），可以按'产出结果'收费，客单价高、价值感强。\n\n第四类是**增值分层**——基础能力免费用来获客和培养习惯，高级能力（更强的模型、更大容量、更多次数）放付费层。这是最常见的'免费 + 增值'打法。\n\n但我要特别强调一个 AI 商业化的坑：**成本结构。** AI 产品有实打实的 token 和算力成本，这和传统软件不一样——传统软件边际成本趋近于零，AI 产品卖得越多、成本越高。所以我做定价时**一定会把单位成本算进去**，确保价格和成本之间有合理毛利，避免出现'用户越多亏得越多'。必要的时候，我会用缓存、更便宜的模型、优化提示词来压低单位成本。\n\n最后是落地方案。我不会一上来就全量收费，而是**先锁定付费意愿最强的那批用户和场景**——通常是那些用这个功能省了大量人力或产生直接收益的人，做一个小范围付费验证，跑通了再根据数据做分层和扩展。这样既验证了付费假设，又把商业化风险控制在最小。\n\n所以我的结论是：AI 商业化成功的关键，是把**价值锚点、商业模式、成本结构**三者对齐——锚点决定了谁会付钱，模式决定怎么收，成本决定了能不能持续赚。抓住这三环，商业化就不是拍脑袋定个价，而是一套能跑起来的生意模型。\"\n\n## AI 技术栈 · 04\n\n讲讲大模型的微调（Fine-tuning）。什么场景需要微调、什么场景不需要？微调一般有哪几种方式？\n\n### 回答框架\n\n1. 微调含义：用特定数据继续训练已预训练模型，让它适配特定任务/领域/风格\n2. 不需要微调的场景：现成能力已够 / 靠提示词、RAG、上下文注入即可解决\n3. 需要微调的判断依据：格式/风格强约束、专有知识高频稳定、模型自身能力不足\n4. 主要方式：全参数微调 vs PEFT（LoRA 等参数高效微调）；结合上下文用\"先提示词→再RAG→最后微调\"的顺序\n\n### 口述参考答案\n\n\"微调，简单说就是**在已经预训练好的大模型基础上，用我们自己的数据再继续训练一下**，让模型更适配某一个特定任务、某个领域，或者某一种输出风格。它不是为了把模型从零教一遍，而是让通用模型'变得更懂我们这块的业务'。\n\n我先讲**什么时候不需要微调**，因为这恰恰是很多人容易一上来就微调、其实不必要的误区。\n\n第一种，**现成能力已经够用的场景**——比如只是要'把口语整理成要点'这种通用能力，市面模型本来就做得很好，完全不需要微调，直接调接口用就行。\n\n第二种，**靠提示词或上下文注入就能解决的**——你只要把规则、范例写在提示词里，或者用 RAG 把相关资料捞进来，模型就能答得很好。这种情况先别动微调，因为微调又贵又慢，先用低成本手段拿到结果再说。\n\n那什么场景**真的需要微调**？我总结三个判断点。\n\n**第一，输出有强格式或强风格约束。** 比如你要模型稳定输出某种特定格式、特定语气（像合同条款、特定口径的客服话术），提示词约束不住，微调能让它更'稳定地长成你想要的样子'。\n\n**第二，有高频稳定的专有知识。** 如果这个领域的知识和规律是稳定、长期、高频率要用的，微调可以把这部分'固化'进模型，比每次靠 RAG 检索更稳、更快。但如果知识是天天变的，那更适合 RAG 而不是微调。\n\n**第三，模型本身能力不足。** 通用模型在这个任务上能力明显不够，再怎么提示也没用，这时候微调是必要的补强。\n\n最后讲微调的方式，主要分两大类。一类是**全参数微调**，把所有参数都训一遍，效果好但成本高、慢、容易过拟合；另一类是**参数高效微调（PEFT）**，最典型的就是 **LoRA**——只训练一小部分新增的低秩参数，冻结原模型。LoRA 成本低、速度快、还能多个任务分别存一个小插件互不干扰，现在业界用它用得最多。\n\n所以我的理解是，微调的决策有个**性价比的顺序**：先看提示词能不能解决 → 再看 RAG 能不能解决 → 都不行了，再上微调。微调里优先选 LoRA 这类高效方式。**能用便宜手段解决的，绝不轻易动用微调这个重武器。**\n\n## AI 产品经理 · 06\n\n面对同一个 AI 需求，你怎么决定用闭源大模型 API、开源模型自建、还是直接用市面上现成的 AI 能力？判断依据是什么？\n\n### 回答框架\n\n1. 先看现成能力：市场上有没有已封装好、满足 80% 需求的成熟 AI 能力（API/现成产品）\n2. 再看数据与差异：是否涉及敏感数据、是否依赖专有知识、是否构成核心差异化\n3. 比较成本结构：研发成本、算力成本、长期维护 vs 调用成本，算清\"自建 vs 购买\"的经济账\n4. 结论顺序：能用现成先用现成 → 需要定制再看开源/闭源 → 核心壁垒才自建\n\n### 口述参考答案\n\n\"这个问题本质是在问**资源怎么分配、钱花在刀刃上**。我不会一上来就'我要选个大模型'，而是倒着问：这个需求，市场上是不是已经有现成答案了。\n\n所以我的判断路径是**从'现成'往'自建'逐层判断**。\n\n**第一层，先看现成的 AI 能力够不够。** 现在市面上有大量封装好的能力——调一个成熟 API、用一个成熟 AI 产品就能覆盖大部分需求。如果现成的能解决七八成，我通常先接现成的，把产品先跑起来、把用户价值先验证出来。**没必要为所有需求都去造轮子。**\n\n**第二层，再看这个需求是否碰了'必须自己掌控'的红线。** 我重点看两个：一个是**数据**——如果涉及敏感数据、合规要求不允许把数据送出去，那闭源 API 可能就不可用，得往自建方向走；另一个是**专有知识/核心差异化**——如果这个能力是产品的核心卖点、靠通用模型做不出差别，那光调 API 是不够的，需要自己在上面做定制。\n\n**第三层，算成本账，这是最实在的。** 我会把两边都算清楚：**自建的账**是研发成本、算力/硬件成本、以及长期维护的人力；**调用的账**是 token/API 的持续成本、以及受制于第三方的风险。然后看一个关键问题——**这个需求的调用量有多大、自建带来的边际收益撑不撑得起这笔投入**。调用量小、通用能力就够，肯定买现成的；调用量极大、自建能显著降本或显著提升效果，才值得投。\n\n**第四层，落到选型结论。** 我习惯的顺序是：**能用现成先用现成 → 需要一定定制再看开源模型（自己可以微调、可控）→ 只有涉及敏感数据、核心壁垒、长期降本，才考虑自建甚至自训。** 闭源和开源的取舍里，我也会权衡'效果天花板'和'可控性'——闭源往往效果更好上手更快，开源可控性强、但需要更多工程投入。\n\n所以我的结论是：模型选型不是选'哪个模型更厉害'，而是**把'现成能力、数据合规、核心差异化、成本账'四件事算清楚**，然后用'现成优先、自建兜底'的顺序来决策。产品经理的价值，就在于把这个账算明白，而不是被技术名词带着走。\"\n\n## AI 技术栈 · 05\n\n讲讲 Agent 的基本架构，它和\"单次调用一次大模型\"有什么本质不同？\n\n### 回答框架\n\n1. 单次调用 vs Agent：一次问答 vs 一个\"能自主规划-执行-反思-迭代\"的循环\n2. Agent 四要素：大模型（大脑）、工具（手脚）、记忆、规划/反思\n3. 运行循环：拆解目标 → 调用工具/检索 → 观察结果 → 反思调整 → 直到完成\n4. 关键工程点：多轮控制、工具调用可靠性、记忆管理、安全与失败兜底\n\n### 口述参考答案\n\n\"我先讲清一个最本质的区别：**单次调用，是模型答一次问题；Agent，是一个能自己做事的循环。** 普通调用是你问一句、它回一句就结束了；而 Agent 是你给它一个目标，它自己去**拆解 → 执行 → 看结果 → 调整 → 再做**，一直到把这个目标完成。它不再是'回答'，而是'干活'。\n\n那它靠什么能干这种活？我讲四个核心部件，这是 Agent 的基本架构。\n\n**第一个，大模型——它是'大脑'，负责理解和决策。** 所有思考、判断、决定下一步做什么，都靠它。\n\n**第二个，工具（Tools）——它是'手脚'。** 这是关键。Agent 能调用外部能力：比如能去调一个 API、能去搜网页、能去操作某个系统、能去写文件。正是因为它能调用工具，它才能真的'做'事，而不是只会说。\n\n**第三个，记忆。** 它需要记住当前任务做到哪一步了、中间得到了什么结果，甚至调用长期记忆记住过往上下文，才能不跑偏、持续往下走。\n\n**第四个，规划和反思。** 它要把一个大目标拆成一步步的小行动，每做完一步观察结果、判断对不对，不对就调整方向。这个'规划—执行—反思'的能力，是 Agent 区别于简单调用的核心。\n\n那它具体怎么运转？我概括成一个循环：**用户给目标 → 大模型把它拆成步骤 → 调用对应的工具去执行 → 拿到结果后判断'够了吗' → 不够就继续下一步 → 够了就把结果整理交付。** 整个过程可能要好几个来回，不是一步到位。\n\n最后我讲几个 Agent 落地的关键工程点，这也是面试里会被追问的：\n\n一个是**多轮和工具调用的可靠性**——工具参数传错、调用失败是常态，必须做好容错和重试，不然很容易'死循环'。另一个是**记忆管理**——上下文是有限的，怎么做摘要、怎么保留关键状态，直接决定 Agent 长任务会不会'忘了前面'。还有一个是**安全与兜底**——Agent 拥有调用外部工具的权限，意味着它有'产生真实影响'的能力，所以权限控制、高影响动作的确认、以及失败时的降级路径，是必须设计的。\n\n所以我的理解是：Agent 的本质是**把'大模型 + 工具 + 记忆 + 规划反思'组合成一个能自主循环做事的系统**，和单次调用的差别，是它从'回答者'变成了'执行者'。这既是它的价值所在，也是它工程复杂度、安全风险都大幅上升的原因。\"\n\n## AI 产品经理 · 07\n\nAI 产品的最终效果，很大程度上取决于算法和工程能不能落地。作为产品经理，你会怎么和算法、工程高效协作，把一个 AI 需求真正做好？\n\n### 回答框架\n\n1. 协作前提：把需求翻译成\"算法/工程能执行的问题\"——定目标、定边界、定评测标准\n2. 明确分工与节奏：算法负责效果、工程负责稳定、PM 负责定义\"好\"并验收\n3. 用统一评测集对齐三方，避免\"我说好、算法说行\"的扯皮\n4. 建立数据反馈闭环，让协作是迭代的而不是一次性交付\n\n### 口述参考答案\n\n\"AI 产品最难的协作点在于：**它的'需求'不像传统功能那么明确，是个模糊的、要不断逼近的目标。** 传统功能你说'做一个按钮，点了就保存'，工程师闭眼能实现；AI 需求你说'让助手更智能地回答用户问题'，算法和工程根本没法直接开工。所以我觉得协作的核心，是**先把模糊的需求翻译成算法和工程能执行、能验收的东西**。\n\n我分四步讲。\n\n**第一步，定目标、定边界、定评测——这是最关键的。** 我不会只丢一句'效果要好'，而是明确三件事：这个功能的**成功标准**是什么、它能处理的**边界**在哪（哪些情况必须兜底）、以及**用什么指标来量**。比如一个客服场景，我会和算法对齐'意图识别准确率要到多少、不能识别的时候怎么降级'。目标定清楚了，三方才不会各说各话。\n\n**第二步，明确各自的分工和责任。** 我会和团队说清楚：**算法负责把效果做上去，工程负责把稳定性和成本做好，而产品经理负责定义'什么叫好'、并负责最终验收。** 这样权责清晰，不会出现'效果不行是算法问题还是产品问题'的互相甩锅。\n\n**第三步，用一个统一的评测集把三方对齐。** 这是我最看重的动作。我会和算法共建一套覆盖典型场景 + 边界 + 反例的评测集，**上线前后、每次改动都用同一把尺子量**。这样我跟算法讨论'这次效果有没有变好'，不是凭感觉，而是看评测集上的数字。评测集就是我们三方的'共同语言'，能避免大量无效拉扯。\n\n**第四步，建立数据反馈闭环。** 我不把协作当成'我提需求、你交付'的一次性买卖，而是让真实用户数据回流——上线后埋点、收集失败案例、定期复盘，把发现的问题反哺到评测集和迭代里。这样协作是持续滚动的，产品才会越做越好。\n\n所以我的结论是：和算法、工程协作，产品经理最大的职责不是催进度，而是**把模糊的 AI 需求翻译成'有目标、有边界、有评测标准'的清晰问题，并建立数据闭环**。协作顺畅的本质，是我们有共同的目标和同一把尺子。\"\n\n## AI 技术栈 · 06\n\n讲讲 token 是什么、token 计费大概怎么算，以及为什么优化 token 消耗很重要？有哪些常见优化手段？\n\n### 回答框架\n\n1. token 概念：模型处理文本的最小单位（约等于\"半个词/一段字\"），输入输出都计费\n2. 计费逻辑：输入 token + 输出 token，通常按量计费、量大可谈价格\n3. 为什么重要：直接决定成本、也影响延迟和体验；AI 产品是\"卖得越多成本越高\"\n4. 优化手段：提示词精简、缓存复用、选更小/更快模型、RAG 按需注入、控制输出长度、批处理\n\n### 口述参考答案\n\n\"我先讲 token 是什么。**token 是模型处理文本的最小单位**——它不是按'字'也不是按'词'，而是模型自己切分出来的最小片段，中文里一个 token 大概对应不到一个字或一两个字。你发给模型的提示词、以及模型回复的内容，都会被切成一串 token 来处理。**模型每次回答，输入和输出都会消耗 token，也都按 token 计费。**\n\n计费逻辑其实很直白：**总费用 = 输入 token 数 × 单价 + 输出 token 数 × 单价**，按量收费。通常输出 token 的单价还会比输入贵一些。对用量大的企业，可以谈包量或更优惠的价格，但单位成本这个逻辑是固定的。\n\n那为什么优化 token 消耗很重要？我讲三点，它不只是一个省钱问题。\n\n**第一，它直接决定成本，而且 AI 产品和传统软件不一样。** 传统软件边际成本趋近于零，而 AI 产品**每次调用都花钱，用的人越多、成本越高**。如果不控 token，很可能出现'产品火了、成本跟着爆了'、卖得越多亏得越多的情况。所以 token 优化是 AI 产品能不能持续盈利的关键。\n\n**第二，它影响延迟和体验。** token 是逐字生成的，输出越长，用户等得越久。控 token 不只是省钱，也是让响应更快、体验更顺。\n\n**第三，它间接影响质量。** 垃圾输入多、上下文塞得太满，模型反而容易抓不住重点、答偏。所以优化 token 往往和提升效果是一回事。\n\n那常见的优化手段有哪些？我按从轻到重讲几个。\n\n**第一个，提示词精简。** 把不必要的废话、重复指令删掉，用最少的字说清楚需求，这是最基础也最立竿见影的。\n\n**第二个，缓存复用。** 用户的常见问题、固定的系统指令，很多是重复的。命中缓存就可以大幅省掉输入 token 的重复开销，对高频场景效果很明显。\n\n**第三个，选更小、更快的模型。** 同一个任务，如果轻量模型效果已经够用，就不用每次都用最强的大模型——这是从模型层面降本。\n\n**第四个，RAG 按需注入。** 不要一股脑把整份长文档塞进上下文，而是只把和问题相关的片段捞进来，既省 token 又提升准确度。\n\n**第五个，控制输出长度并做结构化。** 在提示词里明确限制回复长度、要求直接给要点，避免模型啰嗦输出一堆无效 token。\n\n所以我的理解是：**token 优化本质是在'成本、延迟、质量'三者之间找平衡**，它不是纯粹的抠成本，而是 AI 产品能不能健康运转的工程基本功。产品和技术在这里要一起使劲，把每一分 token 都花在刀刃上。\"\n\n## AI 产品经理 · 08\n\n多模态 AI 产品（同时处理文字、图片、语音）和纯文本产品相比，在体验设计上会新增哪些难点？你会怎么设计？\n\n### 回答框架\n\n1. 多模态的体验优势与难点并存：信息更丰富，但\"理解不一致\"和\"边界模糊\"被放大\n2. 难点一：模态间信息对齐——同一对象在不同模态里要一致（图与文互证）\n3. 难点二：交互与反馈的设计——用户怎么输入、系统怎么呈现，多模态通道怎么配合\n4. 难点三：能力边界与错误兜底——某个模态识别错了，怎么提示、怎么降级\n5. 设计原则：以\"用户意图\"为中心选择模态，不为了炫技堆模态\n\n### 口述参考答案\n\n\"多模态产品的核心诱惑是'信息更丰富'——用户能拍照、能说话、能传文件，AI 能同时理解这些。但我要说，它给体验设计带来的难度也更大，我总结三个最难的点。\n\n**第一个难点，模态之间的信息对齐。** 这是多模态最容易翻车的地方。比如用户上传一张图并问'帮我看看这个',AI 不仅要理解图，还要把图里的信息和文字指令对上。如果图理解对了、但和文字对不上，或者图里的关键细节认错了，用户的信任立刻崩掉。所以我会特别在意**图、文、语音之间的一致性和互证**——产品要能'看'得对，也要能告诉用户'我基于图里的哪部分信息'，而不是各模态各说各话。\n\n**第二个难点，交互和反馈的设计。** 多模态意味着用户的输入方式变多了、系统的呈现方式也变多了。我会想清楚：什么时候引导用户用拍照、什么时候用语音、什么时候打字；反过来，AI 的回答什么时候用文字、什么时候用图、什么时候用语音播报。原则是**跟着场景和用户意图走**——比如用户在路上，适合语音；用户在仔细核对信息，适合图文对照。不是为了'什么都能'就把所有通道堆上去，那只会让用户不知道该怎么用。\n\n**第三个难点，能力边界和错误兜底。** 每个模态识别的准确率都不一样，图片识别错、语音听岔是常态。所以我会为每个模态都设计**明确的能力边界和降级路径**：比如语音没听清，要友好地让用户再说一遍，而不是硬着头皮答；图片里没有用户要找的信息，要明确告知'我在这张图里没找到'，而不是编造。多模态的错误更容易'看着很像真的'，所以'认怂'和溯源比纯文本更重要。\n\n最后我讲一个贯穿的原则：**多模态的价值是'更贴近用户的真实表达'，不是'功能越多越好'。** 我设计时会先问：这个场景里，加上某个模态到底有没有让用户更容易、更准地表达和获取信息？如果没有，就不加。堆模态只会增加理解成本，反而把好产品做成负担。\n\n所以我的结论是：多模态产品设计的难点，集中在**模态对齐、交互编排、边界兜底**三件事上。而设计的原则是**以用户意图为中心**——让合适的模态在合适的场景出现，而不是让所有模态都出现。\"\n\n## AI 技术栈 · 07\n\n讲讲 Embedding（向量嵌入）和向量检索的原理，为什么说它是很多 AI 应用的基础？\n\n### 回答框架\n\n1. Embedding 概念：把文本/图片等转成\"一串数字（向量）\"，让语义变成可计算的距离\n2. 核心价值：语义相近的内容向量也相近——\"理解\"被转化为\"数学距离\"\n3. 向量检索原理：把查询转成向量 → 和库里向量算相似度（余弦等）→ 召回最相近的 topK\n4. 典型应用：RAG、语义搜索、去重、推荐、聚类\n5. 工程要点：切块、索引方式（ANN 近似最近邻）、召回质量（重排）\n\n### 口述参考答案\n\n\"Embedding，中文叫向量嵌入，它的核心思想是把**文字、图片这些非结构化的内容，转成一大串数字，也就是一个向量**。为什么这么干？因为模型没法直接'理解'文字，但它能算数字之间的距离。所以 Embedding 的本质是：**把'语义'转化成'可以计算的数学距离'。**\n\n它的关键特性是：**语义相近的内容，它们的向量也相近。** 比如'猫'和'猫咪'这两个词，转成向量后距离很近；而'猫'和'汽车'距离就远。这样一来，'理解语义'这件事，就变成了'计算向量距离'这件事。这就是它成为很多 AI 应用地基的原因。\n\n那向量检索就顺理成章了。它的原理分三步：\n\n**第一步，索引。** 我们把一个知识库里的内容（比如文档切块后的段落）分别转成向量，全部存进一个向量数据库，建好索引，方便快速查询。\n\n**第二步，查询。** 用户来一个问题，我们把这个查询也转成一个向量。\n\n**第三步，召回。** 用这个查询向量，去和库里所有向量算相似度——最常用的是**余弦相似度**，就是算两个向量方向有多接近——然后把相似度最高的那几段内容**召回**出来，也就是 topK。这召回结果可以喂给大模型，也可以直接返回给用户做语义搜索。\n\n它的典型应用我列几个：**RAG**——从知识库召回相关资料再让模型生成；**语义搜索**——不是靠关键词硬匹配，而是靠语义相似来找，用户换个说法也能搜到；还有**去重、推荐、聚类**——相似内容聚到一起、推给用户相似的东西，都用的是向量距离。\n\n最后我讲几个工程上要注意的点，这也是容易被追问的。一个是**切块质量**——文档怎么切、切多大，直接影响召回效果；一个是**索引方式**——库里向量可能几百万条，全量硬算太慢，所以要用 **ANN（近似最近邻）** 这类算法做快速近似检索，在速度和准确之间取平衡；还有一个是**重排（rerank）**——粗召回可能不够精准，常见做法是先快速召回一大批，再用更精细的模型重排、挑出最准的几条。这些细节，决定了向量检索到底好不好用。\n\n所以我的理解是：**Embedding 把语义变成了数学，向量检索让'按语义找'成为可能**。它是 RAG、语义搜索、个性化推荐这些 AI 能力共同的地基，理解了它，就理解了为什么 AI 产品能做到'懂你想要的'。\"\n\n## AI 产品经理 · 09\n\n你负责一个 AI 功能，怎么给它搭建一套评测体系，判断它上线后到底好不好、有没有退化？请讲讲你的思路。\n\n### 回答框架\n\n1. 评测本质：把\"效果好不好\"从主观感受变成可量化、可复现的指标\n2. 三层评测：效果层（正确率/召回）、体验层（可用率/放弃率）、业务层（转化/留存/成本）\n3. 评测集设计：典型场景 + 边界反例，上线前后用同一把尺子\n4. 退化监控：上线后持续采样回归，关注真实数据与评测集的一致性\n5. 主观+客观结合：离线指标与用户真实反馈互为补充\n\n### 口述参考答案\n\n\"我理解评测体系的核心目的，是把'这个功能到底好不好'从一个主观感觉，变成**可量化、可复现、可对比**的东西。不然团队没法判断每次改动是变好了还是变坏了，也没法和别人对齐。我一般分三层来做。\n\n**第一层，效果层——模型本身做得好不好。** 这是最基础的，我用准确率、召回率这类指标来衡量，比如意图识别对不对、答案准不准。这一层我依赖一套**评测集**——我会特意覆盖三种样本：典型场景、边界情况、以及容易出错的难样本（反例）。评测集一旦建好，**上线前后、每次改动都用同一把尺子量**，这样才能客观判断'这版有没有比上一版好'。\n\n**第二层，体验层——用户用起来顺不顺。** 光效果指标好看不够，用户可能还是不用。我会看**可用率、放弃率、人工介入率**这类指标。比如一个 AI 助手，如果用户经常问完就放弃、或者总需要转人工，那说明体验层出了问题——哪怕单条回答看着挺准。这一层衡量的是'它是不是真正接住了用户'。\n\n**第三层，业务层——它有没有带来真实价值。** 这是最顶层，落到转化率、留存、活跃、单位成本上。一个 AI 功能做出来，最终要看它有没有帮业务指标变好。如果效果层和体验层都不错，但业务层没变化，那说明可能是个伪需求或者场景找错了。\n\n**再说上线后的退化监控。** 这是 AI 产品很容易忽略的——模型是不断更新的，第三方模型升级、我们自己的数据变化，都可能让效果悄悄退化。所以我会**持续采样真实用户请求，定期拿到评测集上去回归**，同时监控线上真实指标，一旦发现'评测集上挺好、线上却变差'，就说明评测集和真实分布脱节了，要回去补样本。这个'评测—监控—补样本'的循环要保持跑起来。\n\n最后我强调一个原则：**客观指标和主观反馈要结合。** 评测集和指标解决'可量化'，但用户真实的抱怨、好评，往往能发现指标看不出来的问题。我会把线上负面反馈、用户访谈也纳入评估，形成闭环。\n\n所以我的结论是：一套完整的评测体系，是**效果层 + 体验层 + 业务层三层指标、配合上线前后的统一评测集、以及持续的退化监控**构成的。它不是上线前的一次性验收，而是要一直运转的质量机制。\"\n\n## AI 技术栈 · 08\n\n怎么评估一个大模型的好坏？有哪些常用的评估指标和方法？\n\n### 回答框架\n\n1. 评估本质：不同任务有不同标尺，先明确\"在评什么能力\"\n2. 客观指标：通用任务（准确率/F1）、生成任务（BLEU/ROUGE）、检索（召回率/命中率）\n3. 通用能力基准：公开 Benchmark（如 MMLU、GSM8K、HumanEval）\n4. 主观/人类评估：人工打分、成对比较、A/B 测试，用 LLM 辅助打分\n5. 产品视角：结合具体场景的评测集 + 成本 + 延迟综合判断\n\n### 口述参考答案\n\n\"评估模型好坏，第一步要先想清楚一个事：**模型没有绝对的好坏，只有'在某个任务上好不好'。** 同样是模型，让它做选择题、写代码、答开放题，评价的标尺完全不一样。所以我评估时，先明确'我要评的是它的什么能力'。\n\n然后我分几类讲常用的方法。\n\n**第一类，客观指标——适合有标准答案的任务。** 比如分类、识别这类任务，我可以用**准确率、F1** 这些指标；如果是生成类任务，比生成的文字和标准答案的接近程度，常用 **BLEU、ROUGE** 这类指标。这一类的优点是客观可复现，缺点是机械，不一定反映真实质量。\n\n**第二类，公开基准测试（Benchmark）——评估通用能力。** 业界有标准化的测试集，比如 **MMLU** 测多学科知识、**GSM8K** 测数学推理、**HumanEval** 测写代码。用这些基准跑一遍，就能横向比较不同模型在通用能力上的高低。好处是可比性强、业内认可，但也可能'刷题'——模型专门针对这些基准训练过，分数会虚高。\n\n**第三类，人类评估——评估质量最真实的办法。** 很多生成任务没有标准答案，只能靠人来判断。常见做法是**人工打分**（给回答打分评等级）、**成对比较**（两个模型同一问题，人挑哪个更好）、以及产品里常用的 **A/B 测试**（真实用户分流，看哪个效果更好）。缺点是人评贵、慢，但最贴近真实使用。\n\n**第四类，用 LLM 当裁判（LLM-as-judge）。** 现在很常用——让另一个强大的模型来给回答打分，或者做排序。成本低、速度快，能规模化评估；但要注意它也有偏见，所以一般先验证'AI 裁判'和人评结果的一致性，一致了才敢大规模用。\n\n最后我从产品视角补充一点：选模型不能只看'分高'。**我会结合具体业务场景的评测集 + 成本 + 延迟**综合判断——一个模型在通用基准上分很高，但在我们特定业务上可能不实用；分差不多时，选成本更低、响应更快的那个更划算。所以评估的最终落点，是**在真实场景里看它能不能又好、又稳、又省地完成我们的任务。**\n\n所以我的理解是：模型评估是**'通用基准 + 客观指标 + 人工/AI 评估'的组合**，加上产品层面的成本与延迟权衡。它不是找一把万能尺子，而是针对任务选对尺子，再落到真实业务里验证。\"\n\n## AI 产品经理 · 10\n\n有些 AI 产品经理觉得\"提示词是算法、工程的事\"。你怎么看？你会怎么管理和优化自己产品的提示词？\n\n### 回答框架\n\n1. 表态：提示词是 AI 产品体验的一部分，PM 必须深度参与，不能甩给技术\n2. PM 管什么：把\"用户要什么、什么算好\"翻译成提示词的约束和目标\n3. 管理方式：提示词版本化、模板化、AB 测试，形成可复用的资产\n4. 优化节奏：基于失败案例反哺提示词，与评测集联动\n5. 边界：真正复杂的提示词交给算法，PM 负责定义\"好\"和验收\n\n### 口述参考答案\n\n\"我的看法很明确：**提示词不是纯技术的事，它是 AI 产品体验的一部分，产品经理必须深度参与。** 因为在传统产品里，界面文案、交互逻辑是产品经理设计的；在 AI 产品里，提示词就承担了类似'界面文案 + 交互逻辑'的角色——它决定了 AI 以什么姿态、按什么逻辑去响应用户。如果 PM 完全甩给算法，等于把产品最重要的体验设计权交出去了。\n\n那产品经理具体管什么？我觉得不是去跟算法比拼谁的提示词写得刁钻，而是管三件事。\n\n**第一，把'用户要什么、什么算好'翻译进提示词。** 提示词里写清楚任务目标、输出格式、约束边界——这些正是产品经理最该定义的。比如一个客服助手，我会明确'语气要礼貌、不确定时引导转人工、不要编造'，这些业务口径必须由 PM 定，算法只是帮我把它落到提示词里。\n\n**第二，把提示词当成产品资产来管理。** 我不会让提示词散落在个人电脑里，而是做**版本化、模板化**——每个场景一套模板，谁改了什么、为什么改，都留痕。因为提示词是不断迭代的，没有版本管理，出问题根本没法回溯。管理好了，它就是产品可持续复用的资产。\n\n**第三，用数据和评测驱动优化。** 我会把线上用户的失败案例收集起来，反哺到提示词——哪个问题它答错了、是没理解还是口径错了，针对性调整提示词；同时和评测集联动，每次改提示词都用同一把尺子验证效果有没有真变好。提示词的优化不是拍脑袋改两句，而是**案例驱动的持续迭代**。\n\n最后我讲一个边界：并不是所有提示词都要 PM 自己写。**真正复杂的、依赖工程技巧的提示词，我会交给算法，但'好与不好'的验收标准由我来定。** PM 的价值是定义方向、管理资产、拿数据驱动迭代，而不是跟技术抢写法。\n\n所以我的结论是：AI 产品经理不一定要会写最牛的提示词，但**必须懂提示词、管好提示词**——把它当成产品体验的一部分去设计、版本化、数据化迭代。谁掌握了提示词，谁就掌握了 AI 产品体验的主动权。\"\n\n## AI 技术栈 · 09\n\n讲讲大模型的\"幻觉\"问题——它为什么会产生？产品上一般怎么缓解？\n\n### 回答框架\n\n1. 幻觉定义：模型生成看似合理、实际错误或编造的内容（\"一本正经地胡说八道\"）\n2. 产生原因：本质是\"预测下一个词\"，不保证事实；知识过时/缺失、训练记忆偏差、被诱导、缺少检索支撑\n3. 缓解手段：RAG 检索事实支撑、要求溯源、提示词约束\"不确定就承认\"、降低温度、增强评测\n4. 产品化兜底：高风险场景人工审核、能力边界提示、给用户\"认怂\"出口\n\n### 口述参考答案\n\n\"我先定义一下什么是幻觉。**幻觉是指模型生成了一段看起来合理、语法通顺、甚至很有说服力，但实际上是错误或者编造的内容**——就是俗称的'一本正经地胡说八道'。它特别危险，因为它不是明显的错误，用户很容易信以为真。\n\n那它为什么会发生？我要从模型的原理说起。大模型本质是在做一件事——**'预测下一个词'**：根据前面的内容，生成一个概率上最合理的词。它追求的是'像人说话'，不是'说真话'。所以只要一个'听起来对'的答案在概率上成立，它就可能说出来，而不去核实真假。具体来说有几个诱因：模型知识有**截止时间**，新的信息它不知道，就很容易编；它训练时没记住某些事实，会靠猜补全；它还可能被**提问方式诱导**，顺着你话里的假设往下编；以及它缺少**事实来源的支撑**，纯靠记忆'自由发挥'。\n\n那产品上怎么缓解？我按从技术到产品讲几个手段。\n\n**第一个，也是最有效的，RAG——给它事实来源。** 我们主动从知识库检索相关资料，让模型**基于检索来的内容作答**，而不是凭空猜。有了可依据的资料，幻觉就大幅下降。\n\n**第二个，要求溯源和引用。** 让模型在回答里标明'这个信息来自哪份文档'，既能帮用户核实，也倒逼它不瞎编——它没法溯源的内容，会更倾向于谨慎。\n\n**第三个，提示词约束它'认怂'。** 在提示词里明确要求：不知道就诚实说'我不确定'，不要猜、不要编。很多时候模型不是不想说实话，是没被要求。\n\n**第四个，技术参数层面的控制。** 比如降低**温度（temperature）**，让输出更保守、更少天马行空；对高风险场景适当控制生成。\n\n**第五个，用评测去堵。** 建一个专门测幻觉的评测集——放很多'容易诱导模型编造'的问题，评估模型答错的概率，倒逼团队去修。\n\n最后是产品化兜底，这个很关键：**高风险场景一定要有人工审核或者明确的边界提示。** 比如医疗、法律、金融这些答错后果严重的领域，不能全自动放出去，需要人审或强提示'本回答仅供参考'；同时给用户一个'AI 可能出错、请核实'的心理预期。产品上还必须给模型一个**'认怂'的出口**——让它不确定时有地方退，而不是被逼着编。\n\n所以我的理解是：幻觉是**大模型的固有能力缺陷**（它本来就擅长'像样'而非'正确'），没法完全消除，但可以通过**RAG 给事实、溯源、提示词约束、评测监控、高风险人工兜底**这套组合，把幻觉的发生率和危害大幅降下来。AI 产品做到'错得少、错了能被发现、发现后影响可控'，就已经是合格的了。\"\n\n## AI 产品经理 · 11\n\nAI 产品刚上线，用户少、数据少，效果调不好、用户又不来——你怎么破这个\"冷启动\"难题？\n\n### 回答框架\n\n1. 先想清冷启动的根因：效果依赖数据，数据依赖用户，用户又依赖效果，形成死循环\n2. 破局方向一：用\"可拿到的高质量种子数据\"先稳住效果（规则/人工标注/第三方数据）\n3. 破局方向二：降低用户使用门槛，把\"体验欠佳\"的代价做小，先换来第一批用户\n4. 破局方向三：设计\"数据飞轮\"，让用户使用自然沉淀成改善效果的数据\n5. 心态：先用\"够用\"而不是\"完美\"，把循环转起来\n\n### 口述参考答案\n\n\"冷启动的本质，是陷入了一个死循环：**AI 效果要靠数据来调好，但数据要靠用户用出来，而用户又因为效果不好不肯来。** 三个环节互相卡死，所以要破局，就得从其中一个环节主动打破，而不是等着它自己转起来。我讲三个破局方向。\n\n**第一个方向，先把'效果'稳到一个'够用'的水平，不完全依赖用户数据。** 刚上线没有真实数据，我可以用能拿到的**种子数据**先把模型喂起来——比如用**规则/人工先做一批高质量样本**、或者借助**公开数据/第三方预训练能力**，先把基础效果做到'能用'。我常说一句话：**冷启动阶段追求的不是'最好'，而是'够好、不劝退'**。效果太差用户看一眼就走，后面全白搭。\n\n**第二个方向，降低用户的使用门槛，让'体验不完美'的代价变小。** 冷启动时功能肯定不完善，所以我不会一上来就做'重承诺、高期待'的强功能，而是选一个**低门槛、高频、低风险**的场景切入——用户用起来不费力、就算效果一般也不会有损失。这样更容易换来第一批愿意尝试的用户。等有了这批用户，数据就开始积累了。\n\n**第三个方向，也是我最看重的，设计'数据飞轮'——让用户的使用本身就在为改善效果产生数据。** 我会在产品里埋好**反馈闭环**：比如让用户对回答点赞/点踩、让用户能一键纠错、把失败案例自动收集下来。用户的每一次使用和反馈，都变成改进模型的样本。这样用户的量起来、数据积累起来，效果跟着变好，效果变好又吸引更多用户——**飞轮一旦转起来，冷启动就真正破了。**\n\n另外我补充一个取舍：冷启动阶段要**分清'必须完美'和'可以先不完美'**。面向用户的关键路径，尽量稳；而一些边缘能力，可以允许它表现一般，先把核心体验跑通、把数据攒起来。\n\n所以我的结论是：破冷启动，不是等数据，而是**主动用种子数据把效果稳到'够用'、用低门槛场景换来第一批用户、再用数据飞轮让循环自我转起来**。产品经理的价值，就是找到那个能先转动起来的破局点，而不是在死循环里干等。\"\n\n## AI 技术栈 · 10\n\n讲讲多模态大模型是怎么实现\"同时理解文字和图片\"的？它的基本架构是什么？\n\n### 回答框架\n\n1. 核心难题：不同模态\"语言不通\"，模型要能\"看懂\"图片并和文字对齐\n2. 视觉编码器：把图片转成和文字同类的向量表示（视觉 token）\n3. 融合方式：图片特征注入到语言模型（如投影层对齐），语言模型负责理解和生成\n4. 训练：预训练对齐 + 指令微调，让模型学会\"看图答问\"\n5. 演进：从\"图文两个模型拼接\"到\"统一一个模型处理多模态\"\n\n### 口述参考答案\n\n\"我先说它要解决的**核心难题**：文字和图片是两种完全不同的信息——文字是离散的、一个词一个词，图片是连续像素、密密麻麻。模型天然'会说人话'，但'看不懂图'。所以多模态大模型的核心工作，就是**让模型能'看懂'图片，并且把图片信息和文字信息'对齐'到同一个理解空间里**。\n\n它基本是分三块拼起来的，我讲一下架构。\n\n**第一块，视觉编码器（Vision Encoder）——负责'看懂图'。** 图片进来，先由一个专门的视觉模型把图片**切成一个个小块（patch）**，然后转成**视觉向量（视觉 token）**。这一步把'连续像素'变成了'模型能处理的离散数字'，就好比把图片翻译成模型的'语言'。常见的做法是用一个训练好的视觉模型（比如基于 ViT 架构）来做这个编码。\n\n**第二块，投影/对齐层——负责'让视觉和文字对上话'。** 视觉 token 和文字 token 的单位不一样，不能直接混在一起用，所以中间要有一个**投影层**，把视觉 token 映射到语言模型能理解的那个空间。这一步是关键——只有对齐了，模型才能同时处理'这张图 + 这段文字'，知道'图里的那只猫'和'文字提到的猫'是同一个东西。\n\n**第三块，语言模型本体——负责'理解 + 生成'。** 对齐后的视觉信息，连同一段文字，一起作为输入喂给大语言模型。语言模型负责综合理解，然后生成回答。它既能做图文理解，也能基于图生成描述。\n\n那它是怎么学会的？靠训练。分两步：**先做对齐预训练**——用海量的图文配对，让模型学会'图和文的关系'；再做**指令微调**——用大量'看图回答问题'的样本，让模型学会按用户的指令看图、答问。这样它才真正'会用'多模态能力。\n\n最后我讲一下演进趋势。早期的做法是**把'看图的模型'和'说话的模型'两个拼起来**，配合很生硬；现在主流的趋势是**往'一个统一的模型'发展**——同一个模型既能看图、又能听声、又能说话，把多种模态原生地融合在一起。这样模态之间的理解更一致，表现也更好。\n\n所以我的理解是：多模态大模型的本质，是**用'视觉编码器看懂图 + 投影层对齐 + 语言模型理解生成'这三块，把不同模态的信息统一到同一个理解空间里，再靠对齐预训练和指令微调教会它'看图答问'**。理解了这套架构，就理解了它为什么能'既看见、又听懂、还会说'。\"\n\n## AI 产品经理 · 12\n\nAI 产品会收集大量用户数据——对话记录、上传的图片、个人画像。作为产品经理，你怎么在产品设计阶段就把隐私合规考虑进去？\n\n### 回答框架\n\n1. 认知前提：AI 产品的数据合规不是事后补救，而是产品设计的一部分，且直接决定产品能不能上线\n2. 设计前：先做数据盘点——收集什么、为什么收集、存多久、谁可见\n3. 合规三件事：用户授权（明示告知+同意）、数据最小化（够用即可）、可删除可导出（用户掌控）\n4. 高风险处理：敏感数据（人脸、医疗、儿童）特殊对待，必要时脱敏、本地处理\n5. 落地上：合规作为功能需求进入排期，评审和上线检查把关\n\n### 口述参考答案\n\n\"我的第一个认知是：**AI 产品的隐私合规，不是上线前补一道手续，而是产品设计本身的一部分。** 因为 AI 产品天然要收集大量数据——对话、图片、行为——这些数据既是它变聪明的来源，也是合规风险最集中的地方。如果等产品做好了再去补合规，往往要返工，甚至直接被卡着上不了线。\n\n我会把它作为产品设计的一条主线来推进，分几步。\n\n**第一步，先做数据盘点。** 在功能设计阶段，我就会逐项问清楚：**我们要收集什么数据？为什么必须收集它？存多久？谁有权限看？** 我特别强调'为什么必须'——凡是说不清用途的数据，就不该收。把账算清楚，是合规的起点。\n\n**第二步，落实合规的三件核心事。**\n**一是明示授权**——用户用 AI 功能之前，必须清清楚楚告诉他'我们会用你的对话来做什么'，并且**获得他的同意**，不能藏着掖着默认同意。\n**二是数据最小化**——只收'够完成任务'的最少数据，能本地处理的不上传，能不用个人标识的不用。很多隐私问题，其实靠'少收集'就能解决一大半。\n**三是用户掌控**——给用户**查看、删除、导出自己数据的入口**，让他随时能撤回。这既是合规要求，也建立信任。\n\n**第三步，把'敏感数据'单独拎出来特殊对待。** 人脸、医疗健康、儿童相关这些，属于高风险数据，要求会更高。我的做法是：**能不做就不做，必须做就上更强的保护**——比如脱敏、本地端侧处理、更严格的授权和更短的留存。涉及儿童的一定要格外谨慎，因为对象特殊。\n\n**第四步，把合规'落到产品排期和执行'，而不是停在文档上。** 我会把合规要求当成**正经的功能需求**，排进迭代、写进验收标准；上线前有一道合规评审和检查关，过不了就不放量。同时持续跟踪法规变化，因为合规要求是动态的，政策一更新，产品就得跟着调。\n\n所以我的结论是：AI 产品的隐私合规，靠的是**产品设计阶段就做数据盘点、落实'授权+最小化+可删除'三件事、对敏感数据特殊处理、并把合规排进开发和验收流程**。把合规当成产品的一部分，它就不是负担，而是一个产品能不能长期健康做下去的基本盘。\"\n\n## AI 技术栈 · 11\n\n讲讲思维链（Chain-of-Thought，简称 CoT）——它是什么？为什么能明显提升模型的复杂推理能力？\n\n### 回答框架\n\n1. 概念：引导模型在给出答案前，先\"把推理步骤一步一步写出来\"\n2. 为什么有效：复杂问题一步答难，拆成多步后错误率下降；模型\"边说边算\"能自我校验\n3. 与零样本/直接答的对比：直接给答案 vs 显式推理链\n4. 常见用法：Few-shot 示例示范 + 提示词要求分步（如\"让我们一步一步想\"）；进阶：自洽性（多次采样投票）\n5. 局限：不是所有任务都需要，短答案简单任务用不上；注意推理过程也可能有错\n\n### 口述参考答案\n\n\"我先讲它是什么。**思维链（CoT）是一种提示方法，核心是引导模型在给出最终答案之前，先把它的推理步骤一步一步地写出来。** 它不改变模型本身，只是改变我们让模型'怎么回答问题'的方式——从'直接蹦答案'，变成'先亮出思考过程，再给结论'。\n\n那它为什么能明显提升复杂推理能力？我讲三点。\n\n**第一，复杂问题'一步答对'很难，但'拆成多步'就简单了。** 一个多步数学题、多段推理题，模型如果被要求直接给答案，中间任何一步出错，整道题就废了；但如果让它**把过程拆成一二三四步**，每步都是一个更简单的小问题，出错概率大幅下降，累计正确率就上去了。\n\n**第二，'边说边算'能自我校验。** 模型在逐步书写的过程中，其实是在'外部化它的推理'——它每写一步，下一步就能基于前面已经写出的内容继续，等于把工作记忆摊在'纸上'，不容易忘了前面的中间结果。这比在脑子里闷头算要稳得多。\n\n**第三，它让模型遵循更结构化的解题路径。** 当提示词明确要求'分步骤、按逻辑推理'时，模型更倾向于沿着合理的推理链往下走，而不是跳过过程凭感觉猜。\n\n那具体怎么用？我讲两个常见做法。\n\n**做法一，Few-shot 示范。** 在提示词里先给一两个'带完整推理过程'的示例，让模型照着这个'先想后答'的样式来。这是最直观的 CoT 用法。\n\n**做法二，直接指令分步。** 在提示词里要求模型'让我们一步一步地想'，或者在输出要求里明确'先给出推理步骤，再给出结论'。很多情况下，一句'请分步思考'就能显著提升复杂题的正确率。\n\n还有一个进阶技巧叫**自洽性（Self-Consistency）**——让模型同一个问题**多次采样、各自推理**，然后把多次结果里**出现最多的那个答案**作为最终输出。因为偶尔会算错，但多数时候算对，'投票'能进一步压低错误率。\n\n最后我讲两个要注意的边界。**第一，不是所有任务都需要 CoT。** 像\"巴黎是哪个国家的首都\"这种一步到位的简单问题，写一堆推理反而多余、还可能引入错误，直接答就行。所以 CoT 主要用在**多步推理、逻辑、数学**这类复杂任务上。**第二，推理过程也可能出错。** 模型写的推理链不保证全对，它可能会'一本正经地推理到错误结论'，所以不能因为有了思维链就盲目信任，还是要用评测去验证。\n\n所以我的理解是：**思维链的本质，是把'一步答'改成'分步想'**——通过把复杂问题拆成简单的小步骤、让模型边说边校验，来显著提升复杂推理的成功率。它是目前提升模型推理表现最有效、也最轻量的手段之一。\"\n\n## AI 产品经理 · 13\n\n你的 AI 产品出了一个严重错误——比如给了用户错误的医疗/金融信息，引发了用户不满甚至舆情。作为产品经理，你会怎么处理，并重建用户信任？\n\n### 回答框架\n\n1. 处理原则：第一时间止损，先于公关解决\"错误本身\"，不回避不辩解\n2. 立即动作：紧急下线/降级该能力、定位根因、评估影响范围并通知受影响用户\n3. 对外沟通：诚恳致歉 + 说明原因 + 给出补救方案，不甩锅给\"AI 就是这样\"\n4. 系统性修复：根因定位（提示词/数据/模型/流程）、上线修复与回归、防再犯机制\n5. 重建信任：透明公开整改过程 + 设计\"信任修复\"产品机制（如高风险提示、人工兜底、可溯源）\n\n### 口述参考答案\n\n\"遇到这种事故，我的处理原则就一句话：**第一时间止损，先把'错误本身'解决掉，再谈沟通和信任。** 因为 AI 出错的信任危机，用户最在意的不是你道歉的态度，而是'这个问题会不会还发生、我的损失怎么办'。\n\n我分四个阶段来处理。\n\n**第一阶段，紧急止损——先救火。** 一旦确认是严重错误，我会立刻做三件事：**紧急下线或降级**这个有问题的能力，先不让它继续害人；**定位根因**，弄清楚是提示词写错了、数据喂错了、还是模型本身的问题；然后**评估影响范围**，凡是可能受影响的用户，主动联系、说明情况。这一步的目标是：先把伤害面控制住，不能让它继续扩散。\n\n**第二阶段，对外沟通——诚恳、具体、不辩解。** 我会第一时间发一个说明：**诚恳致歉 → 讲清楚发生了什么 → 说明我们正在怎么补救 → 给受影响用户具体的补偿或处理方案。** 这里我要特别强调一点：**绝不能甩锅说'这是 AI 的错、我们也没办法'。** 用户不会接受这种说辞，因为产品是我们做的，责任就在我们。诚实承认'是我们的把关没做好'，反而更能挽回信任。\n\n**第三阶段，系统性修复——不能只修一个点。** 我会带着团队做根因复盘，把这次的错误分层修复：改掉出问题的提示词/数据/流程，上评测和回归测试防止同类问题，更重要的是**建'防再犯'机制**——比如高风险内容加人工审核、加溯源、加明确的边界提示。修复不是修完这个 bug 就完事，而是要让\"这类错误不会再发生\"成为制度。\n\n**第四阶段，重建信任——让用户看到你在认真改。** 信任不是靠道歉修回来的，是靠**持续的透明和行动**修回来的。我会公开整改的进展，让用户看到我们改了哪些、为什么改；同时从产品机制上**给用户'安全感'**——比如在结果上明确标注'本内容由 AI 生成，仅供参考'、增加人工兜底、给用户申诉和反馈的入口。让用户感觉'出了问题我能发现、我有办法处理'，信任才会慢慢回来。\n\n所以我的结论是：AI 产品出严重事故，考验的是产品经理能不能**先止损、再诚实地承担、做系统性修复、最后用透明和机制重建信任**。把一次危机处理好，反而可能让用户更信任你——因为让他看到产品是认真、负责、可控的。\"\n\n## AI 技术栈 · 12\n\n讲讲\"知识蒸馏\"（Knowledge Distillation）——它是什么？主要用来解决什么问题？\n\n### 回答框架\n\n1. 概念：用一个能力强的\"教师模型\"，把知识\"教\"给一个更小的\"学生模型\"\n2. 核心思路：学生不只学教师给的\"标准答案\"，更学教师输出概率中蕴含的\"软知识\"\n3. 解决什么问题：模型太大太贵、部署难 → 用小模型逼近大模型效果（压缩 + 提速 + 降成本）\n4. 训练方式：用教师模型在大量数据上生成软标签（概率分布）来训练学生\n5. 权衡：越小越省但也越可能掉效果，需在\"体积/速度\"与\"精度\"间取舍\n\n### 口述参考答案\n\n\"知识蒸馏，简单说就是**让一个能力很强的'教师模型'，把自己的知识'教'给一个更小的'学生模型'**。它解决的问题很实际：**大模型效果虽好，但太大、太贵、跑不动，没法在真实产品里大规模部署。** 知识蒸馏的思路，就是'大模型负责最聪明，小模型负责去执行'——想办法让一个小得多的模型，去逼近大模型的效果。\n\n那它具体是怎么'教'的？这就要讲到它的核心思想了。通常训练一个模型，我们只教它**'标准答案'**——输入一个问题，告诉它正确答案是 A。但知识蒸馏不是只教这个。\n\n关键技巧在于：**教师模型回答时，输出的不只是一个答案，还有一个'每个选项的概率分布'**。比如某道题，教师模型觉得 A 有 70% 对、B 有 25% 对、C 有 5% 对。这里面其实藏着大量**'软知识'**——它告诉我们 A 和 B 是相近的、C 明显不对，这种'相似度'信息，是标准答案里完全没有的。蒸馏的做法，就是**让学生模型去模仿教师模型的这套概率分布**，而不只是对答案。这样学生学到的，是教师'怎么判断'的逻辑，而不仅仅是'哪个对'。\n\n这样做有个很直观的好处：**标准答案只告诉你结果，概率分布还告诉你'思维的痕迹'**，所以小模型能学得更深，用很小的体积逼近大模型的效果。\n\n那它到底解决了什么问题？我总结三点。**一是压缩和降本**——学生模型体积小、参数量少，部署成本和算力成本大幅下降。**二是提速**——小模型推理快，用户响应更快，能支撑高并发。**三是可行性**——很多设备（比如手机、端侧）根本装不下大模型，蒸馏出来的小模型才能跑得动。所以它对'把 AI 能力落到真实生产环境'非常关键。\n\n最后我讲一个必须权衡的点：**蒸馏不是免费的，越小越省，但精度通常会掉一点。** 学生模型再厉害，也很难完全达到教师模型的天花板。所以做蒸馏时，要在'体积/速度/成本'和'精度'之间找平衡——**不是一味追求更小，而是在满足业务效果的前提下，选一个够小、够快、够便宜的模型。** 这个取舍和之前讲模型选型是一样的逻辑：跟着业务需求走。\n\n所以我的理解是：知识蒸馏，是**用'教师教学生'的方式，把大模型的能力'压缩'进一个小模型**，核心在于让学生学教师的'概率分布'而非只对答案。它解决的是大模型'跑不动、太贵'的现实问题，是让 AI 能力真正落地部署的重要一环。\"\n\n## AI 产品经理 · 14\n\n领导给你一个很模糊的想法，比如\"我们想做一个 AI 助手，提升用户效率\"。你会怎么把它拆解成可落地、可排优先级的功能？\n\n### 回答框架\n\n1. 第一步先定义清楚：这个 AI 助手\"帮谁、在什么场景、解决什么问题\"，把模糊变成具体\n2. 第二步拆解能力：围绕核心场景列出\"用户要完成的任务链条\"，对应需要的 AI 能力\n3. 第三步定优先级：按\"价值 × 可行性 × 依赖\"打分，先做价值高又容易验证的 MVP\n4. 第四步划边界：明确哪些能力先不做、哪些能力要兜底，避免一上来贪大\n5. 第五步变成可验收的功能：每个功能有目标、评测标准和交付节奏\n\n### 口述参考答案\n\n\"面对'做一个 AI 助手'这种模糊想法，我最怕的就是直接开始堆功能。我习惯先把'模糊'变成'具体'，分五步拆。\n\n**第一步，先定义清楚'帮谁、在哪、解决什么'。** 我不会让'提升用户效率'停留在口号上，而是会先想：**这个助手主要是给哪类用户、在他们最常做的哪件事上、解决什么具体痛点。** 比如是给一线销售写跟进记录？还是给运营整理数据周报？必须先锁定一个**具体的高价值场景**，否则后面全是空中楼阁。\n\n**第二步，围绕核心场景拆'任务链条'，映射到 AI 能力。** 锁定场景后，我会把这个场景里用户要做的事，拆成一连串的动作。比如销售写跟进，就是'调出客户资料 → 整理对话要点 → 生成跟进记录 → 归档'。然后看每一步需要什么 AI 能力——有的需要检索、有的需要总结、有的需要生成。这样拆下来，'AI 助手'就从一句口号，变成了一张**'场景 → 任务 → 能力'的落地地图**。\n\n**第三步，定优先级——先做'价值高又容易验证'的 MVP。** 我会给每个功能打分：**用户价值**（解决了多痛的问题）、**可行性**（技术成不成熟、成本高不高）、**依赖**（是不是别的基础能力先就绪）。优先做的是**价值高、可行性强、又能快速上线验证**的那个最小闭环——先把一条核心路径跑通，证明'这个方向对用户真的有用'，再往周边扩展。**宁要一个跑通的闭环，不要十个半成品。**\n\n**第四步，划边界、做兜底。** 我会明确写清楚：这一期**哪些能力先不做**，避免团队摊子铺太大；以及**AI 做不了或没把握的部分怎么兜底**（降级成模板、转人工、引导用户）。边界划清楚，产品才不会一开始就失控。\n\n**第五步，把每个功能变成可验收的交付。** 落到排期上，每个功能我都要配上**目标、评测标准、上线节奏**——怎么算做好、用什么尺子验、什么时候上。这样拆出来的不是'想法清单'，而是一份**团队能照着执行的计划**。\n\n所以我的结论是：拆解模糊想法的关键，是**先锁定具体场景、再按任务链条映射能力、用'价值×可行性'排优先级、划清边界兜底、最终落到可验收的功能**。产品经理的价值，就是把一句'我们要做个 AI 助手'，翻译成一张团队能干活、能验证的地图。\"\n\n## AI 技术栈 · 13\n\n讲讲\"高级 RAG\"（Advanced RAG）——相比基础 RAG，它通常多了哪些优化？\n\n### 回答框架\n\n1. 先回顾基础 RAG 的短板：检索不够准、文档切块粗糙、query 表达不精确 → 答案质量受限\n2. 优化方向一：检索前（Pre-retrieval）——query 改写/扩展、更合理的切块与索引\n3. 优化方向二：检索中（Retrieval）——混合检索、重排（rerank）精挑 topK\n4. 优化方向三：检索后（Post-retrieval）——上下文压缩/重排、去冗余、让答案更聚焦\n5. 常见组合：混合检索 + 重排 是最典型的\"高级 RAG\"升级点\n\n### 口述参考答案\n\n\"先回顾一下基础 RAG 的短板，因为高级 RAG 就是冲着这些短板去的。基础 RAG 的流程是'切块 → 向量化 → 检索 → 拼进提示词生成'，但它有几个明显的弱点：**文档切得粗糙、检索结果不够准、用户的问题表达得不清楚**，导致捞回来的资料不相关，答案质量就受限。高级 RAG 就是把这几个环节分别做精，我按'检索前、检索中、检索后'三个阶段讲。\n\n**第一阶段，检索前的优化——先把'源头'弄对。**\n一个是**更精细的切块和索引**。基础 RAG 常常是一刀切成固定长度，容易把一句话、一段逻辑拦腰截断，影响检索。高级做法是**按语义、按段落结构来切**，让每一块尽量是完整有意义的单元，必要时再加一层文档结构索引。\n另一个是**查询改写（Query 改写）**。用户的原始问题往往很短、很口语、甚至有歧义，直接拿去检索效果不好。高级 RAG 会让模型**先把用户问题改写成更适合检索的形式**——比如扩展关键词、把问题改得更完整，甚至拆成多个子查询。这一招对提升召回质量特别有效。\n\n**第二阶段，检索中的优化——把'捞回来'的弄准。**\n最典型的是两件事：**混合检索**和**重排（Rerank）**。\n**混合检索**是指不只靠向量相似度，还结合关键词匹配（BM25 这类）一起检索，取长补短——向量擅长抓语义，关键词擅长抓精确词，混合能覆盖更多情况。\n**重排**更关键。粗检索可能捞回 50 条，里面很多是凑数的。重排就是用**一个更强的模型，对这 50 条按相关性重新精排**，把最准的 top5、top10 挑出来再喂给大模型。这个'先粗召回、再精重排'的两段式，是高级 RAG 里性价比最高、最常见的升级点。\n\n**第三阶段，检索后的优化——把'喂进去的'弄干净。**\n有时候捞回来的几段内容重复、有冗余，全塞进提示词反而干扰模型。高级 RAG 会做**上下文压缩和去重**——把重复的删掉、把不相关的裁掉，甚至对长段落做摘要，只保留真正对回答有用、且不冲突的信息，让模型在干净的上下文上生成更准确的答案。\n\n最后我总结一下：高级 RAG 的本质，是在**基础 RAG 的每个环节上做精化**——检索前把切块和查询做好，检索中用**混合检索 + 重排**把结果捞准，检索后把上下文清理干净。其中**'query 改写 + 混合检索 + 重排'**是最核心、最常用的组合。做 RAG 系统时，先跑通基础版，再按这几个环节逐个加优化，是最务实的路线。\"\n\n## AI 产品经理 · 15\n\n一个成熟、稳定的传统软件产品要\"AI 化\"升级。作为产品经理，你会怎么决定哪些环节该引入 AI，以及如何平稳过渡、不伤害老用户？\n\n### 回答框架\n\n1. 先摸底：盘点存量产品的用户旅程，找出\"效率低/体验差/靠人力堆\"的环节\n2. 用价值标准筛选：AI 引入后是否显著提升体验/降低成本，且不破坏原有核心流程\n3. 渐进式策略：先做\"AI 增强\"而非\"AI 替换\"，保留老路径，让用户逐步适应\n4. 双轨运行与灰度：新老入口并行、小流量灰度，观察数据再决定推进\n5. 回滚与兜底：保留原逻辑可一键回退，防止 AI 化失败伤到核心用户\n\n### 口述参考答案\n\n\"存量产品 AI 化和从零做 AI 产品不一样，它的难点在于：**产品已经有一批成熟用户、一套稳定的流程，你不能为了'显得 AI'就推翻重来，那样会伤到信任和营收。** 我的策略是'渐进增强、保留退路'，分几步。\n\n**第一步，先摸底，找出真正值得用 AI 的环节。** 我不会凭感觉说'这个环节加个 AI'，而是先**盘一遍用户的完整旅程**，找出那些'效率低、体验差、或者靠大量人力堆砌'的环节。比如客服要人工一个个回、数据分析要人慢慢看、文档要人手动整理——这些是 AI 改造的高价值候选。**AI 化要落在'痛点'上，不是落在'热点'上。**\n\n**第二步，用价值标准筛选，守住边界。** 我判断每个候选环节是否值得引入 AI，就看两点：**AI 引入后是不是显著提升了体验或大幅降了成本**，以及**会不会破坏原有的核心流程和用户的既有习惯**。凡是'改了反而让老用户更麻烦'的，宁可不做。核心的、不能出错的关键路径，我不轻易动。\n\n**第三步，用'AI 增强'而不是'AI 替换'。** 这是过渡的关键。我不会一上来就把原来的手动/规则流程整个换成 AI，而是先做成'**AI 先给一版，用户还能自己改、也能回到原路径**'的增强体验。比如原来是用户手动填表，我先加一个'AI 帮你预填、你再确认'。这样用户既享受到效率提升，又保有掌控感，不会觉得'被 AI 绑架了'。\n\n**第四步，双轨运行 + 灰度，用数据说话。** 我会让**新 AI 入口和原有入口并行**一段时间，先小流量灰度，观察两类数据：**AI 的采用率和效果指标**，以及**老用户的流失率、投诉率**。数据说明 AI 效果好、用户接受，我再逐步加大流量、推广；数据不好，我就放慢或调整，而不是硬推。\n\n**第五步，留好退路。** 我会保证**原有逻辑能一键回退**，一旦 AI 化出问题，可以立刻切回旧版本，不影响核心用户使用。这个'退路'既是安全网，也是团队敢放心试错的前提。\n\n所以我的结论是：存量产品 AI 化的核心，是**把 AI 落到'高价值痛点上'、用'增强而非替换'渐进过渡、双轨灰度用数据决策、并始终保留回滚退路**。目标是让老用户感觉'更顺手了'，而不是'被改得不会用了'。\"\n\n## AI 技术栈 · 14\n\n讲讲模型\"量化\"（Quantization）——它是什么？主要用来解决什么问题？有什么代价？\n\n### 回答框架\n\n1. 概念：把模型权重从高精度（如 FP16/FP32）压到低精度（如 INT8/INT4），数字变小、体积和算力要求下降\n2. 解决什么问题：模型太大装不下/跑不动、显存内存不够、推理慢、成本高\n3. 原理：牺牲一点数值精度换取体积和速度；常见 PTQ 后训练量化\n4. 代价：精度有损失，极端量化可能明显掉效果，需评估\n5. 取舍：在\"体积/速度/成本\"和\"精度\"之间平衡，量化常与蒸馏配合\n\n### 口述参考答案\n\n\"我先讲量化是什么。**量化，简单说就是把模型里的权重数字，从高精度表示压到低精度表示。** 模型训练和推理时，默认用高精度数字，比如 FP32（32 位浮点）、FP16（16 位浮点）；而量化是把它们压成**更短的数字**，最常见的是 **INT8（8 位整数）甚至 INT4（4 位）**。数字位数变短了，模型占的空间就小了、跑起来也更快。你可以理解成：**用更'粗'的数字，换更小的体积和更快的速度。**\n\n那它主要解决什么问题？我讲三个，其实都指向同一个核心——**让大模型'跑得动、跑得起'。**\n\n**第一，解决'装不下、跑不动'的问题。** 大模型动辄几十、上百 GB，很多设备、尤其是端侧（手机、边缘设备）根本装不下，显存、内存也不够。量化把模型一压，体积能缩小好几倍，原本跑不动的设备就能跑了。\n\n**第二，解决'推理慢'的问题。** 数字位数少，计算量就小，推理更快、延迟更低，用户体验更好。\n\n**第三，解决'成本高'的问题。** 部署和推理的资源占用小了，算力成本自然下降。这和蒸馏的目标是一致的——**都是让 AI 能力在真实生产里更可行。**\n\n那它有代价吗？有，而且必须讲清楚。**代价就是精度损失。** 你把数字从 32 位压到 8 位甚至 4 位，相当于把一把精确的尺子换成了刻度很粗的尺子，模型的表现通常会**打折扣**。在极端量化（比如 INT4）下，如果任务本身对精度很敏感，效果的下降会很明显，甚至不可接受。\n\n那怎么落地？我讲两个关键点。一个是**常见的做法是'后训练量化（PTQ）'**——模型训好之后，直接对权重做量化，不需要重新训练，成本低、上手快。更讲究一点的会做'量化感知训练（QAT）'——在训练时就考虑量化的损失，让模型更抗压缩，效果更好但训练成本更高。\n\n另一个是**取舍和搭配**。量化不是'越压越好'，而是要在**'体积/速度/成本'和'精度'之间找平衡**——对于精度不敏感的任务（比如问答、写作），可以压得狠一点；对精度要求高的，就少压一点。而且量化**经常和知识蒸馏搭配**用——先用蒸馏把模型变小，再做量化进一步压缩，两条路叠在一起，达到'更小更快，同时尽量保效果'。\n\n所以我的理解是：量化是用**'精度换体积和速度'**的手段，解决大模型'跑不动、跑不起'的问题，但要清醒地认识到它会掉精度。**落地时要在精度和资源之间权衡，并常和蒸馏配合**，才能在真实产品里跑得既快又好、又不至于明显变笨。\"\n\n## AI 产品经理 · 16\n\nAI 越来越强，但也不能全交给它。作为产品经理，你会怎么设计\"人和 AI\"的分工边界？哪些事该交给 AI，哪些必须留给人？\n\n### 回答框架\n\n1. 分工的总原则：AI 做\"快、稳、规模化\"的事，人做\"判断、责任、共情\"的事\n2. 该交给 AI 的：重复性任务、海量信息处理、可验证的标准化产出\n3. 必须留给人/人的把关点：高风险决策、责任归属、共情沟通、需要主观判断的场景\n4. 设计抓手：把\"人审/人确认\"做成流程节点，形成\"AI 出初稿、人做终审\"的分工\n5. 动态调整：随 AI 能力成熟逐步扩展授权，但责任始终在人\n\n### 口述参考答案\n\n\"我的总原则一句话：**AI 负责'快、稳、规模化'，人负责'判断、责任、共情'。** 具体哪些该交、哪些该留，我按这个来分。\n\n先讲**该放心交给 AI 的**，我总结成三类：\n**一是重复性的、可标准化的任务**——比如整理格式、翻译、初稿起草，交给 AI 又快又省人力；\n**二是海量信息的处理**——比如从一大堆文档里筛选、总结、检索，人干不过 AI；\n**三是能验证、结果有标准的产出**——比如代码、摘要，AI 做了人能快速检查对错。这类 AI 做主力、人只做复核，效率提升最大。\n\n再讲**必须留给人或者至少人要做最终把关的**，也分三类：\n**一是高风险、不可逆的决策**——比如涉及钱、法律、医疗、对外的正式承诺，责任太重，不能让 AI 自己拍板；\n**二是需要共情和人际沟通的场景**——比如安抚一个愤怒的用户、和重要客户谈关系，AI 做不到人的温度和分寸；\n**三是需要主观价值和综合判断的**——比如'这个方向值不值得做''这个人靠不靠谱'这类没有标准答案的判断，得靠人。\n\n那落到产品设计上，我会怎么体现这个边界？关键动作是：**把'人审、人确认'做成流程里的一个明确节点，而不是让 AI 一条龙走完。** 典型的分工是'**AI 出初稿、人做终审**'——AI 负责把量大、繁琐的部分做完，但关键动作（付款、发送、对外承诺、高风险输出）之前，**必须有一道人确认的关卡**。这样既用了 AI 的效率，又保住了人对结果的控制权和责任。\n\n最后我补充一点：这个边界不是死的，要**动态调整**。随着 AI 能力越来越成熟、产品验证越来越充分，我可以逐步扩大 AI 的授权范围——比如原来每步都要人确认，后来变成抽样审核。但有一条我始终坚持：**不管 AI 多强，责任永远在人。** 产品出了错，用户找的是公司、是人，不是模型。所以授权可以扩大，责任不能甩。\n\n所以我的结论是：设计人机分工，核心是**让 AI 做它擅长的'快稳规模化'，把'判断、责任、共情'的关键把关留给人和明确的人审节点，并随能力成熟动态调整授权，但责任始终由人承担。** 这个边界设计得好，AI 就是提效的工具；设计得不好，它就成了甩锅的黑箱。\"\n\n## AI 技术栈 · 15\n\n讲讲大模型的\"对齐\"（Alignment）——它是做什么的？一般是怎么实现的？\n\n### 回答框架\n\n1. 概念：让模型的行为\"符合人的意图、价值观和安全要求\"，而不只是\"会答\"\n2. 为什么需要：预训练让模型\"会说话\"，但对齐让模型\"说该说的、不做不该做的\"\n3. 主要方法：RLHF（人类反馈强化学习）为核心——训练奖励模型 + 强化学习微调\n4. 常见补充：指令微调（SFT）、安全训练、宪法 AI 等\n5. 意义与权衡：对齐让模型可控、安全，但也可能限制能力发挥，需平衡\n\n### 口述参考答案\n\n\"对齐，英文叫 Alignment，它的核心是**让模型的行为'符合人的意图、价值观和安全要求'，而不只是'有能力回答'。** 我打个比方：预训练把模型教成'会说话、知识渊博'，但对齐是把模型教成'懂规矩、知道什么能说什么不能说、知道按人的意图去做'。能力是'会不会'，对齐是'该不该、怎么用'。\n\n那为什么特别需要对齐？因为模型如果只被训练成'能力很强'，它可能**很有能力却不受约束**——比如你问它怎么搞破坏，它可能真的详细告诉你；或者它答得天花乱坠但不顾用户真实需求。对齐，就是要把模型'调教'成一个**可靠、安全、服从人的意图**的工具。\n\n那它是怎么实现的？核心方法是 **RLHF，人类反馈强化学习**。我拆成三步讲。\n\n**第一步，训练一个'奖励模型'（Reward Model）。** 我们收集很多提示，让模型针对每个提示生成多个回答，然后**让人工对这些回答排序打分**——哪个更好、更符合人的期望。用这些人工偏好数据，训练出一个'奖励模型'，它的作用就是学会'替人类判断哪个回答更好'。\n\n**第二步，用奖励模型训练大模型（强化学习微调）。** 把大模型接进来，让它生成回答，**奖励模型给每个回答打分**，模型就朝着'得分更高'的方向去优化自己。通过这种'给反馈、不断调整'的过程，模型逐渐学会'说人话、按人意图、不越线'。\n\n**第三步，配合指令微调和安全训练。** 在实践中，还会先用**指令微调（SFT）**让模型先学会'听指令、按格式干活'，再用 RLHF 做偏好对齐；对安全敏感的内容，还会有专门的**安全对齐训练**——训练模型识别危险请求并拒绝，而不是迎合。还有像'宪法 AI'这类用规则约束的方法作为补充。\n\n最后我讲一下它的意义和一个权衡。**意义很明确：对齐是让大模型从'强大的黑箱'变成'可信赖的工具'的关键**，没有对齐，能力越强风险越大。但**对齐也有代价**——过度对齐可能让模型变得'太保守'、束手束脚，在一些需要发挥创造力的场景反而变笨。所以做对齐要把握一个度：**既让它安全可控，又不把它训成'什么都不敢做'的废物。** 这个平衡，是模型团队一直在打磨的事。\n\n所以我的理解是：对齐的本质，是**通过 RLHF 这类'人类反馈驱动'的方法，把模型的行为从'会答'校准到'该答、能安全地答'**，让能力服务于人的意图和安全。它是把大模型从'玩具'变成'可用的产品能力'最关键的最后一公里。\"\n\n## AI 产品经理 · 17\n\n现在大家都能调用相似的大模型，AI 产品的技术门槛在降低。你怎么让一个 AI 产品做出差异化、形成自己的护城河？\n\n### 回答框架\n\n1. 认知前提：单靠\"能用大模型\"成不了护城河，模型本身会被抹平\n2. 护城河方向一：数据——独有的、高价值的专有数据，别人拿不到也学不会\n3. 护城河方向二：场景与流程——深度嵌入真实业务流程，形成切换成本\n4. 护城河方向三：体验与信任——打磨 AI 的可靠性、边界和反馈闭环，积累口碑\n5. 护城河方向四：成本与工程——同样的效果你更便宜、更稳定\n6. 结论：护城河在\"模型之外\"——数据、场景、体验、成本\n\n### 口述参考答案\n\n\"我先亮一个认知：**如果产品只靠'我接了一个很强的大模型'，那基本没有护城河**——因为模型是公开的，你今天能调、别人明天也能调，技术会被快速抹平。所以真正的护城河，一定建立在'模型之外'的东西上。我总结四个方向。\n\n**第一个方向，也是最硬的，数据。** 如果产品能积累**独有的、高价值的、别人拿不到的数据**，这就是别人很难复制的壁垒。比如一个客服产品，用久了沉淀了海量'这家公司的真实问答 + 用户反馈'，这套数据就是独有的资产——别人没有这些数据，即使接了同一个模型，也做不出同样的效果。数据是 AI 时代最像'护城河'的东西。\n\n**第二个方向，深度嵌入场景和业务流程。** 如果 AI 能力只是'一个插件'，用户随时能换；但如果它**嵌进了用户的日常工作流**——和他们的系统打通、和他们的协作方式绑定、存着他们的历史上下文——那用户要换掉它的成本就很高，这就是**切换成本带来的护城河**。越深入业务，越难被替代。\n\n**第三个方向，体验与信任的精细化。** 大模型大家都能用，但**把 AI 做得'可靠、懂边界、出错能被兜住、反馈闭环顺畅'**，是实打实要靠产品团队一点点磨出来的。用户对'这个 AI 靠不靠谱'的判断，形成的是口碑和信任，这种软性壁垒，模仿者短时间很难追上。\n\n**第四个方向，成本与工程效率。** 同样的效果，如果你的产品**单位成本更低、更稳定、响应更快**，那也是竞争力——因为 AI 产品是边际成本不为零的生意，把成本控制好、工程做得稳，本身就能形成优势。\n\n最后我强调一个综合判断：**好的护城河通常是这几个的叠加，而不是单点。** 而且它们有个共同点——**都建在'模型之外的长期积累'上**：数据要靠时间沉淀、场景要靠深度绑定、体验要靠持续打磨、成本要靠工程优化。所以做 AI 产品，我的思路是：**别把赌注押在'我用的模型比你强'上，而要把精力押在数据、场景、体验、成本这些'别人抄不走'的地方。**\n\n所以我的结论是：AI 产品的护城河，不在模型本身，而在**模型之外的数据、场景绑定、体验信任、成本工程**四件事上。谁能在这四件事上持续积累，谁就能在技术趋同的时代立住。\"\n\n## AI 技术栈 · 16\n\n讲讲 Agent 里的\"Function Calling\"（工具调用）——它是什么？是怎么让 Agent 真正\"动手做事\"的？\n\n### 回答框架\n\n1. 概念：模型在生成回复时，能\"决定\"调用某个外部工具/API，并把参数填好交给系统执行\n2. 为什么需要：模型本身只会\"说话\"，要\"做事\"必须借助外部工具，Function Calling 是桥梁\n3. 实现机制：预先声明一批工具（名称+参数格式）→ 模型判断该调哪个并生成结构化调用 → 系统执行并把结果返回 → 模型基于结果继续\n4. 关键工程点：工具定义要清晰、参数校验与容错、权限控制、避免乱调用\n5. 意义：它把 Agent 从\"只会说\"变成\"能执行\"，是 Agent 能力的核心之一\n\n### 口述参考答案\n\n\"我先讲 Function Calling 是什么。它是**让大模型在回复的过程中，主动'决定去调用某个外部工具'，并且把调用参数填好，交给系统去执行**的一种能力。你可以理解成：**模型本身只会'说话'，要'做事'就得靠外部工具，而 Function Calling 就是'模型决定并指挥工具干活'的那座桥。**\n\n为什么它是 Agent 的核心？因为 Agent 和普通问答的本质区别，就是**它能真的动手做**——而动手做的载体就是工具：查天气、调数据库、发邮件、操作某个系统。Function Calling 让模型在'该动手的时候动手'，而不是只给用户一段'建议你去做'的话。\n\n那它是怎么实现的？我讲四个环节。\n\n**第一步，先声明一批工具。** 系统会提前告诉模型：我这里有哪些工具可用，每个工具叫什么、接收什么参数、参数是什么格式。比如'查天气'这个工具，接收的参数是城市名。\n\n**第二步，模型判断并生成调用。** 用户问'北京今天冷不冷'，模型看了工具清单，判断应该调用'查天气'，然后生成一个**结构化的调用指令**——\"调用查天气，参数 city=北京\"。注意，这时模型并不是真的去查，而是**输出一个'我想调这个工具、用这些参数'的意图**。\n\n**第三步，系统执行并返回结果。** 模型输出的调用指令，由**系统（不是模型自己）去真正执行**——系统调天气 API，拿到'北京今天 5 度'，把结果返回给模型。\n\n**第四步，模型基于结果继续。** 模型收到真实结果后，再把它组织成对用户友好的回答——'北京今天 5 度，比较冷，建议加衣服'。这就是一次完整的 Function Calling 循环。\n\n那它有哪些关键工程点？我讲三个。**一是工具定义要清晰准确**——参数格式写清楚，模型才不会乱填；**二是参数校验和容错**——工具可能调用失败、参数可能不合法，系统要能校验、能优雅处理失败并让模型重新来，不能一失败就崩；**三是权限控制和安全**——因为模型能触发外部动作，所以**权限要严格管**：哪些工具它能用、哪些高危动作（比如付款、发信）要经过确认，防止模型乱调或被人诱导去调危险工具。\n\n所以我的理解是：**Function Calling 的本质，是'让模型会说，更会做'——通过'声明工具 → 模型决定调用 → 系统执行 → 结果回传继续'的循环，把模型从回答者变成执行者。** 它是 Agent 真正能落地的关键技术，而把工具定义、容错和权限管好，是它可靠运行的前提。\"\n\n## AI 产品经理 · 18\n\n你想在公司内部推动一个新的 AI 项目立项。你会怎么说服老板、争取到资源，同时管理好他对 AI 的预期？\n\n### 回答框架\n\n1. 立项核心：不是讲技术多酷，而是讲清\"业务痛点 + 商业价值 + 可验证的路径\"\n2. 用业务语言讲价值：降本/增收/提效，量化到老板听得懂的数字\n3. 用 MVP 证明可行性：先承诺小范围试点验证，而不是一步到位的大饼\n4. 管理预期：主动说明 AI 的能力边界、风险与失败成本，避免过度承诺\n5. 争取资源策略：分阶段要资源，先小后大，用早期结果换更大投入\n\n### 口述参考答案\n\n\"推动 AI 项目立项，我最重要的一条心得是：**不要用'AI 很厉害'去说服老板，要用'它帮你解决什么业务问题、值多少钱'去说服。** 老板要的不是技术先进性，是投入产出。所以我分几步来做。\n\n**第一步，先把'业务故事'讲清楚。** 我会用老板听得懂的业务语言，说清楚三件事：**当前存在什么痛点、这个 AI 项目怎么解决它、解决了能带来什么收益**。收益最好量化——比如'客服人力成本降 30%'、'转化率提升 5 个点'，落到钱和效率上，老板才有感觉。\n\n**第二步，用'小步验证'代替'画大饼'。** 我不会一上来就承诺'我们做一个全能的 AI 平台'——那既烧钱又风险大，老板也不敢信。我会说：**先选一个最具体、价值最清晰的小场景，做一个 MVP 试点**，用最小成本验证'这个方向真能给业务带来变化'。用试点数据说话，比任何 PPT 都有说服力。\n\n**第三步，主动管理预期，这是我特别看重的一步。** AI 不是万能的，我一定会在立项时就**坦诚讲清楚它的边界和风险**：哪些它能做好、哪些它做不了、失败的概率和成本是多少。原因很简单——**老板的预期一旦被吊得过高，项目落地时落差越大，信任崩塌得越快。** 提前把'AI 会犯错、需要兜底'讲明白，反而让老板对你有信任，后续好推进。\n\n**第四步，分阶段要资源，用小结果换大投入。** 我不会一次性要一大笔预算，而是**先要一小块资源把试点跑起来**——证明'方向对、团队行'之后，拿着早期结果去申请第二阶段更大的投入。这样既降低了老板的决策门槛，也给了自己'用成果说话'的机会。资源不是靠嘴要来的，是靠一个个小胜仗换来的。\n\n最后我总结一个原则：**立项成功的本质，是让老板看到'这是一个低成本、可验证、回报清晰的生意机会'，而不是'一个很前沿的技术方向'。** 把业务价值讲透、用小步试点降风险、提前管理预期、分阶段争取资源——这四件事做扎实，AI 项目立项的成功率和后续生存率都会高很多。\"\n\n## AI 技术栈 · 17\n\n讲讲大模型生成时的采样参数——比如\"温度（temperature）\"和\"top-p\"——它们控制什么？怎么影响输出？\n\n### 回答框架\n\n1. 背景：模型输出是\"按概率选下一个词\"，采样参数决定\"怎么选\"\n2. 温度（temperature）：控制随机性/创造性——高则发散、低则保守\n3. Top-p（核采样）：控制候选词范围——只从累计概率前 p% 的词里选\n4. 两者配合：温度管发散度，top-p 管候选池大小；一高一低常见组合\n5. 使用场景：创意任务用高、精确任务用低；结合实际权衡\n\n### 口述参考答案\n\n\"我先讲背景，因为采样参数得从这个说起。**大模型生成一个词时，不是'只有一个正确答案'，而是给下一个词算出一堆候选词，每个候选都有个概率**——比如'今天天气'后面，'真'有 60% 概率、'很'有 30%、'不'有 5%。模型最后选哪个词，就由**采样参数**来决定。所以采样参数本质上是控制'模型在概率上怎么下注'的旋钮。\n\n第一个是**温度（temperature）**，它控制的是**随机性和创造性**。\n**温度调高**，模型会把概率分布'拉平'——那些概率本来低一点的词也有机会被选中，输出就更**发散、更有创造性、更大胆**，但也会更容易跑偏、说些奇怪的话。\n**温度调低**，模型会'收窄'分布，几乎只选概率最高的那个词，输出就更**保守、稳定、可预测**，但可能显得死板。\n所以简单记：**温度高 = 天马行空，温度低 = 按部就班。**\n\n第二个是 **top-p，也叫核采样**，它控制的是**候选词的范围大小**。\ntop-p 的做法是：把候选词按概率从高到低排，只从'累计概率达到 p'的那一部分里选。比如 top-p=0.9，就只从'概率加起来到 90% 的那批词'里选，把那些尾部的、很不可能的词直接排除掉。\n所以 **top-p 越小，候选池越窄、输出越保守**；top-p 越大（比如 1），几乎不限制，输出越自由。\n\n这两个参数是**配合使用**的，方向还不一样：**温度管'发散度'（词被选中机会均不均匀），top-p 管'候选池大小'（哪些词有资格参选）。** 实践中，一种常见组合是**把温度调高一点增加创造力、同时用较低的 top-p 排除太离谱的选项**，这样既能更有想法，又不至于太乱。\n\n最后讲怎么选，还是跟着任务走：\n**需要创造力的任务**——比如写故事、想点子、头脑风暴——适合**温度调高**，让模型放开想；\n**需要精确可靠的任务**——比如代码、问答、按格式输出——适合**温度调低**，让它稳定输出，减少胡说。\n而且我要提醒一句：**温度和 top-p 不是越高越好，也不是越低越好，要在'创造性'和'可靠性'之间找平衡**，并且最好用评测来验证——同样的参数在不同任务上效果不一样，要实际测过才知道合不合适。\n\n所以我的理解是：采样参数是**模型生成时的'风格旋钮'**——温度管发散度、top-p 管候选范围，两者配合能精细控制输出是'更稳'还是'更有创意'。产品上，我会按任务性质去调它们，让 AI 在该保守时保守、该放飞时放飞。\"\n\n## AI 产品经理 · 19\n\n请讲一个你做过的最有挑战的（或最有成就感的）AI 项目：你当时是怎么做的、遇到的最大的困难是什么、你是怎么解决的、最后结果如何？\n\n### 回答框架\n\n1. 选项目：挑一个\"有明确挑战 + 有你的关键决策 + 有可量化结果\"的项目，不贪大\n2. 讲背景与目标：一句话说清项目要解决什么、目标是什么\n3. 讲你的关键动作：你在其中的角色和核心决策，突出\"你\"而非\"团队\"\n4. 讲最大困难：一个具体的、真实的难点，别泛泛而谈\n5. 讲解决过程：你是怎么做判断、怎么推动、怎么验证的\n6. 讲结果与复盘：量化结果 + 你学到了什么、沉淀了什么\n\n### 口述参考答案\n\n\"我讲一个我曾经主导的 AI 项目——**给一个内容平台做'AI 智能推荐'升级**。当时团队背景是，用户刷内容刷不到想要的、流失很高，老板希望用 AI 改善，但当时我们既没做过推荐、数据基础也差，是个很有挑战的从零项目。\n\n**先讲背景和目标。** 目标很具体：**把用户的'内容找不到、刷不到'这个问题，用 AI 改善，目标是提升人均浏览时长和留存。** 但我接手时，团队既没有现成的推荐模型，用户的画像数据也残缺，等于要在'地基都没打好'的情况下开工。\n\n**再讲我在里面的关键动作。** 我的角色是产品负责人，我做的第一个关键决策是：**不贪大、不一步到位做复杂模型，而是先定一个'最小可行'的推荐闭环**——先用现成的向量检索能力，把'内容相似度'跑起来，让用户能看到'跟你历史喜欢内容相关的'，先验证'这个方向有没有效'。\n\n**然后是最难的一步，也是最核心的困难：数据。** 我们当时的难点不是算法，而是**冷启动没有数据**——新用户一来，我们根本不知道他喜欢什么，推荐等于瞎猜。为了解决它，我没有等数据自己积累，而是做了两个动作：**一是设计了'引导式冷启动'**——新用户进来先做一次轻量的偏好选择，快速建立初始画像；**二是埋了完整的反馈闭环**——点击、停留、收藏都采集，让数据飞轮尽快转起来。\n\n**解决过程里，我还遇到一个产品层面的麻烦。** 推荐做出来之后，一开始效果并没好多少，团队一度怀疑方向。我当时没有慌，而是**拿数据说话**：先把点击率、留存这些指标拆开看，发现是'冷启动用户'把整体数据拖低了。我据此把策略拆成'老用户用历史偏好、新用户用引导冷启动'两套来跑，结果整体指标就明显上去了。\n\n**最后讲结果和复盘。** 上线三个月后，人均浏览时长提升了约两成，新用户 7 日留存也有明显改善。更重要的是我沉淀了两点认知：**第一，AI 项目最大的坑往往不是技术，而是数据；第二，做 AI 不能一步到位，要先用最小闭环验证方向，再用数据迭代。** 这两条后来一直指导我做 AI 产品。\n\n所以这个项目我最想突出的，是我在'没数据、没经验、结果一度不理想'的情况下，能**守住'先小步验证、拿数据决策'的思路，把项目从零做成并带来实际业务提升。**\"\n\n## AI 技术栈 · 18\n\n讲讲\"让大模型输出结构化数据\"（比如输出 JSON）——为什么重要？一般有哪些方法？\n\n### 回答框架\n\n1. 为什么重要：AI 要接入真实系统，系统只认结构化数据，不能靠\"人类读自然语言\"\n2. 方法一：提示词约定——明确要求\"以 JSON 格式输出\"+ 给格式示例\n3. 方法二：JSON Mode / 结构化输出接口——模型侧保证输出合法 JSON\n4. 方法三：约束解码 / Schema 约束——从生成机制上强制符合指定字段与类型\n5. 关键点：仍要校验与容错，防止字段缺失、类型不对、输出被截断\n\n### 口述参考答案\n\n\"我先讲为什么结构化输出这么重要。**因为真实系统只认'结构化的数据'，不认自然语言。** 当 AI 不是'聊聊天'、而是要真正驱动业务流程时——比如把用户的意图填进一个工单、把提取的信息写进数据库、把结果传给下游系统——系统需要的是**一段格式明确、字段清晰的数据（最典型就是 JSON）**，而不是一段让程序员再去解析的散文。所以让模型稳定输出结构化数据，是 AI 从'能对话'变成'能干活'的硬要求。\n\n那具体怎么实现？我讲几个由浅到深的方法。\n\n**方法一，提示词约定——最基础。** 在提示词里明确告诉模型：'请以 JSON 格式输出，包含 xx、xx 这些字段，类型是什么'，再给它一个格式示例让它照着写。这个方法简单有效，很多场景够用。但它不是百分百可靠——模型有时会偷懒、字段名写错、甚至答着答着格式崩了。\n\n**方法二，用模型的'JSON 模式'接口。** 现在主流模型基本都提供了类似 **JSON Mode / 结构化输出**的能力——你在调用时指定'我要 JSON 输出'，模型端就会**保证它输出的是一段合法、可解析的 JSON**。这一步比纯靠提示词稳很多，因为它是在模型层面做了保证。\n\n**方法三，约束解码 / 按 Schema 强制生成——最严格。** 更进一步，可以**给模型定义一个严格的输出 Schema**（比如'必须有字段 A 是字符串、字段 B 是数组'），系统在**生成过程中就按这个 Schema 去约束**——不让它生成不符合格式的词。这样能从根本上保证输出**结构正确、字段和类型都对**，是最可靠的方案，工程实现也最复杂。\n\n最后我讲一个很关键的提醒：**无论用哪种方法，系统侧都还是要做校验和容错。** 因为模型再稳，也还是可能出现字段缺失、类型不对、输出被截断（因为 token 长度限制）的情况。所以我会**对模型的输出做一层'解析 + 校验'**——解析失败就重试、字段不对就修正或降级，绝不能假设模型输出永远完美。加上对**输出长度和 token 的控制**，防止内容被截断成不完整的 JSON。\n\n所以我的理解是：**让模型输出结构化数据，是它接入真实系统的前提**，实现路径是'提示词约定 → JSON 模式接口 → 按 Schema 强制生成'从易到难递进，但无论多稳都要在系统侧加一层校验和容错兜底。** 把这一层做好了，AI 才能稳定地成为系统里的'干活单元'，而不是一个仅供聊天的黑箱。\"\n\n## AI 产品经理 · 20\n\nAI 产品上线只是开始。作为产品经理，你会怎么持续运营和迭代一个 AI 产品？重点会盯哪些指标？\n\n### 回答框架\n\n1. 运营核心：AI 产品是\"越用越好\"，运营的目标是让\"数据飞轮\"持续转起来\n2. 核心指标分三层：效果层（质量/正确率）、体验层（采用率/放弃率/满意度）、业务层（留存/成本）\n3. 数据闭环：埋点采集失败案例与用户反馈，反哺评测集和模型/提示词\n4. 迭代优先级：先修\"劝退类\"问题，再谈锦上添花；区分\"效果问题\"和\"体验问题\"\n5. 降本运营：持续优化 token/成本，防止\"用得越多亏得越多\"\n\n### 口述参考答案\n\n\"我的一句话定位：**AI 产品上线不是终点，而是'数据飞轮'开始转动的起点。** AI 产品最特别的地方，是它'越用越好'——用户的每一次使用和反馈，都应该变成让产品变好的养料。所以我的运营工作，核心就是让这个飞轮持续转起来。我重点盯三件事。\n\n**第一件，盯'三层指标'，不能只看一层。**\n我把指标分成三层来盯：**效果层**——AI 本身做得好不好，比如回答准确率、识别正确率；**体验层**——用户用起来顺不顺，比如采用率、放弃率、人工介入率、满意度；**业务层**——它到底有没有带来业务价值，比如留存、活跃、转化、单位成本。\n为什么要分层？因为**单看一层会骗人**——效果指标好看，用户可能还是不用；用户用了，可能业务没变好。三层对着看，才能定位问题到底出在'AI 能力'、'交互体验'还是'场景价值'。\n\n**第二件，建好'数据闭环'，这是 AI 运营的灵魂。**\n我会把线上**埋点做好**——用户的放弃、点踩、投诉、失败案例，全都采集下来。然后把这些问题**反哺回去**：是提示词的问题就改提示词，是模型的问题就换/微调，是评测集没覆盖就补样本。这个'发现问题 → 归因 → 修复 → 验证'的循环一旦跑顺，产品就会持续变好。**没有闭环的 AI 产品，等于在凭感觉运营。**\n\n**第三件，排好迭代优先级 + 管好成本。**\n迭代上，我会坚持一个原则：**先修'劝退类'问题，再谈锦上添花。** 凡是让用户'用一次就放弃'的问题——比如答错、报错、体验卡壳——永远排在最高优先级，因为它直接杀死留存。修好了劝退问题，再去做体验优化和新能力。\n成本上，因为 AI 是边际成本不为零的，我会**持续优化 token 消耗和模型选型**——同样的效果能不能更便宜、更快。防止出现'产品越火、成本越爆'、卖得越多亏得越多的情况。这个在运营里和效果一样重要。\n\n所以我的结论是：运营 AI 产品，核心是**用'三层指标'看清问题在哪、用'数据闭环'让产品越用越好、用'先修劝退问题'的思路排迭代优先级，并持续管好成本**。把飞轮转起来、转得稳，AI 产品才算真正立住了，而不是上线后就放任自流。\"\n\n## AI 技术栈 · 19\n\n讲讲\"上下文缓存\"（Context Caching）——它是什么？为什么能明显降本、提速？\n\n### 回答框架\n\n1. 概念：把重复出现的\"输入前缀/固定上下文\"缓存起来，命中时不用重复计算\n2. 为什么有效：模型对相同输入的处理结果可以复用，尤其系统指令、固定文档重复出现\n3. 降本原理：命中的部分不再按满额计费，只收缓存命中的低价甚至几乎免费\n4. 提速原理：跳过重复的预填充（Prefill）阶段，首字响应更快\n5. 适用场景与注意：固定系统提示/长文档/多轮对话；缓存可能失效、更新时要清缓存\n\n### 口述参考答案\n\n\"我先讲上下文缓存是什么。**它是在模型处理大量相同输入时，把重复出现的那部分输入（尤其是前缀）的中间处理结果先存起来，下次遇到同样的输入，直接复用，不用重新算一遍。** 你可以理解成：**把'每次都重复算'的开销，变成了'算一次、反复用'。**\n\n为什么这个优化这么有效？因为在很多真实场景里，输入有很大一部分是**固定的、重复的**。比如一个企业客服系统，每次调用都要带上**一大段固定的系统指令**（告诉模型它是什么角色、要遵守什么规则）；再比如 RAG 场景，**一份长文档会被反复查询**，前面的文档内容每次都一样。这些'重复的前缀'，正是缓存能发挥价值的地方。\n\n那它为什么能**降本**？我给你讲计费的逻辑。大模型是**按输入 token 计费**的，但针对缓存，通常有一套**更便宜的计费规则**——**命中了缓存的那部分 token，费用大幅降低，甚至接近免费**。所以当你的系统指令、固定文档占了输入的很大比例，缓存一开，能省下一大块输入成本。对高频、长上下文的场景，这个降本非常可观。\n\n那它为什么能**提速**？这要从模型生成的两个阶段讲。模型处理请求分两步：**预填充（Prefill）**——先把整段输入算一遍、理解它；**解码（Decode）**——逐字生成回答。上下文缓存的价值在于：**如果输入的前缀命中了缓存，就可以跳过重复的预填充阶段**，直接从已有结果接着算。预填充往往是响应里最耗时的一部分，跳过它，**首字响应（TTFT，第一个字出来的时间）会明显变快**，用户感觉就是'回答来得更快了'。\n\n最后我讲几个要注意的点。**一是缓存不是永远有效的**——它有有效期、也受 token 数限制，长输入缓存可能存不下；**二是上下文一旦更新，缓存会失效**——比如系统指令改了、文档更新了，旧缓存就不能再用，需要重新计算；所以做缓存时要清楚'什么时候能复用、什么时候该刷新'。**三是它是自动还是手动**——有的平台自动做前缀缓存，有的需要主动管理，要按平台机制来用。\n\n所以我的理解是：上下文缓存是**利用'输入大量重复'这个特点，把重复的预填充结果存起来复用**，从而既大幅降低 token 成本、又加快首字响应。它对'固定系统指令 + 长文档 + 高频调用'的场景尤其有效，是 AI 服务降本提速里很实用、也常常被忽略的一招。\"\n"}}</script>

};

const escapeHTML = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

try { saved = JSON.parse(localStorage.getItem(storageKey) || '{}') || {}; } catch { storageAvailable = false; }

}

function applyReadingSize() {

function setMenu(open) {

async function requestQuestion() {
  if (generation || !service.configured) return;
  const chapter = challengeChapter();
  const type = challengeType;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 90000);
  generation = {chapterId: chapter.id};
  generationErrors[chapter.id] = '';
  refreshChallenge();
  try {
    const response = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Handbook-Token': service.token},
      body: JSON.stringify({chapterId: chapter.id, type, history: generatedHistory[chapter.id].map(item => item.question)}),
      signal: controller.signal
    });
    let result;
    try { result = await response.json(); }
    catch { throw new Error('出题服务没有返回有效结果，请检查服务是否仍在运行。'); }
    if (!response.ok) throw new Error(result.error || '出题失败，请稍后重试。');
    if (result.chapterId !== chapter.id || result.type !== type || typeof result.id !== 'string' || typeof result.question !== 'string' || typeof result.answer !== 'string' || !Array.isArray(result.followups) || !result.followups.every(item => typeof item === 'string')) {
      throw new Error('返回的题目不完整，请重新出题。');
    }
    generatedHistory[chapter.id].push(result);
    generatedHistory[chapter.id] = generatedHistory[chapter.id].slice(-10);
    selectedQuestions[chapter.id] = result.id;
    answerVisible = false;
    persist();
    notify(`「${chapter.short}」的新题已生成。`);
  } catch (error) {
    let message = error.message;
    if (error.name === 'AbortError') message = '等待出题超时，请稍后手动重试；本次调用可能已产生用量。';
    if (error instanceof TypeError) message = '无法连接出题服务，请检查电脑网络和服务状态。';
    generationErrors[chapter.id] = message || '出题失败，请稍后重试。';
    notify(generationErrors[chapter.id]);
  } finally {
    clearTimeout(timeout);
    generation = null;
    refreshChallenge();
  }
}

  renderDoubaoResults();
});
document.addEventListener('input', event => {
  if (event.target.id !== 'doubao-search') return;
  doubaoQuery = event.target.value;
  renderDoubaoResults();
});

const editorRepo = 'nicoxu32/ai-agent-handbook';
const editorFile = `/repos/${editorRepo}/contents/content/edits.json`;
const editor = {token: '', base: structuredClone(DATA.edits), draft: structuredClone(DATA.edits), sha: '', group: '', busy: false, dirty: false, ready: false};
const editDialog = document.createElement('dialog');
editDialog.className = 'content-editor';
editDialog.setAttribute('aria-labelledby', 'editor-title');
editDialog.innerHTML = `
  <header class="editor-heading"><div><span class="eyebrow">EDIT CONTENT</span><h2 id="editor-title">编辑页面内容</h2></div><button type="button" class="btn small" id="editor-close" aria-label="关闭编辑">关闭</button></header>
  <div class="editor-body">
  <p class="editor-help">直接修改文字，保存后自动发布到网站，通常需要几分钟。换行可分段，也支持 Markdown 排版。</p>
  <label class="editor-group-label">编辑位置<select id="editor-group" class="select"></select></label>
  <form id="editor-form"><div id="editor-fields"></div></form>
  <details id="editor-auth"><summary>GitHub 编辑授权 <span id="editor-auth-state">· 尚未连接</span></summary>
    <p>仅有此仓库写入权限的人可以发布。创建细粒度令牌，选择 <b>ai-agent-handbook</b> 仓库，并将 <b>Contents</b> 设为 <b>Read and write</b>，其余保持默认。令牌只在当前页面内存中使用，刷新或断开后需重新填写。</p>
    <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">前往 GitHub 创建授权令牌 ↗</a>
    <label>GitHub 授权令牌<input id="editor-token" type="password" autocomplete="off" spellcheck="false" placeholder="仅在此处填写，不要写入正文"></label>
    <div class="actions"><button type="button" class="btn small" id="editor-connect">连接 GitHub</button><button type="button" class="text-button" id="editor-disconnect" hidden>断开连接</button></div>
  </details>
  <p id="editor-status" role="status" aria-live="polite"></p>
  <div id="editor-published" hidden><a href="https://github.com/${editorRepo}/actions" target="_blank" rel="noopener noreferrer">查看自动发布进度 ↗</a><span>发布成功后刷新网站查看。</span></div>
  </div>
  <footer class="editor-footer"><div class="actions"><button type="button" class="text-button" id="editor-discard">撤销修改</button><button type="button" class="text-button" id="editor-export">下载修改备份</button><button type="button" class="text-button" id="editor-reload">载入最新内容</button></div><button type="submit" form="editor-form" class="btn primary" id="editor-save">保存并发布</button></footer>`;
document.body.append(editDialog);
const editorFields = editDialog.querySelector('#editor-fields');
const editorGroup = editDialog.querySelector('#editor-group');
const editorStatus = editDialog.querySelector('#editor-status');
const editorToken = editDialog.querySelector('#editor-token');
const editorGroups = [
  {id: 'home', title: '学习总览 · 指南与路径'},
  ...Object.keys(DATA.pages).filter(id => id !== 'home').map(id => ({id, title: '页面介绍 · ' + DATA.pages[id].title})),
  ...DATA.chapters.map(chapter => ({id: chapter.id, title: `${chapter.number} · ${chapter.short}（含三道面试题）`})),
  ...DATA.doubao.questions.map(question => ({id: question.id, title: `豆包 · ${DATA.doubao.categories[question.category]} ${question.id.split('-').at(-1)} · ${question.title}`})),
  ...DATA.architecture.nodes.map(node => ({id: 'arch-' + node.id, title: '架构图 · ' + node.title})),
  ...Object.entries(DATA.architecture.traces).map(([id, trace]) => ({id: 'trace-' + id, title: '任务路径 · ' + trace.title})),
  ...DATA.extras.filter(extra => ['extra1', 'extra2', 'extra4'].includes(extra.id)).map(extra => ({id: extra.id, title: extra.title}))
];
editorGroup.innerHTML = editorGroups.map(group => `<option value="${group.id}">${escapeHTML(group.title)}</option>`).join('');

function editableValue(field, overrides = editor.draft) {
  return Object.hasOwn(overrides, field.key) ? overrides[field.key] : field.value;
}
function editorMessage(message, error = false) {
  editorStatus.textContent = message;
  editorStatus.classList.toggle('error', error);
}
function updateEditorControls() {
  editDialog.querySelectorAll('input,textarea,select,button').forEach(control => { control.disabled = editor.busy; });
  editorFields.querySelectorAll('input,textarea').forEach(control => { control.disabled = editor.busy || !editor.ready; });
  editDialog.querySelector('#editor-save').disabled = editor.busy || !editor.ready || !editor.dirty;
  editDialog.querySelector('#editor-save').textContent = editor.busy ? '正在处理…' : '保存并发布';
  editDialog.querySelector('#editor-auth-state').textContent = editor.token ? '· 已连接' : '· 尚未连接';
  editDialog.querySelector('#editor-disconnect').hidden = !editor.token;
}
function renderEditorFields() {
  editorGroup.value = editor.group;
  editorFields.replaceChildren();
  DATA.editorFields.filter(field => field.group === editor.group).forEach(field => {
    const label = document.createElement('label');
    label.textContent = field.label;
    const input = document.createElement(field.multiline ? 'textarea' : 'input');
    input.dataset.fieldKey = field.key;
    input.value = editableValue(field);
    input.required = true;
    input.maxLength = field.multiline ? 40000 : 300;
    if (field.multiline) input.rows = Math.min(18, Math.max(4, Math.ceil(input.value.length / 65)));
    label.append(input);
    editorFields.append(label);
  });
  updateEditorControls();
}
function validateOverrides(value) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('内容文件格式不正确，未覆盖现有内容。');
  const known = new Map(DATA.editorFields.map(field => [field.key, field]));
  for (const [key, text] of Object.entries(value)) {
    const field = known.get(key);
    if (!field) throw new Error('网站结构已有更新，请先下载修改备份，再刷新网站。');
    if (typeof text !== 'string' || !text.trim() || text.length > (field.multiline ? 40000 : 300) || (!field.multiline && text.includes('\n'))) {
      throw new Error(`「${field.label}」为空或过长，请检查后重试。`);
    }
  }
}
async function githubRequest(path, {method = 'GET', body, token = editor.token} = {}) {
  const headers = {Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'};
  if (token) headers.Authorization = 'Bearer ' + token;
  if (body) headers['Content-Type'] = 'application/json';
  let response;
  try {
    response = await fetch('https://api.github.com' + path, {method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store', credentials: 'omit', redirect: 'error', signal: AbortSignal.timeout(25000)});
  } catch {
    throw new Error('无法连接 GitHub，可能是网络或请求超时。修改仍保留在当前页面，可先下载备份。');
  }
  if (!response.ok) {
    const messages = {401: '授权已失效，请重新连接 GitHub。', 403: 'GitHub 拒绝请求：请检查令牌的仓库权限或稍后重试。', 404: '无法访问内容文件，请检查授权是否选择了 ai-agent-handbook 仓库。', 409: '内容已被其他设备修改，请下载备份后载入最新内容。', 422: 'GitHub 未接受此次保存，请检查权限并载入最新内容。', 429: 'GitHub 请求频繁，请稍后重试。'};
    throw new Error(messages[response.status] || 'GitHub 暂时不可用，修改尚未确认保存。');
  }
  return response.json();
}
function encodeContent(value) {
  const bytes = new TextEncoder().encode(JSON.stringify(value, null, 2) + '\n');
  if (bytes.length > 900000) throw new Error('内容超过单次保存上限，请下载备份后联系维护者。');
  let binary = '';
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary);
}
async function readEditorFile() {
  const file = await githubRequest(editorFile + '?ref=main');
  if (file.encoding !== 'base64' || !file.sha) throw new Error('无法读取内容文件，请稍后重试。');
  let value;
  try {
    value = JSON.parse(new TextDecoder('utf-8', {fatal: true}).decode(Uint8Array.from(atob(file.content.replace(/\s/g, '')), char => char.charCodeAt(0))));
  } catch {
    throw new Error('内容文件无法解析，未覆盖当前修改。');
  }
  validateOverrides(value);
  return {value, sha: file.sha};
}
async function loadEditorContent() {
  if (editor.busy) return;
  editor.busy = true;
  updateEditorControls();
  editorMessage('正在读取 GitHub 上的最新内容…');
  try {
    const file = await readEditorFile();
    editor.base = file.value;
    editor.draft = structuredClone(file.value);
    editor.sha = file.sha;
    editor.ready = true;
    editor.dirty = false;
    editDialog.querySelector('#editor-published').hidden = true;
    renderEditorFields();
    editorMessage('已载入最新内容。修改后点击「保存并发布」。');
  } catch (error) {
    editorMessage(error.message, true);
  } finally {
    editor.busy = false;
    updateEditorControls();
  }
}
function contentEditButton() {
  return '<button type="button" class="btn small content-edit" data-action="edit-page">编辑内容</button>';
}

function groupForCurrentPage() {
  if (DATA.doubao.questions.some(question => question.id === activeRoute)) return activeRoute;
  if (activeRoute === 'doubao') return main.querySelector('.doubao-question[open]')?.dataset.questionId || filteredDoubaoQuestions()[0]?.id || DATA.doubao.questions[0].id;
  if (DATA.chapters.some(chapter => chapter.id === activeRoute)) return activeRoute;
  if (activeRoute.startsWith('challenge')) return challengeChapter().id;
  if (activeRoute === 'practice') return practiceQuestions()[state.practiceIndex].chapter.id;
  if (activeRoute === 'bank' || activeRoute === 'catalog') return DATA.chapters.some(chapter => chapter.id === bankScope) ? bankScope : state.last;
  if (activeRoute === 'architecture') return 'arch-' + DATA.architecture.nodes[0].id;
  return editorGroups.some(group => group.id === activeRoute) ? activeRoute : 'home';
}
async function openEditor() {
  editor.group = groupForCurrentPage();
  renderEditorFields();
  editDialog.showModal();
  if (!editor.dirty) await loadEditorContent();
  else editorMessage('已恢复当前页面中尚未发布的修改。');
}
function closeEditor() {
  if (editor.busy) return;
  editorToken.value = '';
  editDialog.close();
}
async function connectEditor() {
  if (editor.busy) return;
  const token = editorToken.value.trim();
  if (!token) { editorMessage('请先填写 GitHub 授权令牌。', true); editorToken.focus(); return; }
  editor.busy = true;
  updateEditorControls();
  editorMessage('正在验证仓库访问权限…');
  try {
    const repository = await githubRequest('/repos/' + editorRepo, {token});
    if (repository.full_name !== editorRepo || !repository.permissions?.push) throw new Error('当前账号没有此仓库的编辑权限。');
    editor.token = token;
    editorToken.value = '';
    editDialog.querySelector('#editor-auth').open = false;
    editorMessage('已连接 GitHub。修改后点击「保存并发布」。');
  } catch (error) {
    editorMessage(error.message, true);
  } finally {
    editor.busy = false;
    updateEditorControls();
  }
  if (editor.token && !editor.ready) await loadEditorContent();
}
function sameEdits(left, right) {
  const keys = Object.keys(left);
  return keys.length === Object.keys(right).length && keys.every(key => left[key] === right[key]);
}
async function saveEditor(event) {
  event.preventDefault();
  if (editor.busy || !editor.ready || !editor.dirty) return;
  if (!editor.token) {
    editDialog.querySelector('#editor-auth').open = true;
    editorMessage('请先连接 GitHub，以确认你有发布权限。');
    editorToken.focus();
    return;
  }
  editor.busy = true;
  updateEditorControls();
  editorMessage('正在检查版本并保存…');
  editDialog.querySelector('#editor-published').hidden = true;
  try {
    validateOverrides(editor.draft);
    if (Object.values(editor.draft).some(text => text.includes(editor.token) || /\b(?:github_pat_|gh[pousr]_)[A-Za-z0-9_]{15,}/.test(text))) throw new Error('正文中发现授权凭据，请删除后再发布。');
    const latest = await readEditorFile();
    if (latest.sha !== editor.sha) throw new Error('检测到其他设备的修改，尚未发布。请先下载修改备份，再载入最新内容，避免覆盖。');
    let result;
    try {
      result = await githubRequest(editorFile, {method: 'PUT', body: {message: 'Update handbook content from page editor', content: encodeContent(editor.draft), sha: editor.sha, branch: 'main'}});
    } catch (error) {
      // A lost response does not mean the commit failed. Read back before offering a retry.
      const confirmed = await readEditorFile().catch(() => null);
      if (!confirmed || !sameEdits(confirmed.value, editor.draft)) throw error;
      result = {content: {sha: confirmed.sha}};
    }
    editor.sha = result.content.sha;
    editor.base = structuredClone(editor.draft);
    editor.dirty = false;
    editorMessage('已保存到 GitHub，正在自动发布。网站更新通常需要几分钟。');
    editDialog.querySelector('#editor-published').hidden = false;
  } catch (error) {
    editorMessage(error.message, true);
  } finally {
    editor.busy = false;
    updateEditorControls();
  }
}
editorFields.addEventListener('input', event => {
  const field = DATA.editorFields.find(item => item.key === event.target.dataset.fieldKey);
  if (!field) return;
  if (event.target.value === field.value) delete editor.draft[field.key];
  else editor.draft[field.key] = event.target.value;
  editor.dirty = !sameEdits(editor.draft, editor.base);
  editDialog.querySelector('#editor-published').hidden = true;
  editorMessage(editor.dirty ? '有未发布的修改，关闭编辑窗口后仍保留；刷新或关闭网页前请保存或下载备份。' : '内容未改变。');
  updateEditorControls();
});
editorGroup.addEventListener('change', () => { editor.group = editorGroup.value; renderEditorFields(); });
editDialog.querySelector('#editor-form').addEventListener('submit', saveEditor);
editDialog.querySelector('#editor-close').addEventListener('click', closeEditor);
editDialog.addEventListener('cancel', event => { event.preventDefault(); closeEditor(); });
editDialog.querySelector('#editor-connect').addEventListener('click', connectEditor);
editDialog.querySelector('#editor-disconnect').addEventListener('click', () => {
  editor.token = '';
  editorToken.value = '';
  editorMessage('已断开 GitHub，当前修改仍保留。');
  updateEditorControls();
});
editDialog.querySelector('#editor-reload').addEventListener('click', () => {
  if (editor.dirty && !confirm('载入最新内容将丢弃当前未发布修改。已下载备份并确认继续吗？')) return;
  loadEditorContent();
});
editDialog.querySelector('#editor-discard').addEventListener('click', () => {
  if (editor.dirty && !confirm('撤销本次尚未发布的修改？已发布内容不受影响。')) return;
  editor.draft = structuredClone(editor.base);
  editor.dirty = false;
  renderEditorFields();
  editorMessage('已撤销未发布的修改。');
});
editDialog.querySelector('#editor-export').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(editor.draft, null, 2)], {type: 'application/json'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'handbook-content-backup.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
document.addEventListener('click', event => {
  if (event.target.closest('[data-action="edit-page"]')) openEditor();
});
window.addEventListener('beforeunload', event => {
  if (editor.dirty || editor.busy) { event.preventDefault(); event.returnValue = ''; }
});

persist();renderRoute();checkService();
</script>
