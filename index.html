", "multiline": true}, {"key": "chapter/k22/decision", "label": "放到产品里怎么判断", "value": "图像理解看事实忠实、细节覆盖和任务正确；检索看目标素材能否找到；生成看约束遵循、可编辑性与人工返工。用户要一张活动图时，品牌文字写错比风格不够惊艳更影响交付。真实图片、生成内容和经过编辑的内容要有清楚使用边界。", "group": "k22", "multiline": true}, {"key": "chapter/k22/scenarios", "label": "项目中的应用场景", "value": "**截图问题诊断。** 用户发来报错截图，系统识别提示、当前页面和相关控件，再结合产品版本查询解决办法；缺上下文时补问。截图上没有的账号状态，应通过授权接口核验。\n\n**电商素材制作。** 用商品参考图生成多种场景，保留商品关键外观与文案约束，再检查 Logo、文字、尺寸和细节一致性。候选图可快速扩展创意，正式发布仍需按商品真实属性核对。", "group": "k22", "multiline": true}, {"key": "chapter/k22/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **图表趋势说对，数字说错。** 核对坐标、单位和裁剪后的文字可读性；必要时先抽取数据，再让模型解释。\n- **改一个区域，其他区域也变了。** 检查编辑方式、遮罩或参考条件，逐项比对必须保持的元素，不只凭整体相似度验收。\n- **一张图演示很好，批量失败。** 按清晰度、遮挡、长宽比和内容类型分组测试，明确支持范围，而不是把单图成功泛化成通用视觉能力。", "group": "k22", "multiline": true}, {"key": "question/22.1/title", "label": "面试题 22.1", "value": "你会怎样拆解一个多模态需求？", "group": "k22", "multiline": false}, {"key": "question/22.1/answer", "label": "22.1 口述答案", "value": "“我先问用户到底要从已有内容提取事实、查找素材，还是创造新内容。截图诊断、按图搜商品和生成广告图虽然都涉及图片，但数据、流程和评测标准完全不同。\n\n如果要读精确文字和数字，重点检查 OCR 与位置关系；如果要理解场景，评估视觉模型；如果要找已有素材，建立检索；生成则定义构图、品牌和编辑约束。能力可以组合，不要求一个模型包办。\n\n然后用目标用户真实类型的图片测试，明确失败边界与纠正入口。‘接入多模态’不是可验收需求，用户最终拿到什么才是。”", "group": "k22", "multiline": true}, {"key": "question/22.2/title", "label": "面试题 22.2", "value": "视觉模型回答截图问题时，怎样避免把猜测当事实？", "group": "k22", "multiline": false}, {"key": "question/22.2/answer", "label": "22.2 口述答案", "value": "“我会让它区分可见信息与推断。截图上的报错文字、页面元素可以直接核对；账号是否被封、后台订单是否失败，通常不能仅凭截图确定，需要业务查询或补充信息。\n\n对小字和图表，先检查分辨率、裁剪和 OCR 结果；关键结论对应到图中区域或可查资料。模型没看清时应该明确缺口，不用一个很流畅的解释掩盖不确定。\n\n评估加入模糊、遮挡、相似界面和版本变化样本，分别看读取错误与推理错误。这样才能知道应改善输入处理，还是改知识接入和判断逻辑。”", "group": "k22", "multiline": true}, {"key": "question/22.3/title", "label": "面试题 22.3", "value": "如何评价一套文生图或图像编辑能力？", "group": "k22", "multiline": false}, {"key": "question/22.3/answer", "label": "22.3 口述答案", "value": "“我会先把交付约束拆开：主题构图、尺寸、品牌元素、文字正确、商品或人物一致，以及指定区域修改后其他内容是否保持。好看是一项，符合使用要求是另一项。\n\n用同一组真实任务生成多个候选，观察首次可用率、达到可发布标准的迭代次数与总成本。局部编辑还要与原图逐项对照，不能只看修改区域变好了。\n\n不同用途权重不同，电商商品细节和营销海报文字都是关键。最终评价围绕人工返工和实际交付，不会用一张漂亮示例代表整个产品能力。”", "group": "k22", "multiline": true}, {"key": "chapter/k23/title", "label": "知识点标题", "value": "第三方 API 与账号授权：代表用户办事，需要哪些前提？", "group": "k23", "multiline": false}, {"key": "chapter/k23/intro", "label": "先这样理解", "value": "API 把业务能力变成可调用接口。接入时不只看请求字段，还要看身份、授权范围、业务前置条件、返回状态、限流和错误语义。智能体可以组织调用，却不能替业务系统决定真实库存、余额或订单结果。\n\n认证确认调用者身份，授权确认允许做什么。OAuth 常用于委托授权：用户在服务方允许的流程中授予应用访问范围，应用获得访问令牌；身份登录通常还需要 OIDC 等相应机制。不能看到 OAuth 就把它简单等同于“知道用户是谁”。\n\n比如用户授权读取日历，不代表也授权删除日程；每项操作都要落到允许的能力范围。\n\n**令牌的范围与生命周期要管理。** Access Token 用于访问资源，Refresh Token 在服务支持时用于换取新的访问令牌，两者的用途和保护要求不同。授权可能到期、被撤销，账号也可能绑定错误。服务端应安全保存凭据，模型只接触完成任务必需的业务数据。\n\n读取、创建、修改和删除往往对应不同权限。用户授权应用读日历，不表示可以删除日程；授权应用具备发布能力，也不等于每次草稿都可以未经任务授权直接发布。账号授权和当前动作授权需要衔接。\n\n异步 API 可能只返回受理状态，实际结果通过查询或回调获取。回调也可能重复、迟到或乱序，需要校验来源、去重并结合状态处理。HTTP 200 不是完整业务成功的同义词。", "group": "k23", "multiline": true}, {"key": "chapter/k23/decision", "label": "放到产品里怎么判断", "value": "从任务所需的最小能力申请权限，说明连接了哪个账号、可做哪些事，以及如何撤销。按认证失败、权限不足、限流、业务拒绝和暂时故障分类处理。接口能力不满足承诺时，应调整产品流程，不能让模型通过反复重试假装集成完整。", "group": "k23", "multiline": true}, {"key": "chapter/k23/scenarios", "label": "项目中的应用场景", "value": "**日程助手。** 读取空闲时间与参与者时区，展示拟创建的日程，按授权写入并返回事件 ID。时间改变后重新检查冲突；用户撤权后停止后续访问。\n\n**售后协同。** 查询订单和退款申请，提交符合规则的动作，通过回调与主动查询确认状态。用户看到的是“申请已受理”或“退款已完成”等真实阶段，不是一律成功。", "group": "k23", "multiline": true}, {"key": "chapter/k23/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **昨天能用，今天全部失败。** 检查令牌到期、撤销、Scope 与账号关联，避免把授权问题当临时网络异常无限重试。\n- **接口返回 200，业务没变化。** 检查业务码、异步任务 ID 和最终状态；UI 不能只依据传输成功更新为完成。\n- **同一回调更新了两次。** 验证事件标识与状态版本，去重处理；乱序通知不能把完成态退回较早状态，状态变化需遵循业务规则。", "group": "k23", "multiline": true}, {"key": "question/23.1/title", "label": "面试题 23.1", "value": "OAuth 授权和用户确认操作是什么关系？", "group": "k23", "multiline": false}, {"key": "question/23.1/answer", "label": "23.1 口述答案", "value": "“OAuth 解决应用被授予哪些资源访问能力，当前任务确认解决这次具体要做什么。用户授权日历写权限，只说明应用具备写的能力，不代表可以任意创建或删除所有日程。\n\n我会在连接账号时展示范围与撤销入口，执行任务时核对当前意图、对象和必要确认。凭据由受控服务管理，不把 Token 放进模型上下文。\n\n验收既测授权拒绝、过期和撤销，也测有读权限却尝试写操作、账号绑定错误等情况。权限能力与任务意图都满足，才进入实际执行。”", "group": "k23", "multiline": true}, {"key": "question/23.2/title", "label": "面试题 23.2", "value": "第三方 API 接入评审，你重点检查什么？", "group": "k23", "multiline": false}, {"key": "question/23.2/answer", "label": "23.2 口述答案", "value": "“先看接口是否真正覆盖用户任务，再看权限、状态和失败处理。字段能不能传只是基础，还要知道成功是受理还是完成，是否支持查询、回调、幂等和批量部分失败。\n\n例如退款接口，除了提交金额，还需要知道可退余额、订单范围、最终到账状态和超时后如何核验。授权方式、限流、服务可用性与版本兼容也会影响产品承诺。\n\n我会用正常、拒绝、超时、重复和撤权场景做联调，形成可恢复流程。没有最终状态查询能力，就不能在界面上承诺实时确认成功。”", "group": "k23", "multiline": true}, {"key": "question/23.3/title", "label": "面试题 23.3", "value": "接口失败时，什么时候重试，什么时候转交用户？", "group": "k23", "multiline": false}, {"key": "question/23.3/answer", "label": "23.3 口述答案", "value": "“先按原因区分。授权过期需要刷新或重新授权，权限不足和业务拒绝通常不是重试能解决；临时网络异常或可恢复服务错误可以有限重试，限流要遵守等待提示。\n\n写操作超时尤其要先核对是否已经生效，并结合下游幂等能力决定重试。同一动作的状态仍未知时，明确提示待确认，不能直接告诉用户失败后再发一次。\n\n如果需要补充身份、选择替代方案或承担业务决策，就让用户介入，同时保留输入和进度。合理兜底是给出有依据的下一步，而不是把所有错误都变成‘请稍后再试’。”", "group": "k23", "multiline": true}, {"key": "chapter/k24/title", "label": "知识点标题", "value": "云手机与界面自动化：点击成功，为什么不等于任务成功？", "group": "k24", "multiline": false}, {"key": "chapter/k24/intro", "label": "先这样理解", "value": "云手机是在远端运行并可操作的移动环境；界面自动化是观察界面、定位元素、执行输入和点击。两者可以结合，也可以分别存在。现在一些 Computer Use 或 GUI Agent 能根据截图选择动作，但其可靠性仍要落在具体应用与任务上验证。\n\n定位常见两条路径：使用控件树、可访问性信息或稳定属性；使用截图识别位置与语义。前者通常更容易获取明确控件信息，但不一定覆盖所有页面；后者覆盖面灵活，却受布局、分辨率、遮挡和状态影响。实际可以组合，不能假设一种方式永远最好。\n\n**可靠自动化是观察—行动—再核验。** 点击前检查当前页面和目标，动作后等待可验证状态变化，例如订单号出现、列表新增记录。等待固定两秒不一定可靠，应该优先等业务或界面条件；没有变化时区分加载慢、点错位置与操作被拒绝。\n\n长流程要管理登录会话、设备状态、应用版本和任务检查点。并行操作同一账号或设备可能互相干扰。遇到验证码、额外授权或平台风控，转交用户或服务方允许的正式流程；这类步骤不能靠无条件重放实现稳定自动化。\n\n相比正式 API，界面路径往往更依赖可见反馈，幂等和真实状态查询也可能较弱。因此适合先从任务边界小、可核验、出错可恢复的场景验证，按页面版本持续回归。", "group": "k24", "multiline": true}, {"key": "chapter/k24/decision", "label": "放到产品里怎么判断", "value": "先评估正式接口、允许的接入方式和维护成本，再选择界面自动化。统计完整任务成功率、人工接管率和每次应用更新后的修复量，不能只看单次点击准确率。操作记录应支持定位失败，但账号与屏幕中的敏感信息需要受控保留。", "group": "k24", "multiline": true}, {"key": "chapter/k24/scenarios", "label": "项目中的应用场景", "value": "**既有后台录入。** 对缺少合适接口的内部系统，把已校验字段填入表单，提交前预览，提交后核验记录 ID。先支持少量固定表单和明确版本，避免第一版承诺处理所有页面。\n\n**移动端回归辅助。** 在受控测试账号与设备上执行登录后浏览、搜索与表单流程，记录失败页面。GUI Agent 可以辅助探索，但最终断言要与预期功能对应，不能只凭模型说“看起来正常”。", "group": "k24", "multiline": true}, {"key": "chapter/k24/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **昨天成功，今天点错按钮。** 检查应用版本、弹窗、键盘遮挡和定位依据；重新观察当前页面，不直接复用旧坐标。\n- **弱网下重复提交。** 点击后状态未确认，不应再次点击；先查询或查看提交记录，不能把没跳页当成未执行。\n- **流程恢复后账号或页面不对。** 重新校验账号、页面与任务对象，不能仅依保存的步骤序号继续。", "group": "k24", "multiline": true}, {"key": "question/24.1/title", "label": "面试题 24.1", "value": "API 和 GUI 自动化应该如何选择？", "group": "k24", "multiline": false}, {"key": "question/24.1/answer", "label": "24.1 口述答案", "value": "“先看正式接口是否覆盖任务、授权是否合法完整、能否返回明确业务状态。如果条件满足，API 通常更便于参数校验、幂等和监控。缺接口或覆盖不足时，再评估允许的界面自动化。\n\nGUI 路线可以接近人工操作，但页面版本、弹窗和网络都可能影响稳定性，因此要缩小支持范围、逐步核验并提供接管。选型不能只比较开发第一版的速度，还要算持续维护和失败恢复成本。\n\n我会用同一类任务比较端到端成功率和人工量。能点屏幕不等于更适合所有任务，接口存在也不代表它满足所需权限和状态能力。”", "group": "k24", "multiline": true}, {"key": "question/24.2/title", "label": "面试题 24.2", "value": "如何把演示型 GUI Agent 做成可用功能？", "group": "k24", "multiline": false}, {"key": "question/24.2/answer", "label": "24.2 口述答案", "value": "“我会先固定支持的应用、账号类型和任务范围，定义每一步前置页面与完成条件。定位优先使用可靠结构信息，必要时结合视觉；每次动作后重新观察结果，而不是一串坐标连续点击。\n\n加入超时、异常弹窗、弱网、登录失效和人工接管，保存可核验的进度。写操作还要区分未执行与结果未知，避免重复提交。应用版本变化后跑相关回归。\n\n验收看完整任务成功率和接管成本，而不是一段顺利录屏。只在失败模式和恢复路径可接受时扩大范围，才能把探索能力变成稳定交付。”", "group": "k24", "multiline": true}, {"key": "question/24.3/title", "label": "面试题 24.3", "value": "发布按钮点完卡住了，应该怎么处理？", "group": "k24", "multiline": false}, {"key": "question/24.3/answer", "label": "24.3 口述答案", "value": "“先把状态标为结果待确认，不立即重复点击。检查发布列表、回执或可查询的业务记录，用目标账号、内容标识和时间核对是否已成功。确认成功就补状态，确认未发生且允许重试才继续。\n\n如果无法可靠核验，就暂停并交给用户，保留当前页面和必要记录。界面自动化常缺少正式幂等接口，重复点击可能造成真实重复发布。\n\n后续改进要补提交后的状态判定和恢复入口，而不是只把等待时间调长。用户需要知道是否发生了外部动作，不是一句模糊的‘操作失败’。”", "group": "k24", "multiline": true}, {"key": "chapter/k25/title", "label": "知识点标题", "value": "多模型路由：怎样选模型，才能同时满足质量与成本？", "group": "k25", "multiline": false}, {"key": "chapter/k25/intro", "label": "先这样理解", "value": "接入多个模型只是有多个可选服务，路由才是决定这次请求用哪一个。选择可以依据任务类型、输入模态、上下文长度、结构化输出与工具能力、数据边界、时延和成本。先满足硬约束，再比较质量与费用；不能为了便宜把不允许外发的资料发给另一家服务。\n\n常见路线有三种。静态规则按任务直接分配，简单可解释；分类路由先判断任务复杂度或所需能力，再选模型，但分类本身也会出错；级联路线先尝试较低成本方案，依据可验证结果决定是否升级。不是只有动态模型分类器才算路由。\n\n**级联是否便宜，要算完整路径。** 教学例子：第一层每次成本 0.1 元，三成任务需要再花 1 元升级，则平均调用成本为 0.1＋0.3×1＝0.4 元，尚未包括检索、重试和人工。升级率很高、失败损失很大时，直接用强模型可能更合适。\n\n升级条件要可靠。格式校验失败、工具参数无效、证据不足是可以观察的信号；模型自报“没把握”需要验证，不能直接当校准概率。强模型也不一定能解决缺资料和接口权限问题，路由不能代替问题诊断。\n\n故障切换与质量升级也不同。主服务不可用时的备用模型，需要在目标任务上验证能力兼容；API 字段相似，不代表工具调用、拒答和输出结构一致。进行中的多步任务切换模型，还要保持状态和工具契约。", "group": "k25", "multiline": true}, {"key": "chapter/k25/decision", "label": "放到产品里怎么判断", "value": "按任务分组建立质量门槛，再在合格方案中比较成本和时延，形成可解释的选择边界。记录每个请求为何路由、是否升级和最终结果；评测路由整体表现，不能只看单个模型能力。路由失败导致的返工也应计入成本。", "group": "k25", "multiline": true}, {"key": "chapter/k25/scenarios", "label": "项目中的应用场景", "value": "**客服平台。** 稳定分类用经过验证的低成本模型，复杂政策比较或多轮工具决策用更强方案；实时订单状态依然查询系统。高风险处理不是仅靠选择更贵模型放行。\n\n**文档处理。** 文本提取、复杂图文分析和长材料综合使用各自合适能力；普通文本不必走视觉路径，复杂页面也不能强行塞给只支持文本的模型。", "group": "k25", "multiline": true}, {"key": "chapter/k25/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **单价降低，总账上涨。** 统计升级、重复检索、长输出与人工校对，按成功任务看总成本，而不是只比较单次 Token 报价。\n- **备用模型能聊天，却不能完成流程。** 检查 Schema、工具、模态和上下文兼容，回归真实工作流而非只测一问一答。\n- **路由无法解释，问题难复现。** 记录路由策略、模型配置、版本和触发信号；动态规则也要可追踪与回退。", "group": "k25", "multiline": true}, {"key": "question/25.1/title", "label": "面试题 25.1", "value": "怎样设计一个实际可用的多模型路由？", "group": "k25", "multiline": false}, {"key": "question/25.1/answer", "label": "25.1 口述答案", "value": "“我会先按任务定义硬条件和质量底线，再选满足要求的模型。数据区域、模态、上下文和工具能力先过滤，之后比较真实任务表现、时延与成本。\n\n第一版优先使用可解释规则，比如分类任务走模型 A，复杂分析走模型 B。只有任务分布足够复杂、静态规则明显有损失时，才评估动态分类或级联。每次路由记录原因和最终结果。\n\n评测不仅测模型，还测路由选错会带来什么损失。路由的价值是用合适资源完成任务，不是把所有请求都交给另一个模型判断该用谁。”", "group": "k25", "multiline": true}, {"key": "question/25.2/title", "label": "面试题 25.2", "value": "先用小模型，不行再升级，一定更省吗？", "group": "k25", "multiline": false}, {"key": "question/25.2/answer", "label": "25.2 口述答案", "value": "“不一定，要看升级比例、第一轮消耗和漏升级损失。小模型每次都先花钱，升级后可能还要重新提供上下文和重做部分工具调用；若大多数任务最终都升级，成本和时延可能更高。\n\n我会先定义可验证的升级信号，避免模型答错却自信地通过。用同一批任务比较直接强模型与级联，统计总调用、最终正确率、人工量和时延分布。\n\n简单稳定任务适合较轻方案，复杂任务如果一开始就能识别，直接路由可能更好。关键是单位成功任务成本，不是第一跳模型有多便宜。”", "group": "k25", "multiline": true}, {"key": "question/25.3/title", "label": "面试题 25.3", "value": "主模型故障时，怎样降级才可控？", "group": "k25", "multiline": false}, {"key": "question/25.3/answer", "label": "25.3 口述答案", "value": "“提前验证备用模型能承担哪些任务，并检查工具、结构化输出、模态和数据边界兼容。故障发生时只对满足条件的任务切换，其他任务保留状态、排队或提示能力暂不可用。\n\n进行中的任务要带上可信状态，不能把原模型的半成品盲目当作新模型的正确依据。已有副作用不重复执行，关键结果重新核验。可能影响交付质量或范围时让用户知道变化。\n\n我会做故障演练，观察切换后的完整任务成功率与恢复时间。降级是有边界地维持服务，不是只要另一个接口能返回文字就算成功。”", "group": "k25", "multiline": true}, {"key": "chapter/k26/title", "label": "知识点标题", "value": "统一网关与限流：并发、RPM、TPM 与配额各管什么？", "group": "k26", "multiline": false}, {"key": "chapter/k26/intro", "label": "先这样理解", "value": "网关是统一接入与治理的入口，可以承担凭据管理、模型路由、用量统计、限流和部分通用策略。模型网关、工具网关、业务 API 网关的职责可能不同；它们不必合成一个组件，也不能替代每个业务服务的对象权限检查。\n\n**先把四种限制分清。** RPM 是每分钟请求数，TPM 是每分钟 Token 用量，具体输入输出计量按服务规则；并发限制同时有多少请求或任务在处理；配额通常限制更长周期的总预算或资源量。一个请求很长，可能 RPM 不高却触及 TPM；一批慢请求也可能很快占满并发。\n\n一个用户任务又可能触发多轮模型与工具调用。教学例子：一分钟进入 100 个任务，每个平均调用模型 6 次，模型侧就可能需要处理约 600 次请求，还没算重试。容量规划不能把“用户提交数”直接当下游调用数。\n\n令牌桶是常见限流机制：以一定速率补充可用额度，桶有上限，因此允许有限突发；这里的令牌是算法额度，不一定等于大模型 Token。队列可以吸收短暂峰值，但长期到达量超过处理量，排队会一直增长，必须限制队列长度、等待期限或做准入控制。\n\n重试要区分错误，遵守 Retry-After 等提示，在有上限的退避中加入抖动，把集中重试分散开。熔断是在依赖持续失败时暂时停止或减少调用，再试探恢复；隔离不同租户或任务资源则减少某一类故障拖垮其他任务。", "group": "k26", "multiline": true}, {"key": "chapter/k26/decision", "label": "放到产品里怎么判断", "value": "区分短交互与长批处理，为任务预估资源，设置可解释的队列与取消机制。用量预估可先占预算、完成后按实际结算，具体策略要符合服务计量规则。监控等待时间、拒绝率、队列积压和成功率，并检查大租户是否挤占小租户，而不是只看平均接口响应。", "group": "k26", "multiline": true}, {"key": "chapter/k26/scenarios", "label": "项目中的应用场景", "value": "**多租户智能体平台。** 每个组织有预算与速率边界，模型服务还有全局限制。对话请求与批量文档任务分开控制；额度没用完但并发已满时，UI 明确显示排队原因。\n\n**批量知识入库。** OCR、Embedding 和索引各有处理能力，逐层控制吞吐；某个环节慢时暂停或缓冲上游，不能让无限任务堆进内存。", "group": "k26", "multiline": true}, {"key": "chapter/k26/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **请求数不多，却频繁 429。** 检查 TPM、并发、共享组织额度和短窗口突发，而不只看 RPM；按服务错误详情确认原因。\n- **重试后故障更严重。** 查多个层级是否都在重试，导致乘法放大；统一预算并分散重试，持续失败时熔断。\n- **排队看似保护系统，用户一直等。** 检查长期供需、队列上限和超时，必要时拒绝新任务或调整容量，不能用无期限等待掩盖过载。", "group": "k26", "multiline": true}, {"key": "question/26.1/title", "label": "面试题 26.1", "value": "RPM、TPM、并发和配额怎么影响产品设计？", "group": "k26", "multiline": false}, {"key": "question/26.1/answer", "label": "26.1 口述答案", "value": "“RPM 控制请求频度，TPM 控制模型用量速率，并发控制同时处理数，配额控制周期总量。它们可能同时存在，不能只用用户提交次数判断是否超限。\n\n比如一个长报告请求 Token 很多，即使一分钟只发几次，也可能触及 TPM；多个慢任务则占满并发。Agent 一次任务还有多轮调用，会放大下游负载。\n\n产品要区分排队、瞬时限流和预算耗尽，提供对应等待或调整方式。容量评估按任务类别计算调用量、输入输出和耗时，再做压力测试，而不是给所有用户统一一个请求数就结束。”", "group": "k26", "multiline": true}, {"key": "question/26.2/title", "label": "面试题 26.2", "value": "流量突然翻倍，如何保护核心体验？", "group": "k26", "multiline": false}, {"key": "question/26.2/answer", "label": "26.2 口述答案", "value": "“先保护下游和正在执行的任务，对新任务做准入与并发控制，把短交互和长批处理隔离，按租户公平分配。可以用有界队列吸收短峰值，但必须有等待期限和取消机制。\n\n同时看瓶颈是模型 TPM、解析算力还是工具服务，针对性扩容、降级或延后低优先级批任务。不能只提高入口并发把下游进一步压垮。\n\n我会观察队列等待、拒绝率、成功率与恢复耗时，检查流量恢复后积压能否清空。对用户明确任务已受理还是尚未接收，减少重复提交造成二次放大。”", "group": "k26", "multiline": true}, {"key": "question/26.3/title", "label": "面试题 26.3", "value": "指数退避为什么还需要抖动和重试上限？", "group": "k26", "multiline": false}, {"key": "question/26.3/answer", "label": "26.3 口述答案", "value": "“如果所有客户端同一时间失败，再按相同间隔重试，它们仍会同时冲向服务。抖动把重试时间分散，退避给服务恢复空间；上限则防止一个任务无限占资源。\n\n还要区分可重试错误，权限不足或明确业务拒绝通常不应重试。多个调用层都重试，会把一次失败放大成大量请求，所以要统一总次数与总时间预算。写操作先核验幂等和真实状态。\n\n我会用过载和依赖故障测试检查恢复曲线，而不是只验证单次请求最终成功。重试的目标是提高可靠性，不能反过来成为故障放大器。”", "group": "k26", "multiline": true}, {"key": "chapter/k27/title", "label": "知识点标题", "value": "租户与权限隔离：谁能看什么，必须在哪些位置生效？", "group": "k27", "multiline": false}, {"key": "chapter/k27/intro", "label": "先这样理解", "value": "租户通常对应一个客户组织，多租户系统要隔离数据、配置、凭据与资源。一个组织内部还可能按部门、项目和文件共享关系控制访问。租户隔离与对象权限是两层问题，不能只有 tenant_id 就认为全部完成。\n\nRBAC 按角色授予能力，例如管理员、编辑者、只读成员；ABAC 根据用户、对象与环境属性判断，例如部门和数据等级；ReBAC 根据关系判断，例如项目成员、文档共享对象。实际系统可以组合，产品需要把“谁、对哪个对象、能做什么、在什么条件下”说清楚。\n\n**身份必须来自可信认证链路。** 客户端参数或模型生成的用户 ID 不能直接成为执行身份。服务端将当前身份与租户绑定，再做对象级授权。拥有平台登录权限，不代表能读取任意文件；能读文件也不等于能修改或分享。\n\nRAG 的权限边界应覆盖候选范围、正文取回、模型上下文和引用预览。无权正文不能先交给模型再要求它保密。若底层检索不能直接精确过滤，就要在可信层过滤候选并校验后再取回；注意过滤后候选不足可能降低可回答率，需要另外优化召回。\n\n缓存、记忆、日志和第三方连接器同样可能形成旁路。缓存键只按问题文本，会让相同问题复用别人的答案；需要纳入有效数据范围或权限版本等设计。物理分库能加强某些隔离，但不自动修复应用层错误，逻辑隔离也必须有系统性验证。", "group": "k27", "multiline": true}, {"key": "chapter/k27/decision", "label": "放到产品里怎么判断", "value": "使用权限矩阵表达角色、对象和动作，覆盖继承、共享、撤销、成员离职及任务中途变化。测试既有跨租户，也有同租户跨部门，重点观察内容是否进入上下文与工具，不只检查 UI 是否隐藏入口。高影响动作执行前核验当前权限与对象版本。", "group": "k27", "multiline": true}, {"key": "chapter/k27/scenarios", "label": "项目中的应用场景", "value": "**企业知识助手。** 人事和研发提同样的问题，只能使用各自允许的资料；分享链接预览仍校验访问，不能因为引用来自 AI 就放开。\n\n**客户组织工作台。** 不同企业连接各自 CRM 与文档系统，凭据按组织和授权主体隔离，任务日志与用量也归属对应组织。切换组织后旧上下文不继续混用。", "group": "k27", "multiline": true}, {"key": "chapter/k27/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **数据库隔离了，答案却串租户。** 检查答案缓存、向量命名空间、日志回放、会话与连接器凭据等旁路。\n- **撤权后旧对话仍能继续使用文件。** 检查历史片段重新组装与引用预览，处理权限变化后的状态和衍生内容，而不只删除搜索结果。\n- **权限过滤后回答变差。** 测试授权范围内必要证据是否仍能召回，调整合法候选获取方式，不能通过放宽权限换质量。", "group": "k27", "multiline": true}, {"key": "question/27.1/title", "label": "面试题 27.1", "value": "如何设计企业 RAG 的权限控制？", "group": "k27", "multiline": false}, {"key": "question/27.1/answer", "label": "27.1 口述答案", "value": "“我会把可信用户身份和租户范围贯穿到检索、原文读取和引用访问。无权内容在进入模型之前就要被排除，不能依靠提示词让模型不说出来。\n\n索引需要携带足够授权信息或关联可信权限服务，读取时处理动态撤权。缓存和历史追问也要纳入，避免同一句问题命中其他用户的答案。引用链接再次打开仍做校验。\n\n验证用多账号、跨部门、跨租户与撤权场景，看实际上下文和输出，而不只看前端列表。权限过滤后还要单独评估召回质量，但优化不能突破访问范围。”", "group": "k27", "multiline": true}, {"key": "question/27.2/title", "label": "面试题 27.2", "value": "逻辑隔离与物理隔离如何选择？", "group": "k27", "multiline": false}, {"key": "question/27.2/answer", "label": "27.2 口述答案", "value": "“我会看客户的数据边界、运维要求、规模和成本。逻辑隔离通过租户范围与授权规则共享基础设施，资源利用更灵活，但要求所有访问路径正确执行；物理隔离使用独立库或环境，边界更明确，却增加部署与维护成本。\n\n两者都不能免除应用层权限和凭据管理。独立数据库也可能因缓存串用或连接器选错而泄露，同租户内部还有对象权限。\n\n因此我会按实际隔离要求选方案，并对存储、缓存、日志、模型请求和外部连接做完整验证。不是简单用‘独立部署更安全’代替具体设计，也不只靠一个 tenant_id 字段证明隔离。”", "group": "k27", "multiline": true}, {"key": "question/27.3/title", "label": "面试题 27.3", "value": "AI 工具的执行身份应该怎样确定？", "group": "k27", "multiline": false}, {"key": "question/27.3/answer", "label": "27.3 口述答案", "value": "“执行身份应由认证后的应用上下文和授权关系决定，不能让模型填一个用户 ID 就切换身份。模型提供业务参数，服务端绑定调用主体，再检查这个主体对具体对象能做什么。\n\n如果使用服务账号，还要明确它代表谁、能访问哪些范围，防止拥有更大权限的服务账号替普通用户越权。当前用户有读权限，也不自动拥有修改或分享权限。\n\n我会测试伪造租户参数、跨对象调用、撤权和账号切换，核对审计记录里的实际主体。模型建议是否合理与系统是否有权执行，是必须分别成立的条件。”", "group": "k27", "multiline": true}, {"key": "chapter/k28/title", "label": "知识点标题", "value": "提示词注入防护：为什么资料里的话不能变成系统命令？", "group": "k28", "multiline": false}, {"key": "chapter/k28/intro", "label": "先这样理解", "value": "提示词注入是输入内容试图改变模型原本应该遵守的任务或规则。直接注入来自用户输入，间接注入可能藏在网页、文档、邮件、图片文字或工具返回中。外部内容本应是任务材料，却试图把自己变成更高优先级的指令。\n\n这种问题难在模型用自然语言同时处理规则与资料，边界不像传统程序变量那样天然隔开。标签、分隔符和明确指令有帮助，但不能保证模型永远不混淆。工具描述与检索资料也不能因为来自已连接服务，就自动获得系统级信任。\n\n**防护重点是限制错误产生真实影响的路径。** 让当前任务只获得必要工具和数据，由服务端控制权限与参数，限制外发目的地和写入范围，对重要动作执行独立策略。只读摘要任务不应顺带拥有删除、转账或任意外发能力。\n\n模型判断、内容过滤与外部约束可以多层配合，但过滤可疑词不够。正常安全文档也会讨论“忽略指令”等文字，简单关键词拦截会误伤；攻击也可能绕开这些词。验证要观察最终工具行为和数据流，不只看模型是否口头拒绝。\n\n模型输出进入网页或数据库时还需要常规安全处理，例如 HTML 清理、参数化查询和权限校验。提示词注入与传统注入不是同一个问题，但可能通过系统集成扩大影响，不能因为内容由 AI 生成就跳过已有工程保护。", "group": "k28", "multiline": true}, {"key": "chapter/k28/decision", "label": "放到产品里怎么判断", "value": "把用户授权、应用规则和外部数据分开标明来源。建立受控攻击样本与正常业务样本，同时看未经授权行为发生率和合法任务被误拦的比例。单次测试没有成功攻击不代表不存在风险；随工具、模型、资料渠道变化做针对性回归。", "group": "k28", "multiline": true}, {"key": "chapter/k28/scenarios", "label": "项目中的应用场景", "value": "**网页研究助手。** 读取网页做比较时，网页只能提供被分析内容，不能改变文件访问权限或触发额外外发。输出引用真实来源，工具范围与研究目标一致。\n\n**企业邮件助手。** 邮件附件中的操作建议属于待分析数据；是否创建任务、回复或共享文件，仍依据用户请求与系统授权。外部发件人的文字不能代替收件人的确认。", "group": "k28", "multiline": true}, {"key": "chapter/k28/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **模型答复守规矩，背后却调用了错误工具。** 检查实际调用参数和外发记录，评测不能只观察最终文本。\n- **防护越加越严，正常资料读不了了。** 用合法引用命令、安全培训等样本测误拦，优化来源与行为约束，不仅加禁词。\n- **新工具接入后风险突然增大。** 新能力扩展了可执行范围，重新评估信任边界、描述变更和权限，不把旧测试通过视为永久有效。", "group": "k28", "multiline": true}, {"key": "question/28.1/title", "label": "面试题 28.1", "value": "提示词注入为什么在 Agent 中更值得关注？", "group": "k28", "multiline": false}, {"key": "question/28.1/answer", "label": "28.1 口述答案", "value": "“因为 Agent 把语言判断接到了真实工具。普通回答被诱导可能只是内容偏离；如果系统把外部文档里的命令当成授权，就可能读取、修改或发送不该处理的数据。\n\n我会区分任务指令与资料来源，并把权限、可用工具和参数范围交给系统强制执行。比如只做网页总结，就没有必要提供文件删除工具。\n\n防护不是要求模型更听话就结束，关键是即使模型误读了资料，错误能否被限制在可控范围。验收要看实际工具和数据流，而不是只看回答有没有说‘我不会执行’。”", "group": "k28", "multiline": true}, {"key": "question/28.2/title", "label": "面试题 28.2", "value": "为什么不能只靠一个安全 Prompt 或检测模型？", "group": "k28", "multiline": false}, {"key": "question/28.2/answer", "label": "28.2 口述答案", "value": "“因为它们仍然依赖模型判断，存在漏判和误判，且外部内容形式很多。检测模型可以作为一层，但不能成为唯一的权限门槛。\n\n我会组合来源标记、最小工具范围、服务端授权、参数与外发约束，以及必要的人审。对生成的代码、HTML 或查询，也继续使用原本的执行隔离和输入输出校验。\n\n这样不同层解决不同问题：模型帮助识别语义，系统约束限制实际能力。即使检测漏掉某条指令，也不应因此获得新的数据访问或写操作权限。”", "group": "k28", "multiline": true}, {"key": "question/28.3/title", "label": "面试题 28.3", "value": "怎样验证防护有效，又没有过度影响可用性？", "group": "k28", "multiline": false}, {"key": "question/28.3/answer", "label": "28.3 口述答案", "value": "“我会准备受控的直接和间接注入样本，覆盖网页、文档和工具返回，同时加入正常讨论指令、安全案例和引用文本的业务资料。\n\n评价两面：是否发生未经授权的访问或动作，以及正常任务是否被误拦或无法完成。记录具体来源、模型决策与工具执行，区分检测成功和系统约束成功，而不是合成一个模糊通过率。\n\n工具或模型版本变化后跑相关回归，线上抽查也遵循数据权限。测试结果只能说明覆盖范围内的表现，不能据此承诺所有注入都被彻底解决。”", "group": "k28", "multiline": true}, {"key": "chapter/k29/title", "label": "知识点标题", "value": "异步、幂等与恢复：超时之后，怎样确认到底做没做？", "group": "k29", "multiline": false}, {"key": "chapter/k29/intro", "label": "先这样理解", "value": "异步任务把“接收请求”和“完成工作”拆开：先返回任务 ID，再后台执行，通过查询、事件或通知反馈结果。长文档处理、批量索引与跨系统任务都适合这样设计。状态应区分排队、运行、等待用户、部分完成、成功、失败、取消与结果待确认，按业务选择，不必把所有状态塞进每个任务。\n\n消息队列或客户端重试可能让同一请求被投递多次。至少一次投递侧重避免丢任务，不保证只处理一次。幂等要在业务层控制：重复请求同一操作，不产生额外重复效果。它不等于“不允许重试”，恰恰是为了让某些重试可控。\n\n比如创建订单请求超时后，应先查询结果；需要重试且下游支持幂等时，沿用同一业务幂等标识，避免多创建一张订单。\n\n**幂等键要绑定一笔具体业务操作。** 服务端记录键、调用主体、请求内容摘要与执行状态；同键同请求可返回原结果，同键不同内容应拒绝或按明确规则处理。键的作用范围、有效期、并发竞争与存储一致性都要设计。简单“先查有没有，再插入”若没有原子约束，并发请求仍可能一起执行。\n\n超时意味着没有按时拿到结果，不等于动作没发生。下游支持幂等和状态查询时，用同一标识查证或重试；如果外部操作已成功、但本地尚未记录就断线，本地去重表也可能不知道结果。跨系统不能仅靠本地状态就承诺严格一次执行。\n\n恢复依赖检查点、真实业务回执与补偿。Saga 类思路把长事务拆成步骤，失败时执行对应补偿，例如取消预订；补偿是新的业务动作，可能有费用、限制，也可能失败。回滚一行数据库不会自动撤回已经发出的消息。", "group": "k29", "multiline": true}, {"key": "chapter/k29/decision", "label": "放到产品里怎么判断", "value": "明确取消的含义：停止未来步骤、请求中断当前处理，还是补偿已发生动作。取消请求与任务完成可能竞争，界面以最终确认状态为准。针对同请求并发、回执丢失、消息重复、补偿失败做故障测试，核对外部系统中的最终对象数和状态。", "group": "k29", "multiline": true}, {"key": "chapter/k29/scenarios", "label": "项目中的应用场景", "value": "**批量创建待办。** 每个待办有稳定操作标识，逐项保存成功 ID；重试只补失败或已核实未执行的项。任务整体允许部分完成，不把全部失败掩盖已创建记录。\n\n**跨系统申请。** 先占资源、再发起审批、最后确认使用；审批失败时释放占用。每步状态可查询，补偿失败进入待处理队列，避免资源长期锁住。", "group": "k29", "multiline": true}, {"key": "chapter/k29/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **按钮禁用了，还是创建两条。** 重复可能来自网络、队列或 Agent 多轮调用；检查服务端与下游幂等，前端防抖不是最终保证。\n- **用了幂等键仍重复。** 检查每次重试是否生成新键、有效期是否过短、并发约束是否原子，以及下游副作用是否被覆盖。\n- **用户取消后，外部动作仍已完成。** 检查取消到达时机与服务支持的中断能力，准确呈现已发生部分，按业务规则决定是否补偿。", "group": "k29", "multiline": true}, {"key": "question/29.1/title", "label": "面试题 29.1", "value": "幂等应该怎样设计，为什么只加一个 requestId 不够？", "group": "k29", "multiline": false}, {"key": "question/29.1/answer", "label": "29.1 口述答案", "value": "“requestId 只是标识，是否幂等取决于它如何绑定业务动作以及服务端如何处理重复。我要明确键的主体范围、请求内容、生命周期和状态存储，同一动作重试沿用同一键，不同内容不能误复用。\n\n并发时需要原子去重或唯一约束，不能两个请求都查到不存在就一起执行。若还有下游写操作，要利用下游幂等或状态查询，处理下游成功但本地记录前断线的情况。\n\n验收会并发重复提交、丢失回执并再次调用，核对最终只有预期业务效果。前端防抖和模型记忆只能减少重复意图，不能替代这些保证。”", "group": "k29", "multiline": true}, {"key": "question/29.2/title", "label": "面试题 29.2", "value": "接口超时，怎样判断是否可以自动重试？", "group": "k29", "multiline": false}, {"key": "question/29.2/answer", "label": "29.2 口述答案", "value": "“先分读写和下游能力。只读查询通常更容易重试，但也要控制负载；写操作则可能已经完成，只是回执没回来，所以先根据业务标识查状态。\n\n确认成功就补齐本地记录；确认未执行且条件仍满足，可以在预算内重试；状态未知时结合幂等支持决定，不能换个新标识再次执行。下游既没有查询也没有可靠幂等时，要保守处理或人工核对。\n\n界面明确显示待确认，而不是把超时直接说成失败。这样才能避免用户又点一次、Agent 又重试一次，最终产生多笔真实操作。”", "group": "k29", "multiline": true}, {"key": "question/29.3/title", "label": "面试题 29.3", "value": "跨系统任务失败后，回滚和补偿有什么区别？", "group": "k29", "multiline": false}, {"key": "question/29.3/answer", "label": "29.3 口述答案", "value": "“数据库事务回滚可以撤销事务内未提交的变化，但跨系统已经发生的动作往往只能通过新动作补偿。比如已订酒店后会议取消，要调用取消预订，可能受退改规则约束，不是把本地状态改回去就完成了。\n\n我会记录每一步的状态与回执，定义可重试、可补偿和不可逆环节。补偿本身也要幂等、可观察，失败后有继续处理的路径。恢复时优先复用有效产物，不无条件从头再跑。\n\n用户应该看到部分完成及后续选择。产品不能承诺一次取消能撤销所有已发生动作，必须把真实业务能力和成本讲清楚。”", "group": "k29", "multiline": true}, {"key": "chapter/k30/title", "label": "知识点标题", "value": "日志与链路追踪：怎样把‘慢’和‘答错’定位到具体一步？", "group": "k30", "multiline": false}, {"key": "chapter/k30/intro", "label": "先这样理解", "value": "Logs 是事件记录，Metrics 是聚合指标，Traces 把一次请求或任务经过的步骤关联起来。三者分别帮助知道发生了什么、影响范围多大、具体卡在哪里。只有总耗时曲线，没有执行链路，通常很难解释某个用户为什么失败。\n\nTrace 是一条执行链，Span 是其中一个操作片段，例如检索、重排、模型调用或保存。Span 带开始结束时间、状态与必要属性，并按父子关系连接。异步任务还要把任务 ID 与 Trace 关联，跨队列后不能丢失关联，否则前台请求结束后后台错误就无从追踪。\n\n**模型体验要拆时间。** TTFT 是从明确起点到第一个输出 Token 的耗时，需说明是否包含排队和网络；后续生成速度描述输出阶段；端到端时延还包括检索、工具、人工等待等。用户说“慢”，可能是迟迟没有首字，也可能是工具来回调用，解决办法不同。\n\nP95 表示观测值中约 95% 不超过这个值，不是平均数。端到端 P95 应从端到端样本计算，不能简单把各节点 P95 相加：最慢样本不一定是同一请求，并行步骤也不是串行累加。\n\n诊断质量需要记录模型与提示词版本、资料引用、候选到最终上下文的选择、工具参数和真实状态，但不等于存下所有原文。凭据不进日志，敏感字段按必要性处理，访问与保留期限受控。隐藏思维不是排错必需品，可核对的输入、动作与结果更重要。", "group": "k30", "multiline": true}, {"key": "chapter/k30/decision", "label": "放到产品里怎么判断", "value": "给用户看真实进度与可行动信息，给运维看成功率、成本和依赖健康，给研发看授权范围内的节点细节。记录采样策略，重要失败尽量保留足够诊断证据。按任务类型和输入规模分组，避免小请求平均值掩盖长任务体验。", "group": "k30", "multiline": true}, {"key": "chapter/k30/scenarios", "label": "项目中的应用场景", "value": "**知识问答排错。** 用户反馈某条款错误，按任务找到解析版本、召回候选、最终证据与回答，定位是漏证据、选错版本还是生成误读。\n\n**Agent 成本诊断。** 将每轮模型、工具和重试费用关联同一任务，发现反复搜索或失败升级造成的额外消耗，而不是只看到一张模型总账。", "group": "k30", "multiline": true}, {"key": "chapter/k30/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **平均延迟下降，投诉增加。** 检查高分位与重要任务分组，是否少数长任务等待更久；同时核对首字与最终完成时间。\n- **后台失败，前台链路显示成功。** 检查异步任务关联和受理／完成语义，HTTP 请求结束不能当后台任务结束。\n- **日志很多，仍无法复现。** 缺少版本、资料引用或状态关联时，增加文本量帮助有限；先补关键标识与结构化事件。", "group": "k30", "multiline": true}, {"key": "question/30.1/title", "label": "面试题 30.1", "value": "智能体平台的 Trace 应该记录哪些关键内容？", "group": "k30", "multiline": false}, {"key": "question/30.1/answer", "label": "30.1 口述答案", "value": "“以用户任务为主线，关联模型调用、检索、工具与状态变化。至少记录任务和操作标识、配置版本、耗时、错误类型、用量、必要来源及业务回执，能够从反馈追到具体步骤。\n\n检索问题需要看到候选与最终上下文的差别，工具问题需要看到参数和真实业务状态。异步任务跨队列后也要保持关联，不能只记录入口接口。\n\n但我不会把所有资料和凭据默认写进日志。按排错需要保留最小信息，对敏感内容设置权限和期限。可观测性的目标是解释问题与验证修复，而不是无限收集数据。”", "group": "k30", "multiline": true}, {"key": "question/30.2/title", "label": "面试题 30.2", "value": "用户说 AI 很慢，你会怎样分析？", "group": "k30", "multiline": false}, {"key": "question/30.2/answer", "label": "30.2 口述答案", "value": "“先定义慢在哪：任务排队、首字出现、输出生成还是后续工具执行。用 Trace 拆开各段耗时，再按任务类型、输入长度、模型和高峰时段分组。\n\n长输入可能拖慢首字，长输出延长生成，多轮工具可能把总时间拉长；还有服务端排队和网络因素。P95 等分位数能观察尾部体验，但要用正确的端到端样本计算，不能把节点 P95 相加。\n\n定位后再选压缩上下文、缓存、并发优化、模型路由或减少无效轮次。流式显示可以改善等待感，是否真正变快仍要看测量，并确保没有牺牲任务质量。”", "group": "k30", "multiline": true}, {"key": "question/30.3/title", "label": "面试题 30.3", "value": "怎样设计可观测性，才能支持内容质量优化？", "group": "k30", "multiline": false}, {"key": "question/30.3/answer", "label": "30.3 口述答案", "value": "“我会让用户反馈关联任务与版本，再保留足够的证据路径。比如 RAG 答错，必须能对照原始资料、召回结果、最终上下文和输出；只有一条‘模型调用成功’日志，解释不了质量问题。\n\n随后把失败归类成解析、检索、选证、生成或执行问题，统计频率与影响。典型样本经过授权和脱敏进入回归集，修复后用同类问题验证。\n\n这些信息要与性能和费用关联，才能判断某次质量提升付出了什么代价。日志本身不是质量指标，但它让我们知道应该改哪一层、改完有没有真的解决。”", "group": "k30", "multiline": true}, {"key": "chapter/k31/title", "label": "知识点标题", "value": "评测体系：怎么证明系统更好，而不是刚好答对了几题？", "group": "k31", "multiline": false}, {"key": "chapter/k31/intro", "label": "先这样理解", "value": "评测先回答两个问题：系统应该完成什么，怎样判定完成。模型有输出、格式合法和任务成功是不同层次。写报告要检查事实与材料覆盖，客服处理要核对订单状态，代码修改要验证目标行为与相关回归，不能共用一个“回答质量 8 分”解决所有验收。\n\n**测试集要代表真实任务，也要暴露关键失败。** 从目标用户任务中抽样，按类型、复杂度、输入长度和风险分层，再补充低频高影响的边界。代表性样本用于估计常态表现，专项压力与攻击样本用于验证边界；可以分别报告，不能随意混成一个总体成功率。\n\n开发集帮助发现问题和调参，保留集用于较独立地判断效果。反复看着同一套保留题修改，事实上也会把它变成开发集，需要补充新样本。资料、评分规则和版本变化都应记录，避免把测试条件改变误认为模型进步。\n\n比如用同一批任务比较新旧提示词的正确率、成本和失败情况，再决定是否上线；旧方案的表现就是比较基线。\n\n评分分工也重要：JSON 结构、计算结果、工具状态可用程序核验；复杂事实和表达需要人工规则；模型评委可以扩展评审规模，但要与人工标注对齐，检查位置、篇幅、自偏好和注入等偏差。给评委足够证据，不让它只凭流畅程度打分。\n\n**模型输出有波动，数据也有抽样误差。** 同一任务可能要重复运行，尤其关注一次成功和稳定成功的差别。比较新旧版本尽量用相同输入，观察成对变化与不同任务分组；少量样本上的小提升需要不确定性分析，不能轻易宣称显著。", "group": "k31", "multiline": true}, {"key": "chapter/k31/decision", "label": "放到产品里怎么判断", "value": "定义组件、任务、业务三层指标。组件帮助定位，任务看最终结果与约束，业务看人工修改、采纳与价值。自动完成与人工辅助完成分开统计，失败任务的消耗仍计入成本。发布门槛提前约定，重要约束单独设置，不用其他普通题加分抵消越权或重复交易。", "group": "k31", "multiline": true}, {"key": "chapter/k31/scenarios", "label": "项目中的应用场景", "value": "**模型或提示词升级。** 在固定数据与工具环境上比较旧新版本，观察事实、工具选择、结构、时延与费用，再灰度验证真实流量。对会产生副作用的任务使用测试环境或只读回放。\n\n**企业知识问答验收。** 标注必要证据、适用条件和不可回答原因，分别测召回、答案与引用。用例不只是一句标准答案，还包括为什么这个答案成立。", "group": "k31", "multiline": true}, {"key": "chapter/k31/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **离线高分，上线不好用。** 检查任务分布、资料质量和用户交互差异，是否遗漏真实等待、补问和执行步骤。\n- **改一版涨分，再测又掉。** 检查样本规模、输出波动与评分稳定性；固定条件并重复关键任务，不根据一次运行下结论。\n- **评委喜欢长答案，实际用户嫌啰嗦。** 评分规则明确任务完成与简洁要求，随机交换候选顺序，并与人工判断对齐。", "group": "k31", "multiline": true}, {"key": "question/31.1/title", "label": "面试题 31.1", "value": "从零搭建 Agent 评测体系，你先做什么？", "group": "k31", "multiline": false}, {"key": "question/31.1/answer", "label": "31.1 口述答案", "value": "“先选核心任务并定义可核验的成功条件，明确允许的动作和失败边界。然后从真实类型的任务抽样分层，补上缺信息、工具失败、权限变化和中断恢复等关键用例。\n\n组件层看检索和工具参数，任务层核对最终业务状态与约束，业务层看人工修改和成本。能用程序判断的直接核验，复杂内容用明确规则人工标注，再引入经过校准的模型评委。\n\n开发集与保留集分开，记录数据与配置版本。升级时做离线对照，再小范围验证真实任务，不把某个模型榜单或几条演示结果直接当产品验收。”", "group": "k31", "multiline": true}, {"key": "question/31.2/title", "label": "面试题 31.2", "value": "两个版本成功率差两个百分点，能说明新版更好吗？", "group": "k31", "multiline": false}, {"key": "question/31.2/answer", "label": "31.2 口述答案", "value": "“还不能，先看样本量、任务分布和波动。少量任务里多成功一两条就可能产生这个差距；如果新旧测试输入不一致，比较也不公平。\n\n我会尽量用相同任务成对比较，检查哪些题变好、哪些退化，并按关键场景分组。对随机性明显的任务重复运行，结合置信区间或合适的统计分析判断不确定性。关键失败不能被总体平均掩盖。\n\n即使质量提升可信，还要看成本、时延和上线约束。结论应说明收益范围和证据强度，不能只因为数字大一点就全量切换。”", "group": "k31", "multiline": true}, {"key": "question/31.3/title", "label": "面试题 31.3", "value": "模型当评委怎么用才可靠？", "group": "k31", "multiline": false}, {"key": "question/31.3/answer", "label": "31.3 口述答案", "value": "“先把评分维度和证据给清楚，避免让评委凭整体印象打分。比如回答事实是否被资料支持，要提供原始证据与判定规则；计算和工具状态则直接用程序校验。\n\n我会抽样与人工标注对齐，检查它是否偏好长答案、候选位置或某类表达，必要时交换顺序、拆维度评分。被评内容也可能带有干扰指令，需要作为数据处理。\n\n模型评委适合帮助扩展覆盖和发现问题，但不是唯一真相。对高影响错误保留更强核验，并持续检查新任务分布下是否仍与业务判断一致。”", "group": "k31", "multiline": true}, {"key": "chapter/k32/title", "label": "知识点标题", "value": "版本发布与资产管理：怎样更新能力，又能解释和恢复变化？", "group": "k32", "multiline": false}, {"key": "chapter/k32/intro", "label": "先这样理解", "value": "一个 Agent 的行为由多项资产共同决定：模型及参数、提示词、工具 Schema、工作流、检索策略、知识版本和运行配置。仅记录“Prompt v3”，常常无法重现某次回答，因为模型或工具可能已经变了。\n\n资产管理要保存所有者、用途、接口、依赖、版本与质量记录。别人复用一个工作流模板时，需要知道适用场景、需要哪些凭据与资料、用什么测试过，不能只复制一张画布。版本组合可以形成一次发布的清单，明确哪些变化一起上线。\n\n**发布要区分验证方式。** 离线回放使用固定样本比较；影子流量让新版本观察真实请求但不影响用户结果；灰度让一部分真实任务使用新版；对照实验按合适单位分配版本来评估效果。影子执行涉及写操作时必须禁用副作用或使用隔离环境，不能同时创建两笔真实订单。\n\n进行中的长任务通常需要明确版本策略，避免前半段用旧 Schema、后半段读到新字段。兼容变更可以平滑升级，不兼容变更需要迁移或保留旧接口。权限撤销与安全策略则不能因为任务固定旧版本就被忽略。\n\n回退只能恢复配置或代码到旧组合，不自动撤销已经发出的内容或创建的订单。知识版本回退也不能重新开放已删除或撤权的数据。业务补偿、数据修复与版本回滚要分别处理。", "group": "k32", "multiline": true}, {"key": "chapter/k32/decision", "label": "放到产品里怎么判断", "value": "发布前明确受影响任务、回归范围、观察指标和停止条件，确保旧方案仍可用或有替代路径。资产数量不是效果，复用成功率、首次交付时间、维护负担与实际使用才说明价值。长期无人维护或依赖失效的模板应下架或标记，避免污染能力目录。", "group": "k32", "multiline": true}, {"key": "chapter/k32/scenarios", "label": "项目中的应用场景", "value": "**工具接口升级。** 退款工具增加分项金额字段，检查引用它的 Agent 和流程，验证旧调用是否仍有明确语义；不能让默认值悄悄变成整单退款。\n\n**知识检索策略发布。** 新索引与 Embedding 成套验证，切换查询版本并持续同步更新，保留可回退路径；监控不同资料类型的收益，避免整体提升掩盖某一类退化。", "group": "k32", "multiline": true}, {"key": "chapter/k32/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **回滚提示词，效果却没回来。** 检查模型、工具与知识索引是否同时变化，回退完整兼容组合，而不是单个文件。\n- **灰度结果混在一起看不出差异。** 记录版本分组与任务流量，检查用户或会话是否跨版本污染，并按同类任务比较。\n- **模板很多，实际没人敢用。** 补用途、示例、依赖、维护人和测试结果，减少重复与失效资产，衡量成功复用而非收藏数。", "group": "k32", "multiline": true}, {"key": "question/32.1/title", "label": "面试题 32.1", "value": "智能体发布时应该固定哪些版本信息？", "group": "k32", "multiline": false}, {"key": "question/32.1/answer", "label": "32.1 口述答案", "value": "“固定会影响行为的主要组合：模型和参数、提示词、工具接口、流程、检索策略以及使用的知识版本，并记录评测集和结果。这样用户反馈时能知道当时运行的到底是哪套系统。\n\n长任务还要规定是否沿用启动时的兼容版本，避免中途字段含义变化。但动态权限和撤销仍按当前规则检查，不能为了复现恢复过期授权。\n\n版本管理不只是存历史，还要描述依赖和兼容性。否则只回滚 Prompt，其他组件已经变了，可能既解释不了问题，也恢复不了旧表现。”", "group": "k32", "multiline": true}, {"key": "question/32.2/title", "label": "面试题 32.2", "value": "影子流量和灰度发布有什么区别？", "group": "k32", "multiline": false}, {"key": "question/32.2/answer", "label": "32.2 口述答案", "value": "“影子流量通常让新版处理相同或复制的请求，但用户仍收到原版本结果，适合观察质量和性能；灰度则让一部分真实任务真正使用新版，会影响用户体验。两者的风险与判断目的不同。\n\nAgent 可能调用写工具，所以影子验证不能无控制复制副作用。可以记录原工具结果供回放，或在隔离环境执行，明确这不等同于完整真实环境表现。\n\n灰度前约定样本分配、监控和回退条件，比较同类任务，关注关键错误。不能只因为影子答案看起来不错，就忽略真实交互、权限与下游执行差异。”", "group": "k32", "multiline": true}, {"key": "question/32.3/title", "label": "面试题 32.3", "value": "AI 资产怎样沉淀才有复用价值？", "group": "k32", "multiline": false}, {"key": "question/32.3/answer", "label": "32.3 口述答案", "value": "“我会把资产做成有边界的交付件，说明解决什么任务、输入输出是什么、依赖哪些模型工具与数据、用什么样本验证过、由谁维护。模板、工具和知识连接都需要这些信息。\n\n上线前给出可运行示例，变更时追踪受影响应用，失效时及时归档。让使用者找到并成功用起来，比积累很多名字相似的模板更重要。\n\n衡量复用价值看首次交付时间、复用后成功运行比例和维护成本。复制次数高但后续都要大幅改造，可能说明抽象边界不合适，而不是沉淀已经成功。”", "group": "k32", "multiline": true}, {"key": "chapter/k33/title", "label": "知识点标题", "value": "场景选择与优先级：第一版先证明哪件事值得做？", "group": "k33", "multiline": false}, {"key": "chapter/k33/intro", "label": "先这样理解", "value": "智能体平台可以展示模型、工具、知识库和画布，但用户购买的是工作结果。选场景先画出现有流程：谁在什么时刻做什么、用哪些资料和系统、哪里耗时或容易错、结果由谁验收。没有这一步，容易把“可以接 AI”误当成“值得做”。\n\n价值侧看频率、耗时、错误损失与使用人群；可行性看数据、接口、权限和结果可验证性；经营侧看交付成本、实施复杂度与持续使用机会。评分可以帮助比较，但分数背后的证据与不确定性比精确小数更重要。访谈样本不足时，明确哪些仍是假设。\n\n**是否需要 Agent，要看变化发生在哪里。** 固定字段与规则，用普通程序可能足够；非结构化理解，可以只加一个模型节点；需要根据工具反馈探索下一步，才考虑更多动态决策。自主程度应服务任务，不是第一版必须拉满的指标。\n\nMVP 不是删到只剩聊天演示，而是缩小范围后仍能检验价值的完整闭环。比如只支持一个制度域的客服辅助答复，但必须包括资料适用、引用、修改和反馈；如果省掉结果核验，就无法知道它到底替用户省了什么工作。\n\n比如先让一类资料完成“检索—生成—确认保存”的闭环，再考虑更多复杂任务。\n\n验证要同时设继续与停止条件。用户采用、减少处理时间是正向信号；大量校对、权限长期拿不到、错误损失无法接受，则可能需要收窄、换场景或停止。不要把每次失败都解释为再加一点模型能力就能成功。", "group": "k33", "multiline": true}, {"key": "chapter/k33/decision", "label": "放到产品里怎么判断", "value": "明确需求假设、基线流程、目标用户、成功指标、范围和前置依赖，再安排小样本验证。与同类任务比较包含核查返工的总时间，而不只比较生成速度。先用方案试验或受控试点降低不确定性，再承诺规模化交付。", "group": "k33", "multiline": true}, {"key": "chapter/k33/scenarios", "label": "项目中的应用场景", "value": "**企业客服助手的第一版。** 假设高频咨询集中在有稳定文档的产品规则，人工能核对答案，订单写操作暂不具备可靠接口：可以先做带引用的回复草稿，验证处理效率，再考虑订单操作。这是条件明确的选择，不是所有企业都应先做客服。\n\n**内部研究助手试点。** 先支持指定来源、固定比较维度和证据表，暂不承诺自主全网调查与自动发布。验证研究人员是否更快获得可用资料，而不只看报告页数。", "group": "k33", "multiline": true}, {"key": "chapter/k33/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **用户觉得有趣，几天后不用。** 回到真实工作时刻，检查结果是否能进入现有流程、有没有减少完整任务成本，而不是继续加聊天花样。\n- **需求池里什么都高优先级。** 要求给出频率、影响与依赖证据，区分价值假设和已知事实；没有接口的高价值任务也可能暂时不可交付。\n- **试点成功，扩展后成本失控。** 检查是否依赖少数专家手工清洗或逐次救场，把隐性人工与实施成本纳入规模化评估。", "group": "k33", "multiline": true}, {"key": "question/33.1/title", "label": "面试题 33.1", "value": "如果让你负责一个企业 Agent 平台，第一版做什么？", "group": "k33", "multiline": false}, {"key": "question/33.1/answer", "label": "33.1 口述答案", "value": "“我先给出条件再做选择。假设目标客户有高频产品咨询、资料维护较好、客服能核对答案，但交易写接口不成熟，我会先做带来源的客服回复草稿，暂不直接自动退款。因为资料入口和验收清楚，也能在较小范围测效率。\n\n第一版选一个问题域，完成提问、检索、引用、编辑与反馈闭环。对照原流程测完整处理时间、关键事实错误和人工修改，确认是否真正有用。若主要困难其实在查询订单而非找政策，就应调整方向，补业务集成。\n\n我不会脱离客户条件给所有平台同一答案。首选场景要能被验证，也要有明确的扩大或停止条件。”", "group": "k33", "multiline": true}, {"key": "question/33.2/title", "label": "面试题 33.2", "value": "什么需求值得做成 Agent，什么不值得？", "group": "k33", "multiline": false}, {"key": "question/33.2/answer", "label": "33.2 口述答案", "value": "“我看任务是否需要在不确定环境下根据反馈选择行动。输入、规则和步骤固定，普通自动化通常更容易验证；只是需要理解文本，可以在工作流里加模型；需要跨资料和工具探索，才值得增加 Agent 决策。\n\n比如固定格式报表按时发送，不必让模型重新规划；调查客户问题可能要根据日志和查询结果决定下一步，更适合限定范围的 Agent。还要看错误后果和最终结果能否核验。\n\n我会用最简单可行方案做基线，比较增加自主决策后的成功率、时延和人工量。技术上做得到，不等于业务上值得承担更多不确定性。”", "group": "k33", "multiline": true}, {"key": "question/33.3/title", "label": "面试题 33.3", "value": "业务方要求第一版全覆盖，你怎么收敛并推进？", "group": "k33", "multiline": false}, {"key": "question/33.3/answer", "label": "33.3 口述答案", "value": "“先把要验证的核心价值讲清楚，再按用户任务拆范围，不按技术功能随意裁剪。比如客服草稿先覆盖一个产品和高频问题域，仍保留引用、编辑和失败反馈；复杂交易处理放到具备接口与验证条件后。\n\n我会列出数据、权限、接口和运营维护的依赖，设可验收里程碑：资料可用、核心任务达标、受控试点验证价值，再扩大。具体排期基于依赖确认，不凭一个聊天演示承诺全量上线。\n\n如果反对收敛，就用实施成本、错误损失和证据缺口讨论取舍。目标是先交付一个值得扩展的闭环，而不是第一版列出最多功能。”", "group": "k33", "multiline": true}, {"key": "chapter/k34/title", "label": "知识点标题", "value": "可视化编排与人工介入：让用户在真正需要判断的地方参与", "group": "k34", "multiline": false}, {"key": "chapter/k34/intro", "label": "先这样理解", "value": "可视化编排帮助用户表达流程，人工介入帮助系统在信息、判断或授权不足时继续。两者不是加一个画布和确认框那么简单：要让人知道当前输入、候选结果、动作影响，以及修改后系统从哪里接着做。\n\n人参与至少有四种目的：补充缺失条件、修正模型产物、批准具体动作、异常时接管。对应的界面和状态不同。缺负责人就提供人员选择，批准发布就展示准确内容与账号；不能用同一个“是否继续”代替所有交互。\n\n**确认要绑定具体对象与版本。** 用户批准某篇草稿后，如果内容被改、目标账号变或对象清单增加，就要判断原确认是否仍覆盖。审批结果需要写入任务状态，恢复时从正确节点继续，不能重新执行前面的写操作。\n\n业务人员使用画布时，需要理解节点输入输出，而不是暴露所有工程参数。优先提供经过验证的模板、字段选择、发布前检查和真实数据预览，再逐层开放高级能力。调试、预览与正式运行要清楚区分，避免测试触发真实操作。\n\n长任务体验依赖真实状态：已受理、等待资源、正在处理、需要补充、已完成部分。可以渐进交付，但要说明覆盖范围；没有可靠估计时不伪造百分比。取消与暂停应说明影响的步骤，不让用户误以为所有已发生动作都会撤销。", "group": "k34", "multiline": true}, {"key": "chapter/k34/decision", "label": "放到产品里怎么判断", "value": "按错误影响、可逆性和授权充分程度安排人工环节。低风险草稿不必每一步确认，高影响或缺关键事实的动作需要更强控制。衡量独立完成率、处理耗时、有效纠正与误批准，不只看确认点击率；点击很快可能是用户已经机械略过。", "group": "k34", "multiline": true}, {"key": "chapter/k34/scenarios", "label": "项目中的应用场景", "value": "**内容发布流程。** 模型先生成草稿，人查看完整内容、素材与发布账号，批准后执行；任何影响授权范围的变更触发重新确认。结果显示真实发布状态和链接。\n\n**业务流程搭建。** 运营从模板选择资料、提取规则与通知对象，试运行时查看节点真实输出，修正字段映射；正式发布前检查权限与异常出口，降低第一次运行失败成本。", "group": "k34", "multiline": true}, {"key": "chapter/k34/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **确认框很多，用户照样误操作。** 检查信息是否具体、风险是否分级，移除低价值重复确认，把注意力留给真正重要的动作。\n- **人改了内容，Agent 又覆盖回去。** 将人工修订写成当前有效状态并记录来源，下游读取新版本，不从旧模型输出恢复。\n- **等待审批期间条件变了。** 恢复前检查对象、权限、金额等是否仍匹配，不能把旧审批无条件延用。", "group": "k34", "multiline": true}, {"key": "question/34.1/title", "label": "面试题 34.1", "value": "什么时候需要人工介入，什么时候应该直接完成？", "group": "k34", "multiline": false}, {"key": "question/34.1/answer", "label": "34.1 口述答案", "value": "“我会按信息是否充分、影响大小、可逆性和授权范围判断。常规只读查询与低风险草稿可以直接完成；关键条件缺失时补问，内容需要业务判断时编辑或审阅，重要写操作按规则审批。\n\n不是所有 AI 动作都加确认，也不是模型自信就免确认。比如发布内容需要确认具体稿件与账号，普通摘要不需要让用户批准每次检索。\n\n验收看人工介入是否有效降低关键错误，以及额外耗时和完成率。如果确认很多却没有实质纠正，说明交互可能只是形式，需要重新设计风险分层。”", "group": "k34", "multiline": true}, {"key": "question/34.2/title", "label": "面试题 34.2", "value": "人工确认后如何安全恢复任务？", "group": "k34", "multiline": false}, {"key": "question/34.2/answer", "label": "34.2 口述答案", "value": "“先保存待确认对象、内容版本和当前步骤，人修改或批准后把结果写入任务状态。恢复时校验这个确认仍对应当前动作，权限、价格或目标范围变化要重新判断。\n\n已经完成的步骤与副作用通过回执保留，不因恢复从头重做。比如草稿改完可以从发布前检查继续，先前上传成功的素材不必重复上传，已发布状态不应再次提交。\n\n测试覆盖重复点击批准、审批过期、人工修改与接口迟到返回。人工介入应该成为可恢复流程的一部分，而不是在原来自动任务外随便加一个弹窗。”", "group": "k34", "multiline": true}, {"key": "question/34.3/title", "label": "面试题 34.3", "value": "如何让业务人员真正用得起低代码编排？", "group": "k34", "multiline": false}, {"key": "question/34.3/answer", "label": "34.3 口述答案", "value": "“我会从高频任务模板和清楚的数据流开始。让用户选择字段来源、查看样例输出，提前提示缺参数、类型错误与无效路径；高级设置按需要展开。\n\n调试时提供节点级输入输出和可解释错误，区分测试与正式运行；外部写操作使用草稿、模拟或受控数据，避免用户一调试就产生真实业务影响。失败时能从合适节点继续。\n\n衡量首次成功运行时间、独立排错能力和维护成本。业务人员要的是稳定交付工作，画布越自由不一定越好，重要的是复杂度是否与他们的任务匹配。”", "group": "k34", "multiline": true}, {"key": "chapter/k35/title", "label": "知识点标题", "value": "成本收益与计费：怎样算清一个可用结果到底值不值？", "group": "k35", "multiline": false}, {"key": "chapter/k35/intro", "label": "先这样理解", "value": "模型单价是成本的一部分，完整任务还包括解析、检索、重排、工具、存储、重试与人工审核。建设和实施是投入，日常运行是持续成本；比较方案前先明确算的是直接技术成本、包含人工的运营成本，还是完整经营成本，不能用不同口径相互比较。\n\n**每个成功任务成本，能暴露失败消耗。** 同一批任务的相关总成本除以达到验收标准的任务数，失败消耗留在分子里。教学例子：100 个任务共花 200 元，80 个合格，成功任务成本是 2.5 元；200÷100＝2 元是提交任务平均成本，回答的是另一个问题。\n\nToken 成本还应区分输入、输出、缓存以及服务定义的推理用量，按实际计量计算。更便宜模型如果带来多轮修复，未必总成本更低。成本分布也可能长尾，一小部分复杂任务耗掉大部分预算，套餐设计要考虑这种差异。\n\n收益侧先测完整工作时间，包括准备、等待、校对和返工。生成十秒不代表替用户省了原来的半小时，如果核查还要很久，收益有限。节省时间可以带来产能与服务水平，但不能直接把所有分钟按工资变成实际现金节约。\n\n计费是商业规则，不等于内部成本公式。资源计费透明但用户难估算，按任务计费易理解但要定义复杂度和失败规则，套餐便于预算但需控制长尾消耗。按成功结果计费还必须约定成功标准、争议与重复请求，否则“成功”很容易变成各方理解不同的词。", "group": "k35", "multiline": true}, {"key": "chapter/k35/decision", "label": "放到产品里怎么判断", "value": "先用同类任务做人工与 AI 辅助的对照，观察正确性、总耗时与真实采用，再核算投入和收益。经营上看收入减直接交付成本后的空间，另外考虑研发、实施和持续支持，不把单位毛利等同于公司净利润。所有教学数字与假设都应明确标记。", "group": "k35", "multiline": true}, {"key": "chapter/k35/scenarios", "label": "项目中的应用场景", "value": "**客服草稿助手。** 测人工独立处理与使用草稿后的完整处理时间，包含查证和改写；统计错误回复与返工。试点看有效处理能力，不能只看生成了多少条。\n\n**企业研究套餐。** 按任务范围与资料量分档，给用户费用预估和上限；内部记录模型、工具与失败成本。长任务到预算边界先说明已完成部分与继续选择，不无限自动升级模型。", "group": "k35", "multiline": true}, {"key": "chapter/k35/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **Token 降了，毛利仍下降。** 查重排、外部工具、人工支持与失败损耗，确认客户使用结构是否变复杂。\n- **宣称节省很多时间，业务不认可。** 原口径可能没计校对和等待，或节省时间无法转化产能；重新测完整流程和实际瓶颈。\n- **按成功收费引发争议。** 明确任务验收、部分完成、用户取消、重复结果和平台失败规则，保留可核验回执。", "group": "k35", "multiline": true}, {"key": "question/35.1/title", "label": "面试题 35.1", "value": "你怎样计算 Agent 的真实单任务成本？", "group": "k35", "multiline": false}, {"key": "question/35.1/answer", "label": "35.1 口述答案", "value": "“先明确成本边界，再把一个任务的模型、检索、解析、工具、存储和重试关联起来；如果比较工作效率，还要纳入必要人工校对。失败任务消耗也要计算。\n\n我会同时看提交任务平均成本与成功任务成本。前者适合预算与流量估算，后者更能反映交付效率。不同任务分组统计，避免简单问答掩盖复杂长任务的长尾费用。\n\n然后看哪些环节有优化空间，是输入重复、工具循环还是模型选择问题。不能只因为每百万 Token 价格降低，就认定产品整体更划算。”", "group": "k35", "multiline": true}, {"key": "question/35.2/title", "label": "面试题 35.2", "value": "怎样证明 AI 真正提升效率，而不是把工作转移给人工？", "group": "k35", "multiline": false}, {"key": "question/35.2/answer", "label": "35.2 口述答案", "value": "“比较同类任务完整流程，包含准备资料、等待、核对、修改和异常处理，并同时控制交付质量。AI 生成快，如果让用户花更多时间查错，总体可能没有收益。\n\n我会建立原流程基线，用受控试点或合理对照看总耗时、错误、返工和吞吐。节省的时间是否变成更多处理能力或更快服务，还要结合业务瓶颈验证，不能一律按工资折现金。\n\n成本侧加入技术、维护和必要实施投入。最后说明哪些任务有效、哪些仍不划算，让扩展决策基于可验证的业务价值，而不是调用量或生成速度。”", "group": "k35", "multiline": true}, {"key": "question/35.3/title", "label": "面试题 35.3", "value": "资源计费、任务计费和套餐，你怎么选？", "group": "k35", "multiline": false}, {"key": "question/35.3/answer", "label": "35.3 口述答案", "value": "“我会看用户理解什么价值单位，以及任务成本是否稳定。开发者可能接受资源用量，业务用户更容易理解报告或处理任务；预算固定的企业偏好套餐，但需要清楚额度和复杂任务规则。\n\n按任务收费必须定义成功、部分完成、重试和取消；成本差异大时可以按范围或复杂度分档。套餐还要观察重度客户的长尾消耗，不能用平均成本盲目定价。\n\n我会在试点里记录成本与使用分布，测试用户能否预估账单，并核算可持续利润空间。计费形式可以组合，但费用规则要能解释和核对。”", "group": "k35", "multiline": true}, {"key": "chapter/k36/title", "label": "知识点标题", "value": "用户反馈与持续优化：怎样把抱怨变成有证据的改进？", "group": "k36", "multiline": false}, {"key": "chapter/k36/intro", "label": "先这样理解", "value": "反馈是一条观察，不是现成的根因。“不好用”可能指答案错、缺依据、太慢、格式不合适、执行失败，也可能是用户根本不需要这项能力。先关联具体任务、版本与操作现场，才能找到问题发生在哪里。\n\n点赞、复制、停留和重新生成都是信号，但解释不唯一。复制可能为了继续重写，重生成可能是找更合适措辞，沉默可能是放弃。主动反馈用户也不代表全部用户，需要结合任务结果、抽样核查、访谈与使用分布判断。\n\n**把反馈变成可复现问题。** 保留必要输入、预期与实际差异，按资料、检索、模型、工具、交互和价值分类，再验证根因。典型失败经过权限与质量处理后进入回归样本；不能每条投诉直接加一句 Prompt，否则规则会互相冲突。\n\n用户修订也不是天然正确标签。有人修改语气，有人补充系统原本没有的新事实，也有人改错。若用于训练或评测，要有明确的数据使用授权、标注规则和审查，避免把偏好与事实混为一谈。是否微调是后续方案选择，不是反馈闭环的默认终点。\n\n上线后继续观察同类问题是否减少，并检查是否引入退化。资料更新、用户群变化或模型升级都可能造成漂移。指标下降要先定位变化来源，再决定改资料、流程、交互或模型，不能自动触发无限训练。", "group": "k36", "multiline": true}, {"key": "chapter/k36/decision", "label": "放到产品里怎么判断", "value": "优先处理高影响问题，再看频率、影响核心任务程度、覆盖用户与修复成本。为每次改动定义目标失败类、验证样本和观察指标，保留回退条件。闭环完成应以问题改善且无不可接受退化为准，不以工单关闭数或新增规则数为准。", "group": "k36", "multiline": true}, {"key": "chapter/k36/scenarios", "label": "项目中的应用场景", "value": "**知识助手的错误反馈。** 用户标记引用不支持结论，系统关联当次证据与版本；确认是旧版资料还是生成误读，再分别处理。修复后回归相邻政策问题，避免只补一条特殊答案。\n\n**客服助手的采用分析。** 观察草稿是否被大幅修改、修改哪些字段以及最终处理结果，结合抽样访谈识别真实负担。高复制率不能替代事实核验或业务效率评价。", "group": "k36", "multiline": true}, {"key": "chapter/k36/troubleshooting", "label": "应用中经常遇到的问题", "value": "- **投诉都关了，用户仍不满意。** 看是否修了表面措辞而没解决根因，或只处理活跃反馈者，遗漏沉默用户的失败。\n- **每次修复都带来新问题。** 缺相邻场景回归、版本记录或范围控制；先明确目标错误类再小步发布。\n- **线上质量突然下降。** 检查资料分布、用户任务、模型、工具与提示词最近变化，分组比较，避免把所有漂移都归结为模型变差。", "group": "k36", "multiline": true}, {"key": "question/36.1/title", "label": "面试题 36.1", "value": "你会如何建立真正有效的反馈闭环？", "group": "k36", "multiline": false}, {"key": "question/36.1/answer", "label": "36.1 口述答案", "value": "“先让反馈关联具体任务和版本，帮助用户选择错误类型并保留必要现场。然后用链路证据定位根因，区分资料、检索、生成、工具和交互问题，而不是直接改提示词。\n\n选有代表性的失败形成经过授权与脱敏的回归样本，定义预期结果，验证修复及相邻场景，再小范围上线。上线后看同类错误、人工修改和任务成功是否改善。\n\n反馈闭环的终点不是收集了多少条或关闭了多少工单，而是问题真的减少且没有明显退化。必要时还要访谈没有主动反馈的人，避免只优化声音最大的那一组用户。”", "group": "k36", "multiline": true}, {"key": "question/36.2/title", "label": "面试题 36.2", "value": "用户修改后的答案，能直接拿来训练吗？", "group": "k36", "multiline": false}, {"key": "question/36.2/answer", "label": "36.2 口述答案", "value": "“不能默认直接用。先确认数据使用授权，再判断修改代表什么：事实纠错、语气偏好、补充新信息，还是用户自己改错。它们不能混成同一种正确答案标签。\n\n我会保留修改前后和必要来源，建立标注与质量检查，按任务用途决定进入知识更新、提示词示例、评测集还是训练数据。训练数据和最终测试样本要避免泄漏。\n\n即使数据合格，也要先确认根因适合通过训练解决。如果问题是资料过期或接口状态错误，微调不会自动修复。反馈数据有价值，但需要被理解和治理后才能使用。”", "group": "k36", "multiline": true}, {"key": "question/36.3/title", "label": "面试题 36.3", "value": "反馈很多、资源有限时，你怎么决定先修什么？", "group": "k36", "multiline": false}, {"key": "question/36.3/answer", "label": "36.3 口述答案", "value": "“先区分高影响错误与一般体验问题。越权、重复交易或关键事实错误需要优先处理；然后比较发生频率、影响核心任务的程度、覆盖用户和修复成本，并评估是否有一个根因造成多个现象。\n\n我会为候选改动写清具体收益与验证方法。没有根因证据时先补样本与诊断，不让研发盲改；只是表达偏好时，可以用配置解决，不一定改变全局行为。\n\n上线后看目标失败是否下降，同时检查其他场景有没有退化。优先级不是简单按投诉数排序，而是把实际损失、证据强度和投入产出结合起来。”", "group": "k36", "multiline": true}, {"key": "extra/extra0", "label": "配套阅读正文", "value": "## 七、把 36 个知识点连成一张任务图\n\n下面是一种通用组织方式，用于理解知识之间的联系，不代表任何具体平台的实际部署架构。\n\n```mermaid\nflowchart TD\n    A[用户目标与业务约束] --> B[身份权限、任务状态和范围确认]\n    B --> C[工作流或 Agent 选择下一步]\n    C --> D[知识路径：解析、检索、重排与来源]\n    C --> E[工具路径：接口或受控界面操作]\n    C --> F[多模态路径：语音、图片与文档]\n    D --> G[模型处理与结构化结果]\n    F --> G\n    G --> H[事实、业务规则与授权检查]\n    H --> I[需要时由用户补充、编辑或确认]\n    I --> E\n    E --> J[执行回执与真实状态核验]\n    J --> C\n    J --> K[达成目标或明确停止，交付结果]\n    C --> L[日志、评测、成本与版本记录]\n    G --> L\n    J --> L\n```\n\n你可以这样口述这张图：\n\n“用户提出一个目标后，我会先确认身份、范围和关键条件，再决定哪些步骤固定走工作流，哪些需要 Agent 判断。需要资料就走解析和检索，需要实际操作就调用工具。模型负责理解和生成，程序负责权限、计算和业务状态校验。重要节点由用户补充或确认，最后用真实执行结果判断任务完成。全过程保留必要记录，便于评测、排错和算成本。”\n\n", "group": "extra0", "multiline": true}, {"key": "extra/extra1", "label": "配套阅读正文", "value": "## 八、用两个完整案例练习，把知识讲成方案\n\n### 案例 A：从云盘材料生成一份出差复盘\n\n**可以这样讲：**\n\n“我会先明确这次出差的日期、项目和报告用途，再列出用户有权使用的笔记、文档、图片和录音。文档需要解析，扫描件可能需要 OCR，录音需要 ASR；处理不完整的材料应显示状态。\n\n因为这是完整复盘，我不会只拿最相似的几段就开始写，而会先确认材料范围，按行程或议题整理事实、成果、问题和待办，再合并去重。涉及费用计算时，用程序按口径汇总，模型负责解释。\n\n生成结果要能追溯到文件、页码或音频时间戳，没有证据的结论标明待确认。用户编辑后，系统根据授权调用保存工具，检查实际写入状态，再反馈保存位置。若保存超时，先查询是否已成功，避免重复创建。\n\n评估上，我会看材料覆盖、事实正确、引用和人工修改时间，再看整条任务成功率及成本。即使报告写得很好，如果保存失败却提示成功，这个任务仍然没有完整交付。”\n\n关联知识点：06—13 处理资料；14—18 组织步骤和状态；21—23 接入多种输入；27、29 约束权限和恢复；30—36 管理质量与价值。\n\n### 案例 B：批量删除某日期之前的文件\n\n**可以这样讲：**\n\n“我会先明确使用创建时间还是修改时间，包含哪些目录、是否包括共享文件，以及删除能否恢复。随后由系统按元数据和当前权限筛选具体对象，展示清单、数量和影响，按产品规则取得与清单绑定的确认。\n\n确认后，执行前再检查权限和对象版本，按文件逐项记录结果，避免条件变化时删除了用户没有确认的新增对象。工具返回要区分成功、失败和跳过，遇到超时先查询状态，再决定是否重试。\n\n删除还会影响预览、检索索引和缓存，需要按规则同步处理；任务取消也要说明哪些文件已经处理，不能让用户以为之前的动作自动撤销。审计记录保留必要的对象和操作信息，方便追溯和恢复。\n\n这个场景主要考验精确筛选、授权和执行一致性。模型可以帮助理解自然语言，但不应该凭语义相似度决定删除哪几份文件。我会用部分失败、重复请求、权限中途变化和恢复操作来检验整个方案。”\n\n关联知识点：04、12、13 确保条件与对象明确；15—18 管理工具、工作流和状态；27—30 处理权限、执行恢复与追溯；31、34 定义验证和交互。\n\n", "group": "extra1", "multiline": true}, {"key": "extra/extra2", "label": "配套阅读正文", "value": "## 九、口述练习方法：记住判断顺序，别只背名词\n\n### 1. 解释一个概念，按四句话组织\n\n“它主要解决什么问题。它一般怎样处理。放到这个产品里，可以用在哪个场景。它有什么边界，我会怎么验证。”\n\n例如解释 Rerank：\n\n“它解决的是候选资料很多、重要内容排得不靠前的问题。一般会让更细致的模型或方法重新判断问题与候选的关系。在云盘问答里，它能帮助把真正适用的制度放进上下文。但它不能找回没有召回的资料，所以我要分别看召回和排序，再评估回答质量与额外时延。”\n\n### 2. 回答方案题，按五个判断展开\n\n先说目标和范围，再说数据与依赖，接着说明主要流程，然后覆盖关键异常，最后给出验证指标。每一步说清“为什么”，避免只列系统组件。\n\n如果面试官只留一分钟，可以保留一个主判断、一个具体例子、一个关键风险和一个指标；如果继续追问，再展开链路细节。\n\n### 3. 回答排查题，从一条真实失败链路开始\n\n“我会先拿到具体任务和版本，检查原始输入、解析结果、召回证据、最终上下文、模型输出、工具回执和真实业务状态，找到信息或动作在哪一步出错，再固定样本比较修复效果。”\n\n不要每个问题都从换模型开始，也不要把所有异常都变成修改提示词。\n\n### 4. 回答经历题，只使用真实做过的内容\n\n本文的“如果由我负责”是方案表达，不代表项目经历。面试官问实际项目时，应清楚说明哪些已实践、哪些是学习或方案分析。可以这样接：\n\n“这个细分能力我目前做过系统学习和方案拆解，还没有完整上线经历。我能先说明我的设计和验证思路；如果结合实际项目，我会重点确认这些前置条件。”\n\n如果有真实经历，再补充当时的规模、个人职责、关键选择、实际结果与局限。没有测量的数据不补百分比，演示效果也不说成线上成绩。\n\n", "group": "extra2", "multiline": true}, {"key": "extra/extra4", "label": "配套阅读正文", "value": "## 十、使用范围与说明\n\n- 本手册的技术解释、方案取舍与面试答案为通用学习内容。具体 API、模型限制、MCP 协议版本和服务费用，应在实际实施时依据所用产品的文档核对。\n- 文中的验证方法是建议，不是本次实际运行结果；教学数字不代表任何具体产品或你的个人项目成绩。\n\n整份手册包含 36 个编号知识点，每个知识点对应 3 道编号面试题，共 108 道。可以先按学习顺序理解，再用两个完整案例串联，最后练习脱稿表达。\n\n### 参考资料与更新口径\n\n本轮内容核对日期：2026-10-23。以下官方资料用于核对机制与实现边界；案例是教学设计，指标是建议的验收口径。实际接入仍需核对所用模型、SDK 和协议版本。\n\n- [Agent 与工作流的边界](https://www.anthropic.com/engineering/building-effective-agents)\n- [上下文工程](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents)\n- [MCP 架构与协议版本](https://modelcontextprotocol.io/docs/learn/architecture)\n- [混合检索](https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview)\n- [持久化与任务恢复](https://docs.langchain.com/oss/python/langgraph/durable-execution)\n- [超时、重试与退避](https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/)\n- [日志、指标与链路追踪](https://opentelemetry.io/docs/concepts/observability-primer/)\n- [提示词注入](https://genai.owasp.org/llmrisk/llm01-prompt-injection/)\n", "group": "extra4", "multiline": true}, {"key": "page/home/title", "label": "页面标题", "value": "先理解，再讲清。", "group": "home", "multiline": false}, {"key": "page/home/description", "label": "页面介绍", "value": "按三轮学习路径，把 36 个知识点串成完整方案；结合任务架构图理解各环节，再进入面试练习。", "group": "home", "multiline": true}, {"key": "page/catalog/title", "label": "页面标题", "value": "36 个知识点，逐个讲明白。", "group": "catalog", "multiline": false}, {"key": "page/catalog/description", "label": "页面介绍", "value": "六个模块串起模型、知识、执行、集成、平台和产品。每个知识点都关联三道核心面试题，也可以继续让 AI 出新题。", "group": "catalog", "multiline": true}, {"key": "page/architecture/title", "label": "页面标题", "value": "把 36 个知识点，连成一张任务图。", "group": "architecture", "multiline": false}, {"key": "page/architecture/description", "label": "页面介绍", "value": "这是一种通用的学习架构，用来解释知识点之间的关系，不代表任何具体平台的实际部署。点击编号可阅读对应知识点。", "group": "architecture", "multiline": true}, {"key": "page/bank/title", "label": "页面标题", "value": "核心面试题库", "group": "bank", "multiline": false}, {"key": "page/bank/description", "label": "页面介绍", "value": "围绕 36 个知识点练习原理、方案与排查，共 108 道题。可以按知识点找题，也可以回看对应讲解。", "group": "bank", "multiline": true}, {"key": "round/0/title", "label": "第 1 轮 · 学习轮次标题", "value": "先讲通一个完整任务", "group": "home", "multiline": false}, {"key": "round/0/description", "label": "第 1 轮 · 学习目标", "value": "建立基础概念，解释从查资料、生成报告到确认保存的完整过程。", "group": "home", "multiline": true}, {"key": "round/1/title", "label": "第 2 轮 · 学习轮次标题", "value": "再解释为什么会失败", "group": "home", "multiline": false}, {"key": "round/1/description", "label": "第 2 轮 · 学习目标", "value": "沿着任务链路，区分资料、检索、模型、工具和交互的问题。", "group": "home", "multiline": true}, {"key": "round/2/title", "label": "第 3 轮 · 学习轮次标题", "value": "最后讨论方案取舍", "group": "home", "multiline": false}, {"key": "round/2/description", "label": "第 3 轮 · 学习目标", "value": "判断复杂方案何时值得采用，比较质量、时延与成本。", "group": "home", "multiline": true}, {"key": "architecture/goal/title", "label": "节点名称", "value": "明确业务目标", "group": "arch-goal", "multiline": false}, {"key": "architecture/goal/description", "label": "节点说明", "value": "先判断这件事值得做什么、算不算做成，收集用户目标和材料。", "group": "arch-goal", "multiline": true}, {"key": "architecture/goal/input", "label": "输入", "value": "用户需求、业务约束", "group": "arch-goal", "multiline": true}, {"key": "architecture/goal/output", "label": "产出", "value": "任务目标、成功标准、允许的操作范围", "group": "arch-goal", "multiline": true}, {"key": "architecture/scope/title", "label": "节点名称", "value": "校验身份、范围与任务状态", "group": "arch-scope", "multiline": false}, {"key": "architecture/scope/description", "label": "节点说明", "value": "确认谁在操作、能访问什么、这次任务做到哪一步；条件缺失就先补充。", "group": "arch-scope", "multiline": true}, {"key": "architecture/scope/input", "label": "输入", "value": "用户身份、授权、已有任务状态", "group": "arch-scope", "multiline": true}, {"key": "architecture/scope/output", "label": "产出", "value": "可用资料范围、有效参数、任务编号", "group": "arch-scope", "multiline": true}, {"key": "architecture/plan/title", "label": "节点名称", "value": "编排与调度中心", "group": "arch-plan", "multiline": false}, {"key": "architecture/plan/description", "label": "节点说明", "value": "固定步骤走 Workflow；需要根据反馈选择动作时使用 Agent。拆分角色有明确收益时再考虑多智能体。", "group": "arch-plan", "multiline": true}, {"key": "architecture/plan/input", "label": "输入", "value": "目标、有效状态、上一步结果", "group": "arch-plan", "multiline": true}, {"key": "architecture/plan/output", "label": "产出", "value": "下一步动作、工具参数、停止或继续的决定", "group": "arch-plan", "multiline": true}, {"key": "architecture/knowledge/title", "label": "节点名称", "value": "知识处理与证据检索", "group": "arch-knowledge", "multiline": false}, {"key": "architecture/knowledge/description", "label": "节点说明", "value": "入库：解析 / OCR → 分块 → 向量化与索引。查询：权限和版本过滤 → 向量 + 关键词召回 → 重排 → 带来源的证据。完整统计需另走程序计算。", "group": "arch-knowledge", "multiline": true}, {"key": "architecture/knowledge/input", "label": "输入", "value": "文件、查询、权限和版本条件", "group": "arch-knowledge", "multiline": true}, {"key": "architecture/knowledge/output", "label": "产出", "value": "相关证据、引用位置，或可核验的统计结果", "group": "arch-knowledge", "multiline": true}, {"key": "architecture/multimodal/title", "label": "节点名称", "value": "语音与图像处理", "group": "arch-multimodal", "multiline": false}, {"key": "architecture/multimodal/description", "label": "节点说明", "value": "会议先转写并保留说话人和时间；图片先识别内容与不确定性。图像生成是另一类任务，需单独检查约束。", "group": "arch-multimodal", "multiline": true}, {"key": "architecture/multimodal/input", "label": "输入", "value": "音频、图片、扫描材料", "group": "arch-multimodal", "multiline": true}, {"key": "architecture/multimodal/output", "label": "产出", "value": "带时间或位置线索的内容，或生成素材", "group": "arch-multimodal", "multiline": true}, {"key": "architecture/memory/title", "label": "节点名称", "value": "组织上下文与记忆", "group": "arch-memory", "multiline": false}, {"key": "architecture/memory/description", "label": "节点说明", "value": "把当前有效状态、相关证据和必要偏好送进模型；过期信息不沿用，预算不足时裁剪或压缩。", "group": "arch-memory", "multiline": true}, {"key": "architecture/memory/input", "label": "输入", "value": "任务状态、证据、对话、用户偏好", "group": "arch-memory", "multiline": true}, {"key": "architecture/memory/output", "label": "产出", "value": "有来源、受上下文预算约束的输入", "group": "arch-memory", "multiline": true}, {"key": "architecture/model/title", "label": "节点名称", "value": "模型理解与结构化生成", "group": "arch-model", "multiline": false}, {"key": "architecture/model/description", "label": "节点说明", "value": "模型理解材料并生成草稿或动作建议。程序校验字段与业务规则；有引用也要核对引用是否支持结论。", "group": "arch-model", "multiline": true}, {"key": "architecture/model/input", "label": "输入", "value": "提示词、上下文、证据或工具回执", "group": "arch-model", "multiline": true}, {"key": "architecture/model/output", "label": "产出", "value": "结构化结果、候选答案或工具调用建议", "group": "arch-model", "multiline": true}, {"key": "architecture/check/title", "label": "节点名称", "value": "事实、权限与人工确认", "group": "arch-check", "multiline": false}, {"key": "architecture/check/description", "label": "节点说明", "value": "执行前再次校验目标、权限和业务条件。高风险操作展示对象、范围与影响，由用户确认；参数变化后重新确认。", "group": "arch-check", "multiline": true}, {"key": "architecture/check/input", "label": "输入", "value": "候选结果、拟执行动作及影响范围", "group": "arch-check", "multiline": true}, {"key": "architecture/check/output", "label": "产出", "value": "允许执行、要求修改、等待确认或拒绝", "group": "arch-check", "multiline": true}, {"key": "architecture/tools/title", "label": "节点名称", "value": "工具执行与业务系统", "group": "arch-tools", "multiline": false}, {"key": "architecture/tools/description", "label": "节点说明", "value": "运行时执行工具调用，通过 MCP 或直接 API 连接文件和业务服务；无 API 时才评估受控界面自动化。授权与执行结果由程序判断。", "group": "arch-tools", "multiline": true}, {"key": "architecture/tools/input", "label": "输入", "value": "已校验参数、有效授权、必要的确认", "group": "arch-tools", "multiline": true}, {"key": "architecture/tools/output", "label": "产出", "value": "业务回执、资源标识、错误或状态查询入口", "group": "arch-tools", "multiline": true}, {"key": "architecture/receipt/title", "label": "节点名称", "value": "核验真实状态与恢复", "group": "arch-receipt", "multiline": false}, {"key": "architecture/receipt/description", "label": "节点说明", "value": "超时先查业务状态，不能直接当成失败重做。有副作用的动作使用幂等标识；部分完成时从检查点恢复或按业务规则补偿。", "group": "arch-receipt", "multiline": true}, {"key": "architecture/receipt/input", "label": "输入", "value": "回执、幂等标识、业务状态", "group": "arch-receipt", "multiline": true}, {"key": "architecture/receipt/output", "label": "产出", "value": "已完成 / 部分完成 / 失败 / 状态未知", "group": "arch-receipt", "multiline": true}, {"key": "architecture/delivery/title", "label": "节点名称", "value": "交付结果并收集反馈", "group": "arch-delivery", "multiline": false}, {"key": "architecture/delivery/description", "label": "节点说明", "value": "明确哪些已完成、哪些尚未完成，提供结果、来源和可操作的下一步。用任务结果和用户反馈决定后续优化。", "group": "arch-delivery", "multiline": true}, {"key": "architecture/delivery/input", "label": "输入", "value": "经过核验的任务状态和结果", "group": "arch-delivery", "multiline": true}, {"key": "architecture/delivery/output", "label": "产出", "value": "可核对的交付物、反馈与改进线索", "group": "arch-delivery", "multiline": true}, {"key": "architecture/routing/title", "label": "节点名称", "value": "模型服务与流量控制", "group": "arch-routing", "multiline": false}, {"key": "architecture/routing/description", "label": "节点说明", "value": "为每次模型调用选择合适模型，统一鉴权、配额、限流与超时；降级仍需满足任务底线。", "group": "arch-routing", "multiline": true}, {"key": "architecture/routing/input", "label": "输入", "value": "任务要求、流量、成本约束", "group": "arch-routing", "multiline": true}, {"key": "architecture/routing/output", "label": "产出", "value": "受控的模型调用与降级结果", "group": "arch-routing", "multiline": true}, {"key": "architecture/security/title", "label": "节点名称", "value": "全链路安全与隔离", "group": "arch-security", "multiline": false}, {"key": "architecture/security/description", "label": "节点说明", "value": "检索、缓存、工具和结果返回都校验租户与权限。网页和文档中的指令视为不可信资料，不能直接授予工具权限。", "group": "arch-security", "multiline": true}, {"key": "architecture/security/input", "label": "输入", "value": "身份、权限、不可信外部内容", "group": "arch-security", "multiline": true}, {"key": "architecture/security/output", "label": "产出", "value": "可访问边界、拦截结果、审计线索", "group": "arch-security", "multiline": true}, {"key": "architecture/operations/title", "label": "节点名称", "value": "追踪、评测与版本", "group": "arch-operations", "multiline": false}, {"key": "architecture/operations/description", "label": "节点说明", "value": "保留一次任务的关键调用链；用固定样本比较质量和失败情况，模型、提示词、知识索引与工具版本共同管理。", "group": "arch-operations", "multiline": true}, {"key": "architecture/operations/input", "label": "输入", "value": "运行记录、评测样本、版本变更", "group": "arch-operations", "multiline": true}, {"key": "architecture/operations/output", "label": "产出", "value": "故障定位、发布依据、回退能力", "group": "arch-operations", "multiline": true}, {"key": "architecture/value/title", "label": "节点名称", "value": "成本收益与持续优化", "group": "arch-value", "multiline": false}, {"key": "architecture/value/description", "label": "节点说明", "value": "统计成功完成一次任务的总成本与人工返工，结合反馈判断改动是否产生价值，而非只看调用量。", "group": "arch-value", "multiline": true}, {"key": "architecture/value/input", "label": "输入", "value": "任务完成率、费用、耗时、用户反馈", "group": "arch-value", "multiline": true}, {"key": "architecture/value/output", "label": "产出", "value": "优化优先级、计费依据、价值验证", "group": "arch-value", "multiline": true}, {"key": "trace/all/title", "label": "路径名称", "value": "完整架构", "group": "trace-all", "multiline": false}, {"key": "trace/all/description", "label": "路径说明", "value": "从目标到交付，实线箭头表示主要处理顺序；橙色虚线框表示补充、人工介入或恢复回路。共享能力贯穿各环节。", "group": "trace-all", "multiline": true}, {"key": "trace/report/title", "label": "路径名称", "value": "生成报告", "group": "trace-report", "multiline": false}, {"key": "trace/report/description", "label": "路径说明", "value": "材料经过知识检索或多模态解析，组织上下文后生成草稿；核对事实，需要保存时执行文件工具，最后确认报告与保存状态。", "group": "trace-report", "multiline": true}, {"key": "trace/execute/title", "label": "路径名称", "value": "执行业务操作", "group": "trace-execute", "multiline": false}, {"key": "trace/execute/description", "label": "路径说明", "value": "从明确对象和范围开始，经调度、参数校验与必要的人工确认后调用工具；用业务回执和真实状态判断是否完成。", "group": "trace-execute", "multiline": true}, {"key": "trace/recover/title", "label": "路径名称", "value": "失败与恢复", "group": "trace-recover", "multiline": false}, {"key": "trace/recover/description", "label": "路径说明", "value": "先分清资料缺失、权限不足、执行失败与状态未知。保留有效任务状态，查明真实结果，再返回确认或调度节点；不能无限重试。", "group": "trace-recover", "multiline": true}, {"key": "doubao/db-pm-01/title", "label": "面试题", "value": "当你负责的某个功能想用上 AI，你是怎么判断\"这个问题到底该用大模型解决，还是用传统规则/算法解决\"的？能不能结合你做过的一个具体例子讲讲。", "group": "db-pm-01", "multiline": false}, {"key": "doubao/db-pm-01/answer", "label": "口述参考答案", "value": "\"这个问题问得很核心，因为它背后其实是在考察产品经理能不能分清——**用户的痛点是哪个层面的**，而不是一上来就想着'我有 AI 我得用上'。\n\n我一般是按三步来判断的。\n\n**第一步，先看这个需求到底是'确定性'还是'开放性'的。**\n如果用户的问题是有标准答案的、规则可穷举的——比如'根据订单金额算优惠'、'按关键词过滤敏感词'——那我不会去碰大模型，用规则或者传统算法就够了，又快又稳又便宜，还不会乱说话。**杀鸡不用牛刀，这是我最先守住的边界。**\n\n**第二步，只有当我确认它真的是开放性的、需要语义理解的，才进入 AI 方案。**\n这时候我再往下分一层：看**通用大模型现成能力够不够**。如果我要做的是'帮用户把一段口语总结成要点'这种，市面上成熟模型已经做得很好，我就不自研，直接调 API 或开源模型，把精力花在**提示词设计、效果评测、兜底**上。我做过一个真实例子，之前做一个亲子类的产品，有个功能是帮家长把零散的育儿记录自动整理成周报。这就是典型的'语义理解 + 归纳'，通用模型能力够了，所以当时我的方案是调现成模型 + 在提示词里约束输出格式，而不是去自研。\n\n**第三步，只有当这个能力是产品的核心差异化、调用量大、或者涉及隐私和数据安全，我才考虑自建或微调。**\n因为自建有成本，得算清楚账：研发成本、算力成本、长期维护成本，跟'用现成的够不够、值不值'对比。如果自建的边际收益撑不起这个投入，我宁可先用现成的把用户体验跑起来，再随着数据积累和用户规模决定要不要收回来。\n\n所以我的结论是——**技术选型永远是跟着需求本质和商业账走的，不是跟着'AI 热不热'走的。** 先把问题定义清楚：是规则能解的，还是语义要泛化的；泛化的里，通用模型够不够；不够的核心能力，才值得自建。把这个框架讲清楚，我觉得比背一堆名词更能体现产品判断力。\"", "group": "db-pm-01", "multiline": true}, {"key": "doubao/db-pm-02/title", "label": "面试题", "value": "很多 AI 功能 demo 演示效果很好，一上线就\"翻车\"。作为产品经理，你会怎么在设计阶段就预判并规避这种情况？结合你做过的例子讲讲。", "group": "db-pm-02", "multiline": false}, {"key": "doubao/db-pm-02/framework", "label": "回答框架", "value": "1. **定义好坏** → 上线前建评测集（典型场景 + 边界 + 反例），上线前后用同一把尺子量。\n2. **划边界兜底** → 明确 AI 能负责什么、必须\"认怂\"什么；没把握就引导或降级模板。\n3. **灰度闭环** → 小流量上线，盯两个数：人工介入/放弃率、负面反馈。\n4. **沉淀迭代** → 每次翻车记录下来，反哺评测集和提示词。", "group": "db-pm-02", "multiline": true}, {"key": "doubao/db-pm-02/answer", "label": "口述参考答案", "value": "\"我觉得这个问题背后，考验的不是你会不会做功能，而是你有没有**'从 demo 到生产环境'的那层工程和产品思维**。demo 是挑好样本给你看，生产环境是全量真实用户、各种刁钻输入一起上，所以翻车几乎是必然的，关键是提前把翻车的成本控制住。\n\n我的做法分四步。\n\n**第一步，上线前先把'什么算好'定义死。** 我不会等上线了再凭感觉判断效果行不行，而是在设计阶段就拉上算法和评测，建一个覆盖典型场景 + 边界情况 + 反例的**评测集**。比如我们当时做亲子产品的自动整理功能，我会把'错别字多的、语气很碎的、家长随手记的'这些难样本都放进评测集。目的不是追求百分百正确，而是**上线前后用同一把尺子量**，这样效果有没有变好是可量化的，不是靠感觉。\n\n**第二步，给 AI 划边界、做兜底。** 我会明确告诉团队：这个功能哪些情况它能负责，哪些情况它必须'认怂'。凡是 AI 没把握的，要么给用户一个明确的'我没听懂、换个说法'的引导，要么降级成手动模板。我特别信奉一句话——**AI 产品最重要的设计是它的'下坡路'，就是失败的时候怎么优雅地退**，而不是追求它永远不出错。\n\n**第三步，灰度 + 埋点闭环。** 我不会一刀切全量上线，先小流量跑，重点看两个数：一个是**人工介入/用户放弃率**，一个是**用户反馈里的负面信号**。demo 里最容易被忽略的，就是用户其实没那么爱用它，只是被你演示的效果唬住了。\n\n**第四步，把'翻车'沉淀成迭代。** 每次出问题我都要求记录下来，反哺到评测集和提示词里，这样系统是越用越稳的。\n\n所以我的结论是：**预判翻车不是靠'想得更周全'，而是靠一套可量化的评测 + 明确的边界兜底 + 灰度闭环的机制。** 把机制搭起来，翻车就从'事故'变成'可预期的迭代输入'。\"", "group": "db-pm-02", "multiline": true}, {"key": "doubao/db-pm-02/supplement", "label": "原文补充：金句与案例", "value": "### 🟡 金句（背这 3 句就够了）\n1. **\"demo 是挑好样本给你看，生产环境是全量真实用户、各种刁钻输入，翻车是必然的，关键是把翻车成本控制住。\"**\n2. **\"AI 产品最重要的设计，是它的'下坡路'——失败的时候怎么优雅地退，而不是永远不出错。\"**\n3. **\"预判翻车不是靠想得更周全，是靠一套可量化的评测 + 明确边界兜底 + 灰度闭环的机制。\"**\n\n### 🔵 案例（例子一句话记住）\n> 亲子产品做\"家长零散记录自动整理成周报\"，我把\"错别字多、语气碎、随手记\"的难样本放进评测集，上线前跑同一把尺子，效果可量化、不是靠感觉。", "group": "db-pm-02", "multiline": true}, {"key": "doubao/db-tech-01/title", "label": "面试题", "value": "讲讲 RAG（检索增强生成）的原理，以及它相比把资料直接塞进提示词有什么优势？什么场景下你会优先用 RAG？", "group": "db-tech-01", "multiline": false}, {"key": "doubao/db-tech-01/framework", "label": "回答框架", "value": "**原理三环节：**\n1. **索引** → 文档切块 → Embedding 转向量 → 存进向量库。\n2. **检索** → 用户问题转向量 → 算相似度 → 捞回最相关的几段。\n3. **生成** → 把捞回的内容 + 问题拼进提示词 → 模型基于资料回答。\n\n**相比直接塞提示词的三大优势：**\n1. **解决上下文窗口限制** —— 不用全塞，按需捞。\n2. **可控可更新** —— 文档变只更新向量库，不用重新训练。\n3. **降低幻觉** —— 基于检索事实作答，还能溯源。\n\n**优先用 RAG 的场景：**\n> 知识驱动型、依赖外部资料、资料频繁更新 → 企业知识库问答、客服机器人、合同审阅、政策问答。\n> 反例：靠模型推理就够的通用知识，不一定要 RAG。", "group": "db-tech-01", "multiline": true}, {"key": "doubao/db-tech-01/answer", "label": "口述参考答案", "value": "\"RAG，全称叫检索增强生成。核心思路很直白：**模型回答问题之前，先从一个知识库里把相关的资料'捞'出来，再带着这些资料去生成答案。** 它分成三个环节：**索引、检索、生成**。\n\n我先说索引。我们要先把企业自己的文档切块，切成一段一段的，然后用 Embedding 模型把每段转成向量，存进向量数据库里。这一步的目的是让文字变成模型能算距离的数字。\n\n然后是检索。用户问一个问题，我们也把它转成同样的向量，跟库里的向量算相似度，把最相关的那几段内容捞出来。这就是为什么它叫'检索增强'——你是在主动把和问题相关的上下文捞进来。\n\n最后是生成。把捞出来的这几段内容，连同用户的原始问题，一起拼进提示词里喂给大模型，让模型**基于这些资料**来回答。这样一来，答案就带着知识库里的真实信息，而不是模型自己瞎编。\n\n那它相比'把资料直接塞进提示词'有什么优势？我给你讲三个最关键的点。\n\n第一是**解决上下文窗口的物理限制**。模型的上下文窗口是有限的，现在主流可能到几十万 token，但企业文档是海量的，你不可能全塞进去，塞进去也贵。RAG 是**按需捞最相关的一小部分**，这样再大的知识库都能用。\n\n第二是**可控、可更新**。文档一变，我只要更新向量库就行，不需要重新训练模型。这一点对产品迭代特别重要，企业的知识是天天变的，RAG 让知识的增删改非常轻量。\n\n第三是**降低幻觉**。因为模型是基于检索来的事实去答的，不是纯靠它自己记住的东西，所以答案的准确度更高，而且我还能溯源——告诉用户'我这个答案来自哪份文档'，这在很多 To B 场景是硬要求。\n\n不过 RAG 也有它要处理的问题，比如切块切得好不好、检索准不准，直接影响答案质量，这就是为什么会有'高级 RAG'——在检索前做 query 改写、重排，这些细节。\n\n那我什么时候**优先用 RAG**？一句话概括：**当答案是'知识驱动型'、依赖特定外部资料、且资料会频繁更新的场景**。典型比如企业知识库问答、客服机器人、合同审阅、政策问答。反过来，如果答案是靠模型推理能力就能回答的通用知识，就不一定要 RAG。所以选型逻辑还是那句话——**跟着场景走，不是跟着技术热不热走**。\"", "group": "db-tech-01", "multiline": true}, {"key": "doubao/db-tech-01/supplement", "label": "原文补充：金句与案例", "value": "### 🟡 金句（背这 3 句）\n1. **\"RAG 的核心是：回答之前先从一个知识库把相关资料'捞'出来，再带着资料去生成。\"**\n2. **\"它解决的是上下文窗口的物理限制——文档是海量的，RAG 按需捞最相关的，知识库再大都能用。\"**\n3. **\"选型逻辑是跟着场景走，不是跟着技术热不热走。\"**\n\n### 🔵 案例（例子一句话记住）\n> 企业知识库客服：文档天天更新，我只要刷新向量库，不用重新训模型，答案还能告诉用户\"来自哪份文档\"。", "group": "db-tech-01", "multiline": true}, {"key": "doubao/db-pm-03/title", "label": "面试题", "value": "很多 AI 功能是\"有 AI 没 AI 都行\"的伪需求。作为产品经理，你怎么判断一个 AI 功能到底是不是真需求、值不值得做？", "group": "db-pm-03", "multiline": false}, {"key": "doubao/db-pm-03/framework", "label": "回答框架", "value": "1. 判断标准：AI 是否真正创造了\"原来做不到 / 原来做不好\"的新价值\n2. 三个验证维度：用户愿不愿为此多付（意愿）、是否有真实高频场景（频次）、换人/换工具是否可行（替代性）\n3. 用 MVP + 数据小成本验证，而不是靠\"技术很酷\"拍板\n4. 反例自查：如果去掉 AI 用户体验没差别，就是伪需求", "group": "db-pm-03", "multiline": true}, {"key": "doubao/db-pm-03/answer", "label": "口述参考答案", "value": "\"我觉得这个问题，核心是逼着产品经理想清楚一件事：**AI 到底在这里创造了什么不可替代的价值。** 如果只是把原来一个普通流程换成'套了个 AI'，用户体验没实质变化，那它就是伪需求，不值得做。\n\n我一般用三个维度来验证。\n\n**第一个，看它是不是'原来做不到或做不好的事'。** 真需求通常是 AI 把一件用户本来很痛苦、但人力很难规模化的事情给解了。比如让普通人一句话生成一份专业合同——这个没有 AI 以前根本做不到，这就是真价值。反过来，如果只是把下拉菜单换成'输入一句话'，原来的方案已经很顺，那 AI 是锦上添花，不是雪中送炭。\n\n**第二个，看用户愿不愿意为它付出成本。** 这个成本可以是钱、是时间、是切换习惯。真需求通常意味着用户愿意改变自己的既有路径去用这个功能。如果用户只是在演示的时候'哇'一下，回到日常根本不会打开，那说明这个功能是 demo 需求，不是用户需求。\n\n**第三个，看它有没有真实的高频场景。** 我会去想清楚：这个能力在什么具体场景、多久被用一次、解决了用户哪个具体动作。场景越具体、越高频，越可能是真需求；只有抽象概念、说不清使用场景的，基本是伪需求。\n\n然后落到做法上，我不会靠'技术很酷'来拍板，而是**先做一个轻量 MVP 去小成本验证**，埋点看真实使用数据，再决定要不要加大投入。我特别看重一个反例自查：**如果把 AI 拿掉，用户的体验有没有本质变化？如果没有，那这个功能就该砍掉或者重新想。**\n\n所以我的结论是：判断 AI 功能值不值得做，不看技术含量，看它是不是真的把一件'原来做不到或做不好'的事，在真实高频场景里、让用户愿意付出成本去用。抓住这三点，伪需求就藏不住了。\"", "group": "db-pm-03", "multiline": true}, {"key": "doubao/db-tech-02/title", "label": "面试题", "value": "讲讲大模型的上下文窗口，以及什么是\"上下文工程\"？它为什么重要？", "group": "db-tech-02", "multiline": false}, {"key": "doubao/db-tech-02/framework", "label": "回答框架", "value": "1. 概念：上下文窗口 = 模型单次能\"看见/处理\"的 token 上限\n2. 上下文工程的含义：围绕有限的窗口做\"信息取舍与组织\"——放什么、放多少、怎么排\n3. 重要性：窗口有限 + 信息有优劣 → 直接决定回答质量和成本\n4. 常用手段：RAG 按需捞取、摘要压缩、截断策略、提示词结构优化", "group": "db-tech-02", "multiline": true}, {"key": "doubao/db-tech-02/answer", "label": "口述参考答案", "value": "\"我先解释上下文窗口。它是大模型一次能同时'看见'和处理的 token 上限——你可以理解成模型的'工作记忆容量'。你给它多少输入，它处理这些输入的能力是有上限的，这个上限就是上下文窗口，比如常见的几万甚至几十万 token。超出窗口的部分，模型是看不到的。\n\n那什么是上下文工程？既然窗口是有限的，你怎么在**有限的容量里放进对回答最有用的信息**、以及怎么把这些信息组织好，让模型发挥出最好效果——这一整套取舍和设计，就叫上下文工程。说白了就是**'在窗口内做信息管理'**：放什么、放多少、按什么顺序放。\n\n它为什么重要？我给你讲三个原因。\n\n**第一，窗口有限，但信息是海量的。** 企业的知识库、超长的文档，不可能全塞进去，你必须主动决定哪些信息值得占用宝贵的窗口空间。放错了、放少了，答案质量就会掉。\n\n**第二，信息在窗口里的位置和清晰度，直接影响模型表现。** 同一段资料，怎么组织、怎么强调、放在前面还是后面，效果差别很大。比如把核心指令放前面、把用户最相关的资料放中间，通常比一股脑堆在后面更好。所以上下文工程不是玄学，是实打实影响结果的工程。\n\n**第三，它直接和成本挂钩。** token 是计费的，塞得越多越贵、响应也越慢。好的上下文工程是用**最少的 token 拿到最好的效果**，这既是技术问题也是成本问题。\n\n那常用手段有哪些？我重点讲两个。一个是**RAG**——通过检索把最相关的资料按需捞进窗口，而不是把整个知识库都塞进来；另一个是**摘要与压缩**——对长文档先做提炼再进窗口；再配合**提示词的结构化设计**和合理的截断策略。\n\n所以我的理解是：上下文工程本质是**在'有限的窗口 + 有成本'这两个约束下，做信息的精确编排**。它决定了模型能不能在合适的位置看到合适的信息，从而决定回答质量，也决定了你花多少钱、多快出结果。对大模型产品来说，这是很核心的一个工程能力。\"", "group": "db-tech-02", "multiline": true}, {"key": "doubao/db-pm-04/title", "label": "面试题", "value": "Agent 类产品和传统功能型产品在体验设计上最大的不同是什么？你会怎么设计，让用户愿意信任并放手交给 Agent 去执行任务？", "group": "db-pm-04", "multiline": false}, {"key": "doubao/db-pm-04/framework", "label": "回答框架", "value": "1. 定位差异：从\"用户操作工具\"变为\"用户委托 Agent 执行\"——控制权转移\n2. 信任是核心：透明（能看到 Agent 在做什么、为什么这么做）+ 可控（随时可干预/可撤回）\n3. 失败/不确定时的设计：确认节点、兜底降级、失败成本前置\n4. 用进度可见 + 结果预期管理，逐步建立用户信任", "group": "db-pm-04", "multiline": true}, {"key": "doubao/db-pm-04/answer", "label": "口述参考答案", "value": "\"我觉得最大的不同，是**用户和产品的关系变了**。传统功能型产品是'用户操作工具'——每一步用户都自己动手、自己负责；而 Agent 产品是'用户委托一个智能体去做事'，控制权从我手里交出去了。这个转变带来一个核心问题：**用户凭什么信任你、愿意放手？** 所以我认为 Agent 体验设计的灵魂，不是功能有多强，而是**信任设计**。\n\n我围绕三个关键词来展开：**透明、可控、可预期**。\n\n**第一是透明。** 用户放手的前提，是他能看到 Agent 在做什么、为什么这么做。我会把 Agent 的执行过程做成'可见的进度'——比如它在读哪个资料、查了什么、下一步要做什么，像给用户开了一扇窗，让他觉得'我看得见它，不是黑箱'。全程黑盒的 Agent，用户是不敢用的。\n\n**第二是可控。** 信任不是一次建立的，而是靠'随时能收回控制权'建立的。我会设计清楚干预节点：用户随时可以暂停、改指令、撤回某一步；尤其在高影响动作（比如付款、发邮件、改配置）前面，一定放**确认节点**，让用户过一道手。这既降低风险，也让用户觉得'权力还在我手里'，他才会慢慢放手。\n\n**第三是可预期——做好失败兜底。** Agent 一定会出错，关键是把失败的成本前置。我会想清楚：它不确定时是继续硬做，还是停下来问用户；出错之后有没有降级方案，能不能回到上一个可控状态。我会宁可让它在没把握的时候'认怂'停下来，也不让它闷头把事情搞砸。\n\n最后落到做法上，我不会一上来就让 Agent 全权接管。通常先给用户**偏'半自动'的体验**——Agent 做一版、用户确认一版，用进度可见 + 结果预期管理，让用户在一次次'我放心、它没跑偏'里积累信任，再逐步放开权限。\n\n所以我的结论是：Agent 体验设计的本质是**把控制权的转移设计得足够安全、足够透明**。用户不是被功能说服，而是被'我看得见、我控得住、它兜得住'说服，才会真正愿意把事交给它。\"", "group": "db-pm-04", "multiline": true}, {"key": "doubao/db-tech-03/title", "label": "面试题", "value": "讲讲大模型的\"长期记忆 / 长记忆\"机制，它是怎么实现的？产品上一般怎么用？", "group": "db-tech-03", "multiline": false}, {"key": "doubao/db-tech-03/framework", "label": "回答框架", "value": "1. 概念区分：上下文/短期记忆（当前对话）vs 长期记忆（跨会话的持久信息）\n2. 实现原理：不靠模型参数，靠外部存储——把关键信息结构化存下来、会话时再召回注入\n3. 常见做法：向量库检索 + 关键信息抽取/画像存储 + 会话开始时注入\n4. 产品价值与权衡：个性化体验提升 vs 隐私/数据治理、存储与召回的准确性", "group": "db-tech-03", "multiline": true}, {"key": "doubao/db-tech-03/answer", "label": "口述参考答案", "value": "\"我先澄清一个概念，很多人容易混淆。**短期记忆**指的是模型当前这一次对话里能记住的内容，也就是它的上下文窗口；而**长期记忆**是跨会话的——用户这次来，模型还记得上次聊了什么、他的偏好、他的历史。这个能力模型参数里是没有的，因为大模型本身没有'天生的跨会话记忆'，所以长期记忆一定得靠**产品层面用外部存储来实现**。\n\n怎么实现的？我给你讲它的原理路径。\n\n**第一步是'提取'。** 在一次对话结束后，系统会主动从这段对话里抽出值得记住的信息——比如用户的身份、偏好、说过的重要事实。这一步通常结合规则和大模型抽取来做，抽完再整理成结构化的记忆条目。\n\n**第二步是'存储'。** 把这些记忆存起来。常见两种存法：一种是**结构化存储**，比如用一张用户画像表存'这个用户喜欢什么、忌讳什么'；另一种是**向量存储**，把记忆文本转成向量存进向量库，方便后面做相似度召回。\n\n**第三步是'召回注入'。** 用户下次来的时候，系统先检索出和他当前问题相关的记忆，把它拼进提示词里，让模型'带着记忆'来回答。这其实就是把长期记忆当成了一个'会随着对话增长的动态资料库'，和 RAG 的按需检索思路是相通的。\n\n那产品上怎么用、值在哪？它的价值很直观——**把冷冰冰的交互变成有连续性的体验**：AI 记得你上次聊到哪、记得你的偏好，用户会明显觉得'它懂我'，这对留存和个性化体验是实打实的提升。比如一个陪伴型或学习型产品，记住用户的进度和风格，体验会完全不同。\n\n但它也有必须权衡的地方，我重点提两个。一个是**准确性**——记忆提取错、或者召回了不相关的记忆，反而会误导模型，所以记忆的写入和召回都要有质量控制，甚至要给用户'查看和删除记忆'的入口。另一个是**隐私和数据治理**——长期记忆本质是存了用户的大量个人信息，这涉及到合规、存储安全、用户授权，产品上必须给用户可见的控制权。\n\n所以我的理解是：长期记忆是**把模型'记不住'这件事，用'外部存储 + 提取 + 召回注入'这套机制在产品层面补上**。它能让产品更有连续性，但前提是把准确性和隐私这两件事先管好，否则记忆越多，风险越大。\"", "group": "db-tech-03", "multiline": true}, {"key": "doubao/db-pm-05/title", "label": "面试题", "value": "你的 AI 功能上线了、用户反馈和效果都不错，但公司要求你把它做成能持续赚钱的业务。你会怎么设计它的商业化路径？", "group": "db-pm-05", "multiline": false}, {"key": "doubao/db-pm-05/framework", "label": "回答框架", "value": "1. 先想清楚价值锚点：AI 到底为用户省了什么 / 创造了什么，谁能为此付费\n2. 商业模式选择：订阅 / 按量计费 / 按结果付费 / 增值分层——依据使用特征与价值边界\n3. 成本结构是关键：token/算力成本与定价挂钩，避免\"卖得越多亏得越多\"\n4. 从付费意愿最高的场景切入，用 MVP 验证后分层扩展", "group": "db-pm-05", "multiline": true}, {"key": "doubao/db-pm-05/answer", "label": "口述参考答案", "value": "\"商业化这件事，我的第一步不是急着定价，而是先想清楚一个本质问题：**这个 AI 功能到底替用户省了什么、创造了什么，以及谁是那个最愿意为此付钱的人。** 商业化能不能成，九成取决于价值锚点找得准不准，而不是定价技巧。\n\n定了锚点之后，我再选商业模式。我一般会对着这个功能的使用特征去选，而不是拍脑袋：\n\n**第一类是订阅制。** 适合那种高频、持续被使用、用户离不了的功能——按月度或年度收费，逻辑像'它是我日常工具的一部分'。\n\n**第二类是按量/按 token 计费。** 适合使用量差异很大的场景，比如用户偶尔才用一次、但每次消耗资源明显不同。按量收费的好处是**成本和收入同频**，用户用多少付多少，公司不会因为有人大量滥用而亏。\n\n**第三类是按结果付费。** 当 AI 帮用户完成的是有明确价值结果的事（比如自动生成了能用的物料、完成了分析），可以按'产出结果'收费，客单价高、价值感强。\n\n第四类是**增值分层**——基础能力免费用来获客和培养习惯，高级能力（更强的模型、更大容量、更多次数）放付费层。这是最常见的'免费 + 增值'打法。\n\n但我要特别强调一个 AI 商业化的坑：**成本结构。** AI 产品有实打实的 token 和算力成本，这和传统软件不一样——传统软件边际成本趋近于零，AI 产品卖得越多、成本越高。所以我做定价时**一定会把单位成本算进去**，确保价格和成本之间有合理毛利，避免出现'用户越多亏得越多'。必要的时候，我会用缓存、更便宜的模型、优化提示词来压低单位成本。\n\n最后是落地方案。我不会一上来就全量收费，而是**先锁定付费意愿最强的那批用户和场景**——通常是那些用这个功能省了大量人力或产生直接收益的人，做一个小范围付费验证，跑通了再根据数据做分层和扩展。这样既验证了付费假设，又把商业化风险控制在最小。\n\n所以我的结论是：AI 商业化成功的关键，是把**价值锚点、商业模式、成本结构**三者对齐——锚点决定了谁会付钱，模式决定怎么收，成本决定了能不能持续赚。抓住这三环，商业化就不是拍脑袋定个价，而是一套能跑起来的生意模型。\"", "group": "db-pm-05", "multiline": true}, {"key": "doubao/db-tech-04/title", "label": "面试题", "value": "讲讲大模型的微调（Fine-tuning）。什么场景需要微调、什么场景不需要？微调一般有哪几种方式？", "group": "db-tech-04", "multiline": false}, {"key": "doubao/db-tech-04/framework", "label": "回答框架", "value": "1. 微调含义：用特定数据继续训练已预训练模型，让它适配特定任务/领域/风格\n2. 不需要微调的场景：现成能力已够 / 靠提示词、RAG、上下文注入即可解决\n3. 需要微调的判断依据：格式/风格强约束、专有知识高频稳定、模型自身能力不足\n4. 主要方式：全参数微调 vs PEFT（LoRA 等参数高效微调）；结合上下文用\"先提示词→再RAG→最后微调\"的顺序", "group": "db-tech-04", "multiline": true}, {"key": "doubao/db-tech-04/answer", "label": "口述参考答案", "value": "\"微调，简单说就是**在已经预训练好的大模型基础上，用我们自己的数据再继续训练一下**，让模型更适配某一个特定任务、某个领域，或者某一种输出风格。它不是为了把模型从零教一遍，而是让通用模型'变得更懂我们这块的业务'。\n\n我先讲**什么时候不需要微调**，因为这恰恰是很多人容易一上来就微调、其实不必要的误区。\n\n第一种，**现成能力已经够用的场景**——比如只是要'把口语整理成要点'这种通用能力，市面模型本来就做得很好，完全不需要微调，直接调接口用就行。\n\n第二种，**靠提示词或上下文注入就能解决的**——你只要把规则、范例写在提示词里，或者用 RAG 把相关资料捞进来，模型就能答得很好。这种情况先别动微调，因为微调又贵又慢，先用低成本手段拿到结果再说。\n\n那什么场景**真的需要微调**？我总结三个判断点。\n\n**第一，输出有强格式或强风格约束。** 比如你要模型稳定输出某种特定格式、特定语气（像合同条款、特定口径的客服话术），提示词约束不住，微调能让它更'稳定地长成你想要的样子'。\n\n**第二，有高频稳定的专有知识。** 如果这个领域的知识和规律是稳定、长期、高频率要用的，微调可以把这部分'固化'进模型，比每次靠 RAG 检索更稳、更快。但如果知识是天天变的，那更适合 RAG 而不是微调。\n\n**第三，模型本身能力不足。** 通用模型在这个任务上能力明显不够，再怎么提示也没用，这时候微调是必要的补强。\n\n最后讲微调的方式，主要分两大类。一类是**全参数微调**，把所有参数都训一遍，效果好但成本高、慢、容易过拟合；另一类是**参数高效微调（PEFT）**，最典型的就是 **LoRA**——只训练一小部分新增的低秩参数，冻结原模型。LoRA 成本低、速度快、还能多个任务分别存一个小插件互不干扰，现在业界用它用得最多。\n\n所以我的理解是，微调的决策有个**性价比的顺序**：先看提示词能不能解决 → 再看 RAG 能不能解决 → 都不行了，再上微调。微调里优先选 LoRA 这类高效方式。**能用便宜手段解决的，绝不轻易动用微调这个重武器。**", "group": "db-tech-04", "multiline": true}, {"key": "doubao/db-pm-06/title", "label": "面试题", "value": "面对同一个 AI 需求，你怎么决定用闭源大模型 API、开源模型自建、还是直接用市面上现成的 AI 能力？判断依据是什么？", "group": "db-pm-06", "multiline": false}, {"key": "doubao/db-pm-06/framework", "label": "回答框架", "value": "1. 先看现成能力：市场上有没有已封装好、满足 80% 需求的成熟 AI 能力（API/现成产品）\n2. 再看数据与差异：是否涉及敏感数据、是否依赖专有知识、是否构成核心差异化\n3. 比较成本结构：研发成本、算力成本、长期维护 vs 调用成本，算清\"自建 vs 购买\"的经济账\n4. 结论顺序：能用现成先用现成 → 需要定制再看开源/闭源 → 核心壁垒才自建", "group": "db-pm-06", "multiline": true}, {"key": "doubao/db-pm-06/answer", "label": "口述参考答案", "value": "\"这个问题本质是在问**资源怎么分配、钱花在刀刃上**。我不会一上来就'我要选个大模型'，而是倒着问：这个需求，市场上是不是已经有现成答案了。\n\n所以我的判断路径是**从'现成'往'自建'逐层判断**。\n\n**第一层，先看现成的 AI 能力够不够。** 现在市面上有大量封装好的能力——调一个成熟 API、用一个成熟 AI 产品就能覆盖大部分需求。如果现成的能解决七八成，我通常先接现成的，把产品先跑起来、把用户价值先验证出来。**没必要为所有需求都去造轮子。**\n\n**第二层，再看这个需求是否碰了'必须自己掌控'的红线。** 我重点看两个：一个是**数据**——如果涉及敏感数据、合规要求不允许把数据送出去，那闭源 API 可能就不可用，得往自建方向走；另一个是**专有知识/核心差异化**——如果这个能力是产品的核心卖点、靠通用模型做不出差别，那光调 API 是不够的，需要自己在上面做定制。\n\n**第三层，算成本账，这是最实在的。** 我会把两边都算清楚：**自建的账**是研发成本、算力/硬件成本、以及长期维护的人力；**调用的账**是 token/API 的持续成本、以及受制于第三方的风险。然后看一个关键问题——**这个需求的调用量有多大、自建带来的边际收益撑不撑得起这笔投入**。调用量小、通用能力就够，肯定买现成的；调用量极大、自建能显著降本或显著提升效果，才值得投。\n\n**第四层，落到选型结论。** 我习惯的顺序是：**能用现成先用现成 → 需要一定定制再看开源模型（自己可以微调、可控）→ 只有涉及敏感数据、核心壁垒、长期降本，才考虑自建甚至自训。** 闭源和开源的取舍里，我也会权衡'效果天花板'和'可控性'——闭源往往效果更好上手更快，开源可控性强、但需要更多工程投入。\n\n所以我的结论是：模型选型不是选'哪个模型更厉害'，而是**把'现成能力、数据合规、核心差异化、成本账'四件事算清楚**，然后用'现成优先、自建兜底'的顺序来决策。产品经理的价值，就在于把这个账算明白，而不是被技术名词带着走。\"", "group": "db-pm-06", "multiline": true}, {"key": "doubao/db-tech-05/title", "label": "面试题", "value": "讲讲 Agent 的基本架构，它和\"单次调用一次大模型\"有什么本质不同？", "group": "db-tech-05", "multiline": false}, {"key": "doubao/db-tech-05/framework", "label": "回答框架", "value": "1. 单次调用 vs Agent：一次问答 vs 一个\"能自主规划-执行-反思-迭代\"的循环\n2. Agent 四要素：大模型（大脑）、工具（手脚）、记忆、规划/反思\n3. 运行循环：拆解目标 → 调用工具/检索 → 观察结果 → 反思调整 → 直到完成\n4. 关键工程点：多轮控制、工具调用可靠性、记忆管理、安全与失败兜底", "group": "db-tech-05", "multiline": true}, {"key": "doubao/db-tech-05/answer", "label": "口述参考答案", "value": "\"我先讲清一个最本质的区别：**单次调用，是模型答一次问题；Agent，是一个能自己做事的循环。** 普通调用是你问一句、它回一句就结束了；而 Agent 是你给它一个目标，它自己去**拆解 → 执行 → 看结果 → 调整 → 再做**，一直到把这个目标完成。它不再是'回答'，而是'干活'。\n\n那它靠什么能干这种活？我讲四个核心部件，这是 Agent 的基本架构。\n\n**第一个，大模型——它是'大脑'，负责理解和决策。** 所有思考、判断、决定下一步做什么，都靠它。\n\n**第二个，工具（Tools）——它是'手脚'。** 这是关键。Agent 能调用外部能力：比如能去调一个 API、能去搜网页、能去操作某个系统、能去写文件。正是因为它能调用工具，它才能真的'做'事，而不是只会说。\n\n**第三个，记忆。** 它需要记住当前任务做到哪一步了、中间得到了什么结果，甚至调用长期记忆记住过往上下文，才能不跑偏、持续往下走。\n\n**第四个，规划和反思。** 它要把一个大目标拆成一步步的小行动，每做完一步观察结果、判断对不对，不对就调整方向。这个'规划—执行—反思'的能力，是 Agent 区别于简单调用的核心。\n\n那它具体怎么运转？我概括成一个循环：**用户给目标 → 大模型把它拆成步骤 → 调用对应的工具去执行 → 拿到结果后判断'够了吗' → 不够就继续下一步 → 够了就把结果整理交付。** 整个过程可能要好几个来回，不是一步到位。\n\n最后我讲几个 Agent 落地的关键工程点，这也是面试里会被追问的：\n\n一个是**多轮和工具调用的可靠性**——工具参数传错、调用失败是常态，必须做好容错和重试，不然很容易'死循环'。另一个是**记忆管理**——上下文是有限的，怎么做摘要、怎么保留关键状态，直接决定 Agent 长任务会不会'忘了前面'。还有一个是**安全与兜底**——Agent 拥有调用外部工具的权限，意味着它有'产生真实影响'的能力，所以权限控制、高影响动作的确认、以及失败时的降级路径，是必须设计的。\n\n所以我的理解是：Agent 的本质是**把'大模型 + 工具 + 记忆 + 规划反思'组合成一个能自主循环做事的系统**，和单次调用的差别，是它从'回答者'变成了'执行者'。这既是它的价值所在，也是它工程复杂度、安全风险都大幅上升的原因。\"", "group": "db-tech-05", "multiline": true}, {"key": "doubao/db-pm-07/title", "label": "面试题", "value": "AI 产品的最终效果，很大程度上取决于算法和工程能不能落地。作为产品经理，你会怎么和算法、工程高效协作，把一个 AI 需求真正做好？", "group": "db-pm-07", "multiline": false}, {"key": "doubao/db-pm-07/framework", "label": "回答框架", "value": "1. 协作前提：把需求翻译成\"算法/工程能执行的问题\"——定目标、定边界、定评测标准\n2. 明确分工与节奏：算法负责效果、工程负责稳定、PM 负责定义\"好\"并验收\n3. 用统一评测集对齐三方，避免\"我说好、算法说行\"的扯皮\n4. 建立数据反馈闭环，让协作是迭代的而不是一次性交付", "group": "db-pm-07", "multiline": true}, {"key": "doubao/db-pm-07/answer", "label": "口述参考答案", "value": "\"AI 产品最难的协作点在于：**它的'需求'不像传统功能那么明确，是个模糊的、要不断逼近的目标。** 传统功能你说'做一个按钮，点了就保存'，工程师闭眼能实现；AI 需求你说'让助手更智能地回答用户问题'，算法和工程根本没法直接开工。所以我觉得协作的核心，是**先把模糊的需求翻译成算法和工程能执行、能验收的东西**。\n\n我分四步讲。\n\n**第一步，定目标、定边界、定评测——这是最关键的。** 我不会只丢一句'效果要好'，而是明确三件事：这个功能的**成功标准**是什么、它能处理的**边界**在哪（哪些情况必须兜底）、以及**用什么指标来量**。比如一个客服场景，我会和算法对齐'意图识别准确率要到多少、不能识别的时候怎么降级'。目标定清楚了，三方才不会各说各话。\n\n**第二步，明确各自的分工和责任。** 我会和团队说清楚：**算法负责把效果做上去，工程负责把稳定性和成本做好，而产品经理负责定义'什么叫好'、并负责最终验收。** 这样权责清晰，不会出现'效果不行是算法问题还是产品问题'的互相甩锅。\n\n**第三步，用一个统一的评测集把三方对齐。** 这是我最看重的动作。我会和算法共建一套覆盖典型场景 + 边界 + 反例的评测集，**上线前后、每次改动都用同一把尺子量**。这样我跟算法讨论'这次效果有没有变好'，不是凭感觉，而是看评测集上的数字。评测集就是我们三方的'共同语言'，能避免大量无效拉扯。\n\n**第四步，建立数据反馈闭环。** 我不把协作当成'我提需求、你交付'的一次性买卖，而是让真实用户数据回流——上线后埋点、收集失败案例、定期复盘，把发现的问题反哺到评测集和迭代里。这样协作是持续滚动的，产品才会越做越好。\n\n所以我的结论是：和算法、工程协作，产品经理最大的职责不是催进度，而是**把模糊的 AI 需求翻译成'有目标、有边界、有评测标准'的清晰问题，并建立数据闭环**。协作顺畅的本质，是我们有共同的目标和同一把尺子。\"", "group": "db-pm-07", "multiline": true}, {"key": "doubao/db-tech-06/title", "label": "面试题", "value": "讲讲 token 是什么、token 计费大概怎么算，以及为什么优化 token 消耗很重要？有哪些常见优化手段？", "group": "db-tech-06", "multiline": false}, {"key": "doubao/db-tech-06/framework", "label": "回答框架", "value": "1. token 概念：模型处理文本的最小单位（约等于\"半个词/一段字\"），输入输出都计费\n2. 计费逻辑：输入 token + 输出 token，通常按量计费、量大可谈价格\n3. 为什么重要：直接决定成本、也影响延迟和体验；AI 产品是\"卖得越多成本越高\"\n4. 优化手段：提示词精简、缓存复用、选更小/更快模型、RAG 按需注入、控制输出长度、批处理", "group": "db-tech-06", "multiline": true}, {"key": "doubao/db-tech-06/answer", "label": "口述参考答案", "value": "\"我先讲 token 是什么。**token 是模型处理文本的最小单位**——它不是按'字'也不是按'词'，而是模型自己切分出来的最小片段，中文里一个 token 大概对应不到一个字或一两个字。你发给模型的提示词、以及模型回复的内容，都会被切成一串 token 来处理。**模型每次回答，输入和输出都会消耗 token，也都按 token 计费。**\n\n计费逻辑其实很直白：**总费用 = 输入 token 数 × 单价 + 输出 token 数 × 单价**，按量收费。通常输出 token 的单价还会比输入贵一些。对用量大的企业，可以谈包量或更优惠的价格，但单位成本这个逻辑是固定的。\n\n那为什么优化 token 消耗很重要？我讲三点，它不只是一个省钱问题。\n\n**第一，它直接决定成本，而且 AI 产品和传统软件不一样。** 传统软件边际成本趋近于零，而 AI 产品**每次调用都花钱，用的人越多、成本越高**。如果不控 token，很可能出现'产品火了、成本跟着爆了'、卖得越多亏得越多的情况。所以 token 优化是 AI 产品能不能持续盈利的关键。\n\n**第二，它影响延迟和体验。** token 是逐字生成的，输出越长，用户等得越久。控 token 不只是省钱，也是让响应更快、体验更顺。\n\n**第三，它间接影响质量。** 垃圾输入多、上下文塞得太满，模型反而容易抓不住重点、答偏。所以优化 token 往往和提升效果是一回事。\n\n那常见的优化手段有哪些？我按从轻到重讲几个。\n\n**第一个，提示词精简。** 把不必要的废话、重复指令删掉，用最少的字说清楚需求，这是最基础也最立竿见影的。\n\n**第二个，缓存复用。** 用户的常见问题、固定的系统指令，很多是重复的。命中缓存就可以大幅省掉输入 token 的重复开销，对高频场景效果很明显。\n\n**第三个，选更小、更快的模型。** 同一个任务，如果轻量模型效果已经够用，就不用每次都用最强的大模型——这是从模型层面降本。\n\n**第四个，RAG 按需注入。** 不要一股脑把整份长文档塞进上下文，而是只把和问题相关的片段捞进来，既省 token 又提升准确度。\n\n**第五个，控制输出长度并做结构化。** 在提示词里明确限制回复长度、要求直接给要点，避免模型啰嗦输出一堆无效 token。\n\n所以我的理解是：**token 优化本质是在'成本、延迟、质量'三者之间找平衡**，它不是纯粹的抠成本，而是 AI 产品能不能健康运转的工程基本功。产品和技术在这里要一起使劲，把每一分 token 都花在刀刃上。\"", "group": "db-tech-06", "multiline": true}, {"key": "doubao/db-pm-08/title", "label": "面试题", "value": "多模态 AI 产品（同时处理文字、图片、语音）和纯文本产品相比，在体验设计上会新增哪些难点？你会怎么设计？", "group": "db-pm-08", "multiline": false}, {"key": "doubao/db-pm-08/framework", "label": "回答框架", "value": "1. 多模态的体验优势与难点并存：信息更丰富，但\"理解不一致\"和\"边界模糊\"被放大\n2. 难点一：模态间信息对齐——同一对象在不同模态里要一致（图与文互证）\n3. 难点二：交互与反馈的设计——用户怎么输入、系统怎么呈现，多模态通道怎么配合\n4. 难点三：能力边界与错误兜底——某个模态识别错了，怎么提示、怎么降级\n5. 设计原则：以\"用户意图\"为中心选择模态，不为了炫技堆模态", "group": "db-pm-08", "multiline": true}, {"key": "doubao/db-pm-08/answer", "label": "口述参考答案", "value": "\"多模态产品的核心诱惑是'信息更丰富'——用户能拍照、能说话、能传文件，AI 能同时理解这些。但我要说，它给体验设计带来的难度也更大，我总结三个最难的点。\n\n**第一个难点，模态之间的信息对齐。** 这是多模态最容易翻车的地方。比如用户上传一张图并问'帮我看看这个',AI 不仅要理解图，还要把图里的信息和文字指令对上。如果图理解对了、但和文字对不上，或者图里的关键细节认错了，用户的信任立刻崩掉。所以我会特别在意**图、文、语音之间的一致性和互证**——产品要能'看'得对，也要能告诉用户'我基于图里的哪部分信息'，而不是各模态各说各话。\n\n**第二个难点，交互和反馈的设计。** 多模态意味着用户的输入方式变多了、系统的呈现方式也变多了。我会想清楚：什么时候引导用户用拍照、什么时候用语音、什么时候打字；反过来，AI 的回答什么时候用文字、什么时候用图、什么时候用语音播报。原则是**跟着场景和用户意图走**——比如用户在路上，适合语音；用户在仔细核对信息，适合图文对照。不是为了'什么都能'就把所有通道堆上去，那只会让用户不知道该怎么用。\n\n**第三个难点，能力边界和错误兜底。** 每个模态识别的准确率都不一样，图片识别错、语音听岔是常态。所以我会为每个模态都设计**明确的能力边界和降级路径**：比如语音没听清，要友好地让用户再说一遍，而不是硬着头皮答；图片里没有用户要找的信息，要明确告知'我在这张图里没找到'，而不是编造。多模态的错误更容易'看着很像真的'，所以'认怂'和溯源比纯文本更重要。\n\n最后我讲一个贯穿的原则：**多模态的价值是'更贴近用户的真实表达'，不是'功能越多越好'。** 我设计时会先问：这个场景里，加上某个模态到底有没有让用户更容易、更准地表达和获取信息？如果没有，就不加。堆模态只会增加理解成本，反而把好产品做成负担。\n\n所以我的结论是：多模态产品设计的难点，集中在**模态对齐、交互编排、边界兜底**三件事上。而设计的原则是**以用户意图为中心**——让合适的模态在合适的场景出现，而不是让所有模态都出现。\"", "group": "db-pm-08", "multiline": true}, {"key": "doubao/db-tech-07/title", "label": "面试题", "value": "讲讲 Embedding（向量嵌入）和向量检索的原理，为什么说它是很多 AI 应用的基础？", "group": "db-tech-07", "multiline": false}, {"key": "doubao/db-tech-07/framework", "label": "回答框架", "value": "1. Embedding 概念：把文本/图片等转成\"一串数字（向量）\"，让语义变成可计算的距离\n2. 核心价值：语义相近的内容向量也相近——\"理解\"被转化为\"数学距离\"\n3. 向量检索原理：把查询转成向量 → 和库里向量算相似度（余弦等）→ 召回最相近的 topK\n4. 典型应用：RAG、语义搜索、去重、推荐、聚类\n5. 工程要点：切块、索引方式（ANN 近似最近邻）、召回质量（重排）", "group": "db-tech-07", "multiline": true}, {"key": "doubao/db-tech-07/answer", "label": "口述参考答案", "value": "\"Embedding，中文叫向量嵌入，它的核心思想是把**文字、图片这些非结构化的内容，转成一大串数字，也就是一个向量**。为什么这么干？因为模型没法直接'理解'文字，但它能算数字之间的距离。所以 Embedding 的本质是：**把'语义'转化成'可以计算的数学距离'。**\n\n它的关键特性是：**语义相近的内容，它们的向量也相近。** 比如'猫'和'猫咪'这两个词，转成向量后距离很近；而'猫'和'汽车'距离就远。这样一来，'理解语义'这件事，就变成了'计算向量距离'这件事。这就是它成为很多 AI 应用地基的原因。\n\n那向量检索就顺理成章了。它的原理分三步：\n\n**第一步，索引。** 我们把一个知识库里的内容（比如文档切块后的段落）分别转成向量，全部存进一个向量数据库，建好索引，方便快速查询。\n\n**第二步，查询。** 用户来一个问题，我们把这个查询也转成一个向量。\n\n**第三步，召回。** 用这个查询向量，去和库里所有向量算相似度——最常用的是**余弦相似度**，就是算两个向量方向有多接近——然后把相似度最高的那几段内容**召回**出来，也就是 topK。这召回结果可以喂给大模型，也可以直接返回给用户做语义搜索。\n\n它的典型应用我列几个：**RAG**——从知识库召回相关资料再让模型生成；**语义搜索**——不是靠关键词硬匹配，而是靠语义相似来找，用户换个说法也能搜到；还有**去重、推荐、聚类**——相似内容聚到一起、推给用户相似的东西，都用的是向量距离。\n\n最后我讲几个工程上要注意的点，这也是容易被追问的。一个是**切块质量**——文档怎么切、切多大，直接影响召回效果；一个是**索引方式**——库里向量可能几百万条，全量硬算太慢，所以要用 **ANN（近似最近邻）** 这类算法做快速近似检索，在速度和准确之间取平衡；还有一个是**重排（rerank）**——粗召回可能不够精准，常见做法是先快速召回一大批，再用更精细的模型重排、挑出最准的几条。这些细节，决定了向量检索到底好不好用。\n\n所以我的理解是：**Embedding 把语义变成了数学，向量检索让'按语义找'成为可能**。它是 RAG、语义搜索、个性化推荐这些 AI 能力共同的地基，理解了它，就理解了为什么 AI 产品能做到'懂你想要的'。\"", "group": "db-tech-07", "multiline": true}, {"key": "doubao/db-pm-09/title", "label": "面试题", "value": "你负责一个 AI 功能，怎么给它搭建一套评测体系，判断它上线后到底好不好、有没有退化？请讲讲你的思路。", "group": "db-pm-09", "multiline": false}, {"key": "doubao/db-pm-09/framework", "label": "回答框架", "value": "1. 评测本质：把\"效果好不好\"从主观感受变成可量化、可复现的指标\n2. 三层评测：效果层（正确率/召回）、体验层（可用率/放弃率）、业务层（转化/留存/成本）\n3. 评测集设计：典型场景 + 边界反例，上线前后用同一把尺子\n4. 退化监控：上线后持续采样回归，关注真实数据与评测集的一致性\n5. 主观+客观结合：离线指标与用户真实反馈互为补充", "group": "db-pm-09", "multiline": true}, {"key": "doubao/db-pm-09/answer", "label": "口述参考答案", "value": "\"我理解评测体系的核心目的，是把'这个功能到底好不好'从一个主观感觉，变成**可量化、可复现、可对比**的东西。不然团队没法判断每次改动是变好了还是变坏了，也没法和别人对齐。我一般分三层来做。\n\n**第一层，效果层——模型本身做得好不好。** 这是最基础的，我用准确率、召回率这类指标来衡量，比如意图识别对不对、答案准不准。这一层我依赖一套**评测集**——我会特意覆盖三种样本：典型场景、边界情况、以及容易出错的难样本（反例）。评测
