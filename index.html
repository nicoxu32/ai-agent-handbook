<script id="handbook-data" type="application/json">{"groups": ["模型基础", "知识库与检索", "智能体执行", "多模态与集成", "企业平台能力", "产品设计与运营"], "chapters": [{"id": "k01", "number": "01", "title": "LLM 与推理：模型为什么能回答，又为什么会答错？", "short": "LLM 与推理", "priority": "P0", "group": 0, "intro": "\u003cp>\u003cstrong>先理解它在做什么，再谈它聪不聪明。\u003c/strong> \n常见的生成式大语言模型，会把输入切成 Token，转换成数字表示，再根据当前上下文预测后续 Token。生成一个，就把它接回上下文，继续生成下一个，这叫自回归生成。\u003c/p>\n\u003cp>训练时模型从大量的数据样本中学到语言规律、知识关联和任务模式；因此“预测下一个 Token”是计算机制，不代表它具有可靠的事实数据库。\u003c/p>\n\u003cp>Transformer 中的 Attention，可以理解成计算当前位置应该参考上下文里的哪些信息、参考多少。例如“合同已签，但款项未付”，回答付款状态时必须关注“未付”，不能只抓住“已签”。这种关联通过多层计算形成，并不是系统预先写好所有语法和业务规则。不过 Attention 不是事实核验器：原文错误、条件遗漏或模型误用关联，都可能生成流畅的错误答案。\u003c/p>\n\u003cp>\u003cstrong>训练和使用模型是两件事。\u003c/strong> 预训练建立广泛能力；监督微调、偏好优化等后训练让模型更会遵循要求、调用工具或完成特定任务。调用已经训练好的模型处理请求，叫推理。把文件放进本次上下文，通常不会改模型参数；保存聊天记录，也不等于完成训练。\u003c/p>\n\u003cp>比如给模型一份会议记录，让它整理结论，这是利用已训练模型处理当前输入；这次提供记录不等于重新训练模型。\u003c/p>\n\u003cp>有些推理模型会在回答前投入更多计算或生成内部推理 Token，复杂任务可能因此受益，但耗时、成本也会上升，具体行为取决于服务。Temperature 等采样参数主要改变输出选择的随机程度，并不是“越低越真实”的准确率旋钮。即使低随机性输出稳定地重复同一句话，它也可能稳定地答错。\u003c/p>", "decision": "\u003cp>选模型时先定义任务：客服分类看类别与误分损失，合同审阅看遗漏和引用，工具执行看选工具与参数正确率。用同一批输入比较合格率、时延和人工修订成本，再决定模型。公开榜单能帮助筛选候选，不能替代目标任务评测。模型缺知识、不会执行、行为不稳定，分别对应资料接入、工具集成和提示词／微调等不同路径。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>客服工单分流。\u003c/strong> 输入工单内容和业务定义，模型输出问题类别与判断依据，规则系统再分配队列。先让它区分退款、物流、账号等清晰类别；“退货没到账”可能涉及多个状态，需要允许复合标签或转人工。验收看高风险工单是否漏分，以及分流后是否减少转派。\u003c/p>\n\u003cp>\u003cstrong>合同审阅助手。\u003c/strong> 模型提取付款节点、违约条款和不一致之处，附原文位置；计算日期、比对主体信息由程序辅助。交付的是有依据的审阅建议，用户仍可核对原文。升级模型要证明漏项减少，而不仅是建议写得更长。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>演示很好，上线不稳。\u003c/strong> 演示往往只有干净短文本。按长度、歧义、专业术语、缺资料分组复测，确定失效范围，再选模型或收窄承诺。\u003c/li>\n\u003cli>\u003cstrong>同一问题答案变动。\u003c/strong> 先固定模型版本、参数、资料与提示词，再重复运行。变化可能来自生成随机性，也可能来自检索和服务更新，不能全部归因于 Temperature。\u003c/li>\n\u003cli>\u003cstrong>换强模型仍答错。\u003c/strong> 把正确材料直接提供给模型做对照；如果这样能答对，优先修上游资料路径。若证据充分仍反复误判，再比较模型能力。\u003c/li>\n\u003c/ul>", "questions": [{"id": "01.1", "title": "大模型、AI 应用和 Agent 的区别是什么？", "answer": "\u003cp>“大模型提供理解和生成能力；AI 应用把它接到具体任务和交互里；Agent 则进一步让模型根据目标和执行反馈选择下一步行动。三者不是互相替代的产品名。\u003c/p>\n\u003cp>比如合同摘要应用可以固定地读取文件、生成摘要；合同处理 Agent 还可能发现附件缺失，继续查找，调用系统核对主体，再决定是否提交审批。执行环节由应用运行，模型只是提出行动和参数。\u003c/p>\n\u003cp>所以我不会用‘有聊天框’判断是不是 Agent，而看控制流程是否包含基于反馈的动态决策。自主决策越多，越需要明确状态和停止标准。验收也从文本质量扩展到完整任务是否完成，而不是模型是否说自己完成了。”\u003c/p>"}, {"id": "01.2", "title": "企业资料问答应该选 Prompt、RAG 还是微调？", "answer": "\u003cp>“我先判断缺的是任务说明、外部知识还是稳定行为。输出要求不清楚，先改 Prompt；需要企业最新、可追溯且有权限差异的资料，优先做 RAG；任务已经稳定、有高质量样本，但行为仍持续不达标，再评估微调。\u003c/p>\n\u003cp>例如客服需要查询最新退款政策，这些规则会更新，用检索接入更容易更新和引用。若客服分类标签固定、样本充分，轻量模型微调可能值得评估，但要用保留集证明比提示词方案更稳、更划算。\u003c/p>\n\u003cp>这些方式可以组合。我不会把制度不断训练进参数当作精确更新机制，也不会把工具接口缺失当成模型不会的问题。先定位能力缺口，才能避免在错误的一层投入。”\u003c/p>"}, {"id": "01.3", "title": "怎样判断一个推理能力更强的模型值得采用？", "answer": "\u003cp>“我会选确实需要多步判断的任务做对照，比如合同条款跨段冲突检查，而不是只测简单改写。固定资料、评分规则和调用条件，比较遗漏、错误结论、时延和每个可用结果的成本。\u003c/p>\n\u003cp>如果强模型减少了漏审和人工复核，额外推理成本可能值得；如果主要瓶颈是漏文档，模型再强也补不回真实资料。对于简单分类，较轻模型已经达标，就没有必要给每个请求增加推理预算。\u003c/p>\n\u003cp>我也会重复运行关键样本，确认不是某一次答得好。最终选择可以按任务分层，而不是全平台统一用最贵模型，更不会把模型输出了长分析当成它推理正确的证据。”\u003c/p>"}], "search": "LLM 与推理：模型为什么能回答，又为什么会答错？\n**先理解它在做什么，再谈它聪不聪明。** \n常见的生成式大语言模型，会把输入切成 Token，转换成数字表示，再根据当前上下文预测后续 Token。生成一个，就把它接回上下文，继续生成下一个，这叫自回归生成。\n\n训练时模型从大量的数据样本中学到语言规律、知识关联和任务模式；因此“预测下一个 Token”是计算机制，不代表它具有可靠的事实数据库。\n\nTransformer 中的 Attention，可以理解成计算当前位置应该参考上下文里的哪些信息、参考多少。例如“合同已签，但款项未付”，回答付款状态时必须关注“未付”，不能只抓住“已签”。这种关联通过多层计算形成，并不是系统预先写好所有语法和业务规则。不过 Attention 不是事实核验器：原文错误、条件遗漏或模型误用关联，都可能生成流畅的错误答案。\n\n**训练和使用模型是两件事。** 预训练建立广泛能力；监督微调、偏好优化等后训练让模型更会遵循要求、调用工具或完成特定任务。调用已经训练好的模型处理请求，叫推理。把文件放进本次上下文，通常不会改模型参数；保存聊天记录，也不等于完成训练。\n\n比如给模型一份会议记录，让它整理结论，这是利用已训练模型处理当前输入；这次提供记录不等于重新训练模型。\n\n有些推理模型会在回答前投入更多计算或生成内部推理 Token，复杂任务可能因此受益，但耗时、成本也会上升，具体行为取决于服务。Temperature 等采样参数主要改变输出选择的随机程度，并不是“越低越真实”的准确率旋钮。即使低随机性输出稳定地重复同一句话，它也可能稳定地答错。\n选模型时先定义任务：客服分类看类别与误分损失，合同审阅看遗漏和引用，工具执行看选工具与参数正确率。用同一批输入比较合格率、时延和人工修订成本，再决定模型。公开榜单能帮助筛选候选，不能替代目标任务评测。模型缺知识、不会执行、行为不稳定，分别对应资料接入、工具集成和提示词／微调等不同路径。\n**客服工单分流。** 输入工单内容和业务定义，模型输出问题类别与判断依据，规则系统再分配队列。先让它区分退款、物流、账号等清晰类别；“退货没到账”可能涉及多个状态，需要允许复合标签或转人工。验收看高风险工单是否漏分，以及分流后是否减少转派。\n\n**合同审阅助手。** 模型提取付款节点、违约条款和不一致之处，附原文位置；计算日期、比对主体信息由程序辅助。交付的是有依据的审阅建议，用户仍可核对原文。升级模型要证明漏项减少，而不仅是建议写得更长。\n- **演示很好，上线不稳。** 演示往往只有干净短文本。按长度、歧义、专业术语、缺资料分组复测，确定失效范围，再选模型或收窄承诺。\n- **同一问题答案变动。** 先固定模型版本、参数、资料与提示词，再重复运行。变化可能来自生成随机性，也可能来自检索和服务更新，不能全部归因于 Temperature。\n- **换强模型仍答错。** 把正确材料直接提供给模型做对照；如果这样能答对，优先修上游资料路径。若证据充分仍反复误判，再比较模型能力。\n大模型、AI 应用和 Agent 的区别是什么？ “大模型提供理解和生成能力；AI 应用把它接到具体任务和交互里；Agent 则进一步让模型根据目标和执行反馈选择下一步行动。三者不是互相替代的产品名。\n比如合同摘要应用可以固定地读取文件、生成摘要；合同处理 Agent 还可能发现附件缺失，继续查找，调用系统核对主体，再决定是否提交审批。执行环节由应用运行，模型只是提出行动和参数。\n所以我不会用‘有聊天框’判断是不是 Agent，而看控制流程是否包含基于反馈的动态决策。自主决策越多，越需要明确状态和停止标准。验收也从文本质量扩展到完整任务是否完成，而不是模型是否说自己完成了。”\n企业资料问答应该选 Prompt、RAG 还是微调？ “我先判断缺的是任务说明、外部知识还是稳定行为。输出要求不清楚，先改 Prompt；需要企业最新、可追溯且有权限差异的资料，优先做 RAG；任务已经稳定、有高质量样本，但行为仍持续不达标，再评估微调。\n例如客服需要查询最新退款政策，这些规则会更新，用检索接入更容易更新和引用。若客服分类标签固定、样本充分，轻量模型微调可能值得评估，但要用保留集证明比提示词方案更稳、更划算。\n这些方式可以组合。我不会把制度不断训练进参数当作精确更新机制，也不会把工具接口缺失当成模型不会的问题。先定位能力缺口，才能避免在错误的一层投入。”\n怎样判断一个推理能力更强的模型值得采用？ “我会选确实需要多步判断的任务做对照，比如合同条款跨段冲突检查，而不是只测简单改写。固定资料、评分规则和调用条件，比较遗漏、错误结论、时延和每个可用结果的成本。\n如果强模型减少了漏审和人工复核，额外推理成本可能值得；如果主要瓶颈是漏文档，模型再强也补不回真实资料。对于简单分类，较轻模型已经达标，就没有必要给每个请求增加推理预算。\n我也会重复运行关键样本，确认不是某一次答得好。最终选择可以按任务分层，而不是全平台统一用最贵模型，更不会把模型输出了长分析当成它推理正确的证据。”"}, {"id": "k02", "number": "02", "title": "Token 与上下文：模型这次能看多少，为什么越聊越慢？", "short": "Token 与上下文", "priority": "P0", "group": 0, "intro": "\u003cp>Token 是模型编码文本的单位，不固定等于一个汉字或单词。相同中文在不同分词器下长度也可能不同。产品要做预算，应使用目标服务的计量方式，而不是按字符数给用户承诺容量。\u003c/p>\n\u003cp>\u003cstrong>上下文窗口是本次处理的容量，不是永久记忆。\u003c/strong> 系统指令、用户消息、历史对话、检索片段、工具描述与返回都可能占用输入空间；还要按服务规则为输出及可能的推理 Token 留预算。比如窗口标称很大，也要核对最大输出限制，不能把全部容量都当成可生成的报告长度。\u003c/p>\n\u003cp>比如长报告加上历史对话可能超出一次调用的容量，需要选取相关内容，并为回答留出空间。\u003c/p>\n\u003cp>推理通常能区分两个阶段：Prefill 处理输入并建立当前上下文的表示；Decode 逐步生成输出。长输入会增加前一阶段工作，长答案会延长逐 Token 生成。用户感知的“第一句话很慢”和“已经开始但写得慢”，因此需要分开定位。实际速度还受模型、批处理、硬件和服务排队影响。\u003c/p>\n\u003cp>KV Cache 缓存 Attention 计算中的中间结果，避免生成每个新 Token 时把同样历史全部重算。服务端的 Prompt Cache 还可能复用不同请求的公共前缀，但命中条件、保留时间与收费依服务而定。它们都不是用户长期记忆，也不让过期内容自动更新。\u003c/p>\n\u003cp>\u003cstrong>上下文工程，是决定这一次到底给模型看什么。\u003c/strong> 可以保留结构化任务状态，压缩旧对话，按需读取文件，把超长工具返回分页或提炼。摘要有损：金额、时间、用户已确认的操作范围最好单独保存。长窗口扩大可处理范围，却不保证模型同样善于使用每一个位置的信息。\u003c/p>", "decision": "\u003cp>先拆输入构成和输出需求，再决定压缩、检索或更换窗口。教学例子：系统与工具占 8 千 Token，历史占 30 千，资料占 50 千，计划输出 6 千，合计已达 94 千；还要核对目标模型对推理和输出的具体预算，不能只检查那 50 千资料。优化以关键约束不丢失为前提，记录首字时间、输出生成速度和总成本。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>长任务研究助手。\u003c/strong> 对话越来越长时，保存研究目标、已验证结论、证据链接和待办，再压缩闲聊；后续任务按需回读文件。用户改变研究地区时，旧地区的结果应标为失效，不能让摘要继续把它当当前条件。\u003c/p>\n\u003cp>\u003cstrong>企业多技能助手。\u003c/strong> 不必每轮把几百个工具的完整描述都塞进去。先按任务选相关工具集，需要时再加载更多；评估上下文节省的同时，要检查真正需要的工具是否仍能被发现。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>界面显示历史，模型却忘了。\u003c/strong> 检查实际请求是否包含历史、摘要是否遗漏、窗口是否截断。聊天 UI 保存记录，不代表服务每轮都读到。\u003c/li>\n\u003cli>\u003cstrong>压缩后任务跑偏。\u003c/strong> 对比压缩前后关键字段，尤其否定、金额与确认状态；把这些字段移到结构化状态，摘要主要承载叙述背景。\u003c/li>\n\u003cli>\u003cstrong>缓存命中低。\u003c/strong> 检查可复用前缀是否稳定、动态时间与用户字段是否放在前面，并核对服务规则。不能为了命中缓存混用租户资料或过期授权。\u003c/li>\n\u003c/ul>", "questions": [{"id": "02.1", "title": "有长上下文模型，为什么还要检索与上下文管理？", "answer": "\u003cp>“长窗口解决的是能容纳多少信息，并没有同时解决成本、更新、权限和有效使用问题。少量指定文档做整体比较，可以直接长上下文；从海量资料回答一个问题，更适合检索相关证据；要完整总结一组文件，则先列清材料再分层处理。\u003c/p>\n\u003cp>我会根据任务所需覆盖范围选择，而不是一律切块或一律全塞。还会测关键条件放在长文不同位置时能否被正确使用。就算没有超限，无关资料也可能干扰判断。\u003c/p>\n\u003cp>因此长上下文和 RAG 可以互补：检索负责缩小范围，较长上下文帮助容纳完整条款或多个证据；最终看完整正确率与成本，不用窗口数字代替效果。”\u003c/p>"}, {"id": "02.2", "title": "用户说回答越来越慢，你如何区分输入与输出问题？", "answer": "\u003cp>“我先把排队、首字时间和生成阶段分开，再看输入输出 Token 的变化。长历史或巨大的工具结果可能拖慢输入处理；输出越长，逐步生成通常也越久。首字慢还可能是服务排队，不能只看 Token 猜结论。\u003c/p>\n\u003cp>如果输入重复，尝试删无关内容、压缩历史或利用受支持的前缀缓存；如果答案过长，先明确需要的详略和输出上限。流式展示能改善等待感，却不一定减少总耗时。\u003c/p>\n\u003cp>优化后用相同任务核对关键约束和答案完整性，再比较时延分布。不能通过截掉必要证据换取更快、却更不可靠的回答。”\u003c/p>"}, {"id": "02.3", "title": "对话压缩和长期记忆有什么区别？", "answer": "\u003cp>“对话压缩主要是降低当前任务的上下文占用；长期记忆是决定哪些信息值得跨会话保存和再次使用。压缩摘要可能只活在这个任务里，不能自动视为用户永久偏好。\u003c/p>\n\u003cp>例如用户说‘这次报告控制在两页’，可以进入当前摘要；不能据此长期认定所有报告都只能两页。我会把目标、当前条件、已执行动作等结构化保存，摘要补背景，长期偏好另有写入与修改规则。\u003c/p>\n\u003cp>验证压缩时看原任务约束是否保留；验证长期记忆时看跨会话是否正确取用、是否过期和可删除。两者可能使用相似技术，但产品生命周期不同。”\u003c/p>"}], "search": "Token 与上下文：模型这次能看多少，为什么越聊越慢？\nToken 是模型编码文本的单位，不固定等于一个汉字或单词。相同中文在不同分词器下长度也可能不同。产品要做预算，应使用目标服务的计量方式，而不是按字符数给用户承诺容量。\n\n**上下文窗口是本次处理的容量，不是永久记忆。** 系统指令、用户消息、历史对话、检索片段、工具描述与返回都可能占用输入空间；还要按服务规则为输出及可能的推理 Token 留预算。比如窗口标称很大，也要核对最大输出限制，不能把全部容量都当成可生成的报告长度。\n\n比如长报告加上历史对话可能超出一次调用的容量，需要选取相关内容，并为回答留出空间。\n\n推理通常能区分两个阶段：Prefill 处理输入并建立当前上下文的表示；Decode 逐步生成输出。长输入会增加前一阶段工作，长答案会延长逐 Token 生成。用户感知的“第一句话很慢”和“已经开始但写得慢”，因此需要分开定位。实际速度还受模型、批处理、硬件和服务排队影响。\n\nKV Cache 缓存 Attention 计算中的中间结果，避免生成每个新 Token 时把同样历史全部重算。服务端的 Prompt Cache 还可能复用不同请求的公共前缀，但命中条件、保留时间与收费依服务而定。它们都不是用户长期记忆，也不让过期内容自动更新。\n\n**上下文工程，是决定这一次到底给模型看什么。** 可以保留结构化任务状态，压缩旧对话，按需读取文件，把超长工具返回分页或提炼。摘要有损：金额、时间、用户已确认的操作范围最好单独保存。长窗口扩大可处理范围，却不保证模型同样善于使用每一个位置的信息。\n先拆输入构成和输出需求，再决定压缩、检索或更换窗口。教学例子：系统与工具占 8 千 Token，历史占 30 千，资料占 50 千，计划输出 6 千，合计已达 94 千；还要核对目标模型对推理和输出的具体预算，不能只检查那 50 千资料。优化以关键约束不丢失为前提，记录首字时间、输出生成速度和总成本。\n**长任务研究助手。** 对话越来越长时，保存研究目标、已验证结论、证据链接和待办，再压缩闲聊；后续任务按需回读文件。用户改变研究地区时，旧地区的结果应标为失效，不能让摘要继续把它当当前条件。\n\n**企业多技能助手。** 不必每轮把几百个工具的完整描述都塞进去。先按任务选相关工具集，需要时再加载更多；评估上下文节省的同时，要检查真正需要的工具是否仍能被发现。\n- **界面显示历史，模型却忘了。** 检查实际请求是否包含历史、摘要是否遗漏、窗口是否截断。聊天 UI 保存记录，不代表服务每轮都读到。\n- **压缩后任务跑偏。** 对比压缩前后关键字段，尤其否定、金额与确认状态；把这些字段移到结构化状态，摘要主要承载叙述背景。\n- **缓存命中低。** 检查可复用前缀是否稳定、动态时间与用户字段是否放在前面，并核对服务规则。不能为了命中缓存混用租户资料或过期授权。\n有长上下文模型，为什么还要检索与上下文管理？ “长窗口解决的是能容纳多少信息，并没有同时解决成本、更新、权限和有效使用问题。少量指定文档做整体比较，可以直接长上下文；从海量资料回答一个问题，更适合检索相关证据；要完整总结一组文件，则先列清材料再分层处理。\n我会根据任务所需覆盖范围选择，而不是一律切块或一律全塞。还会测关键条件放在长文不同位置时能否被正确使用。就算没有超限，无关资料也可能干扰判断。\n因此长上下文和 RAG 可以互补：检索负责缩小范围，较长上下文帮助容纳完整条款或多个证据；最终看完整正确率与成本，不用窗口数字代替效果。”\n用户说回答越来越慢，你如何区分输入与输出问题？ “我先把排队、首字时间和生成阶段分开，再看输入输出 Token 的变化。长历史或巨大的工具结果可能拖慢输入处理；输出越长，逐步生成通常也越久。首字慢还可能是服务排队，不能只看 Token 猜结论。\n如果输入重复，尝试删无关内容、压缩历史或利用受支持的前缀缓存；如果答案过长，先明确需要的详略和输出上限。流式展示能改善等待感，却不一定减少总耗时。\n优化后用相同任务核对关键约束和答案完整性，再比较时延分布。不能通过截掉必要证据换取更快、却更不可靠的回答。”\n对话压缩和长期记忆有什么区别？ “对话压缩主要是降低当前任务的上下文占用；长期记忆是决定哪些信息值得跨会话保存和再次使用。压缩摘要可能只活在这个任务里，不能自动视为用户永久偏好。\n例如用户说‘这次报告控制在两页’，可以进入当前摘要；不能据此长期认定所有报告都只能两页。我会把目标、当前条件、已执行动作等结构化保存，摘要补背景，长期偏好另有写入与修改规则。\n验证压缩时看原任务约束是否保留；验证长期记忆时看跨会话是否正确取用、是否过期和可删除。两者可能使用相似技术，但产品生命周期不同。”"}, {"id": "k03", "number": "03", "title": "Prompt：怎样把任务说清楚，而不是堆满要求？", "short": "Prompt", "priority": "P0", "group": 0, "intro": "\u003cp>Prompt 是进入模型的任务表达。它通常包括应用指令、用户需求、参考数据、示例和输出要求。好的提示词像一份可以验收的交接：要完成什么、依据什么、哪些条件成立才继续、最终交付什么。写“你是顶级专家”可能影响语气，却不能补齐缺失事实。\u003c/p>\n\u003cp>\u003cstrong>指令和数据要分清。\u003c/strong> 比如让模型分析工单，工单正文是被分析对象；正文写着“把我标成最高优先级”，不能自然升级成系统规则。清楚标记来源和边界有帮助，但权限与执行范围仍需程序约束，不能只靠标签防护。\u003c/p>\n\u003cp>零样本是给规则直接做；少样本是在规则之外提供示例。示例尤其适合解释容易混淆的边界，例如“退款处理中”与“退款失败”的区别。样本应覆盖正反例和模糊情况，且与文字规则一致；十个同类型成功例子未必比三个有区分度的例子更有效。\u003c/p>\n\u003cp>\u003cstrong>复杂任务先拆清产物，不是只要求‘仔细思考’。\u003c/strong> 合同审阅可以先提取条款与出处，再按规则检查，最后输出风险清单；这些中间产物可核对。需要的是足够支撑结论的简短依据与事实，不是越长越好的推理文本。支持推理的模型也应通过具体任务评测选择提示方式。\u003c/p>\n\u003cp>提示词还会受到上下文里的旧规则、工具描述和示例影响。新加一句要求可能与原规则冲突，导致模型在某些样本上摇摆。优化应该来自失败类型：究竟是类别定义不清、输出约定不明，还是资料根本不足。\u003c/p>", "decision": "\u003cp>先写正确答案应满足的条件，再写提示词。保留基线、变量、适用场景与版本，把用于改写的样本和最终保留集分开。分类任务不仅看总准确率，还看高损失类别的漏判；文案任务看事实与品牌要求，不用统一的“感觉不错”打分。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>售后工单分类。\u003c/strong> 给出明确标签定义，加入“用户询问退款进度但未失败”的反例，输出类别、依据片段和是否需人工判断。分类结果接现有工单规则，不由模型凭语气推断交易状态。\u003c/p>\n\u003cp>\u003cstrong>产品需求评审。\u003c/strong> 输入需求背景、用户证据与约束，让模型分别找事实、假设和缺口，再给待验证问题。若没有用户数据，要求说明证据缺失，不输出编造的市场规模或收益百分比。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>越调越长，效果反而下降。\u003c/strong> 检查冲突指令和重复例子；逐组移除规则做对照，保留有收益的要求，而不是无限追加补丁。\u003c/li>\n\u003cli>\u003cstrong>一条失败修好了，其他题退化。\u003c/strong> 新规则可能过度针对关键词。加入相邻类别和反例回归，确认学到的是业务边界。\u003c/li>\n\u003cli>\u003cstrong>输入少时乱补细节。\u003c/strong> 规定缺失字段与澄清条件，并给真实缺信息样本；如果原文不存在，继续换措辞也无法生成可靠事实。\u003c/li>\n\u003c/ul>", "questions": [{"id": "03.1", "title": "你会怎么设计一个能落地的 Prompt？", "answer": "\u003cp>“我会从验收标准倒推提示词：先定义任务、有效输入和输出，再把容易误解的边界写清楚。比如售后分类，必须区分查询进度和退款失败，不能看到‘退款’两个字就分到同一类。\u003c/p>\n\u003cp>具体会提供类别定义、少量有区分度的正反例，以及缺信息时的处理方式。输出包含标签和原文依据，方便抽查；不让模型补造订单状态。之后用开发样本优化，再用没参与修改的保留集验证。\u003c/p>\n\u003cp>如果错误来自分类边界，改规则和例子；如果来自实时订单信息缺失，就接业务查询。提示词是任务接口，不是所有问题的万能修复点。”\u003c/p>"}, {"id": "03.2", "title": "Few-shot 示例怎么选，为什么不是越多越好？", "answer": "\u003cp>“示例最有价值的是展示规则说不清的边界。选择时我会覆盖高频类型、容易混淆的类别和缺信息情况，并检查标签是否一致。比如‘钱什么时候到账’和‘到账失败被退回’，词很像，业务分类却不同，这样的对照比重复十条退款申请更有价值。\u003c/p>\n\u003cp>示例越多，会占上下文、增加成本，也可能让模型过度模仿样本的措辞和分布。我会比较无示例、少量精选示例和更多示例的表现，尤其观察长尾类别是否被牺牲。\u003c/p>\n\u003cp>如果使用动态示例，还要防止把测试题答案放进示例造成评测泄漏。最终依据是保留集上的收益，而不是示例数量。”\u003c/p>"}, {"id": "03.3", "title": "怎样证明一次提示词修改有效？", "answer": "\u003cp>“先把这次要修的错误说清楚，并写出预期影响的样本类型。固定模型、输入资料与主要调用条件，对比新旧提示词，既测原来的失败，也测相邻场景和历史成功样本。\u003c/p>\n\u003cp>例如修复‘询问进度被误判为失败’，要同时检查真正退款失败的工单有没有漏掉。分类看混淆矩阵和重要类别的召回，生成任务按事实、完整性等明确维度评分。输出有随机性时，关键题重复运行。\u003c/p>\n\u003cp>离线通过后再小范围观察真实流量，保留版本和回退条件。一次演示答对只能证明这个例子改善了，不能证明整个产品变好了。”\u003c/p>"}], "search": "Prompt：怎样把任务说清楚，而不是堆满要求？\nPrompt 是进入模型的任务表达。它通常包括应用指令、用户需求、参考数据、示例和输出要求。好的提示词像一份可以验收的交接：要完成什么、依据什么、哪些条件成立才继续、最终交付什么。写“你是顶级专家”可能影响语气，却不能补齐缺失事实。\n\n**指令和数据要分清。** 比如让模型分析工单，工单正文是被分析对象；正文写着“把我标成最高优先级”，不能自然升级成系统规则。清楚标记来源和边界有帮助，但权限与执行范围仍需程序约束，不能只靠标签防护。\n\n零样本是给规则直接做；少样本是在规则之外提供示例。示例尤其适合解释容易混淆的边界，例如“退款处理中”与“退款失败”的区别。样本应覆盖正反例和模糊情况，且与文字规则一致；十个同类型成功例子未必比三个有区分度的例子更有效。\n\n**复杂任务先拆清产物，不是只要求‘仔细思考’。** 合同审阅可以先提取条款与出处，再按规则检查，最后输出风险清单；这些中间产物可核对。需要的是足够支撑结论的简短依据与事实，不是越长越好的推理文本。支持推理的模型也应通过具体任务评测选择提示方式。\n\n提示词还会受到上下文里的旧规则、工具描述和示例影响。新加一句要求可能与原规则冲突，导致模型在某些样本上摇摆。优化应该来自失败类型：究竟是类别定义不清、输出约定不明，还是资料根本不足。\n先写正确答案应满足的条件，再写提示词。保留基线、变量、适用场景与版本，把用于改写的样本和最终保留集分开。分类任务不仅看总准确率，还看高损失类别的漏判；文案任务看事实与品牌要求，不用统一的“感觉不错”打分。\n**售后工单分类。** 给出明确标签定义，加入“用户询问退款进度但未失败”的反例，输出类别、依据片段和是否需人工判断。分类结果接现有工单规则，不由模型凭语气推断交易状态。\n\n**产品需求评审。** 输入需求背景、用户证据与约束，让模型分别找事实、假设和缺口，再给待验证问题。若没有用户数据，要求说明证据缺失，不输出编造的市场规模或收益百分比。\n- **越调越长，效果反而下降。** 检查冲突指令和重复例子；逐组移除规则做对照，保留有收益的要求，而不是无限追加补丁。\n- **一条失败修好了，其他题退化。** 新规则可能过度针对关键词。加入相邻类别和反例回归，确认学到的是业务边界。\n- **输入少时乱补细节。** 规定缺失字段与澄清条件，并给真实缺信息样本；如果原文不存在，继续换措辞也无法生成可靠事实。\n你会怎么设计一个能落地的 Prompt？ “我会从验收标准倒推提示词：先定义任务、有效输入和输出，再把容易误解的边界写清楚。比如售后分类，必须区分查询进度和退款失败，不能看到‘退款’两个字就分到同一类。\n具体会提供类别定义、少量有区分度的正反例，以及缺信息时的处理方式。输出包含标签和原文依据，方便抽查；不让模型补造订单状态。之后用开发样本优化，再用没参与修改的保留集验证。\n如果错误来自分类边界，改规则和例子；如果来自实时订单信息缺失，就接业务查询。提示词是任务接口，不是所有问题的万能修复点。”\nFew-shot 示例怎么选，为什么不是越多越好？ “示例最有价值的是展示规则说不清的边界。选择时我会覆盖高频类型、容易混淆的类别和缺信息情况，并检查标签是否一致。比如‘钱什么时候到账’和‘到账失败被退回’，词很像，业务分类却不同，这样的对照比重复十条退款申请更有价值。\n示例越多，会占上下文、增加成本，也可能让模型过度模仿样本的措辞和分布。我会比较无示例、少量精选示例和更多示例的表现，尤其观察长尾类别是否被牺牲。\n如果使用动态示例，还要防止把测试题答案放进示例造成评测泄漏。最终依据是保留集上的收益，而不是示例数量。”\n怎样证明一次提示词修改有效？ “先把这次要修的错误说清楚，并写出预期影响的样本类型。固定模型、输入资料与主要调用条件，对比新旧提示词，既测原来的失败，也测相邻场景和历史成功样本。\n例如修复‘询问进度被误判为失败’，要同时检查真正退款失败的工单有没有漏掉。分类看混淆矩阵和重要类别的召回，生成任务按事实、完整性等明确维度评分。输出有随机性时，关键题重复运行。\n离线通过后再小范围观察真实流量，保留版本和回退条件。一次演示答对只能证明这个例子改善了，不能证明整个产品变好了。”"}, {"id": "k04", "number": "04", "title": "结构化输出：格式能读，不代表内容能直接执行", "short": "结构化输出", "priority": "P0", "group": 0, "intro": "\u003cp>人能从一段会议纪要里猜出谁负责什么，程序却需要明确字段。结构化输出就是给模型约定数据接口，比如任务标题、负责人 ID、截止日期、来源和待确认项。JSON 是常见表示，JSON Schema 则描述字段类型、必填项和允许值。\u003c/p>\n\u003cp>比如约定订单结果必须包含 orderId、status 和 amount；字段合规后，还要核验订单的真实业务状态。\u003c/p>\n\u003cp>\u003cstrong>这里有三道不同的门。\u003c/strong> 第一，JSON 语法合法，程序能解析；第二，符合 Schema，例如金额必须为数字、状态只能在枚举中；第三，符合事实和业务规则，例如负责人真实存在、日期不是模型编的。前两道通过，第三道仍可能失败。\u003c/p>\n\u003cp>某些服务支持约束解码，在生成时限制候选 Token，使结果符合支持的 Schema 子集。这通常比仅在提示词里要求“返回 JSON”更稳，但要核对服务对 Schema、拒答、截断与流式结果的处理。格式约束不懂外部业务事实，不能证明库存足够或用户已授权。\u003c/p>\n\u003cp>工具调用与结构化结果也要区别：工具调用描述模型希望应用执行什么动作；结构化结果描述任务产生的数据。一个提取结果可以先让用户编辑，再成为工具入参。不要因为拿到了合法 JSON 就把它直接当成执行指令。\u003c/p>", "decision": "\u003cp>设计字段时先想未知如何表达：允许空值、单独的待确认状态，通常比编默认值可靠。稳定业务对象优先用 ID 而不是姓名。Schema 变更需要版本与兼容策略；由程序补充身份、租户等可信字段，不能让模型自由填写。分别统计结构合规率、关键字段准确率和实际执行结果。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>会议待办创建。\u003c/strong> 模型输出事项、依据时间戳和候选负责人；系统用通讯录解析人员，用户确认后调用任务接口。会议没有说截止日期就留待确认，不能把会议日期自动当截止日期。\u003c/p>\n\u003cp>\u003cstrong>采购申请提取。\u003c/strong> 从邮件和附件提取商品、数量、预算与币种，程序检查币种和金额关系，再生成草稿。合规的数字若对应错行仍是错误，需要回到附件定位核验。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>JSON 正确却创建了错误任务。\u003c/strong> 对照字段依据与业务对象，检查同名人员映射和相对日期时区；解析成功率不能解释语义错误。\u003c/li>\n\u003cli>\u003cstrong>流式输出到一半就触发操作。\u003c/strong> 等完整结果与校验通过再执行；中间 Token 只是未完成数据，截断后要明确失败或恢复。\u003c/li>\n\u003cli>\u003cstrong>缺字段就无限重试。\u003c/strong> 区分格式错误与源信息缺失；前者可有限修复，后者补问或保留未知。重试次数不能补出不存在的事实。\u003c/li>\n\u003c/ul>", "questions": [{"id": "04.1", "title": "JSON Mode、Schema 约束和业务校验有什么区别？", "answer": "\u003cp>“它们约束的是不同层次。JSON Mode 通常帮助生成可解析 JSON；Schema 约束进一步要求字段、类型和枚举符合约定；业务校验判断这些字段是否真实且允许使用。具体保证要看服务定义，不能只根据功能名称猜。\u003c/p>\n\u003cp>比如负责人字段是合法字符串、也符合 Schema，但这个名字可能在公司里对应两个人；退款金额是合法数字，却可能超过可退余额。这些都需要查询和规则校验。\u003c/p>\n\u003cp>我会分别记录结构失败与业务失败，让未知值有明确表示。涉及执行时，格式校验只是前置条件之一，不是拿到 JSON 就开始写数据库。”\u003c/p>"}, {"id": "04.2", "title": "把自然语言转成可执行任务，你会怎样设计字段？", "answer": "\u003cp>“先围绕业务动作定义最小字段，再确定每个字段的来源与校验方式。比如创建任务要有标题、负责人 ID、截止时间、来源和待确认项；身份、租户由服务端提供，不交给模型猜。\u003c/p>\n\u003cp>负责人可以先提取候选姓名，再由通讯录解析；相对日期需要按会议时间和时区转换，原话没有说就留空。写操作前展示可编辑草稿，把未确定项解决后再执行。\u003c/p>\n\u003cp>字段设计还要考虑后续变更。新增可选字段通常较容易兼容，修改字段语义可能让老流程误用，所以需要版本和回归。我的标准是每个会影响动作的字段都有依据，而不只是结构漂亮。”\u003c/p>"}, {"id": "04.3", "title": "输出不合规时，是修复、重试还是让用户补充？", "answer": "\u003cp>“先判断失败性质。格式不完整可能来自输出截断，要调整预算或重新生成；语法错误可以受控修复，但要重新校验；如果缺少原始信息，就应询问或保留未知，不能让模型多试几次猜一个值。\u003c/p>\n\u003cp>对已有的正确字段，我会保留草稿，避免全部推翻。自动修复只允许改变表达结构，不得悄悄补上金额、负责人等关键事实。写操作在结果完整且业务校验通过前不执行。\u003c/p>\n\u003cp>监控上把格式失败、源信息缺失和业务冲突分开统计，才能决定改 Schema、补交互还是改模型，避免靠填默认值掩盖错误。”\u003c/p>"}], "search": "结构化输出：格式能读，不代表内容能直接执行\n人能从一段会议纪要里猜出谁负责什么，程序却需要明确字段。结构化输出就是给模型约定数据接口，比如任务标题、负责人 ID、截止日期、来源和待确认项。JSON 是常见表示，JSON Schema 则描述字段类型、必填项和允许值。\n\n比如约定订单结果必须包含 orderId、status 和 amount；字段合规后，还要核验订单的真实业务状态。\n\n**这里有三道不同的门。** 第一，JSON 语法合法，程序能解析；第二，符合 Schema，例如金额必须为数字、状态只能在枚举中；第三，符合事实和业务规则，例如负责人真实存在、日期不是模型编的。前两道通过，第三道仍可能失败。\n\n某些服务支持约束解码，在生成时限制候选 Token，使结果符合支持的 Schema 子集。这通常比仅在提示词里要求“返回 JSON”更稳，但要核对服务对 Schema、拒答、截断与流式结果的处理。格式约束不懂外部业务事实，不能证明库存足够或用户已授权。\n\n工具调用与结构化结果也要区别：工具调用描述模型希望应用执行什么动作；结构化结果描述任务产生的数据。一个提取结果可以先让用户编辑，再成为工具入参。不要因为拿到了合法 JSON 就把它直接当成执行指令。\n设计字段时先想未知如何表达：允许空值、单独的待确认状态，通常比编默认值可靠。稳定业务对象优先用 ID 而不是姓名。Schema 变更需要版本与兼容策略；由程序补充身份、租户等可信字段，不能让模型自由填写。分别统计结构合规率、关键字段准确率和实际执行结果。\n**会议待办创建。** 模型输出事项、依据时间戳和候选负责人；系统用通讯录解析人员，用户确认后调用任务接口。会议没有说截止日期就留待确认，不能把会议日期自动当截止日期。\n\n**采购申请提取。** 从邮件和附件提取商品、数量、预算与币种，程序检查币种和金额关系，再生成草稿。合规的数字若对应错行仍是错误，需要回到附件定位核验。\n- **JSON 正确却创建了错误任务。** 对照字段依据与业务对象，检查同名人员映射和相对日期时区；解析成功率不能解释语义错误。\n- **流式输出到一半就触发操作。** 等完整结果与校验通过再执行；中间 Token 只是未完成数据，截断后要明确失败或恢复。\n- **缺字段就无限重试。** 区分格式错误与源信息缺失；前者可有限修复，后者补问或保留未知。重试次数不能补出不存在的事实。\nJSON Mode、Schema 约束和业务校验有什么区别？ “它们约束的是不同层次。JSON Mode 通常帮助生成可解析 JSON；Schema 约束进一步要求字段、类型和枚举符合约定；业务校验判断这些字段是否真实且允许使用。具体保证要看服务定义，不能只根据功能名称猜。\n比如负责人字段是合法字符串、也符合 Schema，但这个名字可能在公司里对应两个人；退款金额是合法数字，却可能超过可退余额。这些都需要查询和规则校验。\n我会分别记录结构失败与业务失败，让未知值有明确表示。涉及执行时，格式校验只是前置条件之一，不是拿到 JSON 就开始写数据库。”\n把自然语言转成可执行任务，你会怎样设计字段？ “先围绕业务动作定义最小字段，再确定每个字段的来源与校验方式。比如创建任务要有标题、负责人 ID、截止时间、来源和待确认项；身份、租户由服务端提供，不交给模型猜。\n负责人可以先提取候选姓名，再由通讯录解析；相对日期需要按会议时间和时区转换，原话没有说就留空。写操作前展示可编辑草稿，把未确定项解决后再执行。\n字段设计还要考虑后续变更。新增可选字段通常较容易兼容，修改字段语义可能让老流程误用，所以需要版本和回归。我的标准是每个会影响动作的字段都有依据，而不只是结构漂亮。”\n输出不合规时，是修复、重试还是让用户补充？ “先判断失败性质。格式不完整可能来自输出截断，要调整预算或重新生成；语法错误可以受控修复，但要重新校验；如果缺少原始信息，就应询问或保留未知，不能让模型多试几次猜一个值。\n对已有的正确字段，我会保留草稿，避免全部推翻。自动修复只允许改变表达结构，不得悄悄补上金额、负责人等关键事实。写操作在结果完整且业务校验通过前不执行。\n监控上把格式失败、源信息缺失和业务冲突分开统计，才能决定改 Schema、补交互还是改模型，避免靠填默认值掩盖错误。”"}, {"id": "k05", "number": "05", "title": "幻觉与不确定性：怎样知道一句话到底有没有依据？", "short": "幻觉与不确定性", "priority": "P0", "group": 0, "intro": "\u003cp>模型能生成合理的表达，不意味着它在每一句话生成前都查过事实。所谓幻觉，可以表现为编造不存在的政策、把建议写成决定，或给真实数字配上错误条件。答案大部分正确，也可能因为一个否定词或时间错了而无法使用。\u003c/p>\n\u003cp>\u003cstrong>先区分忠实和真实。\u003c/strong> 忠实性看回答是否符合给定资料；事实正确性看结论是否符合实际。模型忠实引用一份过期制度，依然可能回答错“当前政策”。反过来，一句常识恰好是真的，却没有来自指定资料的依据，也不能冒充对这份文件的结论。\u003c/p>\n\u003cp>无依据回答的原因不止模型参数：解析丢失、检索漏掉、证据冲突、上下文过长、提示词要求补齐所有字段，都可能推动模型猜测。降低问题需要把失败归到相应环节，再决定补资料、改生成、查权威系统还是请求用户补充。\u003c/p>\n\u003cp>\u003cstrong>不确定性不能只看模型说有多自信。\u003c/strong> 自报“90% 把握”通常未经校准；检索相似度也不是正确概率。若要用分数决定自动处理比例，需要在代表性标注数据上验证：分数为某一区间的样本，实际正确率是否接近，以及换任务后是否仍成立。\u003c/p>\n\u003cp>拒答与回答是一种取舍。全部拒答当然能减少错误答案，却不能帮助用户工作。更实用的是区分可回答、需澄清、缺证据和不允许执行，分别设计下一步，并同时衡量错误和误拒绝。\u003c/p>", "decision": "\u003cp>按结论的重要性核验。政策条件、金额、人物和日期优先逐条对来源；实时库存查业务系统，计算交给程序。统计事实错误时写清是按答案还是按断言计算；同时记录覆盖率，即多少合法需求得到可用回答。低错误率若来自大量无理由拒答，不能单独作为质量提升。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>客服政策答复。\u003c/strong> 回答前查当前适用规则，区分公开政策与订单个体状态；“通常三个工作日处理”不能说成“你的退款已成功”。缺订单状态时调用查询或说明无法确认。\u003c/p>\n\u003cp>\u003cstrong>经营周报。\u003c/strong> 把“销售额下降”与“因为渠道投放减少”拆成事实和解释。前者可由数据验证，后者需要额外证据或写为假设；不能让流畅的因果叙述替代分析。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>有引用但结论不成立。\u003c/strong> 逐条核对适用范围、版本与例外；文件名真实不等于支持了具体判断。\u003c/li>\n\u003cli>\u003cstrong>提示不能编造后，系统什么都不答。\u003c/strong> 检查拒答阈值和缺口定义，用“有证据但表述不同”的题测误拒绝，而不是只加入无答案样本。\u003c/li>\n\u003cli>\u003cstrong>模型互相检查仍一起答错。\u003c/strong> 相同模型与相同资料可能有相关错误。核验应引入原始证据、确定性计算或独立标注，不能只看模型投票。\u003c/li>\n\u003c/ul>", "questions": [{"id": "05.1", "title": "减少幻觉，你会先做哪几件事？", "answer": "\u003cp>“先定义业务里什么算错，再按失败来源处理。制度问答要检查资料有效性、关键证据是否进入上下文，以及回答有没有曲解适用条件；实时状态直接查业务系统，数字汇总用程序计算。\u003c/p>\n\u003cp>生成层要求区分事实、推断和未知，并让关键断言关联原文。对于证据缺失的问题，明确补查或澄清方式，不强求填满所有字段。这样比仅在提示词里加‘不要编造’更可验证。\u003c/p>\n\u003cp>评测既包含可回答问题，也包含无答案、过期资料和冲突资料。看事实错误与误拒绝两边，再结合风险决定哪些结果可自动交付，哪些要复核。我不会承诺通过某一个模块实现零幻觉。”\u003c/p>"}, {"id": "05.2", "title": "模型说自己有 95% 把握，能直接用于自动放行吗？", "answer": "\u003cp>“不能把一句自信描述直接当概率。我要先验证这个分数有没有校准：比如高分样本实际错误多少，在目标业务和新数据上是否稳定。没有这些证据，95% 只是输出中的一个数字。\u003c/p>\n\u003cp>自动放行更适合结合可验证信号，例如来源完整、业务字段校验通过、工具返回可核对，再按操作影响设置策略。就算答案正确率很高，也不能越过用户的授权范围。\u003c/p>\n\u003cp>如果采用评分阈值，我会同时看阈值下的错误风险和自动处理覆盖率。阈值提高可能让错误少，但人工量大幅上升；应明确业务能承担哪种取舍，而不是追求一个漂亮分数。”\u003c/p>"}, {"id": "05.3", "title": "怎样设计‘不知道’的体验，既可靠又有用？", "answer": "\u003cp>“先把不知道的原因说清楚。缺用户条件，就问一个能决定答案的问题；缺资料，说明已查范围并给出补充方式；存在冲突，展示冲突和适用条件；没有权限，只提供授权范围内的下一步。\u003c/p>\n\u003cp>比如政策已经查到，只是不知道用户是否获批培训，应该问审批状态，而不是笼统拒答。反过来，知识库根本没有制度，就不能让用户补一个条件后继续编标准。\u003c/p>\n\u003cp>验收时检查这些分流是否正确，并统计可回答问题被误拒绝的比例。目标是让用户理解差的是什么、下一步做什么，而不是用一句‘信息不足’把所有失败都推给用户。”\u003c/p>"}], "search": "幻觉与不确定性：怎样知道一句话到底有没有依据？\n模型能生成合理的表达，不意味着它在每一句话生成前都查过事实。所谓幻觉，可以表现为编造不存在的政策、把建议写成决定，或给真实数字配上错误条件。答案大部分正确，也可能因为一个否定词或时间错了而无法使用。\n\n**先区分忠实和真实。** 忠实性看回答是否符合给定资料；事实正确性看结论是否符合实际。模型忠实引用一份过期制度，依然可能回答错“当前政策”。反过来，一句常识恰好是真的，却没有来自指定资料的依据，也不能冒充对这份文件的结论。\n\n无依据回答的原因不止模型参数：解析丢失、检索漏掉、证据冲突、上下文过长、提示词要求补齐所有字段，都可能推动模型猜测。降低问题需要把失败归到相应环节，再决定补资料、改生成、查权威系统还是请求用户补充。\n\n**不确定性不能只看模型说有多自信。** 自报“90% 把握”通常未经校准；检索相似度也不是正确概率。若要用分数决定自动处理比例，需要在代表性标注数据上验证：分数为某一区间的样本，实际正确率是否接近，以及换任务后是否仍成立。\n\n拒答与回答是一种取舍。全部拒答当然能减少错误答案，却不能帮助用户工作。更实用的是区分可回答、需澄清、缺证据和不允许执行，分别设计下一步，并同时衡量错误和误拒绝。\n按结论的重要性核验。政策条件、金额、人物和日期优先逐条对来源；实时库存查业务系统，计算交给程序。统计事实错误时写清是按答案还是按断言计算；同时记录覆盖率，即多少合法需求得到可用回答。低错误率若来自大量无理由拒答，不能单独作为质量提升。\n**客服政策答复。** 回答前查当前适用规则，区分公开政策与订单个体状态；“通常三个工作日处理”不能说成“你的退款已成功”。缺订单状态时调用查询或说明无法确认。\n\n**经营周报。** 把“销售额下降”与“因为渠道投放减少”拆成事实和解释。前者可由数据验证，后者需要额外证据或写为假设；不能让流畅的因果叙述替代分析。\n- **有引用但结论不成立。** 逐条核对适用范围、版本与例外；文件名真实不等于支持了具体判断。\n- **提示不能编造后，系统什么都不答。** 检查拒答阈值和缺口定义，用“有证据但表述不同”的题测误拒绝，而不是只加入无答案样本。\n- **模型互相检查仍一起答错。** 相同模型与相同资料可能有相关错误。核验应引入原始证据、确定性计算或独立标注，不能只看模型投票。\n减少幻觉，你会先做哪几件事？ “先定义业务里什么算错，再按失败来源处理。制度问答要检查资料有效性、关键证据是否进入上下文，以及回答有没有曲解适用条件；实时状态直接查业务系统，数字汇总用程序计算。\n生成层要求区分事实、推断和未知，并让关键断言关联原文。对于证据缺失的问题，明确补查或澄清方式，不强求填满所有字段。这样比仅在提示词里加‘不要编造’更可验证。\n评测既包含可回答问题，也包含无答案、过期资料和冲突资料。看事实错误与误拒绝两边，再结合风险决定哪些结果可自动交付，哪些要复核。我不会承诺通过某一个模块实现零幻觉。”\n模型说自己有 95% 把握，能直接用于自动放行吗？ “不能把一句自信描述直接当概率。我要先验证这个分数有没有校准：比如高分样本实际错误多少，在目标业务和新数据上是否稳定。没有这些证据，95% 只是输出中的一个数字。\n自动放行更适合结合可验证信号，例如来源完整、业务字段校验通过、工具返回可核对，再按操作影响设置策略。就算答案正确率很高，也不能越过用户的授权范围。\n如果采用评分阈值，我会同时看阈值下的错误风险和自动处理覆盖率。阈值提高可能让错误少，但人工量大幅上升；应明确业务能承担哪种取舍，而不是追求一个漂亮分数。”\n怎样设计‘不知道’的体验，既可靠又有用？ “先把不知道的原因说清楚。缺用户条件，就问一个能决定答案的问题；缺资料，说明已查范围并给出补充方式；存在冲突，展示冲突和适用条件；没有权限，只提供授权范围内的下一步。\n比如政策已经查到，只是不知道用户是否获批培训，应该问审批状态，而不是笼统拒答。反过来，知识库根本没有制度，就不能让用户补一个条件后继续编标准。\n验收时检查这些分流是否正确，并统计可回答问题被误拒绝的比例。目标是让用户理解差的是什么、下一步做什么，而不是用一句‘信息不足’把所有失败都推给用户。”"}, {"id": "k06", "number": "06", "title": "文件解析与 OCR：读出了文字，为什么仍然读错了文件？", "short": "文件解析与 OCR", "priority": "P0", "group": 1, "intro": "\u003cp>文件上传只是把字节存进系统，解析才是把字节变成可用信息。Word、PPT、PDF 和表格各有结构，不能统一当成一段文字。例如双栏 PDF 按横行直接拼接，左右两段会混在一起；表格只有数字没有表头，后续模型就不知道金额属于哪个对象。\u003c/p>\n\u003cp>\u003cstrong>先按页面判断内容类型。\u003c/strong> 有可用文本层的页面可以直接提取，但仍要恢复阅读顺序；纯扫描页需要 OCR，把图像中的文字识别出来；混合文档可能一部分直接提取、一部分 OCR。是否能选中文字只是线索，文本层也可能乱码或位置错误。\u003c/p>\n\u003cp>比如扫描合同先识别文字，再提取条款；能读出字符，还需要确认条款顺序和表格关系正确。\u003c/p>\n\u003cp>OCR 解决“图上写了什么”，版面分析解决“文字在哪里、怎样排列”，表格识别还要恢复行列、合并单元格和跨页表头。视觉语言模型能辅助理解复杂页面，但成本和稳定性要评测，也可能补出原图没有的信息。不是接一个视觉模型就可以跳过原页核对。\u003c/p>\n\u003cp>解析产物至少要能关联文档 ID、版本、页码和段落／单元格位置。正文、表格与图片说明可以分开保存，再供检索使用。复杂表格还可以同时保留结构化数据和可检索摘要：前者用于计算，后者帮助定位。\u003c/p>", "decision": "\u003cp>质量评估按资料类型分组。文字识别可看字符错误率；业务上还要抽查金额、否定词、标题层级和单元格对应关系。一个表格只错一个小数点，整体字符正确率仍可能很高，但业务已经不能用。处理状态应到文件或页面级，区别成功、部分失败和无法读取。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>合同知识库接入。\u003c/strong> 先读取可用文本，扫描附件走 OCR，保留条款标题与页码；跨页条款拼接时保留两个页码来源。生成审阅建议后，用户能回到真正支持建议的原页。\u003c/p>\n\u003cp>\u003cstrong>供应商报价比较。\u003c/strong> 把不同 PDF 的商品、单位、含税价和交付周期解析成字段，同时保留原表格截图位置；币种与单位转换由程序处理。比较前先确认“每箱”与“每件”没有混淆。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>文件在库里却搜不到关键条款。\u003c/strong> 先核对解析文本是否存在，再看索引；如果扫描页没处理，调整检索策略也找不回。\u003c/li>\n\u003cli>\u003cstrong>金额基本正确却总价离谱。\u003c/strong> 检查千分位、小数点、币种、合并表头与单位继承；按字段核验，不能只看全文识别率。\u003c/li>\n\u003cli>\u003cstrong>图表能解释，引用却定位错。\u003c/strong> 核对解析坐标与原页版本是否一致；重新压缩或替换原文件后，旧位置映射可能失效。\u003c/li>\n\u003c/ul>", "questions": [{"id": "06.1", "title": "如何设计一条可靠的企业文档解析链路？", "answer": "\u003cp>“我会先识别文件和页面类型，再选择直接提取、OCR 或视觉辅助解析。输出不只要文字，还要标题、阅读顺序、表格结构和原始位置，后面检索、计算和引用都依赖这些信息。\u003c/p>\n\u003cp>比如报价单，识别到 100 不够，还要知道它是哪种商品、什么单位、含不含税。复杂表格同时保留结构化字段和原页位置，关键字段可回看核验。解析失败要标到具体页面，支持针对性重试。\u003c/p>\n\u003cp>验收按文件类型与关键业务字段分组，不只统计处理成功率。只有下游真正需要的信息被正确提取，才算把文件接入完成。”\u003c/p>"}, {"id": "06.2", "title": "有视觉大模型后，传统 OCR 还有价值吗？", "answer": "\u003cp>“有，两者的任务优势和成本不一样。对清晰扫描文字和批量标准表单，OCR 加结构解析可能更稳定、便宜；复杂版面、图文关系或难解释区域，可以评估视觉模型辅助。具体要看目标材料，不能靠模型类别一概判断。\u003c/p>\n\u003cp>视觉模型能描述图表，但也可能省略字段或补全内容；OCR 识别字符准确，也可能丢行列关系。因此我会用同一批文档比较关键字段正确率、结构恢复、引用定位和处理成本。\u003c/p>\n\u003cp>我的选择可能是混合路线：能直接提取的不用识别，困难页再升级处理。这样把额外计算用在确实需要的地方。”\u003c/p>"}, {"id": "06.3", "title": "怎样验收解析质量，而不被‘成功率 99%’误导？", "answer": "\u003cp>“我先问成功指的是接口没报错，还是关键内容正确。两者差别很大。我会按文本、复杂表格、扫描件和混合页抽样，把原页与解析结果逐项对照。\u003c/p>\n\u003cp>字符错误率是一层，金额、日期、否定词、表头关系和条款位置是另一层。比如把 1.5 万识别成 15 万，只错一个字符，却必须判定关键字段失败。还要检查失败页面有没有被明确标出来。\u003c/p>\n\u003cp>最后用下游检索与计算样例做验证：能否找到正确条款、按表格复算、点回正确页。解析是下游质量的前置条件，不能只用一个文件处理完成比例代表。”\u003c/p>"}], "search": "文件解析与 OCR：读出了文字，为什么仍然读错了文件？\n文件上传只是把字节存进系统，解析才是把字节变成可用信息。Word、PPT、PDF 和表格各有结构，不能统一当成一段文字。例如双栏 PDF 按横行直接拼接，左右两段会混在一起；表格只有数字没有表头，后续模型就不知道金额属于哪个对象。\n\n**先按页面判断内容类型。** 有可用文本层的页面可以直接提取，但仍要恢复阅读顺序；纯扫描页需要 OCR，把图像中的文字识别出来；混合文档可能一部分直接提取、一部分 OCR。是否能选中文字只是线索，文本层也可能乱码或位置错误。\n\n比如扫描合同先识别文字，再提取条款；能读出字符，还需要确认条款顺序和表格关系正确。\n\nOCR 解决“图上写了什么”，版面分析解决“文字在哪里、怎样排列”，表格识别还要恢复行列、合并单元格和跨页表头。视觉语言模型能辅助理解复杂页面，但成本和稳定性要评测，也可能补出原图没有的信息。不是接一个视觉模型就可以跳过原页核对。\n\n解析产物至少要能关联文档 ID、版本、页码和段落／单元格位置。正文、表格与图片说明可以分开保存，再供检索使用。复杂表格还可以同时保留结构化数据和可检索摘要：前者用于计算，后者帮助定位。\n质量评估按资料类型分组。文字识别可看字符错误率；业务上还要抽查金额、否定词、标题层级和单元格对应关系。一个表格只错一个小数点，整体字符正确率仍可能很高，但业务已经不能用。处理状态应到文件或页面级，区别成功、部分失败和无法读取。\n**合同知识库接入。** 先读取可用文本，扫描附件走 OCR，保留条款标题与页码；跨页条款拼接时保留两个页码来源。生成审阅建议后，用户能回到真正支持建议的原页。\n\n**供应商报价比较。** 把不同 PDF 的商品、单位、含税价和交付周期解析成字段，同时保留原表格截图位置；币种与单位转换由程序处理。比较前先确认“每箱”与“每件”没有混淆。\n- **文件在库里却搜不到关键条款。** 先核对解析文本是否存在，再看索引；如果扫描页没处理，调整检索策略也找不回。\n- **金额基本正确却总价离谱。** 检查千分位、小数点、币种、合并表头与单位继承；按字段核验，不能只看全文识别率。\n- **图表能解释，引用却定位错。** 核对解析坐标与原页版本是否一致；重新压缩或替换原文件后，旧位置映射可能失效。\n如何设计一条可靠的企业文档解析链路？ “我会先识别文件和页面类型，再选择直接提取、OCR 或视觉辅助解析。输出不只要文字，还要标题、阅读顺序、表格结构和原始位置，后面检索、计算和引用都依赖这些信息。\n比如报价单，识别到 100 不够，还要知道它是哪种商品、什么单位、含不含税。复杂表格同时保留结构化字段和原页位置，关键字段可回看核验。解析失败要标到具体页面，支持针对性重试。\n验收按文件类型与关键业务字段分组，不只统计处理成功率。只有下游真正需要的信息被正确提取，才算把文件接入完成。”\n有视觉大模型后，传统 OCR 还有价值吗？ “有，两者的任务优势和成本不一样。对清晰扫描文字和批量标准表单，OCR 加结构解析可能更稳定、便宜；复杂版面、图文关系或难解释区域，可以评估视觉模型辅助。具体要看目标材料，不能靠模型类别一概判断。\n视觉模型能描述图表，但也可能省略字段或补全内容；OCR 识别字符准确，也可能丢行列关系。因此我会用同一批文档比较关键字段正确率、结构恢复、引用定位和处理成本。\n我的选择可能是混合路线：能直接提取的不用识别，困难页再升级处理。这样把额外计算用在确实需要的地方。”\n怎样验收解析质量，而不被‘成功率 99%’误导？ “我先问成功指的是接口没报错，还是关键内容正确。两者差别很大。我会按文本、复杂表格、扫描件和混合页抽样，把原页与解析结果逐项对照。\n字符错误率是一层，金额、日期、否定词、表头关系和条款位置是另一层。比如把 1.5 万识别成 15 万，只错一个字符，却必须判定关键字段失败。还要检查失败页面有没有被明确标出来。\n最后用下游检索与计算样例做验证：能否找到正确条款、按表格复算、点回正确页。解析是下游质量的前置条件，不能只用一个文件处理完成比例代表。”"}, {"id": "k07", "number": "07", "title": "分块：怎样让资料既找得准，又保留完整意思？", "short": "分块", "priority": "P0", "group": 1, "intro": "\u003cp>分块是把文档组织成检索单元。它解决的不是单纯“文本太长”，而是让一个片段有清楚主题，方便匹配问题，同时保留回答需要的条件。模型窗口变大后，这个问题仍然存在：大段混合主题会降低检索针对性，全部输入又增加噪声和成本。\u003c/p>\n\u003cp>比如把差旅制度按条款拆成片段，用户问“出差住酒店能报多少”时，先定位住宿标准，再补齐影响答案的例外条件。\u003c/p>\n\u003cp>固定长度切分快、规则简单，但容易切断句子和条件；递归结构切分优先找标题、段落和句子边界；语义切分根据内容变化寻找边界，但增加计算，也不保证懂业务条款。选哪一种，要看原文结构和查询特点。\u003c/p>\n\u003cp>\u003cstrong>块太小和太大，是不同错误。\u003c/strong> 太小可能只剩“上限 500 元”，不知道适用地区和例外；太大可能把报销、休假、采购混在一起，向量表达失去重点。重叠可以保留边界附近内容，却会制造重复片段，让一个结论占满候选位置。\u003c/p>\n\u003cp>父子块把“搜”和“读”分开：用较小子块精确定位，命中后读取对应父块补上下文。相邻窗口扩展也能补前后段落。无论哪种，都要控制扩展范围、去重，并保留来源与权限；父块包含别的权限域时不能直接整块返回。\u003c/p>", "decision": "\u003cp>先用文档结构建立基线，再按失败题调整。制度保留适用对象与例外，技术文档保留标题和代码上下文，表格保持表头关联。块长、重叠量、父块范围都不是通用常数，应固定资料和问题集比较必要证据覆盖、重复率与最终回答质量。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>产品技术文档问答。\u003c/strong> 子块定位具体错误码，父块补齐版本、前置条件与解决步骤。用户查新版接口时，不能因为错误码相同就拼进旧版说明。\u003c/p>\n\u003cp>\u003cstrong>制度问答。\u003c/strong> 对“标准＋例外＋审批条件”建立结构关联，检索命中标准后补充适用条件；跨章节例外可以通过关联信息或补检索取得，不依赖固定重叠碰巧覆盖。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>有答案但回答缺前提。\u003c/strong> 检查条件是否被切到另一块、标题是否丢失；补结构信息或父子检索，不能只是调大 Top K。\u003c/li>\n\u003cli>\u003cstrong>上下文很多却都在说同一句话。\u003c/strong> 检查重叠率和相似片段去重，避免同文档占满预算；必要时保留来源多样性。\u003c/li>\n\u003cli>\u003cstrong>换切法后引用和编辑失效。\u003c/strong> 块 ID 与文档版本要关联，重建索引后刷新旧映射；不能让新旧块混用同一标识。\u003c/li>\n\u003c/ul>", "questions": [{"id": "07.1", "title": "你会怎样确定分块大小和重叠策略？", "answer": "\u003cp>“先看资料结构和问题需要的证据范围，而不是直接选一个流行字数。制度类优先按条款切，保留标题、对象和例外；结构差的材料可以用长度作为兜底。\u003c/p>\n\u003cp>块小有利于主题集中，但可能丢条件；块大保留上下文，却可能降低检索针对性并增加输入成本。重叠只解决边界附近的信息，不解决相隔很远的关联规则。\u003c/p>\n\u003cp>我会选几组合理参数做固定问题集对照，检查必要证据是否找齐、重复片段比例和最终答案。最后可以按文档类型采用不同策略，不要求全库用一个块长。”\u003c/p>"}, {"id": "07.2", "title": "什么情况下父子块比直接增大块长更合适？", "answer": "\u003cp>“当定位要精确，但理解又依赖较长上下文时，父子块更有价值。比如用错误码所在的小段定位，再取回所属小节，带上版本和前置条件；直接用整个大章节做检索，主题反而可能不够集中。\u003c/p>\n\u003cp>但父块不能无限扩大。我会控制总预算、合并重复父块，并确保扩展内容仍在授权范围内。跨章节的补充规则也不一定由同一个父块覆盖，需要另有关联或补查。\u003c/p>\n\u003cp>验证时重点看误解和条件遗漏是否减少，以及多出来的文本有没有拖慢或干扰回答。它解决的是定位与理解颗粒度不同，不是一个普遍更优的默认开关。”\u003c/p>"}, {"id": "07.3", "title": "如何区分分块问题与 Embedding 问题？", "answer": "\u003cp>“我先看索引片段本身是否已经具备完整可识别的信息。如果一句规则被切断、标题丢失或数字没有表头，即使用更好的 Embedding 也很难稳定找对，先修分块和结构。\u003c/p>\n\u003cp>如果片段完整，正确内容却在同义改写问题下召回很差，再比较 Embedding、查询处理和检索配置。可以把完整目标片段与几种查询做小规模对照，排除索引尚未更新等问题。\u003c/p>\n\u003cp>实验时固定一个因素，不同时换模型和切法。最终既看召回，也看回答是否保留条件，否则可能找到更相似的片段，却仍不能答完整。”\u003c/p>"}], "search": "分块：怎样让资料既找得准，又保留完整意思？\n分块是把文档组织成检索单元。它解决的不是单纯“文本太长”，而是让一个片段有清楚主题，方便匹配问题，同时保留回答需要的条件。模型窗口变大后，这个问题仍然存在：大段混合主题会降低检索针对性，全部输入又增加噪声和成本。\n\n比如把差旅制度按条款拆成片段，用户问“出差住酒店能报多少”时，先定位住宿标准，再补齐影响答案的例外条件。\n\n固定长度切分快、规则简单，但容易切断句子和条件；递归结构切分优先找标题、段落和句子边界；语义切分根据内容变化寻找边界，但增加计算，也不保证懂业务条款。选哪一种，要看原文结构和查询特点。\n\n**块太小和太大，是不同错误。** 太小可能只剩“上限 500 元”，不知道适用地区和例外；太大可能把报销、休假、采购混在一起，向量表达失去重点。重叠可以保留边界附近内容，却会制造重复片段，让一个结论占满候选位置。\n\n父子块把“搜”和“读”分开：用较小子块精确定位，命中后读取对应父块补上下文。相邻窗口扩展也能补前后段落。无论哪种，都要控制扩展范围、去重，并保留来源与权限；父块包含别的权限域时不能直接整块返回。\n先用文档结构建立基线，再按失败题调整。制度保留适用对象与例外，技术文档保留标题和代码上下文，表格保持表头关联。块长、重叠量、父块范围都不是通用常数，应固定资料和问题集比较必要证据覆盖、重复率与最终回答质量。\n**产品技术文档问答。** 子块定位具体错误码，父块补齐版本、前置条件与解决步骤。用户查新版接口时，不能因为错误码相同就拼进旧版说明。\n\n**制度问答。** 对“标准＋例外＋审批条件”建立结构关联，检索命中标准后补充适用条件；跨章节例外可以通过关联信息或补检索取得，不依赖固定重叠碰巧覆盖。\n- **有答案但回答缺前提。** 检查条件是否被切到另一块、标题是否丢失；补结构信息或父子检索，不能只是调大 Top K。\n- **上下文很多却都在说同一句话。** 检查重叠率和相似片段去重，避免同文档占满预算；必要时保留来源多样性。\n- **换切法后引用和编辑失效。** 块 ID 与文档版本要关联，重建索引后刷新旧映射；不能让新旧块混用同一标识。\n你会怎样确定分块大小和重叠策略？ “先看资料结构和问题需要的证据范围，而不是直接选一个流行字数。制度类优先按条款切，保留标题、对象和例外；结构差的材料可以用长度作为兜底。\n块小有利于主题集中，但可能丢条件；块大保留上下文，却可能降低检索针对性并增加输入成本。重叠只解决边界附近的信息，不解决相隔很远的关联规则。\n我会选几组合理参数做固定问题集对照，检查必要证据是否找齐、重复片段比例和最终答案。最后可以按文档类型采用不同策略，不要求全库用一个块长。”\n什么情况下父子块比直接增大块长更合适？ “当定位要精确，但理解又依赖较长上下文时，父子块更有价值。比如用错误码所在的小段定位，再取回所属小节，带上版本和前置条件；直接用整个大章节做检索，主题反而可能不够集中。\n但父块不能无限扩大。我会控制总预算、合并重复父块，并确保扩展内容仍在授权范围内。跨章节的补充规则也不一定由同一个父块覆盖，需要另有关联或补查。\n验证时重点看误解和条件遗漏是否减少，以及多出来的文本有没有拖慢或干扰回答。它解决的是定位与理解颗粒度不同，不是一个普遍更优的默认开关。”\n如何区分分块问题与 Embedding 问题？ “我先看索引片段本身是否已经具备完整可识别的信息。如果一句规则被切断、标题丢失或数字没有表头，即使用更好的 Embedding 也很难稳定找对，先修分块和结构。\n如果片段完整，正确内容却在同义改写问题下召回很差，再比较 Embedding、查询处理和检索配置。可以把完整目标片段与几种查询做小规模对照，排除索引尚未更新等问题。\n实验时固定一个因素，不同时换模型和切法。最终既看召回，也看回答是否保留条件，否则可能找到更相似的片段，却仍不能答完整。”"}, {"id": "k08", "number": "08", "title": "Embedding 与向量检索：按意思搜索，是怎样实现的？", "short": "Embedding 与向量检索", "priority": "P0", "group": 1, "intro": "\u003cp>Embedding 把文本或其他内容编码成一组数字，称为向量。训练让某些相关内容在这个空间中更接近，因此“登录不上”与“身份认证失败”即使字面不同，也可能匹配。向量不是把原文压成可以无损还原的密码，它保留的是对目标任务有用的表示。\u003c/p>\n\u003cp>搜索时，用兼容的编码方式把查询与资料映射到同一表示空间，再比较距离或相似度。余弦相似度可以直观理解为比较两个向量方向是否接近；有些模型使用点积等度量，要遵循模型与索引配置，不能随意换算法还认为分数意义一样。\u003c/p>\n\u003cp>\u003cstrong>“表示得好”和“找得快”是两层问题。\u003c/strong> Embedding 决定相关内容是否容易靠近，向量索引决定怎么快速找到近邻。数据小可以精确比较；数据大时常用 ANN，即近似最近邻，允许少量漏掉真正近邻的可能性来降低查询开销。\u003c/p>\n\u003cp>比如资料非常多时，先近似找一批邻近向量；速度快了，也要检查是否漏掉正确资料。\u003c/p>\n\u003cp>HNSW 是常见 ANN 方法，可以把它想成多层导航图：上层先大步靠近目标区域，下层再细查邻居。搜索探索得更多，通常召回更高，但延迟与资源消耗也可能增加。索引能找到向量上的近邻，不代表找到了业务上所有必要证据。\u003c/p>\n\u003cp>换 Embedding 模型时，维度相同也不代表语义空间相同。查询向量与资料向量必须来自匹配的配置；通常要建立新索引、重新编码资料并验证再切换，不能只换查询端模型。\u003c/p>", "decision": "\u003cp>把精确编号与语义问题分组测。向量擅长改写和语义关联，却可能把近似编号、肯定与否定混在一起。看标注证据的召回，不把相似度当真实性概率。迁移同时核算编码成本、索引资源和切换风险；向量和关联信息仍可能包含敏感信息，不是天然匿名数据。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>客服知识检索。\u003c/strong> 用户说“验证码收不到”，资料标题可能是“短信送达异常”；向量帮助跨表述定位，关键词补充运营商错误码与产品型号。\u003c/p>\n\u003cp>\u003cstrong>跨语言资料搜索。\u003c/strong> 业务人员用中文问英文技术资料，使用经过该语言组合验证的多语言 Embedding；返回原文与解释。不能因为模型叫“多语言”，就假设所有语种和专业词效果相同。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>相似度很高却答非所问。\u003c/strong> 检查是否只是同主题，实际对象、版本或否定条件不同；加入精确过滤、混合检索或重排。\u003c/li>\n\u003cli>\u003cstrong>换模型后效果断崖下降。\u003c/strong> 检查向量模型、维度、归一化、距离度量和索引版本是否匹配，先排除新旧空间混用。\u003c/li>\n\u003cli>\u003cstrong>小样本好，全量库差。\u003c/strong> 检查 ANN 参数、过滤后的候选量和近似搜索漏召回；与小范围精确检索对照，区别表示问题和索引问题。\u003c/li>\n\u003c/ul>", "questions": [{"id": "08.1", "title": "Embedding 与向量数据库分别解决什么问题？", "answer": "\u003cp>“Embedding 负责把内容表示成可比较的向量；向量数据库负责存储这些向量、建立索引并检索。前者决定语义表示，后者影响查询效率和工程管理，不能把它们当成一个能力。\u003c/p>\n\u003cp>比如用户用口语查询技术术语，好的表示有机会把两者放近；但大规模索引若近似搜索探索不足，正确近邻仍可能漏掉。反过来，索引再精确，表示空间里本就不相关的条目也不会自然靠近。\u003c/p>\n\u003cp>排查时我会先做小范围精确比较，再看大规模 ANN 表现。知识库还要另外管理原文、版本和权限，有向量库不等于知识问答系统已经建好。”\u003c/p>"}, {"id": "08.2", "title": "为什么相似度高，不代表答案可靠？", "answer": "\u003cp>“相似度衡量的是特定表示和度量下的接近程度，不是事实正确概率。两份合同可能主题完全一样，只差一个编号；两版制度也可能只有金额不同，但业务上必须用对版本。\u003c/p>\n\u003cp>所以我把相似度当候选排序信号，精确条件通过元数据或关键词约束，复杂相关性再重排，答案还要核对证据。阈值需要在本场景数据上验证，不能把某个数值解释成百分之多少可信。\u003c/p>\n\u003cp>评测时我会加入同主题错版本、近似编号和无答案题。只有这些难例处理得好，语义搜索才真正帮助用户，而不是只找到看起来有关的段落。”\u003c/p>"}, {"id": "08.3", "title": "升级 Embedding 模型，你会怎样迁移？", "answer": "\u003cp>“先用固定问题和资料比较新旧模型，确认目标场景收益。随后为新模型建立独立版本的向量索引，重新处理存量资料，并处理构建期间的增量更新。查询必须明确走对应模型和索引。\u003c/p>\n\u003cp>切换前检查覆盖率、权限过滤、精确编号与语义问题的表现，必要时用只读查询并行对照。保留可回退的旧配置，但撤权和删除仍需对两边生效，不能因为回滚恢复已失效数据。\u003c/p>\n\u003cp>我还会核算一次性编码费用和持续资源开销。维度相同不是兼容依据，不能仅修改一个模型名就把已有向量继续当成有效资料。”\u003c/p>"}], "search": "Embedding 与向量检索：按意思搜索，是怎样实现的？\nEmbedding 把文本或其他内容编码成一组数字，称为向量。训练让某些相关内容在这个空间中更接近，因此“登录不上”与“身份认证失败”即使字面不同，也可能匹配。向量不是把原文压成可以无损还原的密码，它保留的是对目标任务有用的表示。\n\n搜索时，用兼容的编码方式把查询与资料映射到同一表示空间，再比较距离或相似度。余弦相似度可以直观理解为比较两个向量方向是否接近；有些模型使用点积等度量，要遵循模型与索引配置，不能随意换算法还认为分数意义一样。\n\n**“表示得好”和“找得快”是两层问题。** Embedding 决定相关内容是否容易靠近，向量索引决定怎么快速找到近邻。数据小可以精确比较；数据大时常用 ANN，即近似最近邻，允许少量漏掉真正近邻的可能性来降低查询开销。\n\n比如资料非常多时，先近似找一批邻近向量；速度快了，也要检查是否漏掉正确资料。\n\nHNSW 是常见 ANN 方法，可以把它想成多层导航图：上层先大步靠近目标区域，下层再细查邻居。搜索探索得更多，通常召回更高，但延迟与资源消耗也可能增加。索引能找到向量上的近邻，不代表找到了业务上所有必要证据。\n\n换 Embedding 模型时，维度相同也不代表语义空间相同。查询向量与资料向量必须来自匹配的配置；通常要建立新索引、重新编码资料并验证再切换，不能只换查询端模型。\n把精确编号与语义问题分组测。向量擅长改写和语义关联，却可能把近似编号、肯定与否定混在一起。看标注证据的召回，不把相似度当真实性概率。迁移同时核算编码成本、索引资源和切换风险；向量和关联信息仍可能包含敏感信息，不是天然匿名数据。\n**客服知识检索。** 用户说“验证码收不到”，资料标题可能是“短信送达异常”；向量帮助跨表述定位，关键词补充运营商错误码与产品型号。\n\n**跨语言资料搜索。** 业务人员用中文问英文技术资料，使用经过该语言组合验证的多语言 Embedding；返回原文与解释。不能因为模型叫“多语言”，就假设所有语种和专业词效果相同。\n- **相似度很高却答非所问。** 检查是否只是同主题，实际对象、版本或否定条件不同；加入精确过滤、混合检索或重排。\n- **换模型后效果断崖下降。** 检查向量模型、维度、归一化、距离度量和索引版本是否匹配，先排除新旧空间混用。\n- **小样本好，全量库差。** 检查 ANN 参数、过滤后的候选量和近似搜索漏召回；与小范围精确检索对照，区别表示问题和索引问题。\nEmbedding 与向量数据库分别解决什么问题？ “Embedding 负责把内容表示成可比较的向量；向量数据库负责存储这些向量、建立索引并检索。前者决定语义表示，后者影响查询效率和工程管理，不能把它们当成一个能力。\n比如用户用口语查询技术术语，好的表示有机会把两者放近；但大规模索引若近似搜索探索不足，正确近邻仍可能漏掉。反过来，索引再精确，表示空间里本就不相关的条目也不会自然靠近。\n排查时我会先做小范围精确比较，再看大规模 ANN 表现。知识库还要另外管理原文、版本和权限，有向量库不等于知识问答系统已经建好。”\n为什么相似度高，不代表答案可靠？ “相似度衡量的是特定表示和度量下的接近程度，不是事实正确概率。两份合同可能主题完全一样，只差一个编号；两版制度也可能只有金额不同，但业务上必须用对版本。\n所以我把相似度当候选排序信号，精确条件通过元数据或关键词约束，复杂相关性再重排，答案还要核对证据。阈值需要在本场景数据上验证，不能把某个数值解释成百分之多少可信。\n评测时我会加入同主题错版本、近似编号和无答案题。只有这些难例处理得好，语义搜索才真正帮助用户，而不是只找到看起来有关的段落。”\n升级 Embedding 模型，你会怎样迁移？ “先用固定问题和资料比较新旧模型，确认目标场景收益。随后为新模型建立独立版本的向量索引，重新处理存量资料，并处理构建期间的增量更新。查询必须明确走对应模型和索引。\n切换前检查覆盖率、权限过滤、精确编号与语义问题的表现，必要时用只读查询并行对照。保留可回退的旧配置，但撤权和删除仍需对两边生效，不能因为回滚恢复已失效数据。\n我还会核算一次性编码费用和持续资源开销。维度相同不是兼容依据，不能仅修改一个模型名就把已有向量继续当成有效资料。”"}, {"id": "k09", "number": "09", "title": "关键词与混合检索：为什么懂语义仍需要精确搜索？", "short": "关键词与混合检索", "priority": "P0", "group": 1, "intro": "\u003cp>关键词检索通常借助倒排索引：记录每个词在哪些文档中出现，查询时快速定位候选。BM25 是常用排序方法，考虑词在当前文档出现的频度、在整个库中是否稀有，以及文档长度；词频的贡献会逐渐饱和，避免简单重复某个词就无限提高得分。\u003c/p>\n\u003cp>因此型号、错误码、人名和产品专有词，往往是关键词路径的强项。向量检索更适合词不一样但意思相关的查询。混合检索把两条路径结合，常见过程是并行召回、去重、融合排名，再视需要重排和选取上下文。\u003c/p>\n\u003cp>\u003cstrong>两种分数不能随便相加。\u003c/strong> BM25 与向量相似度的尺度不同。RRF，即倒数排名融合，使用各列表中的名次，把靠前的结果合并得分，减少直接对齐原始分数的困难。它并不理解“为什么相关”，也不会自动纠正错误召回；融合参数与候选范围仍要评测。\u003c/p>\n\u003cp>比如型号、订单号用关键词精确匹配，口语问题用向量找相关内容，再按名次融合两路结果、去重筛选。\u003c/p>\n\u003cp>精确过滤与相关性排序不同。用户指定“2026 年生效、华东区”，这些是适用范围；仅让相关性分数猜测，很可能取回一份措辞相似的旧规则。查询改写也有风险：把口语改成规范术语有帮助，改掉型号、年份或否定条件就改变了用户问题。\u003c/p>", "decision": "\u003cp>建立精确查询、语义改写、复合条件三类样本，分别看新增路径带来的收益。一个方案整体分数上升，却把关键错误码搜索变差，不应直接全量替换。检索权限应在内容进入模型之前生效，过滤后的候选不足要单独监控。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>技术支持助手。\u003c/strong> “E1042 报错后上传不了附件”同时含精确代码与自然语言症状。错误码走关键词定位，症状走语义补充；先确定产品与版本，再合并解决步骤。\u003c/p>\n\u003cp>\u003cstrong>企业政策搜索。\u003c/strong> 口语“在家办公能不能报网络费”映射到远程办公补贴，同时保留地区、时间、员工类型等硬条件。元数据不齐时应补充或标明范围不确定。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>混合后结果更乱。\u003c/strong> 检查候选去重、融合方式和单路径质量；差的召回通道也会把噪声带入，不能因为叫混合就默认更好。\u003c/li>\n\u003cli>\u003cstrong>改写后查错对象。\u003c/strong> 对编号、日期、否定条件建立保留规则；保留原始查询作对照，不把用户原意完全替换掉。\u003c/li>\n\u003cli>\u003cstrong>设置过滤后几乎没结果。\u003c/strong> 检查元数据缺失和过滤语义，并验证索引对过滤与 ANN 的执行方式；不是一律放宽业务条件。\u003c/li>\n\u003c/ul>", "questions": [{"id": "09.1", "title": "BM25 和向量检索为什么互补？", "answer": "\u003cp>“BM25 基于词在文档和整个库中的分布进行排序，对错误码、型号和明确术语很有用；向量检索用语义表示匹配，适合口语和同义表达。两者擅长的查询类型不同。\u003c/p>\n\u003cp>比如用户问‘X200 连不上 Wi-Fi’，型号不能被相似型号替代，故障描述又可能在文档里写成‘无线网络认证异常’，这时两条路径都可能贡献证据。\u003c/p>\n\u003cp>我会按查询类型分别评估，先看混合是否减少漏召回，再看最终答案。精确范围还要单独过滤，混合检索不能代替版本、地区和权限约束。”\u003c/p>"}, {"id": "09.2", "title": "为什么融合时不能直接把两种检索分数相加？", "answer": "\u003cp>“因为分数的量纲和分布不一样，一个路径的数值大可能只是尺度大，并不代表更相关。直接相加会让某个通道无意中主导排序。\u003c/p>\n\u003cp>可选方法包括在验证过的分数校准后加权，或使用 RRF 这类基于名次的融合。RRF 关心结果在各列表排第几，减少原始尺度差异，但也会损失部分分数差距信息，不是所有情况都最优。\u003c/p>\n\u003cp>融合前还要去重、明确文档与片段粒度，融合后检查互补证据是否保留。我会用固定问题集比较，而不是凭两个权重相加等于一就认为方案合理。”\u003c/p>"}, {"id": "09.3", "title": "查询改写应该做到什么程度？", "answer": "\u003cp>“改写的目标是补足检索表达，不是替用户改问题。可以解析指代、展开缩写、把口语转换成文档术语；但型号、金额、年份和否定条件必须保留。缺失的业务条件应该询问，而不是猜进去。\u003c/p>\n\u003cp>对多条件问题，可以拆成子查询补证据，同时保留原始查询作为一路候选或对照。比如既查地区标准，也查员工例外，最后合并条件，而不是只留下一个泛化主题。\u003c/p>\n\u003cp>我会记录原问题、改写结果和召回变化，重点测‘改写后语义漂移’。如果简单查询已经准确，增加改写可能只是多一次调用和新的错误点。”\u003c/p>"}], "search": "关键词与混合检索：为什么懂语义仍需要精确搜索？\n关键词检索通常借助倒排索引：记录每个词在哪些文档中出现，查询时快速定位候选。BM25 是常用排序方法，考虑词在当前文档出现的频度、在整个库中是否稀有，以及文档长度；词频的贡献会逐渐饱和，避免简单重复某个词就无限提高得分。\n\n因此型号、错误码、人名和产品专有词，往往是关键词路径的强项。向量检索更适合词不一样但意思相关的查询。混合检索把两条路径结合，常见过程是并行召回、去重、融合排名，再视需要重排和选取上下文。\n\n**两种分数不能随便相加。** BM25 与向量相似度的尺度不同。RRF，即倒数排名融合，使用各列表中的名次，把靠前的结果合并得分，减少直接对齐原始分数的困难。它并不理解“为什么相关”，也不会自动纠正错误召回；融合参数与候选范围仍要评测。\n\n比如型号、订单号用关键词精确匹配，口语问题用向量找相关内容，再按名次融合两路结果、去重筛选。\n\n精确过滤与相关性排序不同。用户指定“2026 年生效、华东区”，这些是适用范围；仅让相关性分数猜测，很可能取回一份措辞相似的旧规则。查询改写也有风险：把口语改成规范术语有帮助，改掉型号、年份或否定条件就改变了用户问题。\n建立精确查询、语义改写、复合条件三类样本，分别看新增路径带来的收益。一个方案整体分数上升，却把关键错误码搜索变差，不应直接全量替换。检索权限应在内容进入模型之前生效，过滤后的候选不足要单独监控。\n**技术支持助手。** “E1042 报错后上传不了附件”同时含精确代码与自然语言症状。错误码走关键词定位，症状走语义补充；先确定产品与版本，再合并解决步骤。\n\n**企业政策搜索。** 口语“在家办公能不能报网络费”映射到远程办公补贴，同时保留地区、时间、员工类型等硬条件。元数据不齐时应补充或标明范围不确定。\n- **混合后结果更乱。** 检查候选去重、融合方式和单路径质量；差的召回通道也会把噪声带入，不能因为叫混合就默认更好。\n- **改写后查错对象。** 对编号、日期、否定条件建立保留规则；保留原始查询作对照，不把用户原意完全替换掉。\n- **设置过滤后几乎没结果。** 检查元数据缺失和过滤语义，并验证索引对过滤与 ANN 的执行方式；不是一律放宽业务条件。\nBM25 和向量检索为什么互补？ “BM25 基于词在文档和整个库中的分布进行排序，对错误码、型号和明确术语很有用；向量检索用语义表示匹配，适合口语和同义表达。两者擅长的查询类型不同。\n比如用户问‘X200 连不上 Wi-Fi’，型号不能被相似型号替代，故障描述又可能在文档里写成‘无线网络认证异常’，这时两条路径都可能贡献证据。\n我会按查询类型分别评估，先看混合是否减少漏召回，再看最终答案。精确范围还要单独过滤，混合检索不能代替版本、地区和权限约束。”\n为什么融合时不能直接把两种检索分数相加？ “因为分数的量纲和分布不一样，一个路径的数值大可能只是尺度大，并不代表更相关。直接相加会让某个通道无意中主导排序。\n可选方法包括在验证过的分数校准后加权，或使用 RRF 这类基于名次的融合。RRF 关心结果在各列表排第几，减少原始尺度差异，但也会损失部分分数差距信息，不是所有情况都最优。\n融合前还要去重、明确文档与片段粒度，融合后检查互补证据是否保留。我会用固定问题集比较，而不是凭两个权重相加等于一就认为方案合理。”\n查询改写应该做到什么程度？ “改写的目标是补足检索表达，不是替用户改问题。可以解析指代、展开缩写、把口语转换成文档术语；但型号、金额、年份和否定条件必须保留。缺失的业务条件应该询问，而不是猜进去。\n对多条件问题，可以拆成子查询补证据，同时保留原始查询作为一路候选或对照。比如既查地区标准，也查员工例外，最后合并条件，而不是只留下一个泛化主题。\n我会记录原问题、改写结果和召回变化，重点测‘改写后语义漂移’。如果简单查询已经准确，增加改写可能只是多一次调用和新的错误点。”"}, {"id": "k10", "number": "10", "title": "Rerank：候选已经找到了，怎样选出真正有用的证据？", "short": "Rerank", "priority": "P1", "group": 1, "intro": "\u003cp>召回解决从大量资料中快速找到候选，Rerank 解决候选之间更细致的排序。两者像先圈定书架，再细看哪几页真的回答问题；重排不会凭空看到召回阶段没有找到的资料。\u003c/p>\n\u003cp>比如知识问答先从候选资料里挑出更相关的证据，后续生成答案时再把结论和支持它的原文对应起来。\u003c/p>\n\u003cp>常见向量召回使用双编码器，查询和文档分别编码，可以提前算好文档向量，搜索很快。常见交叉编码器重排把查询与候选一起处理，能更细致比较词语和条件之间的关系，但每个候选都要额外计算。也有用生成式模型重排的方案，具体成本与行为需要单独验证。\u003c/p>\n\u003cp>\u003cstrong>两个数量不要混淆。\u003c/strong> 召回候选量决定重排看得到什么，最终选取量决定生成模型实际读到什么。候选增加可以减少漏证据，却增加重排成本；最终上下文增加可能补齐信息，也可能把重复和噪声一起送进去。\u003c/p>\n\u003cp>排序高不等于证据集合完整。一个问题同时需要价格、退款条件和适用日期，前五名可能全在讲价格。重排后还需要去重、补充互补证据，必要时按子问题选段；不是把所有任务都简化成“挑分数最高的三段”。\u003c/p>", "decision": "\u003cp>先检查正确证据是否已在候选中。如果没有，优先修召回；如果有却进不了最终上下文，再评估重排。排序指标可看 MRR，即首个相关结果名次倒数的平均值，或看考虑相关程度和位置的 nDCG；涉及多证据问答，还必须检查必要证据是否找齐，单个相关结果靠前并不够。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>复杂售后政策问答。\u003c/strong> 从大量相近条款中区分未发货取消、已发货退货、部分退款等条件，重排帮助挑适用规则；订单状态仍来自业务接口。\u003c/p>\n\u003cp>\u003cstrong>研发知识助手。\u003c/strong> 候选包含相同函数名的多个版本，用查询中的版本、错误现象和标题一起重排。代码片段与前置说明配套返回，减少把相似写法当成正确方案。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>重排分数很好，答案还是不完整。\u003c/strong> 检查互补证据是否被重复片段挤掉，按子问题覆盖而不是只看单片段分数。\u003c/li>\n\u003cli>\u003cstrong>接入后明显变慢。\u003c/strong> 分解候选数量、单片段长度、批处理和服务排队；对精确定位查询可绕过低收益重排。\u003c/li>\n\u003cli>\u003cstrong>只看段落判断错适用范围。\u003c/strong> 给重排候选带上必要标题、版本和对象信息，避免关键信息只存在于父文档里。\u003c/li>\n\u003c/ul>", "questions": [{"id": "10.1", "title": "为什么重排通常比向量召回更精细，也更贵？", "answer": "\u003cp>“常见向量召回把查询与文档分别编码，文档向量可以预先算好，因此能快速搜索。交叉编码器重排把问题与每个候选放在一起比较，有机会识别更细的条件关系，但候选越多就需要更多在线计算。\u003c/p>\n\u003cp>这不是所有实现的绝对性能结论，但解释了常见的两阶段设计：先用便宜方法保覆盖，再对有限候选做细排。比如同样出现‘退款’，重排更可能区分退货申请和到账失败。\u003c/p>\n\u003cp>我会同时看候选覆盖、排序收益和额外时延。没有召回的条款不在它的处理范围里，所以重排不能替代召回质量。”\u003c/p>"}, {"id": "10.2", "title": "你会怎样决定是否给产品加 Rerank？", "answer": "\u003cp>“先看错误分布。如果正确证据经常在候选里，但排在最终上下文之外，重排有明确机会；如果根本没召回，先修查询和索引。编号已精确定位的小范围查询，可能无需额外重排。\u003c/p>\n\u003cp>我会用同一批候选对照加与不加，比较最终答案条件是否完整、引用是否正确，以及端到端时延和成本。复杂问题有明显收益、简单问题没有，可以按查询类型启用。\u003c/p>\n\u003cp>上线标准是可用回答改善，而不是重排模型单项分数更高。还要保留服务超时策略，避免增加一个步骤后把整个问答可用性拖低。”\u003c/p>"}, {"id": "10.3", "title": "Top K 增大后，为什么有时答案反而变差？", "answer": "\u003cp>“先确认调的是召回候选 K，还是最终送进上下文的 K。增加召回范围主要影响覆盖和重排开销；增加最终片段数会直接增加生成模型看到的内容，噪声、重复和冲突也会进入。\u003c/p>\n\u003cp>例如大量相似的普通政策挤满上下文，真正决定答案的例外条款可能被忽略。解决方式不只是缩小 K，还包括去重、保留不同子问题的证据、补标题与适用范围。\u003c/p>\n\u003cp>我会比较必要证据覆盖和答案完整性，并记录上下文长度。参数应该服务于证据质量，而不是认为‘给得越多，模型就一定答得越好’。”\u003c/p>"}], "search": "Rerank：候选已经找到了，怎样选出真正有用的证据？\n召回解决从大量资料中快速找到候选，Rerank 解决候选之间更细致的排序。两者像先圈定书架，再细看哪几页真的回答问题；重排不会凭空看到召回阶段没有找到的资料。\n\n比如知识问答先从候选资料里挑出更相关的证据，后续生成答案时再把结论和支持它的原文对应起来。\n\n常见向量召回使用双编码器，查询和文档分别编码，可以提前算好文档向量，搜索很快。常见交叉编码器重排把查询与候选一起处理，能更细致比较词语和条件之间的关系，但每个候选都要额外计算。也有用生成式模型重排的方案，具体成本与行为需要单独验证。\n\n**两个数量不要混淆。** 召回候选量决定重排看得到什么，最终选取量决定生成模型实际读到什么。候选增加可以减少漏证据，却增加重排成本；最终上下文增加可能补齐信息，也可能把重复和噪声一起送进去。\n\n排序高不等于证据集合完整。一个问题同时需要价格、退款条件和适用日期，前五名可能全在讲价格。重排后还需要去重、补充互补证据，必要时按子问题选段；不是把所有任务都简化成“挑分数最高的三段”。\n先检查正确证据是否已在候选中。如果没有，优先修召回；如果有却进不了最终上下文，再评估重排。排序指标可看 MRR，即首个相关结果名次倒数的平均值，或看考虑相关程度和位置的 nDCG；涉及多证据问答，还必须检查必要证据是否找齐，单个相关结果靠前并不够。\n**复杂售后政策问答。** 从大量相近条款中区分未发货取消、已发货退货、部分退款等条件，重排帮助挑适用规则；订单状态仍来自业务接口。\n\n**研发知识助手。** 候选包含相同函数名的多个版本，用查询中的版本、错误现象和标题一起重排。代码片段与前置说明配套返回，减少把相似写法当成正确方案。\n- **重排分数很好，答案还是不完整。** 检查互补证据是否被重复片段挤掉，按子问题覆盖而不是只看单片段分数。\n- **接入后明显变慢。** 分解候选数量、单片段长度、批处理和服务排队；对精确定位查询可绕过低收益重排。\n- **只看段落判断错适用范围。** 给重排候选带上必要标题、版本和对象信息，避免关键信息只存在于父文档里。\n为什么重排通常比向量召回更精细，也更贵？ “常见向量召回把查询与文档分别编码，文档向量可以预先算好，因此能快速搜索。交叉编码器重排把问题与每个候选放在一起比较，有机会识别更细的条件关系，但候选越多就需要更多在线计算。\n这不是所有实现的绝对性能结论，但解释了常见的两阶段设计：先用便宜方法保覆盖，再对有限候选做细排。比如同样出现‘退款’，重排更可能区分退货申请和到账失败。\n我会同时看候选覆盖、排序收益和额外时延。没有召回的条款不在它的处理范围里，所以重排不能替代召回质量。”\n你会怎样决定是否给产品加 Rerank？ “先看错误分布。如果正确证据经常在候选里，但排在最终上下文之外，重排有明确机会；如果根本没召回，先修查询和索引。编号已精确定位的小范围查询，可能无需额外重排。\n我会用同一批候选对照加与不加，比较最终答案条件是否完整、引用是否正确，以及端到端时延和成本。复杂问题有明显收益、简单问题没有，可以按查询类型启用。\n上线标准是可用回答改善，而不是重排模型单项分数更高。还要保留服务超时策略，避免增加一个步骤后把整个问答可用性拖低。”\nTop K 增大后，为什么有时答案反而变差？ “先确认调的是召回候选 K，还是最终送进上下文的 K。增加召回范围主要影响覆盖和重排开销；增加最终片段数会直接增加生成模型看到的内容，噪声、重复和冲突也会进入。\n例如大量相似的普通政策挤满上下文，真正决定答案的例外条款可能被忽略。解决方式不只是缩小 K，还包括去重、保留不同子问题的证据、补标题与适用范围。\n我会比较必要证据覆盖和答案完整性，并记录上下文长度。参数应该服务于证据质量，而不是认为‘给得越多，模型就一定答得越好’。”"}, {"id": "k11", "number": "11", "title": "RAG 与引用：怎样让答案有据可查？", "short": "RAG 与引用", "priority": "P0", "group": 1, "intro": "\u003cp>\u003cstrong>先抓住一个问题：模型没有你公司的最新制度，怎么回答公司的问题？\u003c/strong>\u003c/p>\n\u003cp>假设用户问：“我还在试用期，下周去上海培训，住宿能报销多少？”模型可能知道一般公司怎么报销，但不知道你公司的有效制度，也不知道培训和普通出差有没有不同规定。让它凭常识补答案，很容易说出一个像真的、却不适用的数字。\u003c/p>\n\u003cp>RAG 做的事情，就是先从外部资料里找证据，把问题和证据一起交给模型，再让模型组织回答。模型参数可以保持不变；改变的是这一次回答能参考的材料。\u003c/p>\n\u003cp>不过，“先搜再答”只概括了最后几步。一个可用的 RAG 系统，实际上有两条链路。\u003c/p>\n\u003cp>\u003cstrong>第一条链路，是先把资料整理成能找到、能核对的样子。\u003c/strong>\u003c/p>\n\u003cp>制度上传后，要提取文字和表格，按合适的边界切成片段。每个片段除了正文，还要带文件 ID、标题、页码、版本、生效时间和适用范围等信息。权限也要在后续读取时真正执行，不能只存一个标签。\u003c/p>\n\u003cp>接着为片段建立检索索引。常见做法是同时准备关键词索引和向量索引：关键词擅长找“试用期”“培训”这样的明确表述；向量检索能把“住酒店能报多少”与“住宿费用标准”联系起来。两种都用是常见选择，并不是 RAG 必须绑定的唯一实现。\u003c/p>\n\u003cp>这里要特别留意：如果“住宿标准”与“试用期例外”被切开，后面必须有办法把两段一起找回来。切得很细能帮助定位，但不代表已经保留了回答需要的全部条件。\u003c/p>\n\u003cp>\u003cstrong>第二条链路，是用户提问后，选出真正能回答问题的证据。\u003c/strong>\u003c/p>\n\u003cp>先弄清楚问题在问什么。这个问题里，上海是地点，培训是出差事由，试用期是员工条件，下周是适用时间。如果只拿“上海住宿”去搜，可能找到数字，却漏掉决定能否报销的条件。\u003c/p>\n\u003cp>系统在用户可访问的资料范围内检索，获得一批候选。如果同时用了关键词和向量检索，就需要融合、去重。候选较杂时，再用 Rerank 判断哪些片段更相关；它通常会把问题和候选放在一起比较，判断得更细，但也增加处理时间。\u003c/p>\n\u003cp>到这里仍然不能简单“取分数最高的几段”。最高分的几段可能都在重复住宿标准，而试用期的例外排在后面。系统需要看证据是否互补：地点标准、员工适用条件、培训例外，是不是都覆盖了。必要时补取同一小节或相关条款，再把选好的证据放进模型上下文。\u003c/p>\n\u003cp>\u003cstrong>用一组教学资料，把这条链路走一遍。\u003c/strong>\u003c/p>\n\u003cp>假设资料中有以下条款，数字仅用于说明：\u003c/p>\n\u003cul>\n\u003cli>A：2026 年有效的差旅标准，上海住宿上限为每人每晚 500 元。\u003c/li>\n\u003cli>B：2026 年有效的试用期规定，试用期员工参加公司统一培训，需事先审批，住宿上限为每人每晚 350 元，优先适用本条。\u003c/li>\n\u003cli>C：已经失效的旧差旅标准，上海住宿上限为每人每晚 450 元。\u003c/li>\n\u003c/ul>\n\u003cp>用户问的是试用期培训，最终上下文必须包含 B；A 可以帮助说明一般标准与例外的关系，C 则不能作为当前有效标准。\u003c/p>\n\u003cp>合适的回答应是：“如果属于公司统一培训且已事先获批，适用试用期培训条款，住宿上限为每人每晚 350 元；你是否已获批还需要确认。”它不能只回答“上海上限 500 元”，也不能把“上限 350 元”说成“无论实际花多少都报销 350 元”。\u003c/p>\n\u003cp>这个例子说明，RAG 的难点不仅是找到相关文字，还要找齐决定答案的条件，并让模型正确处理它们之间的关系。\u003c/p>\n\u003cp>\u003cstrong>引用的作用，是让每个关键结论能回到支持它的原文。\u003c/strong>\u003c/p>\n\u003cp>一种常见实现是：给进入上下文的片段分配来源标识，让模型在结论旁返回标识，再由程序把它映射到真实文件、版本和段落。这样能减少模型自行编造链接的问题，但标识存在仍不代表引用正确。\u003c/p>\n\u003cp>还要核对：这段材料是否真的支持“350 元”，是否明确写了审批条件，是否对当前员工和时间有效。引用位置正确、结论忠实、制度适用，是三个需要分别检查的问题。\u003c/p>\n\u003cp>如果找不到试用期规定，系统应该明确缺少决定性资料，继续补查或说明目前无法确定；如果条款已经找齐，却缺用户是否获批的信息，则应该询问用户。缺资料和缺用户条件，对应的下一步不一样。\u003c/p>", "decision": "\u003cp>如果由我负责企业制度问答，我会先限定一个资料边界清楚、来源可靠的制度域，做出可评测的基线。第一版就要能看到从原文到候选片段、最终上下文、回答和引用的完整记录，否则用户说答错了，我们只能盲目改提示词。\u003c/p>\n\u003cp>我不会一开始就堆上多轮改写、多个检索器和多个 Agent。先用失败样本判断瓶颈：相关条款找不到，解决召回；条款在候选里却没进入上下文，解决选证；证据齐全仍答错，才重点检查提示词、模型和回答校验。每加一个环节，都要证明它改善了哪类失败，以及多花了多少时间和成本。\u003c/p>\n\u003cp>验收时，我至少分别看以下几项：\u003c/p>\n\u003cdiv aria-label=\"可横向滚动的表格\" class=\"table-scroll\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>验证问题\u003c/th>\n\u003cth>具体怎么判\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>决定答案的证据是否找齐\u003c/td>\n\u003ctd>给每道测试题标注必要证据；在固定候选数量 K 下，统计必要证据全部被召回的问题数／可回答的测试问题数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回答有没有用对证据\u003c/td>\n\u003ctd>核对金额、适用对象、时间和例外条件；上面案例中遗漏“已审批”就不算完整正确\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>引用是否支持结论\u003c/td>\n\u003ctd>逐条核对引用覆盖的关键断言；不能只检查链接可打开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>没依据时会不会硬答\u003c/td>\n\u003ctd>单独准备资料中无答案的问题，检查有没有编造，以及是否给出准确的缺口说明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有依据时是否被误拒绝\u003c/td>\n\u003ctd>在可回答问题中统计错误拒答，避免通过“少回答”制造低错误率\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用户是否真正省事\u003c/td>\n\u003ctd>观察核对与修改时间、结果可用性，并同时看端到端时延和单次可用回答成本\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>第一项是本项目可以定义的“必要证据完整召回率”，不是所有检索工具默认提供的 Recall@K。普通 Recall@K 常按相关条目被找回的比例计算；只找回两条必要证据中的一条，部分召回率可以有分数，但这道题仍可能无法正确回答。验收前要写清口径。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>企业制度问答。\u003c/strong> 用户问试用期培训能报多少，系统先确定适用时间与员工条件，读取有效标准与例外条款。用原文支持上限与审批条件；是否已获批由用户或审批系统提供。验收不能只看金额，还要核对条件是否齐全。\u003c/p>\n\u003cp>\u003cstrong>客户支持知识助手。\u003c/strong> 产品版本、用户环境与错误码决定解决步骤。先从发布说明和故障知识中检索，再生成可操作建议；需要订单或设备实时状态时调用业务查询。RAG 提供资料依据，工具补充当前状态，两者不互相代替。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>知识库有条款，但候选里没有。\u003c/strong> 对照原文、解析结果、索引和查询，检查版本过滤与条件遗漏；先修召回，不能直接归因于生成模型。\u003c/li>\n\u003cli>\u003cstrong>候选有例外，答案却只用一般标准。\u003c/strong> 检查最终上下文是否包含例外；若被挤掉，修去重和选证；若已经包含，检查模型对条款适用关系的理解。\u003c/li>\n\u003cli>\u003cstrong>引用正确但政策过期。\u003c/strong> 核对生效时间和替代关系，而不是上传时间；缓存与索引都要更新。用户问历史政策时则保留对应历史版本，不能一律只返回最新。\u003c/li>\n\u003c/ul>", "questions": [{"id": "11.1", "title": "如果让你从零设计一个企业制度问答产品，你会怎样搭建 RAG？", "answer": "\u003cp>“我会先把它拆成资料准备和在线问答两条链路。资料准备要解决的是，制度能不能被正确读取、找到和追溯；在线问答要解决的是，这一次问题有没有拿到足够证据，并且用对了。\u003c/p>\n\u003cp>资料侧，我会保留标题、条款结构、版本、生效时间和来源位置，再建立适合的检索索引。在线侧，先识别问题里的员工条件、地区和时间，在授权范围内查找；关键词与向量可以互补，候选较杂时再重排，最后检查上下文有没有覆盖关键条件。\u003c/p>\n\u003cp>比如试用期员工问培训住宿标准，找到上海的一般标准还不够，还要找到试用期的例外和审批要求。答案要把这些条件说全，引用落到具体条款；缺少审批状态就询问，不能默认已经获批。\u003c/p>\n\u003cp>第一版我会选一个制度域，建立包含正常问题、例外条款、旧版本和无答案问题的测试集。先把完整链路跑通、记录好各阶段证据，再根据失败类型加能力。这样才能知道效果提升来自哪一步，而不是做出一个会说话的搜索框就认为完成了。”\u003c/p>"}, {"id": "11.2", "title": "知识库明明有答案，RAG 还是答错，你怎么定位？", "answer": "\u003cp>“我会拿一条失败问题，沿着原文、索引、候选、最终上下文和回答逐层比对，重点看正确证据在哪一步丢失或被用错。\u003c/p>\n\u003cp>先确认当前有效原文确实有答案，相关段落解析、切分和入库是否正常。如果索引里有，但候选没找到，再看查询有没有漏条件、过滤是否误排，以及关键词和向量召回是否合适。这里才考虑改写查询或扩大召回。\u003c/p>\n\u003cp>如果正确条款已经在候选里，却没有进入最终上下文，问题更可能是重排、重复片段挤占位置，或者上下文预算不足。比如五段都讲一般住宿标准，却把试用期例外挤掉了，就要改证据选择，单纯换生成模型解决不了。\u003c/p>\n\u003cp>如果上下文已经包含全部条件，答案仍把 350 元说成 500 元，再检查提示词、模型是否理解条款优先级，以及输出核验。修复时固定资料和测试问题，只改关键因素；既回归这条问题，也回归同类问题，确认不是只把一个例子补对。”\u003c/p>"}, {"id": "11.3", "title": "检索指标提升了，怎么判断 RAG 是否真的值得上线？", "answer": "\u003cp>“我不会只用检索分数做上线结论，因为找到一些相关片段，不等于找齐答案条件，更不等于模型正确使用了它们。\u003c/p>\n\u003cp>我会用一批有原文依据的代表性问题，对照新旧版本。检索层看必要证据是否进入固定范围的候选和最终上下文；回答层核对事实、条件和引用；无答案问题单独检查编造，可回答问题则检查是否被误拒绝。\u003c/p>\n\u003cp>比如一个纯教学例子：100 道可回答问题里，旧版有 70 道找齐必要证据，新版有 85 道，说明检索覆盖改善了。但如果完整正确的答案仍只有 65 道，就需要继续检查选证和生成，不能宣布整体提升了 15 个百分点。\u003c/p>\n\u003cp>最后再看用户核对时间、端到端时延和可用回答成本，并提前约定高影响错误的发布门槛。只在整体收益成立、关键场景没有明显退化时扩大使用。检索指标帮我定位系统，最终还是要用用户能否获得可靠答案来验收。”\u003c/p>"}], "search": "RAG 与引用：怎样让答案有据可查？\n**先抓住一个问题：模型没有你公司的最新制度，怎么回答公司的问题？**\n\n假设用户问：“我还在试用期，下周去上海培训，住宿能报销多少？”模型可能知道一般公司怎么报销，但不知道你公司的有效制度，也不知道培训和普通出差有没有不同规定。让它凭常识补答案，很容易说出一个像真的、却不适用的数字。\n\nRAG 做的事情，就是先从外部资料里找证据，把问题和证据一起交给模型，再让模型组织回答。模型参数可以保持不变；改变的是这一次回答能参考的材料。\n\n不过，“先搜再答”只概括了最后几步。一个可用的 RAG 系统，实际上有两条链路。\n\n**第一条链路，是先把资料整理成能找到、能核对的样子。**\n\n制度上传后，要提取文字和表格，按合适的边界切成片段。每个片段除了正文，还要带文件 ID、标题、页码、版本、生效时间和适用范围等信息。权限也要在后续读取时真正执行，不能只存一个标签。\n\n接着为片段建立检索索引。常见做法是同时准备关键词索引和向量索引：关键词擅长找“试用期”“培训”这样的明确表述；向量检索能把“住酒店能报多少”与“住宿费用标准”联系起来。两种都用是常见选择，并不是 RAG 必须绑定的唯一实现。\n\n这里要特别留意：如果“住宿标准”与“试用期例外”被切开，后面必须有办法把两段一起找回来。切得很细能帮助定位，但不代表已经保留了回答需要的全部条件。\n\n**第二条链路，是用户提问后，选出真正能回答问题的证据。**\n\n先弄清楚问题在问什么。这个问题里，上海是地点，培训是出差事由，试用期是员工条件，下周是适用时间。如果只拿“上海住宿”去搜，可能找到数字，却漏掉决定能否报销的条件。\n\n系统在用户可访问的资料范围内检索，获得一批候选。如果同时用了关键词和向量检索，就需要融合、去重。候选较杂时，再用 Rerank 判断哪些片段更相关；它通常会把问题和候选放在一起比较，判断得更细，但也增加处理时间。\n\n到这里仍然不能简单“取分数最高的几段”。最高分的几段可能都在重复住宿标准，而试用期的例外排在后面。系统需要看证据是否互补：地点标准、员工适用条件、培训例外，是不是都覆盖了。必要时补取同一小节或相关条款，再把选好的证据放进模型上下文。\n\n**用一组教学资料，把这条链路走一遍。**\n\n假设资料中有以下条款，数字仅用于说明：\n\n- A：2026 年有效的差旅标准，上海住宿上限为每人每晚 500 元。\n- B：2026 年有效的试用期规定，试用期员工参加公司统一培训，需事先审批，住宿上限为每人每晚 350 元，优先适用本条。\n- C：已经失效的旧差旅标准，上海住宿上限为每人每晚 450 元。\n\n用户问的是试用期培训，最终上下文必须包含 B；A 可以帮助说明一般标准与例外的关系，C 则不能作为当前有效标准。\n\n合适的回答应是：“如果属于公司统一培训且已事先获批，适用试用期培训条款，住宿上限为每人每晚 350 元；你是否已获批还需要确认。”它不能只回答“上海上限 500 元”，也不能把“上限 350 元”说成“无论实际花多少都报销 350 元”。\n\n这个例子说明，RAG 的难点不仅是找到相关文字，还要找齐决定答案的条件，并让模型正确处理它们之间的关系。\n\n**引用的作用，是让每个关键结论能回到支持它的原文。**\n\n一种常见实现是：给进入上下文的片段分配来源标识，让模型在结论旁返回标识，再由程序把它映射到真实文件、版本和段落。这样能减少模型自行编造链接的问题，但标识存在仍不代表引用正确。\n\n还要核对：这段材料是否真的支持“350 元”，是否明确写了审批条件，是否对当前员工和时间有效。引用位置正确、结论忠实、制度适用，是三个需要分别检查的问题。\n\n如果找不到试用期规定，系统应该明确缺少决定性资料，继续补查或说明目前无法确定；如果条款已经找齐，却缺用户是否获批的信息，则应该询问用户。缺资料和缺用户条件，对应的下一步不一样。\n如果由我负责企业制度问答，我会先限定一个资料边界清楚、来源可靠的制度域，做出可评测的基线。第一版就要能看到从原文到候选片段、最终上下文、回答和引用的完整记录，否则用户说答错了，我们只能盲目改提示词。\n\n我不会一开始就堆上多轮改写、多个检索器和多个 Agent。先用失败样本判断瓶颈：相关条款找不到，解决召回；条款在候选里却没进入上下文，解决选证；证据齐全仍答错，才重点检查提示词、模型和回答校验。每加一个环节，都要证明它改善了哪类失败，以及多花了多少时间和成本。\n\n验收时，我至少分别看以下几项：\n\n| 验证问题 | 具体怎么判 |\n|---|---|\n| 决定答案的证据是否找齐 | 给每道测试题标注必要证据；在固定候选数量 K 下，统计必要证据全部被召回的问题数／可回答的测试问题数 |\n| 回答有没有用对证据 | 核对金额、适用对象、时间和例外条件；上面案例中遗漏“已审批”就不算完整正确 |\n| 引用是否支持结论 | 逐条核对引用覆盖的关键断言；不能只检查链接可打开 |\n| 没依据时会不会硬答 | 单独准备资料中无答案的问题，检查有没有编造，以及是否给出准确的缺口说明 |\n| 有依据时是否被误拒绝 | 在可回答问题中统计错误拒答，避免通过“少回答”制造低错误率 |\n| 用户是否真正省事 | 观察核对与修改时间、结果可用性，并同时看端到端时延和单次可用回答成本 |\n\n第一项是本项目可以定义的“必要证据完整召回率”，不是所有检索工具默认提供的 Recall@K。普通 Recall@K 常按相关条目被找回的比例计算；只找回两条必要证据中的一条，部分召回率可以有分数，但这道题仍可能无法正确回答。验收前要写清口径。\n**企业制度问答。** 用户问试用期培训能报多少，系统先确定适用时间与员工条件，读取有效标准与例外条款。用原文支持上限与审批条件；是否已获批由用户或审批系统提供。验收不能只看金额，还要核对条件是否齐全。\n\n**客户支持知识助手。** 产品版本、用户环境与错误码决定解决步骤。先从发布说明和故障知识中检索，再生成可操作建议；需要订单或设备实时状态时调用业务查询。RAG 提供资料依据，工具补充当前状态，两者不互相代替。\n- **知识库有条款，但候选里没有。** 对照原文、解析结果、索引和查询，检查版本过滤与条件遗漏；先修召回，不能直接归因于生成模型。\n- **候选有例外，答案却只用一般标准。** 检查最终上下文是否包含例外；若被挤掉，修去重和选证；若已经包含，检查模型对条款适用关系的理解。\n- **引用正确但政策过期。** 核对生效时间和替代关系，而不是上传时间；缓存与索引都要更新。用户问历史政策时则保留对应历史版本，不能一律只返回最新。\n如果让你从零设计一个企业制度问答产品，你会怎样搭建 RAG？ “我会先把它拆成资料准备和在线问答两条链路。资料准备要解决的是，制度能不能被正确读取、找到和追溯；在线问答要解决的是，这一次问题有没有拿到足够证据，并且用对了。\n资料侧，我会保留标题、条款结构、版本、生效时间和来源位置，再建立适合的检索索引。在线侧，先识别问题里的员工条件、地区和时间，在授权范围内查找；关键词与向量可以互补，候选较杂时再重排，最后检查上下文有没有覆盖关键条件。\n比如试用期员工问培训住宿标准，找到上海的一般标准还不够，还要找到试用期的例外和审批要求。答案要把这些条件说全，引用落到具体条款；缺少审批状态就询问，不能默认已经获批。\n第一版我会选一个制度域，建立包含正常问题、例外条款、旧版本和无答案问题的测试集。先把完整链路跑通、记录好各阶段证据，再根据失败类型加能力。这样才能知道效果提升来自哪一步，而不是做出一个会说话的搜索框就认为完成了。”\n知识库明明有答案，RAG 还是答错，你怎么定位？ “我会拿一条失败问题，沿着原文、索引、候选、最终上下文和回答逐层比对，重点看正确证据在哪一步丢失或被用错。\n先确认当前有效原文确实有答案，相关段落解析、切分和入库是否正常。如果索引里有，但候选没找到，再看查询有没有漏条件、过滤是否误排，以及关键词和向量召回是否合适。这里才考虑改写查询或扩大召回。\n如果正确条款已经在候选里，却没有进入最终上下文，问题更可能是重排、重复片段挤占位置，或者上下文预算不足。比如五段都讲一般住宿标准，却把试用期例外挤掉了，就要改证据选择，单纯换生成模型解决不了。\n如果上下文已经包含全部条件，答案仍把 350 元说成 500 元，再检查提示词、模型是否理解条款优先级，以及输出核验。修复时固定资料和测试问题，只改关键因素；既回归这条问题，也回归同类问题，确认不是只把一个例子补对。”\n检索指标提升了，怎么判断 RAG 是否真的值得上线？ “我不会只用检索分数做上线结论，因为找到一些相关片段，不等于找齐答案条件，更不等于模型正确使用了它们。\n我会用一批有原文依据的代表性问题，对照新旧版本。检索层看必要证据是否进入固定范围的候选和最终上下文；回答层核对事实、条件和引用；无答案问题单独检查编造，可回答问题则检查是否被误拒绝。\n比如一个纯教学例子：100 道可回答问题里，旧版有 70 道找齐必要证据，新版有 85 道，说明检索覆盖改善了。但如果完整正确的答案仍只有 65 道，就需要继续检查选证和生成，不能宣布整体提升了 15 个百分点。\n最后再看用户核对时间、端到端时延和可用回答成本，并提前约定高影响错误的发布门槛。只在整体收益成立、关键场景没有明显退化时扩大使用。检索指标帮我定位系统，最终还是要用用户能否获得可靠答案来验收。”"}, {"id": "k12", "number": "12", "title": "元数据与知识更新：如何让答案用对版本和适用范围？", "short": "元数据与知识更新", "priority": "P0", "group": 1, "intro": "\u003cp>文字说明“内容是什么”，元数据说明“内容属于谁、何时有效、适用于谁、现在能否使用”。文件 ID、版本、页码、部门、适用地区、生效和失效时间、访问范围，都可能参与判断。上传时间只说明进入系统的时间，不等于业务生效时间。\u003c/p>\n\u003cp>比如同名制度保留生效时间与版本，回答今年报销规则时，就能区分当前有效标准和旧制度。\u003c/p>\n\u003cp>\u003cstrong>知识更新不是替换一个文件就结束。\u003c/strong> 一份原文可能派生解析文本、切块、关键词索引、向量索引、缓存和回答引用。原文变了，派生数据要知道哪些需要重建。可用文件变更事件或定时扫描发现更新，通过版本号或内容摘要识别变化；具体增量粒度取决于系统设计。\u003c/p>\n\u003cp>一种常见流程是先构建新版本，校验完成后再切换可见版本，避免部分片段已更新、部分还停在旧版。构建期间的新增变更要补齐，旧任务使用哪个快照要有约定。旧版在新制度生效后是否还能用于回答，取决于问题是在问当前规则还是历史记录。\u003c/p>\n\u003cp>\u003cstrong>删除、撤权与物理清理不同。\u003c/strong> 数据撤权后应尽快阻断新的未授权访问，不能等待所有向量和缓存清完才生效。可以先标记不可用或在可信读取层检查最新权限，再完成派生副本清理。历史回答已经呈现的内容不会自动从用户记忆或导出文件消失，留存策略需要单独管理。\u003c/p>\n\u003cp>稳定 ID 负责识别同一业务对象，版本负责识别某次内容状态。引用、索引和日志同时携带两者，才能知道答案当时依据哪份资料；仅存文件名会在重命名、覆盖上传和同名文件时失去追溯能力。\u003c/p>", "decision": "\u003cp>定义知识新鲜度口径，例如原始变更到新版本可被检索的延迟，而不是页面显示上传完成的耗时。把生效错误、索引延迟、权限延迟分开监控。业务关键资料更新失败时，可以提示暂不可用或说明适用限制，不能无声地把已失效政策继续当现行规则。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>售后规则调整。\u003c/strong> 新政策在指定日期对新订单生效，历史订单仍适用购买时约定。查询要结合订单时间与渠道匹配规则，而不是只取上传时间最近的 PDF。\u003c/p>\n\u003cp>\u003cstrong>产品版本知识库。\u003c/strong> 同一 API 在不同版本有不同字段，文档版本与软件版本关联；用户查询旧系统问题时仍可得到旧版说明。知识更新的目标是适用，不是把旧内容全部覆盖掉。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>文件更新了，问答仍返回旧内容。\u003c/strong> 沿变更事件、解析、索引切换和回答缓存查状态；分别确认是不是漏触发、构建失败或缓存未失效。\u003c/li>\n\u003cli>\u003cstrong>删除后新对话仍能搜到。\u003c/strong> 检查删除标记、检索过滤、正文读取和缓存；先阻止继续使用，再补清理，不把向量删除当唯一防线。\u003c/li>\n\u003cli>\u003cstrong>一份答案混用了两版规则。\u003c/strong> 查片段版本与发布批次，确认是否半量切换或问题本身跨时期；明确版本后重新组装证据。\u003c/li>\n\u003c/ul>", "questions": [{"id": "12.1", "title": "知识库元数据里哪些字段最值得优先做？", "answer": "\u003cp>“我优先做影响适用性、追溯和访问的字段：稳定对象 ID、内容版本、来源位置、生效范围与访问权限。然后根据场景增加地区、产品版本或订单渠道，而不是先列一个特别大的字段表。\u003c/p>\n\u003cp>比如售后政策，上传时间不能代替生效时间，还可能要结合订单购买时间。文件名也不能代替 ID，否则覆盖上传后就解释不清旧答案依据什么。\u003c/p>\n\u003cp>我会把每个字段对应到实际查询或运维动作，明确谁维护、缺失时怎么处理。元数据有价值的前提是可信且会被执行，界面上展示很多字段但检索不使用，并不能提升答案可靠性。”\u003c/p>"}, {"id": "12.2", "title": "如何设计知识更新，避免新旧内容混用？", "answer": "\u003cp>“我会把更新做成有状态的流水线：发现变更、构建派生数据、校验、切换可见版本，再处理相关缓存。每个文档和片段携带版本，构建没完成时不能只因为原文件更新就宣称同步成功。\u003c/p>\n\u003cp>一种实现是新版本先在独立批次准备好，再切换查询入口，同时补齐构建期间的增量。具体是否保留旧版本取决于业务，问历史政策时就需要它，但不能误当当前版本。\u003c/p>\n\u003cp>验收用新旧答案不同的题检查切换前后结果、引用和更新延迟，还要模拟解析失败和重复变更事件。这样更新才是可验证的过程，不是一个后台刷新按钮。”\u003c/p>"}, {"id": "12.3", "title": "撤销文件权限后，哪些地方需要同步处理？", "answer": "\u003cp>“先保证新的读取和回答不再使用该内容，然后清理或失效相关派生数据。范围包括检索候选、原文预览、缓存、历史追问可能重新读入的内容，以及工具访问路径。\u003c/p>\n\u003cp>索引物理删除可能有延迟，所以权限不能完全依赖删除完成。检索和读取需要可信的当前权限检查，缓存也要带有效访问范围或相应版本策略。重新访问历史引用时仍要校验。\u003c/p>\n\u003cp>我会用撤权前后同账号追问、另一个账号访问、旧链接预览等测试。已经交付或导出的内容无法靠撤权自动收回，这要在留存与共享规则里说明，而不是承诺所有副本立刻消失。”\u003c/p>"}], "search": "元数据与知识更新：如何让答案用对版本和适用范围？\n文字说明“内容是什么”，元数据说明“内容属于谁、何时有效、适用于谁、现在能否使用”。文件 ID、版本、页码、部门、适用地区、生效和失效时间、访问范围，都可能参与判断。上传时间只说明进入系统的时间，不等于业务生效时间。\n\n比如同名制度保留生效时间与版本，回答今年报销规则时，就能区分当前有效标准和旧制度。\n\n**知识更新不是替换一个文件就结束。** 一份原文可能派生解析文本、切块、关键词索引、向量索引、缓存和回答引用。原文变了，派生数据要知道哪些需要重建。可用文件变更事件或定时扫描发现更新，通过版本号或内容摘要识别变化；具体增量粒度取决于系统设计。\n\n一种常见流程是先构建新版本，校验完成后再切换可见版本，避免部分片段已更新、部分还停在旧版。构建期间的新增变更要补齐，旧任务使用哪个快照要有约定。旧版在新制度生效后是否还能用于回答，取决于问题是在问当前规则还是历史记录。\n\n**删除、撤权与物理清理不同。** 数据撤权后应尽快阻断新的未授权访问，不能等待所有向量和缓存清完才生效。可以先标记不可用或在可信读取层检查最新权限，再完成派生副本清理。历史回答已经呈现的内容不会自动从用户记忆或导出文件消失，留存策略需要单独管理。\n\n稳定 ID 负责识别同一业务对象，版本负责识别某次内容状态。引用、索引和日志同时携带两者，才能知道答案当时依据哪份资料；仅存文件名会在重命名、覆盖上传和同名文件时失去追溯能力。\n定义知识新鲜度口径，例如原始变更到新版本可被检索的延迟，而不是页面显示上传完成的耗时。把生效错误、索引延迟、权限延迟分开监控。业务关键资料更新失败时，可以提示暂不可用或说明适用限制，不能无声地把已失效政策继续当现行规则。\n**售后规则调整。** 新政策在指定日期对新订单生效，历史订单仍适用购买时约定。查询要结合订单时间与渠道匹配规则，而不是只取上传时间最近的 PDF。\n\n**产品版本知识库。** 同一 API 在不同版本有不同字段，文档版本与软件版本关联；用户查询旧系统问题时仍可得到旧版说明。知识更新的目标是适用，不是把旧内容全部覆盖掉。\n- **文件更新了，问答仍返回旧内容。** 沿变更事件、解析、索引切换和回答缓存查状态；分别确认是不是漏触发、构建失败或缓存未失效。\n- **删除后新对话仍能搜到。** 检查删除标记、检索过滤、正文读取和缓存；先阻止继续使用，再补清理，不把向量删除当唯一防线。\n- **一份答案混用了两版规则。** 查片段版本与发布批次，确认是否半量切换或问题本身跨时期；明确版本后重新组装证据。\n知识库元数据里哪些字段最值得优先做？ “我优先做影响适用性、追溯和访问的字段：稳定对象 ID、内容版本、来源位置、生效范围与访问权限。然后根据场景增加地区、产品版本或订单渠道，而不是先列一个特别大的字段表。\n比如售后政策，上传时间不能代替生效时间，还可能要结合订单购买时间。文件名也不能代替 ID，否则覆盖上传后就解释不清旧答案依据什么。\n我会把每个字段对应到实际查询或运维动作，明确谁维护、缺失时怎么处理。元数据有价值的前提是可信且会被执行，界面上展示很多字段但检索不使用，并不能提升答案可靠性。”\n如何设计知识更新，避免新旧内容混用？ “我会把更新做成有状态的流水线：发现变更、构建派生数据、校验、切换可见版本，再处理相关缓存。每个文档和片段携带版本，构建没完成时不能只因为原文件更新就宣称同步成功。\n一种实现是新版本先在独立批次准备好，再切换查询入口，同时补齐构建期间的增量。具体是否保留旧版本取决于业务，问历史政策时就需要它，但不能误当当前版本。\n验收用新旧答案不同的题检查切换前后结果、引用和更新延迟，还要模拟解析失败和重复变更事件。这样更新才是可验证的过程，不是一个后台刷新按钮。”\n撤销文件权限后，哪些地方需要同步处理？ “先保证新的读取和回答不再使用该内容，然后清理或失效相关派生数据。范围包括检索候选、原文预览、缓存、历史追问可能重新读入的内容，以及工具访问路径。\n索引物理删除可能有延迟，所以权限不能完全依赖删除完成。检索和读取需要可信的当前权限检查，缓存也要带有效访问范围或相应版本策略。重新访问历史引用时仍要校验。\n我会用撤权前后同账号追问、另一个账号访问、旧链接预览等测试。已经交付或导出的内容无法靠撤权自动收回，这要在留存与共享规则里说明，而不是承诺所有副本立刻消失。”"}, {"id": "k13", "number": "13", "title": "表格计算与完整汇总：什么时候必须换一条处理路径？", "short": "表格计算与完整汇总", "priority": "P0", "group": 1, "intro": "\u003cp>问一个条款、算一张报表、总结全年材料，看起来都能用聊天框输入，背后的证据要求却不同。条款问答只需找齐决定答案的证据；统计要覆盖范围内全部相关记录；完整总结需要先确认材料清单。把它们都变成“取最相似的五段”，会悄悄漏数据。\u003c/p>\n\u003cp>\u003cstrong>数值分析先明确口径，再执行计算。\u003c/strong> 问“本月哪个渠道销售最好”，要说明按支付还是成交、是否扣退款、时间按哪个时区、币种如何换算，以及按金额还是利润。模型可以把问题转成查询，但这些口径需要数据定义和业务确认，不能靠字段名猜。\u003c/p>\n\u003cp>Text-to-SQL 是让模型生成查询的一种路径。可靠流程会提供表结构、指标定义与连接关系，限制可访问数据，检查只读性和查询成本，再执行并核验结果。只允许 SELECT 也不能保证安全和低成本：查询仍可能越权、扫过大范围或因错误连接把金额翻倍。\u003c/p>\n\u003cp>完整汇总则适合先枚举材料，按时间、项目等维度逐组提取事实，再合并去重。中间摘要要保留来源和重要指标，避免摘要的摘要越压越空。需要覆盖的资料有多少、实际处理了多少、哪些失败，应能解释。\u003c/p>", "decision": "\u003cp>把自然语言理解、数据操作和结果叙述分开验收。程序计算正确，不代表口径正确；SQL 执行成功，也不代表回答了用户的问题。验证应包含人工可复算的小样本、空值、退款、重复订单、跨时区边界和一对多连接。分析输出带数据截止时间与口径，便于复查。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>经营分析助手。\u003c/strong> 用户问渠道净销售额，系统先选择已定义的净销售指标，使用受控语义层或查询服务聚合，模型解释变化和提出待验证原因。没有因果证据时，不能把相关性写成投放导致增长。\u003c/p>\n\u003cp>\u003cstrong>季度项目复盘。\u003c/strong> 先列出项目、周报、会议与交付记录，标记缺失材料，逐项目归纳成果和未完成项；同一成果在多份周报出现只算一次。最后保留来源清单，用户能补充遗漏。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>总额翻倍，单条记录看着正常。\u003c/strong> 检查关联表是否一对多导致重复累计，核对聚合前行数和业务主键；不应只让模型重新描述结果。\u003c/li>\n\u003cli>\u003cstrong>排名对，但业务认为结论错。\u003c/strong> 对齐收入、利润、支付额与退款口径，检查时间窗口和币种；这通常是指标定义问题。\u003c/li>\n\u003cli>\u003cstrong>总结文笔很好，却漏掉大项目。\u003c/strong> 检查材料枚举和处理清单，再看分组摘要；检索相关性不能证明材料覆盖完整。\u003c/li>\n\u003c/ul>", "questions": [{"id": "13.1", "title": "如何设计一个可信的自然语言数据分析功能？", "answer": "\u003cp>“我会把它拆成意图与口径确认、受控计算、结果解释三步。模型先理解用户要的指标和维度，不清楚就补问；数据侧用已定义指标、表关系和权限生成或调用查询，执行前检查成本与范围。\u003c/p>\n\u003cp>执行后还要核验主键、总量和关键边界。比如订单与售后明细连接，会不会把一笔订单重复计算；退款究竟按申请还是到账扣除，这些都影响答案。模型最后基于真实结果说明结论与口径。\u003c/p>\n\u003cp>验收不仅比 SQL 能不能跑，还要和人工可复算样本对照。系统应能解释数字从哪来，而不是给一个看起来精确的小数就让用户信任。”\u003c/p>"}, {"id": "13.2", "title": "全文总结为什么不能直接沿用普通 RAG 的 Top K？", "answer": "\u003cp>“普通 RAG 主要按问题找相关证据，Top K 的目标不是保证覆盖全部材料。年度总结如果只检索最相似的几段，很可能重复命中热门项目，漏掉没有相似关键词的重要成果。\u003c/p>\n\u003cp>我会先确定时间、项目和文件清单，再按项目或月份处理，提取有来源的事实，最后合并去重。中间摘要保留关键数字和来源，处理失败的文件明确提示，不把缺口当成没有发生。\u003c/p>\n\u003cp>评测除了事实正确，还检查关键事项覆盖、重复成果和材料处理比例。长上下文可以承接较大材料组，但仍要确认范围，不能只因为装得下就默认总结完整。”\u003c/p>"}, {"id": "13.3", "title": "模型生成的 SQL 通过校验却算错，你怎么查？", "answer": "\u003cp>“先区分校验范围。语法正确、只读和有权限，只能说明查询可以被允许执行，不能证明业务口径正确。我会检查过滤时间、状态、币种、空值处理和表连接基数。\u003c/p>\n\u003cp>拿一小组订单逐条复算，比较连接前后行数和金额，很容易发现一对多导致重复累计。再检查是否把退款申请当成功退款，或把订单创建时间当支付时间。定位后修指标定义或查询模板，而不是只改输出文案。\u003c/p>\n\u003cp>对于高频指标，我更倾向使用受控语义层与已验证查询，减少模型自由拼接。开放分析仍可保留，但要把口径与查询过程暴露给有权限的使用者核对。”\u003c/p>"}], "search": "表格计算与完整汇总：什么时候必须换一条处理路径？\n问一个条款、算一张报表、总结全年材料，看起来都能用聊天框输入，背后的证据要求却不同。条款问答只需找齐决定答案的证据；统计要覆盖范围内全部相关记录；完整总结需要先确认材料清单。把它们都变成“取最相似的五段”，会悄悄漏数据。\n\n**数值分析先明确口径，再执行计算。** 问“本月哪个渠道销售最好”，要说明按支付还是成交、是否扣退款、时间按哪个时区、币种如何换算，以及按金额还是利润。模型可以把问题转成查询，但这些口径需要数据定义和业务确认，不能靠字段名猜。\n\nText-to-SQL 是让模型生成查询的一种路径。可靠流程会提供表结构、指标定义与连接关系，限制可访问数据，检查只读性和查询成本，再执行并核验结果。只允许 SELECT 也不能保证安全和低成本：查询仍可能越权、扫过大范围或因错误连接把金额翻倍。\n\n完整汇总则适合先枚举材料，按时间、项目等维度逐组提取事实，再合并去重。中间摘要要保留来源和重要指标，避免摘要的摘要越压越空。需要覆盖的资料有多少、实际处理了多少、哪些失败，应能解释。\n把自然语言理解、数据操作和结果叙述分开验收。程序计算正确，不代表口径正确；SQL 执行成功，也不代表回答了用户的问题。验证应包含人工可复算的小样本、空值、退款、重复订单、跨时区边界和一对多连接。分析输出带数据截止时间与口径，便于复查。\n**经营分析助手。** 用户问渠道净销售额，系统先选择已定义的净销售指标，使用受控语义层或查询服务聚合，模型解释变化和提出待验证原因。没有因果证据时，不能把相关性写成投放导致增长。\n\n**季度项目复盘。** 先列出项目、周报、会议与交付记录，标记缺失材料，逐项目归纳成果和未完成项；同一成果在多份周报出现只算一次。最后保留来源清单，用户能补充遗漏。\n- **总额翻倍，单条记录看着正常。** 检查关联表是否一对多导致重复累计，核对聚合前行数和业务主键；不应只让模型重新描述结果。\n- **排名对，但业务认为结论错。** 对齐收入、利润、支付额与退款口径，检查时间窗口和币种；这通常是指标定义问题。\n- **总结文笔很好，却漏掉大项目。** 检查材料枚举和处理清单，再看分组摘要；检索相关性不能证明材料覆盖完整。\n如何设计一个可信的自然语言数据分析功能？ “我会把它拆成意图与口径确认、受控计算、结果解释三步。模型先理解用户要的指标和维度，不清楚就补问；数据侧用已定义指标、表关系和权限生成或调用查询，执行前检查成本与范围。\n执行后还要核验主键、总量和关键边界。比如订单与售后明细连接，会不会把一笔订单重复计算；退款究竟按申请还是到账扣除，这些都影响答案。模型最后基于真实结果说明结论与口径。\n验收不仅比 SQL 能不能跑，还要和人工可复算样本对照。系统应能解释数字从哪来，而不是给一个看起来精确的小数就让用户信任。”\n全文总结为什么不能直接沿用普通 RAG 的 Top K？ “普通 RAG 主要按问题找相关证据，Top K 的目标不是保证覆盖全部材料。年度总结如果只检索最相似的几段，很可能重复命中热门项目，漏掉没有相似关键词的重要成果。\n我会先确定时间、项目和文件清单，再按项目或月份处理，提取有来源的事实，最后合并去重。中间摘要保留关键数字和来源，处理失败的文件明确提示，不把缺口当成没有发生。\n评测除了事实正确，还检查关键事项覆盖、重复成果和材料处理比例。长上下文可以承接较大材料组，但仍要确认范围，不能只因为装得下就默认总结完整。”\n模型生成的 SQL 通过校验却算错，你怎么查？ “先区分校验范围。语法正确、只读和有权限，只能说明查询可以被允许执行，不能证明业务口径正确。我会检查过滤时间、状态、币种、空值处理和表连接基数。\n拿一小组订单逐条复算，比较连接前后行数和金额，很容易发现一对多导致重复累计。再检查是否把退款申请当成功退款，或把订单创建时间当支付时间。定位后修指标定义或查询模板，而不是只改输出文案。\n对于高频指标，我更倾向使用受控语义层与已验证查询，减少模型自由拼接。开放分析仍可保留，但要把口径与查询过程暴露给有权限的使用者核对。”"}, {"id": "k14", "number": "14", "title": "Agent 执行循环：下一步由谁决定，什么时候该停？", "short": "Agent 执行循环", "priority": "P0", "group": 2, "intro": "\u003cp>Agent 在不同产品里的命名不完全一致。这里关注一种具体机制：模型根据目标、当前状态和环境反馈，决定下一步行动；应用执行后把真实结果交回，再继续判断。核心是反馈循环，不是头像、聊天框或“自主”两个字。\u003c/p>\n\u003cp>比如查完资料后发现证据不足，系统可以继续检索；拿到工具返回后，再判断任务是否已完成。\u003c/p>\n\u003cp>典型一轮可以是：读取当前目标与状态 → 选择工具和参数 → 系统检查并执行 → 接收结果 → 更新状态 → 继续或结束。工具可能查资料、运行代码、读取业务数据，也可能请求用户补充条件。执行失败要成为新的观察，不能只让模型忽略失败继续写完成总结。\u003c/p>\n\u003cp>ReAct 强调判断、行动与观察交替进行；先规划后执行则先形成任务分解，再依结果调整。前者灵活，但可能绕路；后者便于追踪，却可能因早期计划假设错误而失效。真实系统可以混用，计划是一份可修订的执行依据，不是必须照做的剧本。\u003c/p>\n\u003cp>\u003cstrong>任务越长，可靠性越需要工程补足。\u003c/strong> 一个教学简化：假定十个必要步骤相互独立、各自成功概率都是 95%，全部成功约为 0.95 的十次方，即 60%。真实错误不独立，也会重试恢复，但这个例子说明不能只拿单步准确率代表完整任务能力。\u003c/p>\n\u003cp>因此要定义允许工具、目标范围、轮次、时间、Token 或费用预算，以及成功、失败、需人工处理的停止条件。框架可以组织循环，业务系统仍要负责可信状态与副作用控制。\u003c/p>", "decision": "\u003cp>先找任务中真正不确定的步骤。若所有动作都可以由固定条件决定，工作流可能更合适；只在需要探索或动态分解的部分使用 Agent。验收以任务最终结果为单位，同时检查成功是否依赖额外人工，以及是否超预算。展示动作、证据和结果即可，不需要把不可验证的长思考文本当成执行证明。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>研发问题定位助手。\u003c/strong> 先读报错与相关文件，再运行受控测试，依据失败定位继续查看；修改后验证目标问题和相关行为。完成标准是修改符合要求且检查通过，不是生成了补丁。\u003c/p>\n\u003cp>\u003cstrong>客服处理助手。\u003c/strong> 根据用户描述查询订单、政策和物流，判断需要补问、解释还是发起允许的售后操作。查到订单并不代表退款已完成，最后要核验真实业务状态。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>一直搜，却不结束。\u003c/strong> 检查是否缺完成标准、反复使用同一查询或证据无法满足；识别无进展动作，达到预算后返回缺口和可继续路径。\u003c/li>\n\u003cli>\u003cstrong>接口失败，模型仍说成功。\u003c/strong> 工具结果要结构化区分受理、完成和失败，最终答复从可信任务状态生成或核验。\u003c/li>\n\u003cli>\u003cstrong>计划很完整，执行偏离目标。\u003c/strong> 保存当前目标和用户变更；每轮检查动作是否仍服务目标，旧计划依赖失效后重新规划。\u003c/li>\n\u003c/ul>", "questions": [{"id": "14.1", "title": "一个 Agent 的最小执行闭环包括什么？", "answer": "\u003cp>“至少要有目标、当前状态、可调用工具、执行反馈和停止判断。模型负责在这些信息下选动作，应用负责校验与执行，结果再进入下一轮状态。只有一次模型输出加几个接口名称，不等于闭环已经可靠。\u003c/p>\n\u003cp>以客服处理为例，查订单后可能发现需要补充信息，也可能有资格申请退款；提交申请后还要核对系统到底是受理还是完成。每一步都必须基于真实返回继续判断。\u003c/p>\n\u003cp>我会先限制任务范围和预算，定义什么状态算成功、什么情况应停止或交给人。最重要的是让循环能收敛到可核验结果，而不是无限尝试。”\u003c/p>"}, {"id": "14.2", "title": "怎样控制 Agent 的死循环与无效工具调用？", "answer": "\u003cp>“我会同时控制动作范围和进展。只给当前任务需要的工具，明确参数和错误类型；记录已执行动作及结果，识别同样条件下重复搜索或重复失败。再设置最大轮次、耗时和费用预算作为硬上限。\u003c/p>\n\u003cp>权限不足、参数明确非法、业务拒绝，不该按临时网络错误一遍遍重试。证据不够时可以换有效策略或补问，但必须说明新动作预期解决什么缺口。\u003c/p>\n\u003cp>停止后保留已完成产物和原因，让用户知道能从哪里继续。评测会加入空结果、持续超时和互相冲突的反馈，检查系统是否会及时退出，而不仅测理想成功路径。”\u003c/p>"}, {"id": "14.3", "title": "单步正确率很高，为什么完整任务成功率仍低？", "answer": "\u003cp>“因为任务需要多个步骤同时成立，前面的错误还会影响后面的判断。一个工具参数错了，可能导致后续检索、报告和保存都建立在错误对象上。单步平均值也可能掩盖某个特别关键的薄弱环节。\u003c/p>\n\u003cp>我会按完整任务统计成功，再用链路记录找到最常见的失败节点，区分可恢复失败、错误状态传播和终止判断错误。优先修对最终结果影响最大的环节，必要时把稳定部分改成确定性流程，减少不必要的模型决策。\u003c/p>\n\u003cp>重复运行同一类任务也很重要，第一次成功不代表稳定。我要看到端到端结果、人工介入和成本一起改善，才认为 Agent 能力提升了。”\u003c/p>"}], "search": "Agent 执行循环：下一步由谁决定，什么时候该停？\nAgent 在不同产品里的命名不完全一致。这里关注一种具体机制：模型根据目标、当前状态和环境反馈，决定下一步行动；应用执行后把真实结果交回，再继续判断。核心是反馈循环，不是头像、聊天框或“自主”两个字。\n\n比如查完资料后发现证据不足，系统可以继续检索；拿到工具返回后，再判断任务是否已完成。\n\n典型一轮可以是：读取当前目标与状态 → 选择工具和参数 → 系统检查并执行 → 接收结果 → 更新状态 → 继续或结束。工具可能查资料、运行代码、读取业务数据，也可能请求用户补充条件。执行失败要成为新的观察，不能只让模型忽略失败继续写完成总结。\n\nReAct 强调判断、行动与观察交替进行；先规划后执行则先形成任务分解，再依结果调整。前者灵活，但可能绕路；后者便于追踪，却可能因早期计划假设错误而失效。真实系统可以混用，计划是一份可修订的执行依据，不是必须照做的剧本。\n\n**任务越长，可靠性越需要工程补足。** 一个教学简化：假定十个必要步骤相互独立、各自成功概率都是 95%，全部成功约为 0.95 的十次方，即 60%。真实错误不独立，也会重试恢复，但这个例子说明不能只拿单步准确率代表完整任务能力。\n\n因此要定义允许工具、目标范围、轮次、时间、Token 或费用预算，以及成功、失败、需人工处理的停止条件。框架可以组织循环，业务系统仍要负责可信状态与副作用控制。\n先找任务中真正不确定的步骤。若所有动作都可以由固定条件决定，工作流可能更合适；只在需要探索或动态分解的部分使用 Agent。验收以任务最终结果为单位，同时检查成功是否依赖额外人工，以及是否超预算。展示动作、证据和结果即可，不需要把不可验证的长思考文本当成执行证明。\n**研发问题定位助手。** 先读报错与相关文件，再运行受控测试，依据失败定位继续查看；修改后验证目标问题和相关行为。完成标准是修改符合要求且检查通过，不是生成了补丁。\n\n**客服处理助手。** 根据用户描述查询订单、政策和物流，判断需要补问、解释还是发起允许的售后操作。查到订单并不代表退款已完成，最后要核验真实业务状态。\n- **一直搜，却不结束。** 检查是否缺完成标准、反复使用同一查询或证据无法满足；识别无进展动作，达到预算后返回缺口和可继续路径。\n- **接口失败，模型仍说成功。** 工具结果要结构化区分受理、完成和失败，最终答复从可信任务状态生成或核验。\n- **计划很完整，执行偏离目标。** 保存当前目标和用户变更；每轮检查动作是否仍服务目标，旧计划依赖失效后重新规划。\n一个 Agent 的最小执行闭环包括什么？ “至少要有目标、当前状态、可调用工具、执行反馈和停止判断。模型负责在这些信息下选动作，应用负责校验与执行，结果再进入下一轮状态。只有一次模型输出加几个接口名称，不等于闭环已经可靠。\n以客服处理为例，查订单后可能发现需要补充信息，也可能有资格申请退款；提交申请后还要核对系统到底是受理还是完成。每一步都必须基于真实返回继续判断。\n我会先限制任务范围和预算，定义什么状态算成功、什么情况应停止或交给人。最重要的是让循环能收敛到可核验结果，而不是无限尝试。”\n怎样控制 Agent 的死循环与无效工具调用？ “我会同时控制动作范围和进展。只给当前任务需要的工具，明确参数和错误类型；记录已执行动作及结果，识别同样条件下重复搜索或重复失败。再设置最大轮次、耗时和费用预算作为硬上限。\n权限不足、参数明确非法、业务拒绝，不该按临时网络错误一遍遍重试。证据不够时可以换有效策略或补问，但必须说明新动作预期解决什么缺口。\n停止后保留已完成产物和原因，让用户知道能从哪里继续。评测会加入空结果、持续超时和互相冲突的反馈，检查系统是否会及时退出，而不仅测理想成功路径。”\n单步正确率很高，为什么完整任务成功率仍低？ “因为任务需要多个步骤同时成立，前面的错误还会影响后面的判断。一个工具参数错了，可能导致后续检索、报告和保存都建立在错误对象上。单步平均值也可能掩盖某个特别关键的薄弱环节。\n我会按完整任务统计成功，再用链路记录找到最常见的失败节点，区分可恢复失败、错误状态传播和终止判断错误。优先修对最终结果影响最大的环节，必要时把稳定部分改成确定性流程，减少不必要的模型决策。\n重复运行同一类任务也很重要，第一次成功不代表稳定。我要看到端到端结果、人工介入和成本一起改善，才认为 Agent 能力提升了。”"}, {"id": "k15", "number": "15", "title": "工具调用：模型提出动作，系统如何把动作办成？", "short": "工具调用", "priority": "P0", "group": 2, "intro": "\u003cp>工具调用是一段明确的往返：应用提供工具说明与输入约定，模型选择工具并生成参数；应用校验后执行，把结果与调用标识回传；模型根据结果继续行动或回答。模型输出“调用退款工具”只是申请，不代表退款已经发生。\u003c/p>\n\u003cp>工具契约需要说明做什么、什么时候用、输入字段、返回数据和失败类型。工具描述相互重叠、参数只有模糊字符串，会增加模型选择难度。业务常用操作可以封装成边界明确的工具，不必让模型自己拼几十个底层接口。\u003c/p>\n\u003cp>\u003cstrong>执行身份来自系统，不来自模型自报。\u003c/strong> 用户、租户、凭据等由服务端可信上下文绑定。模型可以填写订单号，但不能通过填一个管理员 ID 获得权限。输入符合 Schema 后，仍要检查对象权限、业务状态和当前任务是否允许该动作。\u003c/p>\n\u003cp>返回结果也要设计。查询应包含必要数据、时间和分页信息；写操作要区分已受理、已完成、部分失败与结果未知，并给出可查询标识。一次返回全部订单历史可能占满上下文，适当分页和按需字段可以减少噪声。\u003c/p>\n\u003cp>并行调用只适合相互独立的动作。查询两个互不依赖的数据源可以并行；创建订单与扣款，或先改状态再查询结果，必须考虑依赖和一致性。调用更快不等于流程正确。\u003c/p>", "decision": "\u003cp>把工具选择、参数正确、执行成功、任务完成分开统计。工具成功但选错对象，业务仍失败。写操作需要明确确认与幂等策略；在超时后核对是否已生效，而不是重复发送。工具返回只提供必要业务信息，不把凭据和内部敏感字段交回模型。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>售后处理。\u003c/strong> 先用只读工具取得订单和可退金额，解释方案，满足授权与条件后执行退款申请，再查询结果。部分退款要绑定具体子订单和金额，不能把“订单可退”理解为整单全退。\u003c/p>\n\u003cp>\u003cstrong>工作事项助手。\u003c/strong> 从讨论中提取待办，经人员匹配和用户确认后批量创建任务；返回逐项任务 ID、失败原因及链接。用户重试失败项时不重复创建已成功任务。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>模型总选错相似工具。\u003c/strong> 检查职责重叠、名称和使用条件；缩小可见工具集，加入区别明确的例子，再评估选择准确性。\u003c/li>\n\u003cli>\u003cstrong>参数合法但业务拒绝。\u003c/strong> 检查状态前置条件、对象权限和金额口径；明确业务错误给模型，不把它包装成笼统网络失败。\u003c/li>\n\u003cli>\u003cstrong>并行后数据前后矛盾。\u003c/strong> 检查动作依赖和读取时间；有先后关系的操作串行执行，并使用版本或业务状态约束。\u003c/li>\n\u003c/ul>", "questions": [{"id": "15.1", "title": "Function Calling 的完整过程是什么？", "answer": "\u003cp>“应用先把工具名称、用途和参数 Schema 提供给模型，模型输出工具调用请求；应用拿到请求后做权限、参数和业务校验，再运行真实接口。结果带着对应调用标识返回，模型才能根据它继续回答或发起下一步。\u003c/p>\n\u003cp>所以模型本身通常并不直接操作数据库，执行发生在应用或工具服务。即使返回成功，也要区分接口成功、业务受理和业务完成。\u003c/p>\n\u003cp>产品设计上，我会让调用前后的状态都可追踪，敏感身份由系统绑定，写操作支持必要确认和幂等。最后以业务结果验收，而不是以模型是否生成正确的函数名验收。”\u003c/p>"}, {"id": "15.2", "title": "怎样设计一个模型容易正确使用的工具？", "answer": "\u003cp>“我会把工具设计成清晰的业务能力：用途单一、名称具体、参数含义明确，并说明不适用的情况。比如‘查询退款状态’和‘提交退款申请’分开，避免一个‘处理退款’包含过多隐含动作。\u003c/p>\n\u003cp>输入尽量使用有类型的业务字段，输出包括状态、必要数据和下一步可用标识。错误也要区分参数、权限、业务拒绝和临时异常，让模型知道该补信息还是停止。大量结果支持分页，避免一次返回拖垮上下文。\u003c/p>\n\u003cp>然后用容易混淆的任务测工具选择和参数正确率。好工具不是描述最长，而是人和模型都能明确知道它在什么条件下做什么。”\u003c/p>"}, {"id": "15.3", "title": "如何避免 Agent 重复执行同一笔写操作？", "answer": "\u003cp>“我会把一个业务动作绑定稳定的操作标识，由服务端记录状态，并尽量使用下游支持的幂等机制。同一次重试沿用同一标识；用户发起真正的新操作，才创建新的标识。前端禁用按钮只能减少点击，不能解决网络重试和模型再次调用。\u003c/p>\n\u003cp>如果接口超时，先查操作状态，区分未执行与结果未知。已完成就返回原结果；确认未完成且允许重试才继续。批量操作还要按项记录，避免重试时把成功项重做。\u003c/p>\n\u003cp>如果下游没有幂等和状态查询能力，自动重试必须更谨慎，必要时人工核对。不能承诺靠模型‘记住不要重复’就实现一次执行。”\u003c/p>"}], "search": "工具调用：模型提出动作，系统如何把动作办成？\n工具调用是一段明确的往返：应用提供工具说明与输入约定，模型选择工具并生成参数；应用校验后执行，把结果与调用标识回传；模型根据结果继续行动或回答。模型输出“调用退款工具”只是申请，不代表退款已经发生。\n\n工具契约需要说明做什么、什么时候用、输入字段、返回数据和失败类型。工具描述相互重叠、参数只有模糊字符串，会增加模型选择难度。业务常用操作可以封装成边界明确的工具，不必让模型自己拼几十个底层接口。\n\n**执行身份来自系统，不来自模型自报。** 用户、租户、凭据等由服务端可信上下文绑定。模型可以填写订单号，但不能通过填一个管理员 ID 获得权限。输入符合 Schema 后，仍要检查对象权限、业务状态和当前任务是否允许该动作。\n\n返回结果也要设计。查询应包含必要数据、时间和分页信息；写操作要区分已受理、已完成、部分失败与结果未知，并给出可查询标识。一次返回全部订单历史可能占满上下文，适当分页和按需字段可以减少噪声。\n\n并行调用只适合相互独立的动作。查询两个互不依赖的数据源可以并行；创建订单与扣款，或先改状态再查询结果，必须考虑依赖和一致性。调用更快不等于流程正确。\n把工具选择、参数正确、执行成功、任务完成分开统计。工具成功但选错对象，业务仍失败。写操作需要明确确认与幂等策略；在超时后核对是否已生效，而不是重复发送。工具返回只提供必要业务信息，不把凭据和内部敏感字段交回模型。\n**售后处理。** 先用只读工具取得订单和可退金额，解释方案，满足授权与条件后执行退款申请，再查询结果。部分退款要绑定具体子订单和金额，不能把“订单可退”理解为整单全退。\n\n**工作事项助手。** 从讨论中提取待办，经人员匹配和用户确认后批量创建任务；返回逐项任务 ID、失败原因及链接。用户重试失败项时不重复创建已成功任务。\n- **模型总选错相似工具。** 检查职责重叠、名称和使用条件；缩小可见工具集，加入区别明确的例子，再评估选择准确性。\n- **参数合法但业务拒绝。** 检查状态前置条件、对象权限和金额口径；明确业务错误给模型，不把它包装成笼统网络失败。\n- **并行后数据前后矛盾。** 检查动作依赖和读取时间；有先后关系的操作串行执行，并使用版本或业务状态约束。\nFunction Calling 的完整过程是什么？ “应用先把工具名称、用途和参数 Schema 提供给模型，模型输出工具调用请求；应用拿到请求后做权限、参数和业务校验，再运行真实接口。结果带着对应调用标识返回，模型才能根据它继续回答或发起下一步。\n所以模型本身通常并不直接操作数据库，执行发生在应用或工具服务。即使返回成功，也要区分接口成功、业务受理和业务完成。\n产品设计上，我会让调用前后的状态都可追踪，敏感身份由系统绑定，写操作支持必要确认和幂等。最后以业务结果验收，而不是以模型是否生成正确的函数名验收。”\n怎样设计一个模型容易正确使用的工具？ “我会把工具设计成清晰的业务能力：用途单一、名称具体、参数含义明确，并说明不适用的情况。比如‘查询退款状态’和‘提交退款申请’分开，避免一个‘处理退款’包含过多隐含动作。\n输入尽量使用有类型的业务字段，输出包括状态、必要数据和下一步可用标识。错误也要区分参数、权限、业务拒绝和临时异常，让模型知道该补信息还是停止。大量结果支持分页，避免一次返回拖垮上下文。\n然后用容易混淆的任务测工具选择和参数正确率。好工具不是描述最长，而是人和模型都能明确知道它在什么条件下做什么。”\n如何避免 Agent 重复执行同一笔写操作？ “我会把一个业务动作绑定稳定的操作标识，由服务端记录状态，并尽量使用下游支持的幂等机制。同一次重试沿用同一标识；用户发起真正的新操作，才创建新的标识。前端禁用按钮只能减少点击，不能解决网络重试和模型再次调用。\n如果接口超时，先查操作状态，区分未执行与结果未知。已完成就返回原结果；确认未完成且允许重试才继续。批量操作还要按项记录，避免重试时把成功项重做。\n如果下游没有幂等和状态查询能力，自动重试必须更谨慎，必要时人工核对。不能承诺靠模型‘记住不要重复’就实现一次执行。”"}, {"id": "k16", "number": "16", "title": "Workflow：把确定的流程固定下来，把变化留给模型", "short": "Workflow", "priority": "P0", "group": 2, "intro": "\u003cp>工作流把任务表达成节点、依赖和流转规则。节点可以调用模型、查数据库、运行代码、等待人工审批，也可以只是判断条件。模型节点仍有不确定性，但节点之间什么时候执行、传什么数据，可以由程序明确控制。\u003c/p>\n\u003cp>比如固定审批链按预先规定的流程走；只有确实需要根据检索或工具结果动态选下一步的环节，才交给 Agent 判断。\u003c/p>\n\u003cp>DAG 是有向无环图，适合有清晰依赖且不回到前面节点的任务。分支决定走哪条路径，并行让独立步骤同时处理；需要反复检查、重试或等待用户时，还可能使用循环和状态机。画布能表达哪些结构，要看实际执行引擎，不能只看有没有连线。\u003c/p>\n\u003cp>\u003cstrong>节点之间真正传的是数据契约。\u003c/strong> 上游输出订单 ID，下游需要的是订单对象或金额时，必须有明确映射和类型。可视化只把线连上，不代表字段、空值和失败语义正确。发布前可以检查缺参数、类型不匹配、不可达节点与没有终止条件的路径。\u003c/p>\n\u003cp>可靠执行还要持久化检查点：记录已完成节点、关键输入、产物和流程版本。恢复时重新校验权限和外部状态，不能假设暂停前的库存或授权仍有效。任务恢复也不等于所有节点绝不重放；外部写操作仍要幂等保护。\u003c/p>", "decision": "\u003cp>固定规则的审批和数据处理优先确定性流程；资料查找或异常诊断可以在局部嵌入 Agent。把“如何执行”和“如何配置”分开看：拖拽方便不代表运行可靠。评估首次发布成功率、异常定位时间与恢复成功率，同时核对业务结果。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>合同审批。\u003c/strong> 固定读取、提取、规则检查、人工审阅、归档链路；模型辅助识别条款，金额阈值与审批路线由规则决定。缺材料进入等待，不直接绕过审批。\u003c/p>\n\u003cp>\u003cstrong>文档接入。\u003c/strong> 上传后按类型解析，成功后建索引，部分页失败进入补处理；索引校验通过再切换版本。处理状态和产物可从失败节点恢复，不让整批文件重跑。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>单节点能跑，连起来失败。\u003c/strong> 对比节点输入输出类型、变量作用域和空值，检查上游是否返回了业务错误而非预期对象。\u003c/li>\n\u003cli>\u003cstrong>恢复后把审批或发布又做一次。\u003c/strong> 检查检查点时机与外部副作用记录；持久化流程状态不能替代业务幂等。\u003c/li>\n\u003cli>\u003cstrong>等待用户时流程版本变了。\u003c/strong> 明确任务固定旧版本还是迁移，并验证状态兼容；权限仍按当前规则校验，不能随旧版本冻结。\u003c/li>\n\u003c/ul>", "questions": [{"id": "16.1", "title": "Workflow 和 Agent 怎么组合更合理？", "answer": "\u003cp>“我会先把稳定的业务规则和真正需要动态判断的部分拆开。合同审批的身份、阈值、审批节点和归档规则适合工作流；查找缺失附件或分析条款冲突，可以由 Agent 在限定范围内探索。\u003c/p>\n\u003cp>这样做的原因是，固定环节不需要每次让模型重新决定；动态环节又能根据反馈调整。两者不是非此即彼，也不能仅从产品叫不叫 Agent 判断实现。\u003c/p>\n\u003cp>我会用纯工作流或单次模型调用做基线，只有动态决策确实提升任务表现时才扩大。控制边界越清楚，失败越容易定位，成本和恢复也更可控。”\u003c/p>"}, {"id": "16.2", "title": "低代码编排平台，除了画布还必须解决什么？", "answer": "\u003cp>“最核心的是数据契约、执行语义和调试。用户要知道字段来自哪里、下游期待什么、空值和失败走哪条路；并行、循环、重试和人工等待也需要明确规则。\u003c/p>\n\u003cp>发布前做类型和路径检查，运行时展示节点输入输出、错误和产物，提供受控测试环境。涉及外部写操作，要说明测试是否真的会执行，不能让用户点‘调试’就发出正式通知。\u003c/p>\n\u003cp>衡量平台是否好用，我会看用户首次成功运行时间、独立排错比例和恢复成本，而不只看拖拽体验。画布解决配置表达，执行引擎才决定流程能否可靠交付。”\u003c/p>"}, {"id": "16.3", "title": "流程中途失败后，怎样从失败处继续？", "answer": "\u003cp>“先保存可恢复的状态与产物，记录节点版本和外部操作回执。恢复时判断哪些结果仍有效、哪些需要重新检查。比如文档已解析成功可以复用；发布超时则先查是否已经发布，不能直接重发。\u003c/p>\n\u003cp>检查点不一定覆盖每一条外部动作，所以可重放节点中的写操作仍需幂等。等待期间权限、价格或库存变化，也要在继续前核验。\u003c/p>\n\u003cp>用户应看到已完成部分和当前阻塞点，选择补信息、重试或停止。验证会模拟执行成功但保存检查点前断线的情况，检查最终结果是否重复，而不仅测试节点报错后的正常重试。”\u003c/p>"}], "search": "Workflow：把确定的流程固定下来，把变化留给模型\n工作流把任务表达成节点、依赖和流转规则。节点可以调用模型、查数据库、运行代码、等待人工审批，也可以只是判断条件。模型节点仍有不确定性，但节点之间什么时候执行、传什么数据，可以由程序明确控制。\n\n比如固定审批链按预先规定的流程走；只有确实需要根据检索或工具结果动态选下一步的环节，才交给 Agent 判断。\n\nDAG 是有向无环图，适合有清晰依赖且不回到前面节点的任务。分支决定走哪条路径，并行让独立步骤同时处理；需要反复检查、重试或等待用户时，还可能使用循环和状态机。画布能表达哪些结构，要看实际执行引擎，不能只看有没有连线。\n\n**节点之间真正传的是数据契约。** 上游输出订单 ID，下游需要的是订单对象或金额时，必须有明确映射和类型。可视化只把线连上，不代表字段、空值和失败语义正确。发布前可以检查缺参数、类型不匹配、不可达节点与没有终止条件的路径。\n\n可靠执行还要持久化检查点：记录已完成节点、关键输入、产物和流程版本。恢复时重新校验权限和外部状态，不能假设暂停前的库存或授权仍有效。任务恢复也不等于所有节点绝不重放；外部写操作仍要幂等保护。\n固定规则的审批和数据处理优先确定性流程；资料查找或异常诊断可以在局部嵌入 Agent。把“如何执行”和“如何配置”分开看：拖拽方便不代表运行可靠。评估首次发布成功率、异常定位时间与恢复成功率，同时核对业务结果。\n**合同审批。** 固定读取、提取、规则检查、人工审阅、归档链路；模型辅助识别条款，金额阈值与审批路线由规则决定。缺材料进入等待，不直接绕过审批。\n\n**文档接入。** 上传后按类型解析，成功后建索引，部分页失败进入补处理；索引校验通过再切换版本。处理状态和产物可从失败节点恢复，不让整批文件重跑。\n- **单节点能跑，连起来失败。** 对比节点输入输出类型、变量作用域和空值，检查上游是否返回了业务错误而非预期对象。\n- **恢复后把审批或发布又做一次。** 检查检查点时机与外部副作用记录；持久化流程状态不能替代业务幂等。\n- **等待用户时流程版本变了。** 明确任务固定旧版本还是迁移，并验证状态兼容；权限仍按当前规则校验，不能随旧版本冻结。\nWorkflow 和 Agent 怎么组合更合理？ “我会先把稳定的业务规则和真正需要动态判断的部分拆开。合同审批的身份、阈值、审批节点和归档规则适合工作流；查找缺失附件或分析条款冲突，可以由 Agent 在限定范围内探索。\n这样做的原因是，固定环节不需要每次让模型重新决定；动态环节又能根据反馈调整。两者不是非此即彼，也不能仅从产品叫不叫 Agent 判断实现。\n我会用纯工作流或单次模型调用做基线，只有动态决策确实提升任务表现时才扩大。控制边界越清楚，失败越容易定位，成本和恢复也更可控。”\n低代码编排平台，除了画布还必须解决什么？ “最核心的是数据契约、执行语义和调试。用户要知道字段来自哪里、下游期待什么、空值和失败走哪条路；并行、循环、重试和人工等待也需要明确规则。\n发布前做类型和路径检查，运行时展示节点输入输出、错误和产物，提供受控测试环境。涉及外部写操作，要说明测试是否真的会执行，不能让用户点‘调试’就发出正式通知。\n衡量平台是否好用，我会看用户首次成功运行时间、独立排错比例和恢复成本，而不只看拖拽体验。画布解决配置表达，执行引擎才决定流程能否可靠交付。”\n流程中途失败后，怎样从失败处继续？ “先保存可恢复的状态与产物，记录节点版本和外部操作回执。恢复时判断哪些结果仍有效、哪些需要重新检查。比如文档已解析成功可以复用；发布超时则先查是否已经发布，不能直接重发。\n检查点不一定覆盖每一条外部动作，所以可重放节点中的写操作仍需幂等。等待期间权限、价格或库存变化，也要在继续前核验。\n用户应看到已完成部分和当前阻塞点，选择补信息、重试或停止。验证会模拟执行成功但保存检查点前断线的情况，检查最终结果是否重复，而不仅测试节点报错后的正常重试。”"}, {"id": "k17", "number": "17", "title": "MCP：统一的到底是接入协议，还是业务能力？", "short": "MCP", "priority": "P0", "group": 2, "intro": "\u003cp>MCP，即 Model Context Protocol，为 AI 应用与外部工具和上下文来源提供通用交互协议。价值是减少不同应用接入同一能力时重复适配；它没有规定模型如何思考，也没有自动替你实现企业业务逻辑。\u003c/p>\n\u003cp>比如通过统一协议发现和调用文件查询能力，但仍需单独做账号授权与权限检查。\u003c/p>\n\u003cp>三个角色要分清：Host 是承载用户交互、模型和策略的 AI 应用；Client 是 Host 内连接某个 Server 的组件；Server 暴露工具、资源或提示模板，并可能继续调用企业原有 API。一个 Host 可以连接多个 Server，每条连接有对应的 Client 管理。\u003c/p>\n\u003cp>\u003cstrong>Tools、Resources、Prompts 是三类能力。\u003c/strong> Tools 是可调用动作，例如查询工单；Resources 是可读取的上下文，例如资源内容或数据描述；Prompts 是可复用的交互模板。服务可以只提供其中部分能力，客户端也未必支持所有功能，不能因为两端都标注 MCP 就认为完全兼容。\u003c/p>\n\u003cp>协议层使用 JSON-RPC 等消息约定。常见连接方式包括本地进程的 stdio 和远程 Streamable HTTP；远程传输可以使用流式能力，但不能把旧教程里的某种 HTTP／SSE 连接流程当成所有版本的固定做法。服务发现、版本声明和可选能力，应按双方支持的规范检查。\u003c/p>\n\u003cp>\u003cstrong>版本确实会改变接入方式。\u003c/strong> 本次核对的官方架构文档已描述 2026-07-28 版本的无状态请求与 \u003ccode>server/discover\u003c/code> 发现机制。维护采用较早协议的 SDK 时，不能直接混用新版发现流程；实现时应固定兼容版本，并依据对应规范迁移。背住某一版初始化步骤，不等于理解了 MCP。\u003c/p>", "decision": "\u003cp>把 MCP、模型工具调用和业务 API 放在不同层看：模型提出工具调用，Host 决定是否执行，通过 Client 调 Server，Server 再办理业务。授权、对象权限、幂等和审计仍需设计。采用它的理由应是多应用复用、生态接入与维护收益，而不是“接上就自动成为万能 Agent”。\u003c/p>", "scenarios": "\u003cp>\u003cstrong>企业工具中心。\u003c/strong> 将工单查询、文档读取等能力包装成受控服务，多种 AI 客户端按协议使用。目录记录提供者、权限、Schema、版本和可用状态；撤销连接后新调用不能继续使用旧授权。\u003c/p>\n\u003cp>\u003cstrong>开发工作台接入。\u003c/strong> AI 应用通过受支持的 MCP 服务读取项目文档与错误追踪信息，按任务选工具。Server 返回的数据仍是外部内容，不能借描述文字升级成 Host 的系统指令。\u003c/p>", "troubleshooting": "\u003cul>\n\u003cli>\u003cstrong>两边都支持 MCP，却连接不上。\u003c/strong> 分别核对协议版本、传输方式、认证和能力支持；不要把连接失败统一当成模型问题。\u003c/li>\n\u003cli>\u003cstrong>工具列表能看到，调用却失败。\u003c/strong> 发现能力不等于拥有业务权限，检查凭据范围、对象权限、参数与后端业务状态。\u003c/li>\n\u003cli>\u003cstrong>接入越多，模型越容易选错。\u003c/strong> 按任务加载相关工具，规范命名与描述，记录版本变更；协议标准化没有消除上下文拥挤和选择歧义。\u003c/li>\n\u003c/ul>", "questions": [{"id": "17.1", "title": "MCP、API 和 Function Calling 怎么配合？", "answer": "\u003cp>“API 是业务服务提供能力的接口；Function Calling 是模型生成工具调用意图和参数的方式；MCP 统一 AI 应用与外部工具、资源交互的协议。它们可以在一次任务里连续出现。\u003c/p>\n\u003cp>例如模型选择查询工单，Host 校验后通过 MCP Client 调 Server，Server 再调用工单 API，结果逐层返回。MCP 可以减少各客户端单独适配的成本，但不会替代工单系统的权限与业务校验。\u003c/p>\n\u003cp>因此我会先看是否有跨应用复用需求和成熟服务，再决定是否采用。单一应用接一个稳定接口，直接集成也可能更简单，不能把协议当业务能力本身。”\u003c/p>"}, {"id": "17.2", "title": "设计 MCP 工具中心，需要管理哪些内容？", "answer": "\u003cp>“我会同时管理接入兼容性和业务可用性。接入侧记录协议版本、传输、能力声明与认证方式；工具侧记录用途、参数、权限、提供者、版本、调用表现和失败类型。\u003c/p>\n\u003cp>发布工具前要验证描述与实际行为一致，工具变更会影响哪些 Agent，旧调用能否继续使用。运行时由 Host 和后端执行权限边界，不能让 Server 的描述自己获得更高信任。\u003c/p>\n\u003cp>对用户则说明连接后能读什么、做什么以及如何撤销。评价中心不只看工具数量，还看接入耗时、正确调用率和维护成本。目录丰富但模型选不对，仍然不能算平台能力成熟。”\u003c/p>"}, {"id": "17.3", "title": "接入 MCP 服务后，最容易忽略什么？", "answer": "\u003cp>“容易把协议连通误认为业务已经可信。工具发现成功，不代表当前账号有权限；参数符合 Schema，不代表订单状态允许操作；服务端返回文字，也不能作为新的系统指令。\u003c/p>\n\u003cp>我会分别检查版本与传输兼容、凭据隔离、对象权限、结果语义和工具变更。协议版本还会演进，客户端应固定受支持组合，不能直接照旧教程拼接新规范。\u003c/p>\n\u003cp>出现问题时沿 Host、Client、Server 和业务 API 分层定位；涉及写操作仍保留确认与幂等。MCP 帮我们统一接入方式，可靠执行还取决于完整业务契约。”\u003c/p>"}], "search": "MCP：统一的到底是接入协议，还是业务能力？\nMCP，即 Model Context Protocol，为 AI 应用与外部工具和上下文来源提供通用交互协议。价值是减少不同应用接入同一能力时重复适配；它没有规定模型如何思考，也没有自动替你实现企业业务逻辑。\n\n比如通过统一协议发现和调用文件查询能力，但仍需单独做账号授权与权限检查。\n\n三个角色要分清：Host 是承载用户交互、模型和策略的 AI 应用；Client 是 Host 内连接某个 Server 的组件；Server 暴露工具、资源或提示模板，并可能继续调用企业原有 API。一个 Host 可以连接多个 Server，每条连接有对应的 Client 管理。\n\n**Tools、Resources、Prompts 是三类能力。** Tools 是可调用动作，例如查询工单；Resources 是可读取的上下文，例如资源内容或数据描述；Prompts 是可复用的交互模板。服务可以只提供其中部分能力，客户端也未必支持所有功能，不能因为两端都标注 MCP 就认为完全兼容。\n\n协议层使用 JSON-RPC 等消息约定。常见连接方式包括本地进程的 stdio 和远程 Streamable HTTP；远程传输可以使用流式能力，但不能把旧教程里的某种 HTTP／SSE 连接流程当成所有版本的固定做法。服务发现、版本声明和可选能力，应按双方支持的规范检查。\n\n**版本确实会改变接入方式。** 本次核对的官方架构文档已描述 2026-07-28 版本的无状态请求与 `server/discover` 发现机制。维护采用较早协议的 SDK 时，不能直接混用新版发现流程；实现时应固定兼容版本，并依据对应规范迁移。背住某一版初始化步骤，不等于理解了 MCP。\n把 MCP、模型工具调用和业务 API 放在不同层看：模型提出工具调用，Host 决定是否执行，通过 Cl
