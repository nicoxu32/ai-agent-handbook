<script>
'use strict';
const STATIC_SITE = __STATIC_SITE__;
const DATA = JSON.parse(document.getElementById('handbook-data').textContent);
const main = document.getElementById('main');
const searchInput = document.getElementById('search');
const sidebar = document.getElementById('sidebar');
const storageKey = 'nico-agent-handbook-v1';
const icons = {
  arrow: '<path d="M5 12h14m-5-5 5 5-5 5"/>',
  model: '<circle cx="12" cy="12" r="4"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3M5 19l3-3m8-8 3-3"/>',
  book: '<path d="M12 5v15M3 4c4-1 7 0 9 2 2-2 5-3 9-2v15c-4-1-7 0-9 2-2-2-5-3-9-2Z"/>',
  agent: '<rect x="3" y="7" width="18" height="14" rx="3"/><path d="M12 7V3m-3 0h6M7 13h2m6 0h2M8 17h8"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/>',
  platform: '<path d="m12 2 9 5-9 5-9-5Zm-9 10 9 5 9-5M3 17l9 5 9-5"/>',
  product: '<path d="M4 20V10m8 10V4m8 16v-7M2 20h20"/>',
  bookmark: '<path d="M6 3h12v18l-6-4-6 4Z"/>',
  check: '<path d="m5 12 4 4L19 6"/>',
  copy: '<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',
  shuffle: '<path d="M3 5h3l12 14h3M3 19h3l4-5m4-4 4-5h3m-3-3 3 3-3 3m0 8 3 3-3 3"/>'
};
const icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || icons.book}</svg>`;
const escapeHTML = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain = html => { const el = document.createElement('div'); el.innerHTML = html; return el.textContent.trim(); };
let saved = {};
let storageAvailable = true;
try { saved = JSON.parse(localStorage.getItem(storageKey) || '{}') || {}; } catch { storageAvailable = false; }
if (typeof saved !== 'object' || Array.isArray(saved)) saved = {};
const validIds = new Set(DATA.chapters.map(c => c.id));
const validList = value => Array.isArray(value) ? value.filter(id => validIds.has(id)) : [];
const state = { done: new Set(validList(saved.done)), bookmarks: new Set(validList(saved.bookmarks)), last: validIds.has(saved.last) ? saved.last : 'k01', filter: 'all', practiceGroup: 'all', practiceIndex: 0, readingSize: Number.isInteger(saved.readingSize) && saved.readingSize >= 90 && saved.readingSize <= 150 && saved.readingSize % 10 === 0 ? saved.readingSize : 100 };
const questionTypes = {scenario: '场景设计', diagnosis: '问题排查', tradeoff: '方案取舍'};
const generatedHistory = {};
for (const chapter of DATA.chapters) {
  const entries = saved.generatedHistory?.[chapter.id];
  generatedHistory[chapter.id] = Array.isArray(entries) ? entries.filter(q =>
    q && q.chapterId === chapter.id && typeof q.id === 'string' &&
    typeof q.question === 'string' && typeof q.answer === 'string' &&
    Object.hasOwn(questionTypes, q.type) && Array.isArray(q.followups) &&
    q.followups.every(item => typeof item === 'string')
  ).slice(-10) : [];
}
let service = {loading: true, configured: false, token: '', message: ''};
let generation = null;
let challengeType = 'scenario';
const generationErrors = {};
const selectedQuestions = {};
let answerVisible = false;
const allQuestions = DATA.chapters.flatMap(c => c.questions.map(q => ({ ...q, chapter: c })));
const groupCopy = ['理解模型的能力，也理解它的边界。','让模型找到资料，并用对证据。','把一个目标，变成可核验的行动。','连接语音、图像和真实业务系统。','让任务稳定运行，让结果值得信任。','从业务场景出发，衡量真正的价值。'];
const groupIcons = ['model','book','agent','image','platform','product'];
let toastTimer;
let activeRoute = 'home';
function notify(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, 2400); }
function persist() {
  try { localStorage.setItem(storageKey, JSON.stringify({done:[...state.done],bookmarks:[...state.bookmarks],last:state.last,generatedHistory,readingSize:state.readingSize})); }
  catch { storageAvailable = false; }
}

function applyReadingSize() {
  main.style.setProperty('--reading-scale', state.readingSize / 100);
  document.getElementById('reading-smaller').disabled = state.readingSize === 90;
  document.getElementById('reading-larger').disabled = state.readingSize === 150;
  document.getElementById('reading-reset').title = `当前字号 ${state.readingSize}%，点击恢复正常`;
  document.getElementById('reading-reset').setAttribute('aria-label', `恢复正常字号，当前 ${state.readingSize}%`);
}
function changeReadingSize(size) {
  state.readingSize = Math.min(150, Math.max(90, size));
  applyReadingSize();
  persist();
  notify(`正文字号：${state.readingSize}%${state.readingSize === 100 ? '（正常）' : ''}`);
}
document.getElementById('reading-smaller').addEventListener('click', () => changeReadingSize(state.readingSize - 10));
document.getElementById('reading-reset').addEventListener('click', () => changeReadingSize(100));
document.getElementById('reading-larger').addEventListener('click', () => changeReadingSize(state.readingSize + 10));
applyReadingSize();

function setMenu(open) {
  sidebar.classList.toggle('open', open);
  document.getElementById('overlay').hidden = !open;
  document.getElementById('menu-button').setAttribute('aria-expanded', String(open));
  document.body.style.overflow = open ? 'hidden' : '';
  sidebar.inert = !open && innerWidth <= 760;
  document.querySelector('.workspace').inert = open;
  if (open) { sidebar.setAttribute('role','dialog'); sidebar.setAttribute('aria-modal','true'); document.getElementById('close-menu').focus(); }
  else { sidebar.removeAttribute('role'); sidebar.removeAttribute('aria-modal'); }
}
function go(route) { searchInput.value = ''; setMenu(false); if (location.hash === '#' + route) renderRoute(); else location.hash = route; }
function footer() { return `<footer class="footer"><span>为 AI 产品经理准备 · 口述学习与面试手册</span><div class="footer-actions"><button class="text-button" data-action="download">下载 Markdown ↗</button></div></footer>`; }
function lesson(chapter) {
  state.last = chapter.id; persist();
  const index = DATA.chapters.indexOf(chapter);
  const split = chapter.title.indexOf('：');
  const heading = split < 0 ? chapter.title : chapter.title.slice(0,split);
  const subtitle = split < 0 ? '' : chapter.title.slice(split+1);
  const navigation = `<div>${index>0 ? `<small>上一节</small><a href="#${DATA.chapters[index-1].id}">← ${escapeHTML(DATA.chapters[index-1].short)}</a>` : '<a href="#home">← 回到总览</a>'}</div><div class="next-topic">${index<DATA.chapters.length-1 ? `<small>下一节</small><a href="#${DATA.chapters[index+1].id}">${escapeHTML(DATA.chapters[index+1].short)} →</a>` : '<a href="#catalog">回到知识目录 →</a>'}</div>`;
  main.innerHTML = `<article class="reader"><header class="lesson-head"><div class="lesson-meta"><span>知识点 ${chapter.number} / 36</span></div><h1>${escapeHTML(heading)}</h1><p class="lesson-subtitle">${escapeHTML(subtitle)}</p><nav class="reader-bottom reader-top" aria-label="页首前后知识点">${navigation}</nav></header><section class="reading-section" id="understand"><h2 class="reading-label"><span class="ordinal">01</span>先这样理解</h2><div class="prose" data-highlight-key="chapter/${chapter.id}/intro">${chapter.intro}</div></section><section class="reading-section product-note" id="decision"><h2 class="reading-label"><span class="ordinal">02</span>放到产品里怎么判断</h2><div class="prose" data-highlight-key="chapter/${chapter.id}/decision">${chapter.decision}</div></section><section class="reading-section" id="scenarios"><h2 class="reading-label"><span class="ordinal">03</span>项目中的应用场景</h2><div class="prose" data-highlight-key="chapter/${chapter.id}/scenarios">${chapter.scenarios}</div></section><section class="reading-section" id="troubleshooting"><h2 class="reading-label"><span class="ordinal">04</span>应用中经常遇到的问题</h2><div class="prose" data-highlight-key="chapter/${chapter.id}/troubleshooting">${chapter.troubleshooting}</div></section><section class="reading-section" id="questions"><div class="section-head"><h2 class="reading-label"><span class="ordinal">05</span>三道核心面试题</h2><button class="text-button" data-action="expand">展开全部答案</button></div><p class="content-count">先试着自己回答，再展开对照。理解思路，比逐字背诵更重要。</p><div class="question-list">${chapter.questions.map(q=>`<details class="question"><summary><span class="question-number">${q.id}</span><span data-highlight-key="question/${q.id}/title">${escapeHTML(q.title)}</span></summary><div class="answer"><div class="answer-label">可以这样说</div><div class="prose" data-highlight-key="question/${q.id}/answer">${q.answer}</div></div></details>`).join('')}</div></section><nav class="reader-bottom" aria-label="页尾前后知识点">${navigation}</nav>${footer()}</article>`;
}
function resultCard(chapter, query='') {
  let excerpt = plain(chapter.intro);
  if (query) { const text = chapter.search.replace(/\*\*|<[^>]*>/g,''); const at = text.toLowerCase().indexOf(query.toLowerCase()); excerpt = text.slice(Math.max(0,at-34),Math.max(0,at-34)+140).replace(/\n+/g,' '); }
  const highlighted = text => { if (!query) return escapeHTML(text); const index=text.toLowerCase().indexOf(query.toLowerCase()); if(index<0)return escapeHTML(text);return escapeHTML(text.slice(0,index))+'<mark>'+escapeHTML(text.slice(index,index+query.length))+'</mark>'+escapeHTML(text.slice(index+query.length)); };
  return `<button class="result" data-route="${chapter.id}"><span class="result-top"><span>知识点 ${chapter.number}</span><span>${DATA.groups[chapter.group]}</span><span class="badge">${chapter.priority}</span></span><h3>${highlighted(chapter.title)}</h3><p>${highlighted(excerpt.slice(0,140))}…</p></button>`;
}
function practiceQuestions() { return allQuestions.filter(q=>state.practiceGroup==='all' || (state.practiceGroup.startsWith('k') ? q.chapter.id===state.practiceGroup : q.chapter.group===Number(state.practiceGroup))); }
function practice() {
  const list=practiceQuestions(); state.practiceIndex=((state.practiceIndex%list.length)+list.length)%list.length;
  const q=list[state.practiceIndex];
  updatePageHeading();
  main.innerHTML = `<div class="reader"><div class="eyebrow">面试口述练习</div><h1 class="page-title">先说一遍，再看答案。</h1><p class="hero-copy">用自己的话讲清原理、场景与取舍，把理解变成表达。</p><div class="practice-toolbar"><label><span class="sr-label">练习范围 </span><select class="select" id="practice-select" aria-label="练习范围"><option value="all" ${state.practiceGroup==='all'?'selected':''}>全部 108 道题</option>${DATA.groups.map((g,i)=>`<option value="${i}" ${state.practiceGroup===String(i)?'selected':''}>${g}</option>`).join('')}${state.practiceGroup.startsWith('k')?`<option value="${q.chapter.id}" selected>本节 · ${escapeHTML(q.chapter.short)}</option>`:''}</select></label><button class="btn small" data-action="random">${icon('shuffle')}随机一题</button></div><article class="practice-card"><div class="lesson-meta"><span class="badge">${q.chapter.priority}</span><span>${DATA.groups[q.chapter.group]} / ${q.id}</span></div><h2 data-highlight-key="question/${q.id}/title">${escapeHTML(q.title)}</h2><div class="practice-hint">试着按「核心判断 → 具体场景 → 边界与验证」组织回答。</div><div class="actions"><button class="btn primary" data-action="reveal" aria-expanded="false" aria-controls="practice-answer">查看口述答案 ${icon('arrow')}</button><button class="btn" data-action="copy" data-question="${q.id}">${icon('copy')}复制题目</button></div><div class="practice-answer" id="practice-answer" hidden><div class="answer-label">参考思路 · 可以这样说</div><div class="prose" data-highlight-key="question/${q.id}/answer">${q.answer}</div></div></article><div class="practice-controls"><button class="btn small" data-action="previous-question" ${list.length===1?'disabled':''}>← 上一题</button><span>第 ${state.practiceIndex+1} / ${list.length} 题 · 支持键盘 ← → 切换</span><button class="btn small" data-action="next-question" ${list.length===1?'disabled':''}>下一题 →</button></div><div class="bottom-band ai-entry"><div><h3>试试没见过的问题。</h3><p>根据当前知识点，实时生成新场景与参考答案。</p></div><button class="btn" data-route="challenge-${q.chapter.id}">AI 出新题 ${icon('arrow')}</button></div><p style="margin-top:28px"><a class="practice-topic" href="#${q.chapter.id}">回到知识点 ${q.chapter.number}：${escapeHTML(q.chapter.short)} ↗</a></p>${footer()}</div>`;
}
function extraView(extra) { main.innerHTML=`<article class="reader"><div class="prose" data-highlight-key="extra/${extra.id}">${extra.html}</div>${footer()}</article>`; }
function challengeChapter() {
  const id = activeRoute.startsWith('challenge-') ? activeRoute.slice(10) : state.last;
  return DATA.chapters.find(chapter => chapter.id === id) || DATA.chapters[0];
}
function refreshChallenge() {
  if (activeRoute.startsWith('challenge') && !searchInput.value) {
    challengeView();
    updatePageHeading();
  }
}
async function checkService() {
  if (STATIC_SITE) {
    service = {loading: false, configured: false, token: '', message: '在线版支持完整学习与 108 道核心题练习，暂未接入 AI 实时出题。AI 出题可在电脑本地版使用。'};
    refreshChallenge();
    return;
  }
  service.loading = true;
  refreshChallenge();
  try {
    if (location.protocol === 'file:') throw new Error('AI 出题需要通过本地服务打开网页；离线文件仍可阅读和练习原有题目。');
    const response = await fetch('/api/status', {signal: AbortSignal.timeout(6000)});
    if (!response.ok) throw new Error('当前是静态网页服务，尚未启动 AI 出题服务。');
    const result = await response.json();
    if (typeof result.configured !== 'boolean' || typeof result.token !== 'string') throw new Error('出题服务响应异常，请重新启动服务。');
    service = {...result, loading: false, message: ''};
  } catch (error) {
    service = {loading: false, configured: false, token: '', message: error.message || '无法连接出题服务，请检查电脑上的服务是否运行。'};
  }
  refreshChallenge();
}
function serviceNotice() {
  if (STATIC_SITE) return `<div class="service-note"><p>在线版暂未接入 AI 实时出题。你可以先练习 108 道核心题，或按照仓库说明在电脑上启动本地 AI 出题。</p><div class="actions"><button class="text-button" data-route="bank">练习核心题库</button><a class="text-button" href="https://github.com/nicoxu32/ai-agent-handbook#接入-ai-实时出题" target="_blank" rel="noopener noreferrer">查看本地使用说明 ↗</a></div></div>`;
  if (service.loading) return '<div class="service-note" role="status">正在检查出题服务…</div>';
  if (service.configured) return `<div class="service-note ready"><p>模型服务已配置 · ${escapeHTML(service.model)}。每次出题会发送本节讲解、原有三题及近期题目，调用可能产生 API 费用。</p></div>`;
  const message = service.message || '模型服务尚未配置，请先在电脑上填写 API 地址、API Key 和模型名称。';
  return `<div class="service-note"><p>${escapeHTML(message)}</p><button class="text-button" data-action="refresh-service">重新检查连接</button></div>`;
}
function challengeView() {
  const chapter = challengeChapter();
  const history = generatedHistory[chapter.id];
  const question = history.find(item => item.id === selectedQuestions[chapter.id]) || history.at(-1);
  let status = generationErrors[chapter.id] || '';
  if (generation) {
    const pendingChapter = DATA.chapters.find(item => item.id === generation.chapterId);
    status = `正在为「${pendingChapter.short}」出题，请稍候。通常需要数十秒，可以继续阅读其他知识点。`;
  }
  main.innerHTML = `<div class="reader"><header class="challenge-intro"><div class="eyebrow">换个问题，检验理解</div><h1 class="page-title">换个场景，检验你的理解。</h1><p class="hero-copy">围绕当前知识点实时生成新题，避开原有三道题。先自己讲一遍，再对照口述答案，继续接受追问。</p></header><div class="challenge-fields"><label>出题知识点<select class="select" id="challenge-chapter">${DATA.chapters.map(item => `<option value="${item.id}" ${item.id === chapter.id ? 'selected' : ''}>${item.number} · ${escapeHTML(item.short)}</option>`).join('')}</select></label><label>出题方向<select class="select" id="challenge-type">${Object.entries(questionTypes).map(([id, label]) => `<option value="${id}" ${id === challengeType ? 'selected' : ''}>${label}</option>`).join('')}</select></label></div>${serviceNotice()}<button class="btn primary generation-submit" data-action="generate" ${generation || !service.configured ? 'disabled' : ''}>${generation ? '正在出题…' : '出一道新题'} ${icon('arrow')}</button><p class="generation-status ${generationErrors[chapter.id] && !generation ? 'error' : ''}" role="status" aria-live="polite">${escapeHTML(status)}</p>${history.length ? `<label class="history-control">本知识点的出题记录 · 本机保留最近 10 道<select class="select" id="challenge-history">${[...history].reverse().map(item => `<option value="${escapeHTML(item.id)}" ${item.id === question.id ? 'selected' : ''}>${escapeHTML(questionTypes[item.type])} · ${escapeHTML(item.question.slice(0,65))}</option>`).join('')}</select></label>` : ''}${question ? `<article class="practice-card"><div class="lesson-meta"><span class="badge">AI 实时出题</span><span>${questionTypes[question.type]} · 知识点 ${chapter.number}</span></div><h2 data-highlight-key="generated/${escapeHTML(question.id)}/title">${escapeHTML(question.question)}</h2><p class="practice-hint">先说结论，再讲做法、边界与验证。AI 答案供学习参考，可回到原文核对。</p><button class="btn" data-action="reveal-generated" aria-expanded="${answerVisible}" aria-controls="generated-answer">${answerVisible ? '收起参考答案与追问' : '查看参考答案与追问'}</button><div class="practice-answer" id="generated-answer" ${answerVisible ? '' : 'hidden'}><div class="answer-label">可以这样说</div><div class="prose generated-answer" data-highlight-key="generated/${escapeHTML(question.id)}/answer">${escapeHTML(question.answer)}</div><h3 style="margin-top:25px">面试官可能继续追问</h3><ol class="prose followup-list">${question.followups.map(item => `<li>${escapeHTML(item)}</li>`).join('')}</ol><a class="practice-topic" href="#${chapter.id}">回到本节，核对知识点 →</a></div></article>` : '<div class="generation-placeholder"><h2>用一道新问题，试试是否真正理解。</h2><p>选好知识点和方向，点击「出一道新题」。生成后会先展示题目，参考答案由你主动展开。</p></div>'}${footer()}</div>`;
}
async function requestQuestion() {
  if (generation || !service.configured) return;
  const chapter = challengeChapter();
  const type = challengeType;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 90000);
  generation = {chapterId: chapter.id};
  generationErrors[chapter.id] = '';
  refreshChallenge();
  try {
    const response = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Handbook-Token': service.token},
      body: JSON.stringify({chapterId: chapter.id, type, history: generatedHistory[chapter.id].map(item => item.question)}),
      signal: controller.signal
    });
    let result;
    try { result = await response.json(); }
    catch { throw new Error('出题服务没有返回有效结果，请检查服务是否仍在运行。'); }
    if (!response.ok) throw new Error(result.error || '出题失败，请稍后重试。');
    if (result.chapterId !== chapter.id || result.type !== type || typeof result.id !== 'string' || typeof result.question !== 'string' || typeof result.answer !== 'string' || !Array.isArray(result.followups) || !result.followups.every(item => typeof item === 'string')) {
      throw new Error('返回的题目不完整，请重新出题。');
    }
    generatedHistory[chapter.id].push(result);
    generatedHistory[chapter.id] = generatedHistory[chapter.id].slice(-10);
    selectedQuestions[chapter.id] = result.id;
    answerVisible = false;
    persist();
    notify(`「${chapter.short}」的新题已生成。`);
  } catch (error) {
    let message = error.message;
    if (error.name === 'AbortError') message = '等待出题超时，请稍后手动重试；本次调用可能已产生用量。';
    if (error instanceof TypeError) message = '无法连接出题服务，请检查电脑网络和服务状态。';
    generationErrors[chapter.id] = message || '出题失败，请稍后重试。';
    notify(generationErrors[chapter.id]);
  } finally {
    clearTimeout(timeout);
    generation = null;
    refreshChallenge();
  }
}

document.addEventListener('click',async event=>{
  const jump=event.target.closest('[data-jump]');if(jump){event.preventDefault();const target=document.getElementById(jump.dataset.jump);target?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});if(target===main)main.focus({preventScroll:true});return;}
  const route=event.target.closest('[data-route]');if(route){go(route.dataset.route);return;}
  const button=event.target.closest('[data-action]');if(!button)return;
  const action=button.dataset.action;
  if(action==='expand'){const details=[...main.querySelectorAll('.question')];const open=details.some(d=>!d.open);details.forEach(d=>d.open=open);button.textContent=open?'收起全部答案':'展开全部答案';}
  if(action==='reveal'){const answer=document.getElementById('practice-answer');answer.hidden=!answer.hidden;button.setAttribute('aria-expanded',String(!answer.hidden));button.innerHTML=(answer.hidden?'查看口述答案':'收起口述答案')+' '+icon('arrow');}
  if(['next-question','previous-question','random'].includes(action)){const total=practiceQuestions().length;if(action==='random'&&total>1){state.practiceIndex=(state.practiceIndex+1+Math.floor(Math.random()*(total-1)))%total;}else state.practiceIndex+=action==='previous-question'?-1:1;practice();}
  if(action==='copy'){const q=allQuestions.find(q=>q.id===button.dataset.question);try{await navigator.clipboard.writeText(q.title);notify('题目已复制。');}catch{const temp=document.createElement('textarea');temp.value=q.title;temp.style.position='fixed';temp.style.opacity='0';document.body.append(temp);temp.select();const ok=document.execCommand('copy');temp.remove();notify(ok?'题目已复制。':'复制不可用，请选中题目文字复制。');}}
  if(action==='generate') await requestQuestion();
  if(action==='refresh-service') await checkService();
  if(action==='reveal-generated') {
    answerVisible = !answerVisible;
    const answer = document.getElementById('generated-answer');
    answer.hidden = !answerVisible;
    button.setAttribute('aria-expanded', String(answerVisible));
    button.textContent = answerVisible ? '收起参考答案与追问' : '查看参考答案与追问';
  }
  if(action==='download'){const isDoubao=activeRoute==='doubao'||activeRoute.startsWith('db-');const url=URL.createObjectURL(new Blob([isDoubao?DATA.doubao.source:DATA.source],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=isDoubao?'豆包面试题_AI产品经理与AI技术栈.md':'AI智能体开发平台_36个知识点与108道面试问答.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  if(action==='clear-search'){searchInput.value='';renderRoute();searchInput.focus();}
});
document.addEventListener('change', event => {
  if (event.target.id === 'practice-select') {
    state.practiceGroup = event.target.value;
    state.practiceIndex = 0;
    practice();
  }
  if (event.target.id === 'challenge-chapter') {
    answerVisible = false;
    go('challenge-' + event.target.value);
  }
  if (event.target.id === 'challenge-type') {
    challengeType = event.target.value;
    updatePageHeading();
  }
  if (event.target.id === 'challenge-history') {
    selectedQuestions[challengeChapter().id] = event.target.value;
    answerVisible = false;
    challengeView();
  }
});

  if(sidebar.classList.contains('open')&&event.key==='Tab'){const focusables=[...sidebar.querySelectorAll('a,button,summary,select')].filter(el=>el.getClientRects().length);const first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}return;}
  if(event.target.closest('input,textarea,select,[contenteditable]'))return;
  if(event.key==='/'&&!event.ctrlKey&&!event.metaKey){event.preventDefault();searchInput.focus();}
  if(activeRoute==='practice'&&!searchInput.value&&(event.key==='ArrowRight'||event.key==='ArrowLeft')){event.preventDefault();state.practiceIndex+=event.key==='ArrowRight'?1:-1;practice();}
});
